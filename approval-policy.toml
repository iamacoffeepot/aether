# Approval policy — the tier guard the Bloomery pre-seal admission gate consults
# to decide whether a workpiece's membership may auto-advance (the host forms the
# `approval` itself), needs an LLM judge, or stops at the owner's desk (an
# owner-signed `Statement` must populate the `approval`). It maps path globs to
# an approval tier over a workpiece's declared surface (the `## Declared surface`
# glob block the scope revision carries). ADR-0149 / ADR-0151.
#
# This file is the FALLBACK, not the authority. A draft that seals an
# `aether.bloomery.approval_policy` entry in its bloom-wide configuration
# registry is gated against that sealed value, so the tier its members were
# admitted at is part of what the bloom attests rather than a property of the
# coordinator's disk (ADR-0174, #4616). A draft that seals none is gated against
# the rules below, which is what keeps a coordinator that has authored no policy
# working unchanged — and what keeps this file's git history the delegation
# ladder's audit trail.
#
# The policy is Bloomery-owned: the value type
# (`crates/aether-bloomery/src/values/approval.rs`) carries the `--tier`
# resolution over these rules in Rust, matching the `scripts/surface-match.py`
# resolver, so the semantics below are the contract the gate honours, not a
# script's. The host gate
# (`crates/aether-chassis-bloomery/src/bloomery/approve/`) only reads this file
# into that value.
#
# Resolution is most-restrictive-match-wins (human > judge > auto): a path's
# tier is the most restrictive rule that matches it, and a path matched by no
# rule takes `default` below. A workpiece's tier is the most restrictive tier
# over every path in its declared surface; order in the `rules` list does not
# matter.
#
# THE DEFAULT IS `judge` — not `auto`, and not `human`. Most work is fine to
# advance on its own: a change the owner scoped and expects to come back correct
# should not sit waiting on him. A `human` default encodes "trust nothing", which
# is false and makes him the bottleneck on every doc tweak. An `auto` default
# encodes "trust everything", which silently auto-approves a brand-new, unpoliced
# top-level surface the moment somebody creates one. `judge` is the honest
# middle: an unknown surface gets a second reader rather than a rubber stamp.
#
# Globs use gitignore-style ** semantics (gitwildmatch): ** spans path segments,
# * stays within one segment, ? is one non-slash character, and a leading /
# anchors the repository root. The host gate validates every glob against that
# grammar and fails closed to `human` on anything outside it; an unreadable or
# malformed policy is a gate FAILURE (never a silent `auto`).
#
# Relaxing a tier is a one-line, owner-signed diff to this file, so the file's
# git history is the delegation ladder's audit trail. `approval-policy.toml` is
# itself a `human`-tier glob below, so a relaxation can never auto-approve its
# own relaxation.
#
# The ADR hard gate lives ABOVE this file, in the host gate's Rust (maturity-aware,
# ADR-0146 §6 / ADR-0151): a change that writes a NEW ADR or edits an ESTABLISHED
# (non-Proposed) one routes to the owner before any policy lookup. Only a change
# whose every touched ADR is still `Status: Proposed` defers to this file — and
# the `docs/adr/**` entry below is `judge` precisely so that fall-through resolves
# to a shadow reader, not the owner. That new/established → owner guarantee lives
# in the gate, not here (a glob matches paths, not maturity).

default = "judge"

# Core APIs. Change one of these and every downstream consumer moves with it,
# so the owner reads them before they advance — always.
[[rules]]
glob = "crates/aether-data/**"
tier = "human"

[[rules]]
glob = "crates/aether-data-derive/**"
tier = "human"

[[rules]]
glob = "crates/aether-codec/**"
tier = "human"

[[rules]]
glob = "crates/aether-kinds/**"
tier = "human"

[[rules]]
glob = "crates/aether-actor/**"
tier = "human"

[[rules]]
glob = "crates/aether-actor-derive/**"
tier = "human"

[[rules]]
glob = "crates/aether-substrate/**"
tier = "human"

# New systems, and the supply chain. A new crate MUST add one of these, so this
# is how "adding a new core system" is caught; a dependency change lands here
# too, which is the same conversation.
[[rules]]
glob = "/Cargo.toml"
tier = "human"

[[rules]]
glob = "crates/*/Cargo.toml"
tier = "human"

# ADRs. The routing decision lives in the ADR hard gate ABOVE this file
# (maturity-aware): a new or established ADR is already routed to the owner by
# the gate before this lookup runs, so this entry is only ever consulted on the
# gate's in-progress fall-through — a change to a still-Proposed ADR mid-arc.
[[rules]]
glob = "docs/adr/**"
tier = "judge"

# Constitutional, and every supported agent harness's own machinery.
# Self-modification of the thing that decides what may self-modify is the
# owner's alone.
[[rules]]
glob = "/AGENTS.md"
tier = "human"

[[rules]]
glob = "/CLAUDE.md"
tier = "human"

[[rules]]
glob = ".agents/**"
tier = "human"

[[rules]]
glob = ".claude/**"
tier = "human"

[[rules]]
glob = ".codex/**"
tier = "human"

[[rules]]
glob = "/.mcp.json"
tier = "human"

[[rules]]
glob = ".github/workflows/**"
tier = "human"

# Relaxing a tier here is an owner-signed one-line diff, so this policy file
# self-lists as human.
[[rules]]
glob = "/approval-policy.toml"
tier = "human"

# Submitted-and-expected-to-come-back-right. These advance on their own.
[[rules]]
glob = "docs/guide/**"
tier = "auto"

[[rules]]
glob = "crates/aether-kit-commons/**"
tier = "auto"

[[rules]]
glob = "crates/aether-math/**"
tier = "auto"

[[rules]]
glob = "crates/aether-mcp/**"
tier = "auto"

[[rules]]
glob = "crates/aether-mesh/**"
tier = "auto"

[[rules]]
glob = "crates/aether-test-fixtures-*/**"
tier = "auto"

[[rules]]
glob = "scripts/**"
tier = "auto"

[[rules]]
glob = "xtask/**"
tier = "auto"

[[rules]]
glob = "fuzz/**"
tier = "auto"

# The engine's substantive middle. These take the `judge` default anyway; they
# are spelled out because this is where a new capability or a chassis change
# lands, and a reader should not have to infer the tier of the busiest tree in
# the repo. Every native capability owns its own `aether-<cap>` crate, so the
# list below names them one by one; a capability crate added later and not yet
# listed is never unpoliced by the omission — it takes the same `judge` default
# these entries restate.
[[rules]]
glob = "crates/aether-audio/**"
tier = "judge"

[[rules]]
glob = "crates/aether-clipboard/**"
tier = "judge"

[[rules]]
glob = "crates/aether-component/**"
tier = "judge"

[[rules]]
glob = "crates/aether-fleet/**"
tier = "judge"

[[rules]]
glob = "crates/aether-fs/**"
tier = "judge"

[[rules]]
glob = "crates/aether-game/**"
tier = "judge"

[[rules]]
glob = "crates/aether-http/**"
tier = "judge"

[[rules]]
glob = "crates/aether-inventory/**"
tier = "judge"

[[rules]]
glob = "crates/aether-lifecycle/**"
tier = "judge"

[[rules]]
glob = "crates/aether-process/**"
tier = "judge"

[[rules]]
glob = "crates/aether-render/**"
tier = "judge"

[[rules]]
glob = "crates/aether-rpc/**"
tier = "judge"

[[rules]]
glob = "crates/aether-tcp/**"
tier = "judge"

[[rules]]
glob = "crates/aether-text/**"
tier = "judge"

[[rules]]
glob = "crates/aether-trace/**"
tier = "judge"

[[rules]]
glob = "crates/aether-window/**"
tier = "judge"

[[rules]]
glob = "crates/aether-chassis-desktop/**"
tier = "judge"

[[rules]]
glob = "crates/aether-behavior/**"
tier = "judge"
