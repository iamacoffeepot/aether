# Approval policy — maps path globs to an approval tier (`auto`, `judge`, or
# `human`). ADR-0151.
#
# It is read by `.agents/skills/approve/scripts/resolve_approval_tier.py`, which
# loads this file and the matcher `scripts/surface-match.py` from a captured
# `origin/main` commit. Two skill steps call it:
#
#   - /approve resolves the tier of an issue's `## Declared surface`. `auto`
#     work may be approved unattended (`authority: policy-auto`); `judge` and
#     `human` work needs the owner's explicit approval.
#   - /implement and /land price surface overflow: changed paths outside the
#     approved surface. `auto` overflow lands with the ordinary direct review,
#     `judge` overflow needs the landing agent's own acceptance of each path,
#     and `human` overflow needs the owner's explicit confirmation.
#
# `.agents/skills/_shared/github-workflow.md` holds the full contract.
#
# Resolution is most-restrictive-match-wins (human > judge > auto): a path's
# tier is the most restrictive rule that matches it, and a path matched by no
# rule takes `default` below. A workpiece's tier is the most restrictive tier
# over every path in its declared surface; order in the `rules` list does not
# matter.
#
# THE DEFAULT IS `judge` — not `auto`, and not `human`. An `auto` default would
# let an unattended run approve work on a brand-new, unpoliced top-level surface
# the moment somebody creates one. At /approve time `judge` and `human` set the
# same bar: both need the owner's explicit approval. The two differ only when a
# path is priced as surface overflow: an unlisted path changed outside the
# approved surface is accepted path by path by the landing agent under `judge`,
# where a `human` default would stop every such overflow, a doc tweak included,
# for the owner's confirmation.
#
# Globs use gitignore-style ** semantics (gitwildmatch): ** spans path segments,
# * stays within one segment, ? is one non-slash character, and a leading /
# anchors the repository root. The resolver validates every glob against that
# grammar and fails closed to `human` on anything outside it; an unreadable or
# malformed policy is a resolver FAILURE (never a silent `auto`).
#
# Relaxing a tier is a one-line, owner-signed diff to this file, so the file's
# git history is the delegation ladder's audit trail. `approval-policy.toml` is
# itself a `human`-tier glob below, so a relaxation can never auto-approve its
# own relaxation.
#
# The ADR rule lives ABOVE this file, in the approve and land skills: a change
# that writes a NEW ADR or edits an ESTABLISHED (non-Proposed) one is `human`
# regardless of any policy lookup. Only a change whose every touched ADR is still
# `Status: Proposed` defers to this file — and the `docs/adr/**` entry below is
# `judge` precisely so that fall-through resolves to a second reader, not the
# owner. That new/established → owner guarantee lives in the skills, not here (a
# glob matches paths, not maturity).

default = "judge"

# Core APIs. Change one of these and every downstream consumer moves with it,
# so the owner reads them before they advance — always.
[[rules]]
glob = "crates/aether-data/**"
tier = "human"

[[rules]]
glob = "crates/aether-data-derive/**"
tier = "human"

[[rules]]
glob = "crates/aether-codec/**"
tier = "human"

[[rules]]
glob = "crates/aether-kinds/**"
tier = "human"

[[rules]]
glob = "crates/aether-actor/**"
tier = "human"

[[rules]]
glob = "crates/aether-actor-derive/**"
tier = "human"

[[rules]]
glob = "crates/aether-substrate/**"
tier = "human"

# New systems, and the supply chain. A new crate MUST add one of these, so this
# is how "adding a new core system" is caught; a dependency change lands here
# too, which is the same conversation.
[[rules]]
glob = "/Cargo.toml"
tier = "human"

[[rules]]
glob = "crates/*/Cargo.toml"
tier = "human"

# The lockfile is the mechanical artifact of the manifest conversation above:
# every dependency change rewrites it, and without a rule naming it here the
# file-granularity check refuses any scope that declares it — making
# dependency work impossible to scope at all (found by execution, issue-4875).
[[rules]]
glob = "/Cargo.lock"
tier = "human"

# ADRs. The routing decision lives in the maturity-aware ADR rule described in
# the header: the approve and land skills already route a new or established ADR
# to the owner, so this entry is only ever consulted on the in-progress
# fall-through — a change to a still-Proposed ADR mid-arc.
[[rules]]
glob = "docs/adr/**"
tier = "judge"

# Constitutional, and every supported agent harness's own machinery.
# Self-modification of the thing that decides what may self-modify is the
# owner's alone.
[[rules]]
glob = "/AGENTS.md"
tier = "human"

[[rules]]
glob = "/CLAUDE.md"
tier = "human"

[[rules]]
glob = ".agents/**"
tier = "human"

[[rules]]
glob = ".claude/**"
tier = "human"

[[rules]]
glob = ".codex/**"
tier = "human"

[[rules]]
glob = "/.mcp.json"
tier = "human"

# The guardrail hook scripts both harnesses wire (`.claude/settings.json`,
# `.codex/hooks.json`) and their tests.
[[rules]]
glob = ".hooks/**"
tier = "human"

[[rules]]
glob = ".github/workflows/**"
tier = "human"

# The resolver executes this matcher, so it governs pricing.
[[rules]]
glob = "/scripts/surface-match.py"
tier = "human"

# Relaxing a tier here is an owner-signed one-line diff, so this policy file
# self-lists as human.
[[rules]]
glob = "/approval-policy.toml"
tier = "human"

# Submitted-and-expected-to-come-back-right. These advance on their own.
[[rules]]
glob = "docs/guide/**"
tier = "auto"

[[rules]]
glob = "crates/aether-kit/**"
tier = "auto"

[[rules]]
glob = "crates/aether-math/**"
tier = "auto"

[[rules]]
glob = "crates/aether-mcp/**"
tier = "auto"

[[rules]]
glob = "crates/aether-mesh/**"
tier = "auto"

[[rules]]
glob = "crates/aether-test-fixtures-*/**"
tier = "auto"

[[rules]]
glob = "scripts/**"
tier = "auto"

[[rules]]
glob = "xtask/**"
tier = "auto"

[[rules]]
glob = "fuzz/**"
tier = "auto"

# The engine's substantive middle. These take the `judge` default anyway; they
# are spelled out because this is where a new capability or a chassis change
# lands, and a reader should not have to infer the tier of the busiest tree in
# the repo. Every native capability owns its own `aether-<cap>` crate, so the
# list below names them one by one; a capability crate added later and not yet
# listed is never unpoliced by the omission — it takes the same `judge` default
# these entries restate.
[[rules]]
glob = "crates/aether-audio/**"
tier = "judge"

[[rules]]
glob = "crates/aether-clipboard/**"
tier = "judge"

[[rules]]
glob = "crates/aether-component/**"
tier = "judge"

[[rules]]
glob = "crates/aether-fleet/**"
tier = "judge"

[[rules]]
glob = "crates/aether-fs/**"
tier = "judge"

[[rules]]
glob = "crates/aether-http/**"
tier = "judge"

[[rules]]
glob = "crates/aether-inventory/**"
tier = "judge"

[[rules]]
glob = "crates/aether-lifecycle/**"
tier = "judge"

[[rules]]
glob = "crates/aether-process/**"
tier = "judge"

[[rules]]
glob = "crates/aether-render/**"
tier = "judge"

[[rules]]
glob = "crates/aether-rpc/**"
tier = "judge"

[[rules]]
glob = "crates/aether-tcp/**"
tier = "judge"

[[rules]]
glob = "crates/aether-text/**"
tier = "judge"

[[rules]]
glob = "crates/aether-trace/**"
tier = "judge"

[[rules]]
glob = "crates/aether-window/**"
tier = "judge"

[[rules]]
glob = "crates/aether-chassis-desktop/**"
tier = "judge"

[[rules]]
glob = "crates/aether-behavior/**"
tier = "judge"

# Repo-level gate configs. A lint ban or a formatting rule is one file at the
# root, so a member that changes one has to name it, and a surface may name a
# file only when a rule here knows it. Human tier: each is a repo-wide gate.
[[rules]]
glob = "/clippy.toml"
tier = "human"

[[rules]]
glob = "/rustfmt.toml"
tier = "human"
