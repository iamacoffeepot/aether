# Named seal profiles. `cargo xtask bloom seal --profile opus-high` (and
# the matching supersede flag) resolves a name here to authored-and-sealed
# config digests through POST /configs. The bloom record still carries only
# those digests — this file is authoring ergonomics above ADR-0174's
# registry, not a parallel config channel.
#
# Shared sub-bundles (`price_tables`, `model_overrides`, `forecasts`) are
# referenced by name from `[profiles.*]`, so a rate change is one edit.

# Micro-USD per million tokens, from the vendor price cards; a model with
# no row stays unpriced rather than silently free. Keyed by model so a
# duplicate and an authoring-order-dependent digest cannot exist. The
# grok-4.6 figures match the published card and were confirmed against
# billed laps (computed == billed to the cent, including a lap that
# crossed the 200k band); the band bills the whole request at the higher
# rates once the prompt reaches the threshold.
[price_tables.standard.rows."claude-opus-5"]
input = 5000000
cache_read = 500000
cache_write_5m = 6250000
cache_write_1h = 10000000
cache_write = 6250000
output = 25000000

[price_tables.standard.rows."grok-4.6"]
input = 2000000
cache_read = 500000
cache_write_5m = 0
cache_write_1h = 0
cache_write = 0
output = 6000000

[price_tables.standard.rows."grok-4.6".long_context]
prompt_tokens = 200000
input = 4000000
cache_read = 1000000
cache_write_5m = 0
cache_write_1h = 0
cache_write = 0
output = 12000000

[model_overrides.opus-high]
agent = { harness = "Claude", model = "claude-opus-5" }
reasoning_effort = "High"

[model_overrides.sonnet-medium]
agent = { harness = "Claude", model = "claude-sonnet-5" }
reasoning_effort = "Medium"

[forecasts.none]
predicted_tokens = 0
predicted_worker_secs = 0
predicted_retries = 0

[profiles.opus-high]
model_override = "opus-high"
price_table = "standard"
forecast = "none"

[profiles.sonnet-medium]
model_override = "sonnet-medium"
price_table = "standard"
forecast = "none"
