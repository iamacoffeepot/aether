[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The `package` target writes the persisted `pack/manifest` with the
# chassis's own `encode_manifest` (ADR-0163 §1) — the same encoder its
# decoder reads — rather than re-implementing the byte layout, so xtask
# depends on the chassis crate that owns `package::{PackageManifest,
# PackageEntry, Sha256, encode_manifest}`.
aether-chassis = { path = "../crates/aether-chassis" }
# `import-commit` builds the journal's own `Tree` / `EncodedArtifact` values and
# speaks its `read_head` / `publish` mail, so it links the kind vocabulary.
aether-bloomery-kinds = { path = "../crates/aether-bloomery-kinds" }
# The `muse` verbs build the session's own inputs and read its records:
# `OpenInput`, `ContinueInput`, `TurnSettings`, `Session`, `TurnResult`, the
# `offered()` tools, and the `MUSE` bundle head.
aether-bloomery-muse = { path = "../crates/aether-bloomery-muse" }
# The `muse` verbs name each session program by its `Program::NAME`, never a
# hand-spelled string.
aether-bloomery-program = { path = "../crates/aether-bloomery-program" }
# `muse open` builds its seeded reads as `TreePath`s, the type `OpenInput`
# takes; the identity half only, with no workspace runtime.
aether-bloomery-workspace = { path = "../crates/aether-bloomery-workspace", default-features = false }
# `muse open` binds the proof tools it offers to a `ProofBound`; `library`
# strips that bundle's wasm entry surface.
aether-bloomery-workspace-programs = { path = "../crates/aether-bloomery-workspace-programs", features = ["library"] }
# `import-commit` installs the frame cap the engine and `aether-mcp` share, so
# its batch budget matches what the engine will read.
aether-codec = { path = "../crates/aether-codec" }
aether-data = { path = "../crates/aether-data" }
# `import-commit` dials the engine's RPC port with the same client
# `aether-mcp` uses, and resolves the frame cap through `FrameSizeConfig`.
aether-rpc = { path = "../crates/aether-rpc" }
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
clap = { workspace = true }
determinator = "0.12.0"
guppy = "0.17.26"
notify = "8.2.0"
rmcp = { version = "2.1", features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
toml = { workspace = true }
# Content-addressed hashing for `pack/objects/<sha256>` — the same crate
# the hub binary store hashes uploads with (ADR-0115). Native build tool,
# so `std`.
sha2 = { workspace = true, features = ["std"] }
# Workspace symbol inventory (`cargo xtask symbols`): parse every crate's
# sources including `#[cfg(test)]` modules and `tests/` trees. `full` is
# the Item/File grammar; no extra toolchain binary.
syn = { workspace = true, features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# `import-commit`'s tests stage its batches into a scratch journal through the
# same `Batch` + `Journal::append` path the journal actor's publish handler runs.
aether-bloomery-journal = { path = "../crates/aether-bloomery-journal" }

[lints]
workspace = true
