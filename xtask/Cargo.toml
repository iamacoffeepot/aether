[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The `package` target writes the persisted `pack/manifest` with the
# chassis's own `encode_manifest` (ADR-0163 §1) — the same encoder its
# decoder reads — rather than re-implementing the byte layout, so xtask
# depends on the chassis crate that owns `package::{PackageManifest,
# PackageEntry, Sha256, encode_manifest}`.
# The model lanes fork the harness the coordinator resolved from the stage's
# sealed `AgentProfile` and hands over as `--harness` (#4578). xtask parses the
# flag back through `aether_bloomery::Harness` rather than re-spelling the
# vocabulary locally: the domain crate owns the one spelling, the same way it
# owns `CONSTRUCT_IMPLEMENT_COMMAND`, so a drifted copy cannot render a harness
# this entrypoint then refuses to parse.
aether-bloomery = { path = "../crates/aether-bloomery", features = ["testing"] }
# The day roll's coverage-map type (ADR-0203). The git adapter owns the
# fleet-main compare-and-swap the operator command drives through `git`.
aether-bloomery-git = { path = "../crates/aether-bloomery-git" }
aether-chassis = { path = "../crates/aether-chassis" }
aether-data = { path = "../crates/aether-data" }
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
clap = { workspace = true }
determinator = "0.12.0"
guppy = "0.17.26"
notify = "8.2.0"
rmcp = { version = "1.7", features = ["client", "transport-streamable-http-client-reqwest"] }
# Fold-test journal counts (#5073). The coordinator host does not ship a
# `sqlite3` CLI; the workspace already bundles rusqlite for the store.
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
toml = { workspace = true }
# Content-addressed hashing for `pack/objects/<sha256>` — the same crate
# the hub binary store hashes uploads with (ADR-0115). Native build tool,
# so `std`.
sha2 = { workspace = true, features = ["std"] }
# Workspace symbol inventory (`cargo xtask symbols`): parse every crate's
# sources including `#[cfg(test)]` modules and `tests/` trees. `full` is
# the Item/File grammar; no extra toolchain binary.
syn = { workspace = true, features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true
