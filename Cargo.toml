[workspace]
resolver = "3"
members = [
    "crates/aether-substrate",
    "crates/aether-chassis",
    "crates/aether-chassis-desktop",
    "crates/aether-chassis-headless",
    "crates/aether-chassis-harness",
    "crates/aether-chassis-hub",
    "crates/aether-harness-substrate",
    "crates/aether-harness-substrate-capture",
    "crates/aether-codec",
    "crates/aether-data",
    "crates/aether-kinds",
    "crates/aether-math",
    "crates/aether-actor",
    "crates/aether-actor-derive",
    "crates/aether-audio",
    "crates/aether-behavior",
    "crates/aether-behavior-derive",
    "crates/aether-bloomery",
    "crates/aether-bloomery-console",
    "crates/aether-bloomery-github",
    "crates/aether-chassis-bloomery",
    "crates/aether-http-derive",
    "crates/aether-data-derive",
    "crates/aether-derive",
    "crates/aether-fs",
    "crates/aether-inventory",
    "crates/aether-mesh",
    "crates/aether-kit-commons",
    "crates/aether-puppet",
    "crates/aether-kit-sim",
    "crates/aether-kit-terrain",
    "crates/aether-kit-widget",
    "crates/aether-kit-workbench",
    "crates/aether-rpc",
    "crates/aether-fleet",
    "crates/aether-harness-fleet",
    "crates/aether-harness-perf",
    "crates/aether-clipboard",
    "crates/aether-window",
    "crates/aether-lifecycle",
    "crates/aether-tcp",
    "crates/aether-game",
    "crates/aether-component",
    # Dedicated trybuild host for `aether-component`'s route contracts. Keeping
    # its dev-dependency graph narrow prevents trybuild's generated project from
    # inheriting the component crate's integration harnesses and wasm fixtures.
    "crates/aether-component-ui-tests",
    "crates/aether-http",
    "crates/aether-trace",
    "crates/aether-render",
    "crates/aether-text",
    "crates/aether-anthropic",
    "crates/aether-gemini",
    "crates/aether-process",
    "crates/aether-mcp",
    "crates/aether-context-canary",
    # Test fixtures — single-output crates sitting alongside every other
    # member: one shared `kinds` rlib plus the component cdylibs (the main
    # bundle, the typed↔reshaped replace-pair satellites, the ADR-0138
    # defaultless multi-actor fixture, and the ADR-0147 boot-slot fixture)
    # and the split-cap native lib.
    "crates/aether-test-fixtures-kinds",
    "crates/aether-test-fixtures-bundle",
    "crates/aether-test-fixtures-stateful-typed",
    "crates/aether-test-fixtures-stateful-reshaped",
    "crates/aether-test-fixtures-split-cap",
    "crates/aether-test-fixtures-defaultless",
    "crates/aether-test-fixtures-boot",
    "crates/aether-test-fixtures-behavior",
    "xtask",
]
exclude = [
    # The cargo-fuzz harness (issue 1562) is its own nested crate on the
    # nightly toolchain; keeping it out of the workspace members leaves
    # the stable `cargo` build, the lockfile, and the `crate:<short>`
    # product-crate convention untouched.
    "fuzz",
]

[workspace.package]
version = "0.3.0-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arc-swap = "1"
# Chassis-binary argv parsing (ADR-0090 unit d, issue 1258). One
# consumer today (`aether-chassis`); workspaced so future CLI
# surfaces reach for the same major.
clap = { version = "4", features = ["derive"] }
# Property-based testing (issue 1561). Dev-only on the two hand-rolled
# wire boundaries — the codec round-trip law (`aether-codec`) and the
# mail-ring reclaim state machine (`aether-substrate`). Pinned once here
# so both suites share a major; pulled in via `[dev-dependencies]`, never
# linked into a production build.
proptest = "1"

# High-fanout shared deps (iamacoffeepot/aether#1526). Promoted to the
# workspace table so the single-version property is structural — members
# inherit with `{ workspace = true }` and extend per-member `features` /
# `optional` locally. The no_std/wasm members need defaults off
# (serde's / tracing's `std`), and edition 2024 only lets a member
# disable defaults when the workspace entry does — so these carry
# `default-features = false` and the native consumers re-add the default
# features they rely on (`std`, `attributes`) on their own declaration,
# keeping Cargo.lock byte-stable.
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
bytemuck = { version = "1.19", default-features = false }
confique = { version = "0.4", default-features = false }
cpal = "0.17"
# ed25519 signature verification behind the `KeyProvider` port (ADR-0149
# step 3, ADR-0150/ADR-0151): the real author-signature trust gate custodied
# by the host `aether.signing` capability. `default-features = false` keeps
# the verify-only surface lean (no `rand`); the pure `Ed25519KeyProvider`
# lives in `aether-bloomery` (native-gated) and the host cap parses key bytes.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
hound = "3"
inventory = "0.3"
png = "0.18"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", default-features = false }
serde_json = "1"
# Live operator TUI for the Bloomery coordinator (issue 5120). The
# console is a standalone read-only board; these two are its only new
# workspace deps.
crossterm = "0.28"
ratatui = "0.29"
# ADR-0149 Bloomery journal store (issue 3458): SQLite in WAL mode is the
# durable single-writer home for the journal / inbox / outbox / active-
# membership tables. Host crate (`aether-chassis-bloomery`) only — the guest
# sees typed transact mail, never SQL. `bundled` compiles SQLite from
# source so no system libsqlite3 is required on CI runners.
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.9"
# Content-addressed hashing for the hub binary store (ADR-0115, issue
# 1953): sha256 over a binary's raw bytes keys each entry. Native-only
# consumer (the hub binary store under `native`); pinned here so any
# future hashing surface shares the major. Default features off keeps the
# no_std consumers (`aether-bloomery`'s wasm-safe content-addressing core,
# ADR-0149) no_std; native consumers re-add `std` on their own declaration.
sha2 = { version = "0.10", default-features = false }
syn = { version = "2", features = ["full"] }
tracing = { version = "0.1", default-features = false }
wasmtime = "44"
wgpu = "29.0.1"
# ADR-0170 authored render programs: the render cap validates authored
# WGSL and reads its uniform-block layout at register time through naga
# directly — the same naga version wgpu 29 compiles shaders with, pinned
# in lockstep so validation and compilation agree.
naga = "29.0.1"

# Backtraces and panic locations keep file:line fidelity; the variable and
# type debug sections they drop are the bulk of every test binary. With full
# debuginfo a cold --all-targets target dir weighs ~100 GB, which caps the
# pipeline's concurrent build lanes at 2 on disk alone
# (spikes/build-concurrency on the spike branch, iamacoffeepot/aether#4915).
# A debugger session opts back in with CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

# Optimize the cranelift compiler even in dev/test builds. Every wasm
# component load runs a full cranelift compile of the module, and
# unoptimized cranelift is ~10-30x slower — ~15s per module in CI, which
# put the substrate-bundle integration suite at ~44 minutes of CPU time
# (iamacoffeepot/aether#2803). Test-target dependencies build under the
# dev profile, so this covers `cargo test` / nextest locally and in CI.
# The one-time optimized rebuild of these two crates is held by the CI
# rust-cache and only recurs on a wasmtime version bump.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[workspace.lints.rust]
# Phase 5 of iamacoffeepot/aether#913 swept ~244 RsUnnecessaryQualifications
# findings across the workspace. Enabling rustc's matching lint here at
# `warn` prevents reintroduction — CI's `cargo clippy -- -D warnings`
# escalates it to a hard fail on any new qualified path that the
# compiler can elide (e.g. `core::mem::size_of` when the edition-2024
# prelude has `size_of` in scope).
unused_qualifications = "warn"

# `export!` gates its emitted entry surface on the invoking crate's
# `library` feature (see the macro's rustdoc). Most invoking crates never
# declare that feature — the gate is macro-embedded precisely so they
# don't have to — so register the value as expected here; `-D warnings`
# would otherwise fail every such crate on `unexpected_cfgs`, which is
# not suppressed through macro expansion for feature values. The lint
# stays live for genuine cfg typos.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("library"))'] }

[workspace.lints.rustdoc]
# Phase 5 / 5c of iamacoffeepot/aether#913 doc-comment cleanup.
# `redundant_explicit_links` flags `[`Foo`](crate::path::to::Foo)`
# when the bracket label already resolves to the same target via
# intra-doc-link lookup. `broken_intra_doc_links` catches dangling
# `[Foo]` after a rename. `private_intra_doc_links` catches public
# docs pointing at private items. CI's `Rustdoc` job (`cargo doc
# --workspace --no-deps --document-private-items --all-features
# --keep-going` under `RUSTDOCFLAGS='-D rustdoc::...'`) escalates
# these to hard failures; `warn` here keeps local `cargo doc` usable
# for developers without forcing -D on every dev run.
# `--document-private-items` is what makes a private-to-private link
# resolve at all — without it rustdoc never visits those items, so
# the lints above see nothing to check. `--all-features` is what
# makes a module behind a non-default feature reach rustdoc at all —
# without it, cargo never compiles that module, so the lints above
# see nothing to check there either.
redundant_explicit_links = "warn"
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
# Baseline — both groups as warn, then opt out of the idiom-fight bucket below.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

# Deny picks — INITIALLY AT WARN until per-pick cleanup PRs land (iamacoffeepot/aether#854 Phase 1.b-1.c.iv).
# Each follow-up PR fixes its hits and promotes its lint to deny in the same diff.
dbg_macro                           = "warn"  # promote to deny in Phase 1.c.* if any hits exist
todo                                = "warn"  # promote to deny if no hits surface
unimplemented                       = "warn"  # promote to deny if no hits surface
undocumented_unsafe_blocks          = "deny"
cloned_instead_of_copied            = "deny"
large_stack_arrays                  = "deny"
match_wildcard_for_single_variants  = "deny"
uninlined_format_args               = "deny"
unreadable_literal                  = "deny"
# Module layout: a module with child modules is `foo/mod.rs`; a plain
# `foo.rs` file is only for a terminal (leaf) module with no children.
self_named_module_files             = "deny"

# Warn picks — cherry-picked from restriction + style (not covered by pedantic/nursery baseline).
unwrap_used                         = "warn"
print_stdout                        = "warn"
print_stderr                        = "warn"
# absolute_paths — catches `crate::a::b::c::Thing` written inline at call sites
# when a `use` would shorten it. See iamacoffeepot/aether#951. Starts at `warn`;
# promotion to `deny` is a follow-up phase once any reintroduced hits stay green.
# Default `absolute-paths-max-segments = 2` is sufficient — no override in clippy.toml.
absolute_paths                      = "warn"

# Disable — idiom fight / dispatcher contract / doc-burden. Rationale in iamacoffeepot/aether#854.
float_cmp                    = "allow"
missing_const_for_fn         = "allow"
missing_errors_doc           = "allow"
needless_pass_by_ref_mut     = "allow"
too_long_first_doc_paragraph = "allow"
