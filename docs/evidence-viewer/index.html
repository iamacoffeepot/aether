<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Evidence Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1b1f23;
    --bg: #ffffff;
    --muted: #57606a;
    --border: #d0d7de;
    --card: #f6f8fa;
    --link: #0969da;
    --ok: #1a7f37;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3;
      --bg: #0d1117;
      --muted: #9198a1;
      --border: #30363d;
      --card: #161b22;
      --link: #4493f8;
      --ok: #3fb950;
      --bad: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 1rem;
  }
  h2 {
    font-size: 1.1rem;
    margin: 1.75rem 0 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.25rem;
  }
  a {
    color: var(--link);
  }
  .muted {
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
  }
  .verdict-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .badge-ok { color: var(--ok); border-color: var(--ok); }
  .badge-bad { color: var(--bad); border-color: var(--bad); }
  .badge-neutral { color: var(--muted); }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1rem;
  }
  th, td {
    text-align: left;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.85rem;
  }
  td.summary {
    font-size: 0.85rem;
  }
  .category-heading {
    margin-top: 1rem;
    font-weight: 600;
  }
  ul.plain {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.plain li {
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  video, img.frame {
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: block;
    margin: 0.5rem 0;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin: 0.5rem 0;
  }
  code {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.1rem 0.35rem;
  }
  /* A prompt is long-form text, not code: wrap it rather than sending the page
     into a horizontal scroll. */
  pre {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    margin: 0.4rem 0 1rem;
    overflow-x: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 0.85rem;
    line-height: 1.45;
  }
  details {
    margin: 0.5rem 0;
  }
  summary {
    cursor: pointer;
    color: var(--link);
  }
</style>
</head>
<body>
<main id="app">
  <h1>Aether Evidence Viewer</h1>
  <p class="muted">Loading&hellip;</p>
</main>
<script>
(function () {
  "use strict";

  // Storage-repoint knobs: change these two constants to retroactively fix every
  // previously posted evidence link (bucket rename, CloudFront/OAC swap, etc).
  var BRANCH_BASE = "https://raw.githubusercontent.com/iamacoffeepot/aether/dogfood/evidence/evidence/";
  var BUCKET_BASE = "https://aether-evidence.s3.amazonaws.com/evidence/";

  var REPO = "iamacoffeepot/aether";
  var EVIDENCE_BRANCH = "dogfood/evidence";
  var API_BASE = "https://api.github.com/repos/" + REPO;

  var app = document.getElementById("app");

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function el(tag, opts) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text !== undefined) node.textContent = opts.text;
    if (opts.href !== undefined) node.href = opts.href;
    if (opts.attrs) {
      for (var k in opts.attrs) {
        if (Object.prototype.hasOwnProperty.call(opts.attrs, k)) node.setAttribute(k, opts.attrs[k]);
      }
    }
    return node;
  }

  // Validates and parses ?run=<issue>/<run>. issue must be digits; run must be
  // [A-Za-z0-9._-]+. Returns null for anything else — these values are
  // interpolated into URLs, never into HTML unescaped.
  function parseRun(raw) {
    if (!raw) return null;
    var parts = raw.split("/");
    if (parts.length !== 2) return null;
    var issue = parts[0];
    var run = parts[1];
    if (!/^[0-9]+$/.test(issue)) return null;
    if (!/^[A-Za-z0-9._-]+$/.test(run)) return null;
    return { issue: issue, run: run, joined: issue + "/" + run };
  }

  // Run ids are "<github run id>-<attempt>"; both halves are numeric and the
  // run id is assigned monotonically, so a numeric compare doubles as time
  // order. Falls back to a string compare for anything unexpected.
  function compareRunsDesc(a, b) {
    var pa = a.split("-");
    var pb = b.split("-");
    var byRun = (Number(pb[0]) || 0) - (Number(pa[0]) || 0);
    if (byRun) return byRun;
    var byAttempt = (Number(pb[1]) || 0) - (Number(pa[1]) || 0);
    if (byAttempt) return byAttempt;
    return a < b ? 1 : a > b ? -1 : 0;
  }

  function fetchJson(url) {
    return fetch(url).then(function (resp) {
      if (!resp.ok) throw new Error("fetch failed: " + resp.status + " " + url);
      return resp.json();
    });
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  }

  function truncate(text, max) {
    if (typeof text !== "string") return "";
    return text.length > max ? text.slice(0, max - 1) + "…" : text;
  }

  // Fills a run row's verdict + summary cells from its rollup.json, best
  // effort: a run whose rollup never landed just shows a neutral badge.
  function fillRowFromRollup(joined, verdictCell, summaryCell) {
    fetchJson(BRANCH_BASE + joined + "/rollup.json")
      .then(function (rollup) {
        verdictCell.appendChild(badgeFor(rollup.succeeded === true, "succeeded: " + String(rollup.succeeded)));
        if (rollup.artifact) {
          var verdict = rollup.artifact.verdict;
          verdictCell.appendChild(document.createTextNode(" "));
          verdictCell.appendChild(badgeFor(verdict === "correct" ? true : verdict === "wrong" ? false : null, "artifact: " + String(verdict)));
        }
        summaryCell.textContent = truncate(fieldText(rollup.summary), 200);
      })
      .catch(function () {
        verdictCell.appendChild(badgeFor(null, "no rollup"));
      });
  }

  function renderRunRow(issue, run, dates) {
    var joined = issue + "/" + run;
    var tr = el("tr");

    var runCell = el("td");
    runCell.appendChild(el("a", { text: run, href: "?run=" + joined }));
    tr.appendChild(runCell);

    tr.appendChild(el("td", { className: "muted", text: formatDate(dates[joined]) }));

    var verdictCell = el("td");
    tr.appendChild(verdictCell);
    var summaryCell = el("td", { className: "muted summary" });
    tr.appendChild(summaryCell);
    fillRowFromRollup(joined, verdictCell, summaryCell);

    return tr;
  }

  function renderRunList(tree, dates) {
    var seen = {};
    var byIssue = {};
    var entries = (tree && tree.tree) || [];
    for (var i = 0; i < entries.length; i++) {
      var match = /^evidence\/([0-9]+)\/([A-Za-z0-9._-]+)\//.exec((entries[i] && entries[i].path) || "");
      if (!match) continue;
      var joined = match[1] + "/" + match[2];
      if (seen[joined]) continue;
      seen[joined] = true;
      (byIssue[match[1]] = byIssue[match[1]] || []).push(match[2]);
    }

    var issues = Object.keys(byIssue);
    issues.forEach(function (issue) {
      byIssue[issue].sort(compareRunsDesc);
    });
    // Newest issue first, where an issue's age is its most recent run.
    issues.sort(function (a, b) {
      return compareRunsDesc(byIssue[a][0], byIssue[b][0]);
    });

    clear(app);
    app.appendChild(el("h1", { text: "Aether Evidence Viewer" }));
    app.appendChild(el("p", {
      className: "muted",
      text: "Dogfood trial runs, newest first, grouped by closing issue. Open a run for its full rollup.",
    }));

    if (issues.length === 0) {
      app.appendChild(el("p", { className: "card", text: "No runs found on the evidence branch." }));
      return;
    }
    if (tree && tree.truncated) {
      app.appendChild(el("p", { className: "muted", text: "The branch listing was truncated by the GitHub API; the oldest runs may be missing." }));
    }

    issues.forEach(function (issue) {
      var heading = el("h2");
      heading.appendChild(el("a", {
        text: "Issue #" + issue,
        href: "https://github.com/" + REPO + "/issues/" + issue,
      }));
      app.appendChild(heading);

      var table = el("table");
      var thead = el("thead");
      var headRow = el("tr");
      ["run", "when", "verdict", "summary"].forEach(function (h) {
        headRow.appendChild(el("th", { text: h }));
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      var tbody = el("tbody");
      byIssue[issue].forEach(function (run) {
        tbody.appendChild(renderRunRow(issue, run, dates));
      });
      table.appendChild(tbody);
      app.appendChild(table);
    });
  }

  function renderIndexError() {
    clear(app);
    app.appendChild(el("h1", { text: "Aether Evidence Viewer" }));
    app.appendChild(el("p", {
      className: "card",
      text: "Could not list runs from the evidence branch — the GitHub API request failed (possibly rate-limited). Retry in a minute, or open a run directly with ?run=<issue>/<run>.",
    }));
  }

  // The landing state: enumerate every run on the evidence branch. One
  // commits call supplies both the branch tip (for the tree listing) and a
  // best-effort run -> date map from the "evidence: dogfood run <issue>/<run>"
  // commit subjects — a /sweep squash of the branch drops old dates, but the
  // runs themselves still list from the tree.
  function renderIndex() {
    fetchJson(API_BASE + "/commits?sha=" + encodeURIComponent(EVIDENCE_BRANCH) + "&per_page=100")
      .then(function (commits) {
        if (!Array.isArray(commits) || commits.length === 0) throw new Error("no commits on the evidence branch");
        var dates = {};
        commits.forEach(function (c) {
          var message = (c && c.commit && c.commit.message) || "";
          var match = /^evidence: dogfood run ([0-9]+\/[A-Za-z0-9._-]+)/.exec(message);
          if (match && c.commit.committer && c.commit.committer.date) {
            dates[match[1]] = c.commit.committer.date;
          }
        });
        return fetchJson(API_BASE + "/git/trees/" + commits[0].commit.tree.sha + "?recursive=1")
          .then(function (tree) {
            renderRunList(tree, dates);
          });
      })
      .catch(function () {
        renderIndexError();
      });
  }

  function renderInvalidRun(raw) {
    clear(app);
    app.appendChild(el("h1", { text: "Aether Evidence Viewer" }));
    var p = el("p", { className: "muted" });
    p.appendChild(document.createTextNode("The "));
    p.appendChild(el("code", { text: "run" }));
    p.appendChild(document.createTextNode(" query parameter must look like "));
    p.appendChild(el("code", { text: "<issue>/<run>" }));
    p.appendChild(document.createTextNode(" (digits, then letters/digits/._-)."));
    app.appendChild(p);
  }

  function renderNotFound(run) {
    clear(app);
    app.appendChild(backLink());
    app.appendChild(el("h1", { text: "Aether Evidence Viewer" }));
    var p = el("p", { className: "card" });
    p.appendChild(document.createTextNode("No evidence found for run "));
    p.appendChild(el("code", { text: run.joined }));
    p.appendChild(document.createTextNode(". The rollup for this run could not be fetched — it may not have been uploaded yet, or the run id is wrong."));
    app.appendChild(p);
  }

  function badgeFor(ok, label) {
    var cls = ok === true ? "badge badge-ok" : ok === false ? "badge badge-bad" : "badge badge-neutral";
    return el("span", { className: cls, text: label });
  }

  function renderVerdictHeader(rollup) {
    var section = el("div", { className: "card" });
    var row1 = el("div", { className: "verdict-row" });
    row1.appendChild(badgeFor(rollup.succeeded === true, "succeeded: " + String(rollup.succeeded)));
    if (rollup.buildGreen !== null && rollup.buildGreen !== undefined) {
      row1.appendChild(badgeFor(rollup.buildGreen === true, "buildGreen: " + String(rollup.buildGreen)));
    }
    if (rollup.artifact) {
      var verdict = rollup.artifact.verdict;
      row1.appendChild(badgeFor(verdict === "correct" ? true : verdict === "wrong" ? false : null, "artifact: " + String(verdict)));
    }
    section.appendChild(row1);
    if (rollup.summary) {
      section.appendChild(el("p", { text: rollup.summary }));
    }
    if (rollup.artifact && rollup.artifact.rationale) {
      var rat = el("p", { className: "muted" });
      rat.appendChild(document.createTextNode("Judge rationale: " + rollup.artifact.rationale));
      section.appendChild(rat);
    }
    return section;
  }

  function fieldText(value) {
    if (value === null || value === undefined) return "";
    if (typeof value === "object") {
      try { return JSON.stringify(value); } catch (e) { return String(value); }
    }
    return String(value);
  }

  // The task and the provenance are what make a verdict falsifiable: without the
  // prompt the consumer was handed and the artifact the judge was told to expect,
  // a "wrong" is unreadable — you cannot tell a real defect from an agent that was
  // asked the wrong question. Everything is set via textContent, never innerHTML.
  function labelled(label, value) {
    var p = el("p");
    var strong = el("strong", { text: label + ": " });
    p.appendChild(strong);
    p.appendChild(document.createTextNode(fieldText(value) || "—"));
    return p;
  }

  function renderTask(task) {
    var section = el("div", { className: "card" });
    if (!task || typeof task !== "object") {
      section.appendChild(el("p", {
        className: "muted",
        text: "This run predates task capture — the rollup does not record what the consumer was asked.",
      }));
      return section;
    }
    section.appendChild(labelled("Medium", task.medium));
    section.appendChild(labelled("Surface under test", task.surfaceUnderTest));

    section.appendChild(el("div", { className: "category-heading", text: "Handed verbatim to the consumer" }));
    section.appendChild(el("pre", { text: fieldText(task.prompt) || "—" }));

    section.appendChild(el("div", {
      className: "category-heading",
      text: "Expected artifact (the judge grades against this; the consumer never sees it)",
    }));
    section.appendChild(el("pre", {
      text: task.expectedArtifact ? fieldText(task.expectedArtifact) : "(none — nothing renders, so no artifact was judged)",
    }));
    return section;
  }

  function renderProvenance(provenance) {
    var wrap = document.createDocumentFragment();
    if (!provenance || typeof provenance !== "object") {
      wrap.appendChild(el("p", {
        className: "muted",
        text: "This run predates provenance capture — the models, effort, and prompts it ran with were not recorded.",
      }));
      return wrap;
    }

    var table = el("table");
    var thead = el("thead");
    var headRow = el("tr");
    ["phase", "model", "effort", "agent type"].forEach(function (heading) {
      headRow.appendChild(el("th", { text: heading }));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el("tbody");
    var driverRow = el("tr");
    driverRow.appendChild(el("td", { text: "driver (harness session)" }));
    driverRow.appendChild(el("td", { text: fieldText(provenance.driver && provenance.driver.model) || "—" }));
    driverRow.appendChild(el("td", { text: "—" }));
    driverRow.appendChild(el("td", { text: "—" }));
    tbody.appendChild(driverRow);

    var phases = provenance.phases || {};
    var order = ["author", "attempt", "judge"];
    order.forEach(function (name) {
      var phase = phases[name];
      if (!phase) return;
      var tr = el("tr");
      tr.appendChild(el("td", { text: phase.prompt ? name : name + " (did not run)" }));
      tr.appendChild(el("td", { text: fieldText(phase.model) || "—" }));
      tr.appendChild(el("td", { text: fieldText(phase.effort) || "—" }));
      tr.appendChild(el("td", { text: fieldText(phase.agentType) || "—" }));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    order.forEach(function (name) {
      var phase = phases[name];
      if (!phase || !phase.prompt) return;
      var details = el("details");
      details.appendChild(el("summary", { text: "The " + name + " prompt, as sent" }));
      details.appendChild(el("pre", { text: fieldText(phase.prompt) }));
      wrap.appendChild(details);
    });

    return wrap;
  }

  function renderFrictionTable(friction) {
    var wrap = document.createDocumentFragment();
    if (!friction || typeof friction !== "object") return wrap;
    var categories = Object.keys(friction);
    var any = false;
    for (var i = 0; i < categories.length; i++) {
      var category = categories[i];
      var items = friction[category];
      if (!Array.isArray(items) || items.length === 0) continue;
      any = true;
      wrap.appendChild(el("div", { className: "category-heading", text: category + " (" + items.length + ")" }));
      var table = el("table");
      var thead = el("thead");
      var headRow = el("tr");
      ["severity", "where", "what", "suggested"].forEach(function (h) {
        headRow.appendChild(el("th", { text: h }));
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      var tbody = el("tbody");
      items.forEach(function (finding) {
        var tr = el("tr");
        tr.appendChild(el("td", { text: fieldText(finding && finding.severity) }));
        tr.appendChild(el("td", { text: fieldText(finding && finding.where) }));
        tr.appendChild(el("td", { text: fieldText(finding && finding.what) }));
        tr.appendChild(el("td", { text: fieldText(finding && finding.suggested) }));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
    }
    if (!any) {
      wrap.appendChild(el("p", { className: "muted", text: "No friction findings." }));
    }
    return wrap;
  }

  function renderTokenTable(tokensPerTool) {
    if (!Array.isArray(tokensPerTool)) return null;

    var wrap = document.createDocumentFragment();
    if (tokensPerTool.length === 0) {
      wrap.appendChild(el("p", { className: "muted", text: "No MCP tool traffic recorded." }));
      return wrap;
    }

    var rows = tokensPerTool.slice().sort(function (left, right) {
      var leftTotal = Number(left && left.tokensIn || 0) + Number(left && left.tokensOut || 0);
      var rightTotal = Number(right && right.tokensIn || 0) + Number(right && right.tokensOut || 0);
      return rightTotal - leftTotal || fieldText(left && left.tool).localeCompare(fieldText(right && right.tool));
    });
    var table = el("table");
    var thead = el("thead");
    var headRow = el("tr");
    ["tool", "calls", "tokens in", "tokens out"].forEach(function (heading) {
      headRow.appendChild(el("th", { text: heading }));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var tbody = el("tbody");
    rows.forEach(function (row) {
      var tr = el("tr");
      tr.appendChild(el("td", { text: fieldText(row && row.tool) }));
      tr.appendChild(el("td", { text: fieldText(row && row.calls) }));
      tr.appendChild(el("td", { text: fieldText(row && row.tokensIn) }));
      tr.appendChild(el("td", { text: fieldText(row && row.tokensOut) }));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function renderSoftHolds(softHolds) {
    var wrap = document.createDocumentFragment();
    if (!Array.isArray(softHolds) || softHolds.length === 0) {
      wrap.appendChild(el("p", { className: "muted", text: "No soft-holds." }));
      return wrap;
    }
    var ul = el("ul", { className: "plain" });
    softHolds.forEach(function (hold) {
      var li = el("li");
      var kind = fieldText(hold && hold.kind);
      var where = fieldText(hold && hold.where);
      var detail = fieldText(hold && hold.detail);
      var text = kind;
      if (where) text += " (" + where + ")";
      if (detail) text += ": " + detail;
      li.textContent = text;
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    return wrap;
  }

  function renderMedia(run) {
    var wrap = document.createDocumentFragment();

    var img = el("img", {
      className: "frame",
      attrs: { alt: "judged frame for run " + run.joined },
    });
    img.src = BRANCH_BASE + run.joined + "/frame.png";
    img.onerror = function () {
      img.style.display = "none";
    };
    wrap.appendChild(img);

    var video = el("video", { attrs: { controls: "", preload: "metadata" } });
    video.src = BUCKET_BASE + run.joined + "/trial.mp4";
    video.onerror = function () {
      video.style.display = "none";
    };
    wrap.appendChild(video);

    var links = el("div", { className: "links" });
    var transcript = el("a", { text: "transcript.jsonl", href: BUCKET_BASE + run.joined + "/transcript.jsonl" });
    var solution = el("a", {
      text: "solution/",
      href: "https://github.com/iamacoffeepot/aether/tree/dogfood/evidence/evidence/" + run.joined + "/solution",
    });
    links.appendChild(transcript);
    links.appendChild(solution);
    wrap.appendChild(links);

    return wrap;
  }

  function backLink() {
    var p = el("p");
    p.appendChild(el("a", { text: "← all runs", href: "?" }));
    return p;
  }

  function renderRollup(run, rollup) {
    clear(app);
    app.appendChild(backLink());
    app.appendChild(el("h1", { text: "Evidence: " + run.joined }));
    app.appendChild(renderVerdictHeader(rollup));

    app.appendChild(el("h2", { text: "The task" }));
    app.appendChild(renderTask(rollup.task));

    app.appendChild(el("h2", { text: "Friction" }));
    app.appendChild(renderFrictionTable(rollup.friction));

    app.appendChild(el("h2", { text: "Soft-holds" }));
    app.appendChild(renderSoftHolds(rollup.softHolds));

    var tokenTable = renderTokenTable(rollup.tokensPerTool);
    if (tokenTable) {
      app.appendChild(el("h2", { text: "MCP tool tokens" }));
      app.appendChild(tokenTable);
    }

    app.appendChild(el("h2", { text: "Media & artifacts" }));
    app.appendChild(renderMedia(run));

    app.appendChild(el("h2", { text: "Provenance" }));
    app.appendChild(renderProvenance(rollup.provenance));
  }

  function main() {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get("run");
    if (!raw) {
      renderIndex();
      return;
    }
    var run = parseRun(raw);
    if (!run) {
      renderInvalidRun(raw);
      return;
    }
    var rollupUrl = BRANCH_BASE + run.joined + "/rollup.json";
    fetch(rollupUrl)
      .then(function (resp) {
        if (!resp.ok) throw new Error("rollup fetch failed: " + resp.status);
        return resp.json();
      })
      .then(function (rollup) {
        renderRollup(run, rollup);
      })
      .catch(function () {
        renderNotFound(run);
      });
  }

  main();
})();
</script>
</body>
</html>
