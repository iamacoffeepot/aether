[book]
title = "Aether Guide"
description = "How Aether works and how to build with it — for agents and humans."
authors = ["aether"]
language = "en"
# The guide source lives under docs/guide/ so it sits next to the ADRs
# (docs/adr/) without entangling with them. The rendered site builds to
# docs/book/ (gitignored); CI rebuilds it fresh and deploys to Pages. The
# standalone docs/evidence-viewer/ and docs/pipeline-deck/ pages live outside
# this mdBook source and docs.yml copies them into the Pages tree after build.
src = "guide"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/iamacoffeepot/aether"
edit-url-template = "https://github.com/iamacoffeepot/aether/edit/main/docs/{path}"
no-section-label = false

[output.html.fold]
enable = true
level = 2

[output.html.search]
enable = true
