[package]
name = "aether-bloomery-muse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The muse.turn Sampled bloomery program: one stateless responses-API turn per run (ADR-0234)."

# One bundle crate: the cdylib is the program bundle `cargo xtask build-wasm`
# discovers structurally (cdylib + aether-actor); the rlib lets the native
# integration test drive `MuseTurn` through `start_async`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-program = { path = "../aether-bloomery-program" }
aether-bloomery-workspace = { path = "../aether-bloomery-workspace", default-features = false }
# The proof tools a session offers from the `workspace-programs` bundle: their
# programs render and check the offer, and `ProofBound` is what it binds.
# `library` strips that bundle's `export!`, so this bundle exports no proof.
aether-bloomery-workspace-programs = { path = "../aether-bloomery-workspace-programs", features = ["library"] }
aether-codec = { path = "../aether-codec" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-http = { path = "../aether-http", default-features = false }
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
serde_json = { workspace = true }

[lints]
workspace = true
