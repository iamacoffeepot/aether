[package]
name = "aether-contentgen"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0050 shared content-gen layer, reduced by ADR-0159 (issue #3893) to the
# I/O-free surface the surviving `aether.gemini` guest component still consumes:
# the adapter-facing request DTO (`adapter`) its pure body builder converts
# through, and the `status=<n>` / body-snippet string helpers (`strparse`) its
# error taxonomy calls. Both are wasm-safe, so the crate carries no
# dependencies.
#
# The native runtime half this crate used to own — the `ureq` transport
# plumbing, the `gen/<uuid>` staging, and the staging-root `Config` derive —
# retired with the provider caps when they moved into wasm guest components
# (ADR-0159 §6).

