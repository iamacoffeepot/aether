[package]
name = "aether-contentgen"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0050 shared content-gen layer, extracted from `aether-capabilities`
# (iamacoffeepot/aether#3705) as the shared foundation of the provider-cluster
# split. Owns the infrastructure both content-gen provider caps
# (`aether-anthropic`, `aether-gemini`) embed but which is not itself a cap: the
# provider-adapter traits + stub impls (`adapter`), the `ContentGenConfig`
# staging-root config (`config`), the `gen/<uuid>.<ext>` output staging
# (`staging`), and the shared `ureq` transport plumbing (`transport`). It is a
# thin foundation — no re-export facade — that the two provider crates depend on;
# nothing depends back on it from `aether-capabilities` (no back-dep).
#
# The dispatch model both caps embed rides `aether_substrate`'s
# `TaskQueue` (`aether_substrate::actor::native::TaskQueue`), which lives in the
# substrate; contentgen references it by that full path and does not re-home it.
# Generated artifacts stage through the `aether.fs` cap's `LocalFileAdapter`, so
# the crate depends on `aether-fs` (identity-only by default; the `runtime`
# feature forwards `aether-fs/runtime`).
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# always-on face carries only the wasm-safe adapter traits + stub types and the
# `ContentGenConfig` domain struct; the `aether_substrate`-typed runtime half
# (the `Config` derive, the `ureq` transport, and the `uuid`-named `gen/`
# staging) is gated so a marker-only build never pulls the transport / substrate
# stack through it.

[features]
default = ["runtime"]
runtime = [
    "dep:aether-substrate",
    "aether-fs/runtime",
    "dep:ureq",
    "dep:uuid",
    "dep:clap",
    "dep:confique",
]

[dependencies]
# The `gen/` staging path writes generated bytes atomically through the
# `aether.fs` cap's `LocalFileAdapter` and reports `FsError`.
# `default-features = false` keeps the marker-only build from dragging the fs
# runtime; the `runtime` feature above forwards `aether-fs/runtime`.
aether-fs = { path = "../aether-fs", default-features = false }
# Native-only runtime half — gated so marker builds skip the substrate runtime
# (the `Config` derive) + the `ureq` transport / `uuid` staging.
aether-substrate = { path = "../aether-substrate", optional = true }
# ADR-0050 §1: the shared blocking HTTP transport both provider adapters run
# their requests through. Rides the `runtime` feature.
ureq = { version = "3", optional = true, features = ["rustls"] }
# `v4` random-name generation for `gen/<uuid>.<ext>` staged output paths
# (ADR-0050). Rides the `runtime` feature.
uuid = { version = "1", optional = true, features = ["v4"] }
# The `Config` derive emits the `ContentGenConfigLayer`
# (`#[derive(confique::Config)]`) + `ContentGenOverlay` (`#[derive(clap::Args)]`)
# structs; both ride the `runtime` feature so marker builds skip them.
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }

[dev-dependencies]
# The staging unit tests boot the `aether_substrate::testing` scratch-dir
# fixture, enabled by the substrate `test-support` feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
aether-fs = { path = "../aether-fs" }

# cargo-machete (the CI unused-deps gate) scans source without resolving
# features, so it cannot see that `clap` and `confique` are used only through
# the `Config` derive's codegen under the optional `runtime` feature —
# `confique` via `#[derive(confique::Config)]` on the config layer, `clap` via
# the `#[derive(clap::Args)]` the same derive emits on the `*Overlay` struct.
# Both are false positives: the deps are real and runtime-gated.
[package.metadata.cargo-machete]
ignored = ["clap", "confique"]

[lints]
workspace = true
