[package]
name = "aether-window"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.window` capability, extracted by the arc that dissolved the
# capabilities monolith (iamacoffeepot/aether#3717) as a per-cap crate. Owns
# the concrete `HeadlessWindowCapability` identity + its fail-fast
# `Err`-replying default runtime (`runtime/mod.rs`), with desktop and synthetic
# alternatives under keyed runtime children. The crate also owns the public multi-window request,
# reply, lifecycle, selector, and sender-facade surface; only the shared
# `WindowId` and `WindowMode` values live in `aether-kinds`.
#
# Unlike the pure-leaf `aether-clipboard`, this crate has an inbound
# consumer: `aether-rpc`'s server test addresses `HeadlessWindowCapability` to
# exercise the `Component` local-RPC-server reply path, so `aether-rpc` holds
# it as a dev-dependency.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identity + `HandlesKind` markers compile always-on; the
# `aether_substrate`-typed runtime half is gated so a marker-only wasm
# guest can address `ctx.actor::<WindowCapability>()` without
# dragging the substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate"]
# The desktop runtime (ADR-0160 §Decision 2): the state-bearing
# `DesktopWindowCapability` that drives a real winit window. Pulls the
# substrate runtime (via `runtime`) plus winit; default features stay
# `runtime`-only, so headless / harness / wasm consumers never build winit.
desktop = ["runtime", "dep:winit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
# Deterministic in-memory window manager and raw event injection surface for
# real-substrate harness tests. Production chassis do not enable this feature.
synthetic = ["runtime"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-kinds = { path = "../aether-kinds" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# Native-only runtime half — gated so wasm/marker builds skip the substrate
# runtime.
aether-substrate = { path = "../aether-substrate", optional = true }
# The winit window handle the desktop runtime mutates. Gated behind the
# `desktop` feature so only a desktop chassis build pulls it.
winit = { version = "0.30", optional = true }

# The `#[actor]` macro emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` HandlerEntry per handler, so native builds need
# `inventory` reachable; wasm guests don't (the gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

# App activation is only needed by the desktop runtime on macOS. Keep these
# bindings out of every other target, including wasm marker-only consumers.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"], optional = true }

[dev-dependencies]
# The selector/unsubscribe/drop integration scenarios boot the in-process
# harness with its synthetic window runtime and component host.
aether-harness-substrate = { path = "../aether-harness-substrate" }
# The scenarios load and drop the Probe wasm through `aether.component`.
aether-component = { path = "../aether-component" }
# The Probe's re-broadcast kinds the scenarios count at the harness observer.
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
# The Probe wasm loaded by stem (`aether_test_fixtures_bundle.wasm`): declared
# so the runtime artifact coupling is cargo-visible.
aether-test-fixtures-bundle = { path = "../aether-test-fixtures-bundle" }
# `test-support` exposes `aether_substrate::testing::boot_authority`, the
# test-only mint for the `BootAuthority` the registry's direct mutators now
# require (ADR-0165 / iamacoffeepot/aether#4156).
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

# The Probe wasm coupling above is load-by-stem only — no source import — so
# the source-scanning unused-deps gate cannot see it.
[package.metadata.cargo-machete]
ignored = ["aether-test-fixtures-bundle"]

[lints]
workspace = true
