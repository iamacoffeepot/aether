[package]
name = "aether-tcp"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.tcp` capability (ADR-0079), extracted by the arc that dissolved the
# capabilities monolith (iamacoffeepot/aether#3751) as a leaf per-cap
# crate. Owns the whole three-tier TCP
# lineage — the `TcpCapability` control plane (Singleton), the
# `TcpListenerActor` accept-loop supervisor (Instanced, one per bound
# port), and the `TcpSessionActor` framed read/write endpoint (Instanced,
# one per connection) — plus the cap's own `aether.tcp.*` mail kinds
# (`kinds`), the listener / session init configs (`config`), and the
# send-side `TcpWasmExt` / `TcpNativeExt` facades (`route`).
#
# The `aether-game` player tier is the in-repo consumer that names these
# types directly. That is a downward leaf→leaf dependency, not a facade: a
# downstream crate that wants TCP deps on `aether-tcp` directly, and pulls in
# nothing else.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identities, mail kinds, and `HandlesKind` markers compile
# always-on; the `aether_substrate`-typed runtime half (the cap's
# listener-fleet supervisor map, the accept-loop sidecar threads, and the
# framed session I/O) is gated so a marker-only wasm guest can address
# `ctx.actor::<TcpCapability>()` without dragging the substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate", "dep:aether-codec", "dep:tracing"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# ADR-0072 length-prefix stream framing — the session runtime pops whole
# frames off its read buffer with `aether_codec::frame::pop_frame`. Rides
# the `runtime` feature; the framing lives on the native I/O half.
aether-codec = { path = "../aether-codec", optional = true }
# Native-only runtime half — gated so wasm/marker builds skip the
# substrate runtime.
aether-substrate = { path = "../aether-substrate", optional = true }
# The accept loop and session I/O log bind/accept/close transitions and
# warn on a framing or socket failure. Rides the `runtime` feature —
# those log sites are native-only.
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }

# The `Kind` derive and the `#[actor]` macro each emit a
# `cfg(not(target_family = "wasm"))`-gated `inventory::submit!`, so native
# builds need `inventory` reachable; wasm guests don't (the gate skips
# emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The runtime unit tests boot a chassis through the canonical
# `aether_substrate::testing` fixture, enabled by the substrate
# `test-support` feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

[lints]
workspace = true
