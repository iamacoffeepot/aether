[package]
name = "aether-bloomery-reactor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Portable reactor preparation, signature macros, and pure evaluation of typed stored-event arms (ADR-0222)."

[dependencies]
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-reactor-derive = { path = "../aether-bloomery-reactor-derive" }
aether-bloomery-view = { path = "../aether-bloomery-view" }
aether-data = { path = "../aether-data", features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-view = { path = "../aether-bloomery-view" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-kinds = { path = "../aether-kinds" }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
aether-test-fixtures-reactor = { path = "../aether-test-fixtures-reactor" }
wasmparser = "0.246"

# The tests load this fixture's built wasm by stem, so the cargo edge exists
# solely for determinator and dist pre-build visibility.
[package.metadata.cargo-machete]
ignored = ["aether-test-fixtures-reactor"] # aether-suppression-request: the fixture edge exists for determinator/dist visibility (its wasm is loaded by stem, never imported)

[lints]
workspace = true
