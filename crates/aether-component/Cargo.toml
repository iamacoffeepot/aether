[package]
name = "aether-component"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.component` wasm-component-lifecycle capability (ADR-0022,
# ADR-0038, ADR-0122), extracted by the arc that dissolved the capabilities
# monolith (iamacoffeepot/aether#3756) as a per-cap crate. Named for the `aether.component` mailbox it
# owns, matching every other cap crate in the arc.
#
# The cap (`component`) and the trampoline every loaded wasm component
# runs as (`trampoline`) move as one unit because they are one capability
# split across two modules: the cap names `WasmTrampoline` /
# `WasmTrampolineConfig` for real — it spawns the trampoline, reads its
# `NAMESPACE` to build peer addresses, and hands it its init config —
# while the trampoline's references back to the cap are rustdoc links
# only. Neither half is useful alone.
#
# The `http` cap's deferred-reply path names `ComponentHostCapability` to
# resolve the handler component it answers through, so `aether-http`
# depends on this crate. That is a genuine downward use, not a facade —
# neither crate re-exports the other's names.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the ZST
# cap and trampoline identities with their `Addressable`, per-handler
# `HandlesKind`, and name-inventory markers compile always-on; the
# state-bearing wasmtime half (the cap state, the trampoline state, and
# both init configs, which hold `Arc<Engine>` / `Arc<Linker<ComponentCtx>>`)
# is gated so a marker-only wasm guest can address
# `ctx.actor::<ComponentHostCapability>()` without dragging wasmtime and
# the substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate", "dep:wasmtime", "dep:sha2", "dep:tracing"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# Native-only runtime half — gated so wasm/marker builds skip the
# substrate runtime.
aether-substrate = { path = "../aether-substrate", optional = true }
# The wasm engine the cap and its trampolines are built around: the cap
# state holds `Arc<Engine>` / `Arc<Linker<ComponentCtx>>`, and each
# trampoline owns the instantiated guest `Component`. Rides the `runtime`
# feature — the identity half never names it.
wasmtime = { workspace = true, optional = true }
# ADR-0147 module-boot dedup keys the loaded wasm by its sha256 content
# hash. Rides the `runtime` feature; the hashing happens on the load path.
sha2 = { workspace = true, optional = true }
# The load path and the trampoline's replace / forward sites log lifecycle
# transitions and warn-drop unroutable mail. Rides the `runtime` feature —
# those log sites are native-only.
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }

# The `#[actor]` macro emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!`, so native builds need `inventory` reachable; wasm
# guests don't (the gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
trybuild = "1"
# iamacoffeepot/aether#3769: the component scenario tests (load / replace /
# drop lifecycle, module boot, inline children, typed config, guest ctx
# surface) rehomed here from aether-substrate-bundle. They boot the
# in-process `SubstrateHarness` harness (issue #3765) with
# `.with_component_host()` — non-visual, so no capture-crate edge.
aether-harness-substrate = { path = "../aether-harness-substrate" }
# iamacoffeepot/aether#3776: the component fleet tests (load / replace /
# describe over the wire, the hub component store, and replace/drop reply
# routing) rehomed here from aether-substrate-bundle. They drive the real
# hub → RPC → forked-headless stack through `FleetHarness` and speak raw
# wire `Call` frames, which needs the rpc wire vocabulary in test scope.
aether-harness-fleet = { path = "../aether-harness-fleet" }
aether-rpc = { path = "../aether-rpc" }
# `fleetharness_replace` swaps the probe for the kit camera export,
# drives it with `CameraCreate`, and cold-loads `aether_kit_commons.wasm`, so
# the dep is both a real import and the #3766 source→consumer coupling
# that keeps determinator and the dist pre-build honest.
aether-kit-commons = { path = "../aether-kit-commons" }
# `fleetharness_component_store` assembles a boot-manifest JSON file for
# the spawn-with-manifest path (called fully-qualified, no `use`).
serde_json = { workspace = true }
# Integration tests see only the lib + dev-deps, so the SDK / data /
# kind-vocabulary crates the tests import need their own dev entries even
# though the lib already depends on them.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# The shared `Kind` definitions the tests decode + assert against; also
# pinned (`use … as _`) so the fixture kinds' `inventory::submit!`
# descriptor entries land in each test binary.
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
# iamacoffeepot/aether#3766: the fixture crates whose wasm these tests
# load, declared so the source→consumer coupling is cargo-visible —
# determinator re-runs these tests when a fixture changes, and xtask's
# wasm-consumer rule fires the dist pre-build. The tests locate the
# built wasm by stem, so the code never imports these crates.
aether-test-fixtures-bundle = { path = "../aether-test-fixtures-bundle" }
aether-test-fixtures-boot = { path = "../aether-test-fixtures-boot" }
aether-test-fixtures-defaultless = { path = "../aether-test-fixtures-defaultless" }
aether-test-fixtures-stateful-typed = { path = "../aether-test-fixtures-stateful-typed" }
aether-test-fixtures-stateful-reshaped = { path = "../aether-test-fixtures-stateful-reshaped" }
# `dispatch_decode_failure` drives the `Probe` fixture directly through
# the pub `Component::instantiate` / `deliver` API, which needs the
# substrate types and `wasmtime::{Engine, Linker, Module}` in test scope
# (integration tests see only the lib + dev-deps). `test-support` exposes
# `aether_substrate::testing::boot_authority`, the test-only mint for the
# `BootAuthority` the registry's direct mutators now require (ADR-0165 /
# iamacoffeepot/aether#4156).
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
wasmtime = { workspace = true }

# cargo-machete's source-only scan cannot see the wasm-coupling dev-deps
# above: the tests load each fixture's built wasm by stem rather than
# importing the crate, so the cargo edge exists purely for determinator /
# dist-pre-build visibility (iamacoffeepot/aether#3766).
[package.metadata.cargo-machete]
ignored = [
    "aether-test-fixtures-bundle",
    "aether-test-fixtures-boot",
    "aether-test-fixtures-defaultless",
    "aether-test-fixtures-stateful-typed",
    "aether-test-fixtures-stateful-reshaped",
]

[lints]
workspace = true
