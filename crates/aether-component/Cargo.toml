[package]
name = "aether-component"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.component` wasm-component-lifecycle capability (ADR-0022,
# ADR-0038, ADR-0122), extracted by the arc that dissolved the capabilities
# monolith (iamacoffeepot/aether#3756) as a per-cap crate. Named for the `aether.component` mailbox it
# owns, matching every other cap crate in the arc.
#
# The cap (`component`) and the trampoline every loaded wasm component
# runs as (`trampoline`) move as one unit because they are one capability
# split across two modules: the cap names `WasmTrampoline` /
# `WasmTrampolineConfig` for real — it spawns the trampoline, reads its
# `NAMESPACE` to build peer addresses, and hands it its init config —
# while the trampoline's references back to the cap are rustdoc links
# only. Neither half is useful alone.
#
# The `http` cap's deferred-reply path names `ComponentHostCapability` to
# resolve the handler component it answers through, so `aether-http`
# depends on this crate. That is a genuine downward use, not a facade —
# neither crate re-exports the other's names.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the ZST
# cap and trampoline identities with their `Addressable`, per-handler
# `HandlesKind`, and name-inventory markers compile always-on; the
# state-bearing wasmtime half (the cap state, the trampoline state, and
# both init configs, which hold `Arc<Engine>` / `Arc<Linker<ComponentCtx>>`)
# is gated so a marker-only wasm guest can address
# `ctx.actor::<ComponentHostCapability>()` without dragging wasmtime and
# the substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate", "dep:wasmtime", "dep:sha2", "dep:tracing"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# Native-only runtime half — gated so wasm/marker builds skip the
# substrate runtime.
aether-substrate = { path = "../aether-substrate", optional = true }
# The wasm engine the cap and its trampolines are built around: the cap
# state holds `Arc<Engine>` / `Arc<Linker<ComponentCtx>>`, and each
# trampoline owns the instantiated guest `Component`. Rides the `runtime`
# feature — the identity half never names it.
wasmtime = { workspace = true, optional = true }
# ADR-0147 module-boot dedup keys the loaded wasm by its sha256 content
# hash. Rides the `runtime` feature; the hashing happens on the load path.
sha2 = { workspace = true, optional = true }
# The load path and the trampoline's replace / forward sites log lifecycle
# transitions and warn-drop unroutable mail. Rides the `runtime` feature —
# those log sites are native-only.
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }

# The `#[actor]` macro emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!`, so native builds need `inventory` reachable; wasm
# guests don't (the gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[lints]
workspace = true
