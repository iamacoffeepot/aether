[package]
name = "aether-test-fixtures-defaultless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A small multi-actor module with no bare-load entry (ADR-0241 §9). Two
# `WasmActor` types (`Alpha`, `Beta`) exported via
# `export!(public = [Alpha, Beta])`, so a `load` with no export selector
# against it is a hard error naming the exports, and a named
# `export: Some("<NAMESPACE>")` load resolves as usual. Standalone so its
# two-type shape stays minimal.
[lib]
crate-type = ["cdylib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-kinds = { path = "../aether-kinds" }

[lints]
workspace = true
