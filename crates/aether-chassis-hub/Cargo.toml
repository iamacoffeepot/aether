[package]
name = "aether-chassis-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The hub chassis (issue #3810): the thin coordinator between
# aether-mcp and the substrate fleet. Stands up trace dispatch, the
# engines cap, and the RPC server, then blocks on SIGINT/SIGTERM.
# Produces the `aether-hub` binary; the shared composition
# layer comes from `aether-chassis`.

# cargo-machete (the CI unused-deps gate) scans source without expanding
# macros, so `confique` reads as unused: it is named only by the paths
# `#[derive(aether_substrate::Config)]` emits for `McpEndpointConfig`'s layer
# type. `clap` escapes the same fate only because `cli.rs` also names it
# directly.
[package.metadata.cargo-machete]
ignored = ["confique"]

[[bin]]
name = "aether-hub"
path = "src/bin/hub.rs"

# Same `runtime` convention as the other chassis crates (ADR-0122):
# composes the cap crates' substrate-typed halves, so default-on with
# no transport-only face.
[features]
default = ["runtime"]
runtime = []

[dependencies]
aether-chassis = { path = "../aether-chassis" }
aether-substrate = { path = "../aether-substrate" }
# The hub's cap set: the engines cap (fleet fork/track) and the RPC server
# aether-mcp dials. `TraceDispatchCapability` now rides the shared `ChassisBase`
# (aether-chassis), so the hub no longer depends on aether-trace directly.
aether-fleet = { path = "../aether-fleet" }
aether-rpc = { path = "../aether-rpc" }
# The shadow Model Context Protocol endpoint (design migration step 4): the
# HTTP capability that carries `POST /mcp` into the protocol capability, and
# the protocol capability itself. The hub's tool provider is authored against
# `aether-mcp`'s `#[mcp::router]` / `#[mcp::tool]` macros and its `Context` /
# `Outcome` / `ToolError` vocabulary, all re-exported from that crate root.
aether-http = { path = "../aether-http" }
aether-mcp = { path = "../aether-mcp" }
# `#[actor(singleton, root)]` on the tool provider and the `Manual` reply-mode
# marker its deferred tool methods name.
aether-actor = { path = "../aether-actor" }
# `frame::max_frame_size()` — the installed wire ceiling the composer clamps
# the protocol server's provider-wire ceiling against.
aether-codec = { path = "../aether-codec" }
# `HubCli` flattens the `SettlementOverlay` for the hub's own teardown-budget
# knob (`--settlement-cap-secs`), resolved off its source stack.
aether-harness-substrate = { path = "../aether-harness-substrate" }
# Fully-qualified `aether_data::mailbox_id_from_name` resolves the
# engines-cap route target.
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# The bin parses `HubCli` (ADR-0090 unit d) and bridges boot faults.
clap = { workspace = true }
# ADR-0090 unit g: `#[derive(aether_substrate::Config)]` on `McpEndpointConfig`
# emits a `confique::Config` layer beside the domain struct, so the derive's
# emitted paths need the crate reachable here.
confique = { workspace = true }
anyhow = { workspace = true }
# The tool provider's boundary input / output types derive the workspace wire
# serialization beside `aether_data::Schema`.
serde = { workspace = true, features = ["derive", "std"] }
tracing = { workspace = true, features = ["std", "attributes"] }

# The hub blocks on a SIGINT/SIGTERM signal in
# `HubServerDriverRunning::run`; signal-hook is Unix-only, the Windows
# fallback rides `ctrlc` for Ctrl-C only.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[dev-dependencies]
# The binary-store proof (relocated from the bundle, #3812) drives the
# real hub -> RPC -> engines-cap stack over FleetHarness and resolves
# both uploaded chassis binaries through the dist manifest. The shadow
# Model Context Protocol endpoint test reuses its isolated-store helper
# rather than growing a second temp-directory convention.
aether-harness-fleet = { path = "../aether-harness-fleet" }
# `features = ["test-support"]` exposes `aether_substrate::testing`
# (`TestChassis` / `fresh_substrate`), the passive-chassis fixture the shadow
# endpoint boots over — the real hub driver blocks on a shutdown signal.
# Dev-dependency feature unification applies to test builds only.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The shadow endpoint test speaks JSON-RPC over a real socket, so it builds
# and reads protocol messages as JSON.
serde_json = { workspace = true }

[lints]
workspace = true
