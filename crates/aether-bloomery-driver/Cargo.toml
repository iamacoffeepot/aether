[package]
name = "aether-bloomery-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sans-io driver core for the native bundle driver: journal folds in, driver commands out (ADR-0226), split into an always-on driver actor identity and a runtime feature carrying the core and the actor."

# The ADR-0122 identity/runtime split rides the `runtime` feature. The identity
# half (the `BundleDriver` marker with its handled-kind markers and contract
# rows) is `no_std` and compiles always-on, so a wasm guest names the driver
# with `default-features = false`. The `runtime` feature adds the sans-io
# program core, the construction params, and the `aether.bloomery.driver`
# actor's substrate-typed state; it brings the journal's runtime with it.
[features]
default = ["runtime"]
runtime = [
  "dep:aether-substrate",
  "dep:aether-bloomery-journal",
  "dep:aether-bloomery-program",
  "dep:wasmparser",
  "dep:tracing",
]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-component = { path = "../aether-component", default-features = false }
aether-data = { path = "../aether-data", features = ["derive"] }
# Identity-side: the driver depends on the http capability and relays
# programs' `Http` and `Workspace` calls, handling `FetchResult` and the
# workspace's `RunResult` (ADR-0240 D6).
aether-http = { path = "../aether-http", default-features = false }
aether-bloomery-workspace = { path = "../aether-bloomery-workspace", default-features = false }
# Identity-side: `PublishResult` and `SpawnResult`, the component host's
# replies to the driver's bundle publish and root spawn, are handled kinds of
# the driver.
aether-kinds = { path = "../aether-kinds" }
# Native-only runtime half: the actor runtime, the journal owner the driver
# mails (with its own runtime), the program and view vocabularies the core
# folds, and the bundle section check.
aether-substrate = { path = "../aether-substrate", optional = true }
aether-bloomery-journal = { path = "../aether-bloomery-journal", optional = true }
aether-bloomery-program = { path = "../aether-bloomery-program", optional = true }
wasmparser = { version = "0.246", optional = true }
# Native-only runtime half: the shell opens one span per ticketed step under
# the `aether.bloomery.step` target, closed at its reply.
tracing = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
# The end-to-end scenarios boot the shipped bloomery chassis through its
# harness, which depends back on this crate through the chassis — the same
# dev cycle aether-component has with aether-harness-substrate.
aether-harness-bloomery = { path = "../aether-harness-bloomery" }
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
# The step-span scenario installs a registry with one counting layer.
tracing-subscriber = "0.3"

[lints]
workspace = true
