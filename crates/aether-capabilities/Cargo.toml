[package]
name = "aether-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true

# Issue 552 stage 2e originally extracted the chassis-cap layer out of
# `aether-substrate` into this crate. The arc that dissolves the monolith
# has since moved every real capability into its own per-cap crate; the
# `http` client and server were the last, leaving for `aether-http` /
# `aether-http-derive` (iamacoffeepot/aether#3758).
#
# What remains is the `aether.test_bench` fail-fast stub cap, which desktop
# and headless compose so `aether.test_bench.advance` mail errors instead
# of warn-dropping into a hung reply slot.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the ZST
# cap identity with its `Addressable`, `HandlesKind`, and name-inventory
# markers compiles always-on; the `aether_substrate`-typed state and
# `#[runtime] impl` are gated behind it.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate"]

[dependencies]
# Always-on: target-agnostic SDK + data layer + kind types. These compile
# fine for `wasm32-unknown-unknown` and carry the markers wasm components
# rely on.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# Native-only runtime half — gated so wasm/marker builds skip the substrate
# runtime.
aether-substrate = { path = "../aether-substrate", optional = true }

# The `#[actor]` macro emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!`, so native builds need `inventory` reachable; wasm
# guests don't (the gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# `tests/embeddable_resolution.rs` exercises the ADR-0099 §5/§6 host-carry
# fold through `aether_component::resolve_embedded`. Dev-only — no source
# file in this crate names the component cap.
aether-component = { path = "../aether-component" }
# iamacoffeepot/aether#2517: the cap unit tests boot a chassis through the
# canonical `aether_substrate::testing` fixture, enabled by the substrate
# `test-support` feature. Dev-dependency feature unification applies to test
# builds only, so this never enters the production graph
# `cargo tree -p aether-capabilities -e normal` reports.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# iamacoffeepot/aether#2529: `tests/source_invariants.rs` parses this crate's
# own `src/**/*.rs` and walks each AST to enforce the pub-or-private (#2471)
# and runtime-half-is-a-file (#2479) source-shape rules — an AST-exact check
# the compiler is indifferent to, run through `cargo test` so CI covers it.
# `syn` is already deep in the transitive graph
# (every derive macro pulls it), so this dev-dep is near-free.
syn = { workspace = true, features = ["full", "visit", "parsing"] }

[lints]
workspace = true
