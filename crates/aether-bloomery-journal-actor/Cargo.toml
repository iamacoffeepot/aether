[package]
name = "aether-bloomery-journal-actor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Instanced native owner of a Bloomery journal and its read mailbox."

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-journal = { path = "../aether-bloomery-journal" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-substrate = { path = "../aether-substrate" }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
aether-kinds = { path = "../aether-kinds" }
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
