[package]
name = "aether-chassis-bloomery"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

# The Bloomery coordinator binary: boots `BloomeryChassis` (store + RPC +
# trace + signal driver). Needs the runtime feature (the whole native
# chassis surface), so it is gated.
[[bin]]
name = "bloomery"
path = "src/bin/bloomery.rs"
required-features = ["runtime"]

# The mock lane program the lane-boundary scenarios point
# `AETHER_BLOOMERY_LANE_PROGRAM` at (#4727). A test fixture that has to be a
# binary, because the seam it stands in for spawns a process. Built with the
# crate rather than behind a feature so a plain `cargo test` compiles the
# scenarios that resolve it through `CARGO_BIN_EXE_`.
[[bin]]
name = "bloomery-mock-lane"
path = "src/bin/bloomery_mock_lane.rs"
required-features = ["runtime", "github"]

# Operator CLI for commission authoring (#5047). A sibling of `bloomery`, not a
# subcommand of it: a bare `bloomery` still starts the daemon.
[[bin]]
name = "bloomery-commission"
path = "src/bin/bloomery_commission.rs"
required-features = ["runtime"]

[features]
# Chassis-target default: the full native host (SQLite store runtime,
# chassis, RPC/trace caps, signal driver). A wasm/marker consumer does
# `default-features = false` and gets only the `aether.store.*` kind
# identity + markers.
default = ["runtime", "github"]
# Durable backend-object correspondence without the Bloomery process, GitHub
# adapter, or the rest of the native chassis. This is the narrow build-layer
# surface for a non-Git source/executor adapter.
correspondence = ["dep:rusqlite"]
# "this build carries the substrate-side runtime" — pulls aether-substrate,
# the chassis caps, the SQLite backend, and every native-only dep the
# `#[runtime] impl NativeActor` and the chassis assembly reference.
runtime = [
    "correspondence",
    "dep:aether-substrate",
    "dep:aether-http",
    "dep:aether-component",
    "dep:aether-rpc",
    "dep:aether-trace",
    "dep:aether-kinds",
    "dep:aether-codec",
    "dep:dirs",
    "dep:ed25519-dalek",
    "dep:tracing",
    "dep:clap",
    "dep:confique",
    "dep:anyhow",
    "dep:serde_json",
    "dep:signal-hook",
]
# Lane-boundary harness (#4732): in-memory GitHub fixture so the
# aggregate line (Integrate -> AggregateVerify -> AggregateReview -> Land)
# runs without a live token. The `github_backend` field itself is
# `#[cfg(any(test, feature = "testing"))]` so prod manifests never
# advertise `AETHER_GITHUB_BACKEND` and prod binaries never link
# `FakeGithub` unless the `testing` feature is enabled.
github = ["dep:aether-bloomery-github"]
testing = ["github", "aether-bloomery-github/testing", "aether-bloomery/testing"]

[dependencies]
# Always-on (wasm-safe) — the `#[actor]` identity markers and the
# `aether.store.*` kind family compile from these alone.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
# The bloom-protocol value types the store journals (as wire bytes) and the
# host replays through the reducer.
# The pure reducer + value vocabulary + control-plane mail kinds. `default-features
# = false` links only the rlib core, never the guest-SDK `runtime` feature (the
# wasm control actor + `export!`) — the host mounts that actor as a wasm component,
# it never links it natively (issue #3497).
aether-bloomery = { path = "../aether-bloomery", default-features = false }
serde = { workspace = true, features = ["derive", "alloc"] }
# Host bootstrap of the fallback approval policy (`approval-policy.toml`).
toml = { workspace = true }

# Runtime-only (native).
aether-substrate = { path = "../aether-substrate", optional = true }
# iamacoffeepot/aether#3758: the http caps were extracted to `aether-http`.
# The bloomery chassis installs `HttpServerCapability` and its API actor
# renders `HttpServerResponse`s, so it takes the runtime face.
aether-http = { path = "../aether-http", optional = true }
# iamacoffeepot/aether#3756: the component cap was extracted to
# `aether-component`. The bloomery chassis installs
# `ComponentHostCapability` with its wasmtime-typed `ComponentHostConfig`,
# so it takes the runtime face (default features).
aether-component = { path = "../aether-component", optional = true }
# The generic TCP RPC transport (extracted from capabilities, #3735) the
# bloomery chassis binds (`RpcServerCapability`).
aether-rpc = { path = "../aether-rpc", optional = true }
# The `aether.trace` cap (extracted from capabilities, #3719) the bloomery
# chassis mounts (`TraceDispatchCapability`). Runtime half (default-on).
aether-trace = { path = "../aether-trace", optional = true }
# The substrate kind vocabulary — `BinaryManifest` for the `--describe` probe.
aether-kinds = { path = "../aether-kinds", optional = true }
# `POST /configs` encodes an authored configuration's JSON through its kind's
# schema (ADR-0174), the same `encode_schema` path the MCP `send_mail` front
# uses. The recovery + contract tests also dial the `bloomery` bin over raw wire
# frames (`aether_codec::frame`, the FleetHarness pattern).
aether-codec = { path = "../aether-codec", optional = true }
# Platform data-dir resolution for the artifacts store-root default (mirrors
# the hub engines cap's `resolve_fleet_store_root`).
dirs = { version = "6", optional = true }
# The `aether.signing` capability parses its host-local allowlist config into
# ed25519 verifying keys (ADR-0149 step 3, ADR-0150). The pure verifier
# (`Ed25519KeyProvider`) lives in `aether-bloomery`; this cap constructs it from
# `VerifyingKey`s decoded here.
ed25519-dalek = { workspace = true, optional = true }
# The outward projection mirror the host mounts behind the projection cap
# shell (#3459). Native (reqwest) — runtime-only, never in the wasm marker
# build.
aether-bloomery-github = { path = "../aether-bloomery-github", optional = true }
# SQLite in WAL mode: the durable single-writer journal / inbox / outbox /
# active-membership store. `bundled` compiles SQLite from source.
rusqlite = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std", "attributes"], optional = true }
# clap + confique back the ADR-0090 derive-`Config` output (the clap overlay
# and confique layer the macro emits) — referenced only through macro
# expansion, so cargo-machete needs the ignore below.
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# `--describe` serializes the `BinaryManifest` to JSON on stdout.
serde_json = { workspace = true, optional = true }

# The signal-blocking driver (SIGINT/SIGTERM) mirrors the hub chassis.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", optional = true }

# `#[derive(aether_data::Kind)]` emits an `inventory::submit!` only on
# native targets; wasm marker builds skip it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
# The mirror demo (#3459 step 7) drives the projection against the adapter's
# in-process `FakeGithub` double, so it needs no token or network.
aether-bloomery-github = { path = "../aether-bloomery-github", features = ["testing"] }
# The `bloomery` binary's `AETHER_GITHUB_BACKEND=fixture` path needs the
# `testing` feature at runtime (not just `cfg(test)`), so the `cargo test`
# harness's `CARGO_BIN_EXE_bloomery` is built with it via this self-dependency.
aether-chassis-bloomery = { path = ".", features = ["testing"] }
# The mirror-driver actor-path test drives the capability's handlers through the
# substrate cap-test fixture (`aether_substrate::testing`), gated behind the
# `test-support` feature so the fixture module is compiled for tests.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The REST answer-gate test signs a real author statement and configures the
# `aether.signing` allowlist with its public key, so it needs the signing half
# of the same ed25519 primitive the capability verifies with.
ed25519-dalek = { workspace = true }
tempfile = "3"

[lints]
workspace = true

# clap / confique / inventory are pulled in only through the derive-`Config`
# and derive-`Kind` macro output (a clap overlay, a confique layer, an
# `inventory::submit!`), which cargo-machete's source-only scan cannot see.
[package.metadata.cargo-machete]
ignored = ["clap", "confique", "inventory"]
