[package]
name = "aether-bloomery"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# A pure rlib: the canonical value vocabulary, the pure reducer, and the
# control/source `aether.{store,source}.*` mail kinds the native host and the
# GitHub adapter both link inward, cycle-free (ADR-0149 §The boundary). This crate
# was formerly also a `cdylib` compiling the wasm control-core actor; that actor
# became a native cap (`aether-chassis-bloomery`'s `control`), so the crate no longer
# emits a wasm component or depends on the guest SDK.
crate-type = ["rlib"]

[features]
# Exposes the domain fixture set (`digest`, memberships, drafts, view
# `Default`s) so a downstream crate's tests share one vocabulary instead of
# re-deriving it. Adds no dependencies. Consumers enable it from their
# `[dev-dependencies]` stanza (or their own `testing` feature), so
# feature unification keeps it out of every production graph.
testing = []

[dependencies]
# The canonical wire format (ADR-0118) backs content-addressing: a
# `Digest` is sha256 over a value's `aether_data::wire` bytes, so digests
# reuse the workspace's own canonical encoding rather than a parallel one.
# The `derive` feature drives `#[derive(Kind, Schema)]` on the control-plane
# mail vocabulary (`control.rs`): the store-family transact-mails the control
# actor drives plus the `aether.bloomery.{admit,query}` ingress.
aether-data = { path = "../aether-data", features = ["derive"] }
# Content-addressing needs a collision-resistant hash, consistent with the
# hub binary store (ADR-0115). Default features off keeps the wasm build lean.
sha2 = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }

# `#[derive(aether_data::Kind)]` (the `control.rs` mail vocabulary) emits an
# `inventory::submit!` referencing `::inventory` only on native targets, to
# materialize the descriptor list the host's wire codec reads. Wasm guests skip
# it (the descriptor rides the `aether.kinds` custom section, ADR-0028), so the
# dep is gated out of the wasm cdylib build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
inventory = { workspace = true }
# The real ed25519 `KeyProvider` (`Ed25519KeyProvider`) is native-only: the
# host custodies key material and the core manifest-closure gate + its tests
# construct the provider, but the wasm control actor never does (it holds no
# keys, ADR-0149 §The boundary). Gating it out of the wasm cdylib keeps the
# component lean and off curve25519-dalek's wasm build surface.
ed25519-dalek = { workspace = true }

[dev-dependencies]
# Self-dependency with `testing` on, so this crate's integration tests
# (`tests/`) see the fixture module the feature exposes — an integration
# test links the lib without the `test` cfg, so the feature is the only
# way to reach a test-only module from `tests/`.
aether-bloomery = { path = ".", features = ["testing"] }
# The seven named invariants ride property tests (ADR-0149 migration
# step 1). Dev-only — the pure core never links a test dependency.
proptest = { workspace = true }
# Encoder-equivalence tripwires for sealed config kinds: `POST /configs`
# addresses over `encode_schema` bytes; `digest_of` addresses over
# `wire::to_vec`. Only the codec can produce the schema-driven half, so
# the assertion runs through it. Acyclic — `aether-codec` depends on
# `aether-data`, never on this crate.
aether-codec = { path = "../aether-codec" }
serde_json = { workspace = true }

[lints]
workspace = true
