[package]
name = "aether-chassis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The desktop chassis (issue #3812): winit window + wgpu render + cpal
# audio. Produces the `aether-desktop` binary over the shared
# `aether-chassis` composition layer.

[[bin]]
name = "aether-desktop"
path = "src/bin/desktop.rs"

# Same `runtime` convention as the other chassis crates (ADR-0122).
[features]
default = ["runtime"]
runtime = []

[dependencies]
aether-chassis = { path = "../aether-chassis" }
aether-substrate = { path = "../aether-substrate", features = ["render"] }
# The desktop cap set: the pumped render actor (ADR-0161 R3 — the driver
# boots it and owns the surface on the winit thread), plus the
# window/text/audio/clipboard caps and the common-cap configs the env threads
# through `with_common_caps`. Text rides here rather than in the shared
# full-stack set because it depends on render, which only desktop serves.
# `aether-render/desktop` pulls the pumped runtime and its per-window surface
# support.
aether-render = { path = "../aether-render", features = ["desktop"] }
aether-window = { path = "../aether-window", features = ["desktop"] }
aether-audio = { path = "../aether-audio", features = ["runtime"] }
aether-clipboard = { path = "../aether-clipboard", features = ["runtime"] }
aether-text = { path = "../aether-text", features = ["runtime"] }
aether-lifecycle = { path = "../aether-lifecycle" }
aether-component = { path = "../aether-component" }
aether-http = { path = "../aether-http" }
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
clap = { workspace = true }
# `DesktopDriverConfig` derives `aether_substrate::Config` (ADR-0090), which
# emits a confique-shaped `DesktopDriverConfigLayer` beside the clap-shaped
# `DesktopDriverOverlay`, so both crates must be reachable here.
confique = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }
# The winit event loop. The wgpu surface stack now lives in the pumped
# render actor (`aether-render/desktop`, ADR-0161 R3), so the chassis holds
# no direct wgpu edge.
winit = "0.30.13"
# The unified `PumpWake` channel the driver's `await_settlement_pumped`
# selects across (ADR-0161 §Decision 2).
crossbeam-channel = "0.5"

[dev-dependencies]
# `test-support` exposes `aether_substrate::testing::boot_authority`, the
# test-only mint for the `BootAuthority` the registry's eager mutators now
# require (ADR-0165 / iamacoffeepot/aether#4161). The lifecycle driver's
# reply-inbox test registers directly against a bare registry, so it needs
# the token production boot holds.
aether-substrate = { path = "../aether-substrate", features = ["render", "test-support"] }

# The desktop signal-watcher thread mirrors the headless shutdown flag:
# signal-hook on Unix, the `ctrlc` Ctrl-C fallback on Windows.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[lints]
workspace = true
