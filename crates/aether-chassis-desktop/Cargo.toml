[package]
name = "aether-chassis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# The desktop chassis (issue #3812): winit window + wgpu render + cpal
# audio. Produces the `aether-substrate` binary over the shared
# `aether-chassis` composition layer.

[[bin]]
name = "aether-substrate"
path = "src/bin/desktop.rs"

# Same `runtime` convention as the other chassis crates (ADR-0122).
[features]
default = ["runtime"]
runtime = []

[dependencies]
aether-chassis = { path = "../aether-chassis" }
aether-substrate = { path = "../aether-substrate", features = ["render"] }
# The desktop cap set: the pumped render actor (ADR-0161 R3 — the driver
# boots it and owns the surface on the winit thread), plus the
# window/audio/clipboard caps and the common-cap configs the env threads
# through `with_common_caps`. `aether-render/desktop` pulls the pumped
# runtime (`PumpedRenderCapability` + winit-typed `WindowCell`).
aether-render = { path = "../aether-render", features = ["desktop"] }
aether-window = { path = "../aether-window", features = ["desktop"] }
aether-audio = { path = "../aether-audio", features = ["runtime"] }
aether-clipboard = { path = "../aether-clipboard", features = ["runtime"] }
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-lifecycle = { path = "../aether-lifecycle" }
aether-component = { path = "../aether-component" }
aether-http = { path = "../aether-http" }
aether-input = { path = "../aether-input" }
aether-game = { path = "../aether-game" }
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
clap = { workspace = true }
anyhow = { workspace = true }
# `--describe` prints the BinaryManifest as JSON (ADR-0115).
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }
# The winit event loop. The wgpu surface stack now lives in the pumped
# render actor (`aether-render/desktop`, ADR-0161 R3), so the chassis holds
# no direct wgpu edge.
winit = "0.30.13"
# The unified `PumpWake` channel the driver's `await_settlement_pumped`
# selects across (ADR-0161 §Decision 2).
crossbeam-channel = "0.5"

# The desktop signal-watcher thread mirrors the headless shutdown flag:
# signal-hook on Unix, the `ctrlc` Ctrl-C fallback on Windows.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[lints]
workspace = true
