[package]
name = "aether-test-fixtures-fs-demux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Request-correlation fixtures (issues 2791, 5508, 6530): the `test.fs_demux`
# root and the `test.inline.fs_demux_parent` export, whose private inline
# child runs the same demux flow. That child declares
# `depends(FsCapability, SubstrateHarnessObserver)`, and the host checks a
# private inline child's dependencies when its module loads (ADR-0230 §3), so
# loading any export of this module needs fs and the harness observer. That is
# why it is standalone: in the shared bundle, every bundle load without fs
# roots, and every FleetHarness bundle load, would be refused. The `rlib` lets
# host tests name the actor types they load and the child the parent spawns.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data", features = ["derive"] }
# The `aether.fs` cap (iamacoffeepot/aether#3706): the fixtures address
# `FsCapability` and its kinds. Marker face only.
aether-fs = { path = "../aether-fs", default-features = false }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
# The demux flow reports mismatches and its matched state through
# `tracing::warn!` / `info!`, which the actor-aware subscriber `export!`
# installs drains to the actor's log ring.
tracing = { workspace = true, default-features = false }

[lints]
workspace = true
