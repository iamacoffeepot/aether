[package]
name = "aether-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.clipboard` capability, extracted from `aether-capabilities`
# (iamacoffeepot/aether#3715) as a leaf per-cap crate of the arc that
# dissolves the capabilities monolith. Owns the full clipboard stack: the
# request/reply mail kinds (`kinds`), the `ClipboardConfig` backend
# selector (`config`), the `ClipboardCapability` identity + system /
# in-memory runtime (`runtime`), and the fail-fast
# `HeadlessClipboardCapability` companion (`headless_runtime`). It is a
# pure leaf — no other capability depends on it, so capabilities keeps no
# `aether-clipboard` dependency (no facade).
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identity, kinds, and `HandlesKind` markers compile always-on;
# the `aether_substrate`-typed runtime half (plus the native `arboard`
# backend) is gated so a marker-only wasm guest can address
# `ctx.actor::<ClipboardCapability>()` without dragging the substrate
# through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate", "dep:arboard"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# Native-only runtime half — gated so wasm/marker builds skip the substrate
# runtime and the `arboard` system backend.
aether-substrate = { path = "../aether-substrate", optional = true }
arboard = { workspace = true, optional = true }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory`
# reachable; wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The fail-fast companion test boots the `aether_substrate::testing`
# mailer fixture, enabled by the substrate `test-support` feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

[lints]
workspace = true
