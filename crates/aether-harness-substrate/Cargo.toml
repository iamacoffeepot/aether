[package]
name = "aether-harness-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true

# `SubstrateHarness` — the in-process harness harness (ADR-0067, issue #3765).
# Boots a substrate-harness chassis (basics only: trace dispatch, the harness
# cap, lifecycle, fail-fast headless window, the observer mailbox) over a
# `RecordingBackend` loopback; each test composes the caps its scenario
# needs via the builder (issue #3764). Render/GPU capture support is the
# sibling `aether-harness-substrate-capture` crate behind the
# `FrameHook`/`RenderExt` seam, so a non-visual consumer's dependency
# closure never carries aether-render or wgpu.

# The `runtime` feature exists solely to drive the `#[actor]` split
# path's hardcoded `feature = "runtime"` gate on the harness cap pair
# (mirrors the chassis crates); the harness itself is
# unconditionally runtime-shaped.
[features]
default = ["runtime"]
runtime = []

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-component = { path = "../aether-component" }
aether-data = { path = "../aether-data" }
aether-fs = { path = "../aether-fs" }
aether-kinds = { path = "../aether-kinds" }
aether-lifecycle = { path = "../aether-lifecycle" }
aether-substrate = { path = "../aether-substrate" }
aether-trace = { path = "../aether-trace" }
aether-window = { path = "../aether-window", features = ["synthetic"] }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true }
confique = { workspace = true }
# ADR-0161 R4: `push_and_settle` polls the crossbeam settlement receiver
# `SettlementRegistry::subscribe_settlement` hands back, draining the pumped
# render slot each round so a render-recipient chain settles.
crossbeam-channel = "0.5"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }

# cargo-machete's source-only scan cannot see that `clap` and `confique`
# are used exclusively through `#[derive(aether_substrate::Config)]`
# codegen on `SettlementConfig` (`confique` via the emitted config layer,
# `clap` via the emitted `Args` overlay), so both are false positives.
[package.metadata.cargo-machete]
ignored = ["clap", "confique"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[lints]
workspace = true
