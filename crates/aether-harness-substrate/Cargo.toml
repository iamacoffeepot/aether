[package]
name = "aether-harness-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `SubstrateHarness` — the in-process harness harness (ADR-0067, issue #3765).
# Boots a substrate-harness chassis (basics only: trace dispatch, the harness
# cap, lifecycle, fail-fast headless window, the observer mailbox) over a
# `RecordingBackend` loopback; each test composes the caps its scenario
# needs via the builder (issue #3764). Render/GPU capture support is the
# sibling `aether-harness-substrate-capture` crate behind the
# `FrameHook`/`RenderExt` seam, so a non-visual consumer's dependency
# closure never carries aether-render or wgpu.

# The `runtime` feature mirrors the chassis crates' convention; the harness
# itself is unconditionally runtime-shaped. The `#[actor]` split path it used
# to drive now lives in `aether-substrate-harness-cap`.
[features]
default = ["runtime"]
runtime = []
# Exposes `SubstrateHarness::await_registry_applied`, which needs
# `PassiveChassis::await_registry_applied` — gated on `aether-substrate`'s
# own `test-support` feature. A downstream test crate (never a chassis
# binary, which takes this crate as a normal dependency) opts in.
test-support = ["aether-substrate/test-support"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-component = { path = "../aether-component" }
aether-data = { path = "../aether-data" }
aether-fs = { path = "../aether-fs" }
aether-kinds = { path = "../aether-kinds" }
aether-lifecycle = { path = "../aether-lifecycle" }
aether-substrate = { path = "../aether-substrate" }
# The `aether.substrate_harness` cap the chassis composes (issue #5706 gave it
# its own crate so the shipped chassis binaries stop linking this one).
aether-substrate-harness-cap = { path = "../aether-substrate-harness-cap" }
aether-trace = { path = "../aether-trace" }
aether-window = { path = "../aether-window", features = ["synthetic"] }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
# The crossbeam settlement receiver `SettlementRegistry::subscribe_settlement`
# hands back, which a hookless `push_and_settle` waits on, and the harness's
# one `PumpWake` channel its pump loop and a render settle block on (ADR-0161
# §Decision 2).
crossbeam-channel = "0.5"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
# `test-support` exposes `aether_substrate::testing::boot_authority`, the
# test-only mint for the `BootAuthority` the registry's eager mutators now
# require (ADR-0165 / iamacoffeepot/aether#4161). The harness's own
# `#[cfg(test)]` fixtures register observer mailboxes directly against the
# booted registry, so they need the token production boot holds.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# `SubstrateHarnessObserver`, the typed marker the lifecycle and window-event
# scenarios' fixture subscribers forward what they receive to.
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[lints]
workspace = true
