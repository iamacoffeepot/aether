[package]
name = "aether-process"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0157 `aether.process` one-shot exec capability. Owns the full stack: the
# mail kinds (`kinds` — `Run` / `RunResult` / `ProcessError`, owned in-crate per
# ADR-0121 so a guest that shells out depends on this crate directly), the
# `ProcessConfig` (deny-by-default allowlist / default timeout / concurrency
# bound), the spawn-and-capture loop (`runner` — the single reviewed
# implementation of the deadline / drain / group-reap discipline the workspace
# previously hand-rolled per consumer), and the `ProcessCapability` identity +
# task-queue runtime. It is a pure leaf — no other cap depends on it.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the wasm-safe
# identity, kinds, and `ProcessConfig` domain struct compile always-on; the
# `aether_substrate`-typed runtime half (the allowlist state, the `TaskQueue`
# dispatch, the subprocess loop) is gated so a marker-only wasm guest can address
# `ctx.actor::<ProcessCapability>()` without dragging the substrate stack through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate", "dep:clap", "dep:confique", "dep:tracing"]

[dependencies]
# Always-on: the `#[actor]` identity SDK + data / kind types the marker face
# carries.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# Native-only runtime half — gated so marker builds skip the substrate runtime
# + the `Config` derive's clap/confique codegen + the subprocess loop.
aether-substrate = { path = "../aether-substrate", optional = true }
# The `Config` derive emits the `ProcessConfigLayer`
# (`#[derive(confique::Config)]`) + `ProcessOverlay` (`#[derive(clap::Args)]`)
# structs; both ride the `runtime` feature so marker builds skip them.
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory` reachable;
# wasm guests don't (the derive's gate skips emission). The unix group-reap
# escalation (`setsid` at fork, `killpg` on the deadline) uses `libc`, so it is
# a unix-only dependency of the native runner.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The runtime unit tests boot the dispatch loopback through the canonical
# `aether_substrate::testing` fixture, enabled by the substrate `test-support`
# feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

# cargo-machete (the CI unused-deps gate) scans source without resolving
# features, so it cannot see that `clap` and `confique` are used only through
# the `Config` derive's codegen under the optional `runtime` feature. Both are
# false positives: the deps are real and runtime-gated.
[package.metadata.cargo-machete]
ignored = ["clap", "confique"]

[lints]
workspace = true
