[package]
name = "aether-chassis-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true

# Standalone bundle builds (issue #3815; #1529, generalizing #1518):
# chassis binaries that auto-load the component pack embedded at build
# time, so the binary runs hub-less. `build.rs` stages the pack the
# bins embed via `include_bytes!`; `cargo xtask bundle --chassis
# {desktop|headless}` builds the component wasms and drives this. The
# pack format itself lives in `aether_chassis::bundle_pack` — the build
# script compiles the same source in via `#[path]` so encoder and
# decoder stay one file.

[[bin]]
name = "aether-bundle-desktop"
path = "src/bin/aether-bundle-desktop.rs"

[[bin]]
name = "aether-bundle-headless"
path = "src/bin/aether-bundle-headless.rs"

[dependencies]
aether-chassis = { path = "../aether-chassis" }
aether-chassis-desktop = { path = "../aether-chassis-desktop" }
aether-chassis-headless = { path = "../aether-chassis-headless" }
aether-substrate = { path = "../aether-substrate" }
anyhow = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }

[build-dependencies]
# `build.rs` parses the `AETHER_BUNDLE_MANIFEST` JSON and encodes the
# bundle pack through `aether-chassis`'s bundle_pack.rs (compiled in
# via `#[path]`), so the build script needs serde + serde_json in
# build scope.
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }

[lints]
workspace = true
