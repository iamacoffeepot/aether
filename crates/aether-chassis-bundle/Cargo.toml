[package]
name = "aether-chassis-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true

# Standalone bundle builds (issue #3815; #1529, generalizing #1518):
# chassis binaries that auto-load the component package embedded at
# build time, so the binary runs hub-less. `build.rs` stages the
# depot-shaped package artifact (`pack/manifest` + content-addressed
# objects) into `OUT_DIR` and generates the `include_bytes!` source the
# bins embed; `cargo xtask bundle --chassis {desktop|headless}` builds
# the component wasms, emits the pack, and points `AETHER_BUNDLE_PACK`
# at it. The manifest byte format + decode-and-resolve path live in
# `aether_chassis::package` (ADR-0163 §1), so the bundle bins reuse the
# same reading path the depot boot uses.

[[bin]]
name = "aether-bundle-desktop"
path = "src/bin/aether-bundle-desktop.rs"

[[bin]]
name = "aether-bundle-headless"
path = "src/bin/aether-bundle-headless.rs"

[dependencies]
aether-chassis = { path = "../aether-chassis" }
aether-chassis-desktop = { path = "../aether-chassis-desktop" }
aether-chassis-headless = { path = "../aether-chassis-headless" }
aether-substrate = { path = "../aether-substrate" }
anyhow = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }

[lints]
workspace = true
