[package]
name = "aether-input"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.input` capability, extracted by the arc that dissolved the
# capabilities monolith (iamacoffeepot/aether#3747) as a leaf per-cap
# crate. Owns the full input stack: the
# ADR-0021 subscribe-control mail kinds (`kinds`), the `InputConfig`
# init config (`config`), the `InputCapability` identity + the
# publish/subscribe subscriber-table runtime (`runtime`), and the
# send-side `InputMailboxExt` facade. It is a pure leaf — no other
# capability depends on it, so capabilities keeps no `aether-input`
# dependency (no facade).
#
# The genuine input-stream event kinds (`Key`, `MouseMove`, `WindowSize`,
# …) stay in `aether-kinds`: they are driver-produced core vocabulary
# consumed broadly, so this crate only references them.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identity, kinds, and `HandlesKind` markers compile always-on;
# the `aether_substrate`-typed runtime half (the registry handle,
# subscriber table, and monitor map) is gated so a marker-only wasm guest
# can address `ctx.actor::<InputCapability>()` without dragging the
# substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# `UnsubscribeAll` is a cast-shape (Pod) kind — one `MailboxId`, fixed
# size — so it derives `bytemuck::Pod` / `Zeroable`.
bytemuck = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# Native-only runtime half — gated so wasm/marker builds skip the
# substrate runtime.
aether-substrate = { path = "../aether-substrate", optional = true }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory`
# reachable; wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The runtime unit tests boot the `aether_substrate::testing` mailer
# fixture, enabled by the substrate `test-support` feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The subscribe/unsubscribe/drop integration test boots the in-process
# harness harness with the component host + input cap composed.
aether-harness-substrate = { path = "../aether-harness-substrate" }
# The test loads the probe wasm through `aether.component`, addressing the
# host by `ComponentHostCapability::NAMESPACE`.
aether-component = { path = "../aether-component" }
# The probe's re-broadcast kinds (`KeyObserved`, `TextInputObserved`) the
# test counts at the harness observer mailbox.
aether-test-fixtures-kinds = { path = "../aether-test-fixtures/aether-test-fixtures-kinds" }
# The probe wasm the test loads by stem (`aether_test_fixtures_bundle.wasm`,
# issue #3766): declared so the wasm coupling is cargo-visible even though
# nothing links the host rlib.
aether-test-fixtures-bundle = { path = "../aether-test-fixtures/aether-test-fixtures-bundle" }

# The probe wasm coupling above is load-by-stem only — no source import —
# so the source-scanning unused-deps gate cannot see it.
[package.metadata.cargo-machete]
ignored = ["aether-test-fixtures-bundle"]

[lints]
workspace = true
