[package]
name = "aether-test-fixtures-inline-dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# ADR-0230 §3 fixture: a module whose composable child declares a dependency.
# `Holder` (the default export) spawns the composable `Needy` inline in
# `wire`, and `Needy` declares `depends(ClipboardCapability)`, which the
# substrate harness does not compose unless a scenario asks for it. Loading
# any export of this module is refused wherever clipboard is absent, so it
# is standalone: in the shared bundle, every bundle load in every scenario
# without clipboard would be refused.
[lib]
crate-type = ["cdylib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-kinds = { path = "../aether-kinds" }
aether-clipboard = { path = "../aether-clipboard", default-features = false }

[lints]
workspace = true
