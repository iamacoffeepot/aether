[package]
name = "aether-bloomery-journal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Append-only journal root: a SQLite log of typed Storage events plus digest-named artifact files (ADR-0220)."

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-substrate = { path = "../aether-substrate" }
rusqlite = { workspace = true }
tempfile = "3"

[dev-dependencies]
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-kinds = { path = "../aether-kinds" }
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
