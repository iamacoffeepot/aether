[package]
name = "aether-bloomery-journal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Append-only SQLite log of typed Storage events and content-addressed artifacts (ADR-0220)."

[dependencies]
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-data = { path = "../aether-data", features = ["derive"] }
rusqlite = { workspace = true }

[dev-dependencies]
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-data = { path = "../aether-data", features = ["derive"] }
tempfile = "3"

[lints]
workspace = true
