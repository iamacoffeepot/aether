[package]
name = "aether-substrate-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true

# Chassis-binary residue crate: the substrate-harness chassis entry
# point plus the standalone bundle and perf bins. The desktop, headless,
# and hub chassis live in their own aether-chassis-* crates; the shared
# substrate runtime stays in `aether-substrate`.
#
# The in-process `SubstrateHarness` API lives in the
# `aether-harness-substrate` crate; this crate only carries the
# `aether-substrate-harness` binary entry point for it.

[lib]
path = "src/lib.rs"

[[bin]]
name = "aether-substrate-harness"
path = "src/bin/substrate-harness.rs"

# Standalone bundle builds (#1529, generalizing #1518): a chassis that
# auto-loads the component pack embedded at build time, so the binary
# runs hub-less. `build.rs` stages the pack the bins embed; `cargo xtask
# bundle --chassis {desktop|headless}` builds the component wasms and
# drives this.
[[bin]]
name = "aether-bundle-desktop"
path = "src/bin/aether-bundle-desktop.rs"

[[bin]]
name = "aether-bundle-headless"
path = "src/bin/aether-bundle-headless.rs"

# Perf-comparison tooling (iamacoffeepot/aether#1077). `perf-trial` runs
# one latency sweep and emits a TrialReport JSON; `perf-compare`
# interleaves K base/candidate trials and renders the noise-aware paired
# comparison (ADR-0085).
[[bin]]
name = "aether-perf-trial"
path = "src/bin/perf-trial.rs"

[[bin]]
name = "aether-perf-compare"
path = "src/bin/perf-compare.rs"

# iamacoffeepot/aether#1155: renders per-cell queued/drain/handler sample
# distributions to PNGs.
[[bin]]
name = "aether-perf-plot"
path = "src/bin/perf-plot.rs"

# The `runtime` feature exists solely to drive the `#[actor]` split
# path's hardcoded `feature = "runtime"` gate (the macro convention from
# iamacoffeepot/aether#2311 / ADR-0122): a split cap's `NativeActor` /
# `Lifecycle` / `NativeDispatch` impls compile only when this feature is
# active. The bundle never builds to wasm and has no transport-only
# consumer, so it is default-on. `aether-substrate` and the per-cap crates
# already arrive with their own `runtime` defaults via the
# non-`default-features = false` deps below, so no forwarding is needed.
[features]
default = ["runtime"]
runtime = []

[dependencies]
aether-substrate = { path = "../aether-substrate", features = ["render"] }
# The shared chassis-composition layer (issue #3809): boot fragments,
# fleet-wide config registry, CLI roots, autoload, and the bundle-pack
# format the standalone bins decode (build.rs compiles the same source
# in via `#[path]`).
aether-chassis = { path = "../aether-chassis" }
# The standalone `aether-bundle-headless` bin boots the headless chassis
# until the bundle machinery gets its own crate (#3815) — a husk-uses-
# leaf dep that dies with that cut.
aether-chassis-headless = { path = "../aether-chassis-headless" }
aether-chassis-desktop = { path = "../aether-chassis-desktop" }
# The substrate-harness crates + the GPU capture half (issue #3765): the
# `aether-substrate-harness` binary composes through them, and the
# resident scenario tests link both.
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-harness-substrate-capture = { path = "../aether-harness-substrate-capture" }
# iamacoffeepot/aether#3756: the component cap was extracted to
# `aether-component`. Every chassis installs `ComponentHostCapability` with
# its wasmtime-typed `ComponentHostConfig` and the scenario tests build
# trampoline addresses off `WasmTrampoline::NAMESPACE`, so the bundle takes
# the runtime face.
aether-component = { path = "../aether-component" }
# iamacoffeepot/aether#3749: the lifecycle cap was extracted to
# `aether-lifecycle`; every chassis composes `LifecycleCapability` and
# builds its `LifecycleConfig` graph, so the bundle takes the runtime face.
aether-lifecycle = { path = "../aether-lifecycle" }
# iamacoffeepot/aether#3747: the input cap was extracted to `aether-input`;
# every chassis composes `InputCapability` + `InputConfig`.
aether-input = { path = "../aether-input" }
# iamacoffeepot/aether#3721: the render cap was extracted to `aether-render`;
# the chassis bundle needs its wgpu runtime half (RenderCapability / RenderGpu /
# RenderHandles / RenderTuningConfigLayer for the desktop + substrate-harness drivers).
aether-render = { path = "../aether-render", features = ["runtime"] }
# iamacoffeepot/aether#3751: the tcp cap was extracted to `aether-tcp`; every
# chassis composes `TcpCapability`, so the bundle takes the runtime face.
aether-tcp = { path = "../aether-tcp" }
# iamacoffeepot/aether#3754: the game player-gateway cap was extracted to
# `aether-game`; every chassis registers the `GameGatewayCapability` identity
# and boots it from `GameGatewayConfig`, so the bundle takes the runtime face.
aether-game = { path = "../aether-game" }
# iamacoffeepot/aether#3727: the text cap was extracted to `aether-text`;
# the chassis bundle wires `TextCapability`, so it needs the runtime half
# (fontdue TTF parse / rasterize + the substrate-side runtime).
aether-text = { path = "../aether-text", features = ["runtime"] }
aether-clipboard = { path = "../aether-clipboard", features = ["runtime"] }
# The `aether.fs` cap (iamacoffeepot/aether#3706) — the chassis wires
# `FsCapability` + resolves `NamespaceRoots`, so it needs the fs runtime (default).
aether-fs = { path = "../aether-fs" }
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# Catch-all error type for chassis main()s + build_passive that
# bridge BootError / wasmtime / io faults purely to bubble up.
# Same crate as `wasmtime::Result` re-exports (issue #571).
anyhow = { workspace = true }
png = { workspace = true }
# iamacoffeepot/aether#1155: distribution-plot rendering for the
# `perf-plot` bin. `ab_glyph` keeps fonts pure-Rust (no font-kit / system
# freetype — headless-CI friendly); we render to an RGB buffer and encode
# with the `png` dep above, so no `image` / `bitmap_encoder` pull. Not
# feature-gated: a few small pure-Rust crates next to the chassis's
# wgpu/wasmtime aren't worth gating off the build for, and gating left the
# bin uncovered by clippy (the "missing features" finding).
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "ab_glyph",
    "line_series",
] }
# `rmcp` / `axum` / `base64` / `schemars` retired with the embedded MCP
# server (issue 763 P5e) — the harness moved out-of-process into the
# `aether-mcp` crate, which owns those deps now.
serde = { workspace = true, features = ["derive", "std"] }
# Trial reports + comparison output are JSON (perf tooling, #1077).
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }
wgpu = { workspace = true }

# Hub chassis blocks on a SIGINT/SIGTERM signal in
# `HubServerDriverRunning::run`. Tokio retired alongside the embedded
# MCP + engine listener (issue 763 P5e/P5f); signal-hook is a much
# smaller dep and runs synchronously on the calling thread — no async
# runtime to host, no mio/tokio-macros transitive build cost.
# signal-hook is Unix-only; the Windows fallback rides `ctrlc` for
# Ctrl-C only (matches the pre-tokio-retirement behavior, which also
# distinguished SIGINT/SIGTERM only on Unix).
[build-dependencies]
# `build.rs` parses the `AETHER_BUNDLE_MANIFEST` JSON and encodes the
# bundle pack through `src/bundle_pack.rs` (compiled in via `#[path]`,
# #1529), so the build script needs serde + serde_json in build scope.
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }

[dev-dependencies]
# iamacoffeepot/aether#3767: the `FleetHarness` harness the fleet scenario
# suites (`tests/fleetharness_*.rs`, `replace_drop_reply_routing.rs`) boot —
# extracted from `tests/fleetharness/mod.rs` into its own test-support crate.
# It locates the forked headless chassis through `dist/manifest.json`
# (`cargo xtask dist` first), no longer via `CARGO_BIN_EXE_*`.
aether-harness-fleet = { path = "../aether-harness-fleet" }
# iamacoffeepot/aether#2517: the RPC engine-routing / engines-cap / FleetHarness
# integration tests boot a passive chassis through the canonical
# `aether_substrate::testing::TestChassis`, enabled by the substrate
# `test-support` feature. The normal dep keeps `render`; this dev entry unions
# the feature into test builds only, so it stays out of the production graph.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# iamacoffeepot/aether#2455: the dispatch-decode-failure regression test drives
# the `Probe` fixture directly through the pub `Component::instantiate` / `deliver`
# API, which needs `wasmtime::{Engine, Linker, Module}` in scope to build the
# host engine + linker. Same workspace pin `aether-substrate` links against.
wasmtime = { workspace = true }

[lints]
workspace = true
