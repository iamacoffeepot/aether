[package]
name = "aether-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The release demo's bring-up: one throwaway wasm actor that, loaded last in
# the demo's boot list, sends the kit mesh viewer the same `aether.kit.mesh.load`
# an operator would and tells the renderer which camera to follow. The depot
# spec, the boot manifest, the three init-configs and the README live beside
# this file, so the whole demo is one deletable directory. The `rlib` lets the
# tests name the actor type.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
# The demo names `MeshViewer` by bare type to declare it a dependency and send
# it the load, and `CameraComponent` to write the camera's path, so it needs
# the kit's actor impls. `library` strips the kit's own
# `export!` entry surface (one `export!` per wasm module), leaving the impls
# without a second `receive_p32` / `init` colliding with this crate's.
# `xtask dist` builds each component package in its own cargo invocation, so
# the feature cannot unify into the kit's own cdylib build.
aether-kit = { path = "../aether-kit", features = ["library"] }
aether-kinds = { path = "../aether-kinds" }
# The demo tells the renderer which view source to follow. Marker face only:
# it is a wasm guest addressing the render cap by mail.
aether-render = { path = "../aether-render", default-features = false }
tracing = { workspace = true, default-features = false }

# `tests/scenario.rs` loads the checked-in boot manifest's entries through a
# rendering `SubstrateHarness`, encoding each config as the chassis boot does.
[dev-dependencies]
aether-chassis = { path = "../aether-chassis" }
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-harness-substrate-capture = { path = "../aether-harness-substrate-capture" }
# The scenario opens the `main` window the demo's camera follows.
aether-window = { path = "../aether-window", default-features = false }
serde_json = { workspace = true }
# `tests/kit_asset_absent.rs` walks the built demo wasm's custom sections.
wasmparser = "0.246"

[lints]
workspace = true
