[package]
name = "aether-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Schema-driven encode + decode of agent-supplied JSON params against
# `aether_data::SchemaType` descriptors. ADR-0019 made every
# substrate kind hub-encodable from JSON params; this crate is that
# encoder, factored out of the hub so callers outside the supervisor
# (scenario runner, future tooling) can use the same path without
# taking a heavy dep on `aether-hub`.
#
# ADR-0069 renamed this crate from `aether-params-codec` to
# `aether-codec` — the codec is universal (schema → bytes), not
# specific to mail params, and the next consumer is the prompt-system
# save format.
#
# Pure functions, no hub state, no async. Inputs are
# `serde_json::Value` + `aether_data::SchemaType`; outputs are wire
# bytes the substrate's existing decoders accept.

[lib]
path = "src/lib.rs"

[dependencies]
aether-data = { path = "../aether-data" }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
# Frame-size install (ADR-0156 §6) warns when a second, differing cap push
# races the set-once install — a boot-ordering bug the codec detects but must
# not abort a process over. Log-only; no subscriber pulled in here.
tracing = { workspace = true }

[dev-dependencies]
# Round-trip tests in this crate encode JSON params via the schema
# encoder, then decode the bytes back through `bytemuck::cast` (cast
# kinds) or a `serde` deserialize. Production callers don't need any of
# this — only pulled in for `cargo test`.
aether-data = { path = "../aether-data", features = ["derive"] }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
bytemuck = { workspace = true, features = ["derive"] }
# Issue 1561: the schema-driven round-trip property
# (`decode_schema(encode_schema(v)) == v`) over a generated `SchemaType`
# tree + a matching `serde_json::Value`. Dev-only; never in a release build.
proptest.workspace = true

[lints]
workspace = true
