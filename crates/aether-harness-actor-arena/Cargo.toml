[package]
name = "aether-harness-actor-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aether-actor-arena-trial"
path = "src/bin/trial.rs"

[[bin]]
name = "aether-actor-arena-compare"
path = "src/bin/compare.rs"

[[bin]]
name = "aether-actor-arena-preallocation-trial"
path = "src/bin/preallocation_trial.rs"

[[bin]]
name = "aether-actor-arena-preallocation-matrix"
path = "src/bin/preallocation_matrix.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
libc = "0.2"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
wasmtime = { workspace = true }
wat = "1"

[lints]
workspace = true
