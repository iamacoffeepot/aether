[package]
name = "aether-test-fixtures-republish"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Issue 7109: same-namespace successor modules for republish tests. Under
# ADR-0241 §4 a republish replaces a namespace only with code for the same
# namespace, so each behavior change a replace test makes needs a second module
# that exports what the first one did. Each module version is one `[[example]]`
# cdylib (built by `cargo xtask build-wasm` as `-p <pkg> --examples`); the lib
# is an rlib holding the actors every version of a family shares, which each
# example lists in its own `export!`. The namespaces are `test.republish.*`, so
# the shared bundle stays as it is.
#
# - `republish_subject_*`: `test.republish.subject` as a base and one successor
#   per behavior change: a dropped row, a changed reply, an added row, an added
#   fallback, an added dependency, an inline child with a dependency, and an
#   added boot. `republish_subject_helper` (issue 6867) is a base with a
#   dependency-free inline child that the inline-dependency successor
#   republishes.
# - `republish_group_v{1,2}`: the instanced `test.republish.gate` and the root
#   `test.republish.peer`. Only v2's gate handles `GateProbe`, and v2's peer
#   traps in `on_rehydrate` when its config says so.
# - `republish_carry_v{1,2}`: a correlation-carry requester, held relay and
#   held requester beside the shared `test.republish.carry.holder`. v2 reshapes
#   the requester's carried context and the relay's held reply kind.
# - `republish_group_v3` (issue 7086): the pair with the gate's config kind
#   changed, republishing v1.
# - `republish_loader` (issue 7086): a guest that loads a component through the
#   component host, as any guest does.
# - `republish_courier_v{1,2}` (issue 7086): a root courier and an instanced
#   parcel. v2's courier mails the component host from `on_rehydrate`, so its
#   load or drop reaches the host on the republish's own commit chain.
# - `republish_keep_v{1,2}` (issue 7125): the shared root
#   `test.republish.keep.keeper`, which moves a held reply and its count out of
#   itself in `on_dehydrate`, and a root `test.republish.keep.refuser` that
#   saves a bundle. v2's refuser traps in `on_rehydrate`.
# - `republish_watch_v{1,2}` (issue 7496): the root `test.republish.watch.ledger`,
#   which watches the providers that admit themselves and has no saved state,
#   the root `test.republish.watch.peer`, a guest provider, and the instanced
#   `test.republish.watch.desk` with its inline clerk, which watches from its
#   own `wire`. v2's peer traps in `on_rehydrate` when its config says so.
# - `republish_watch_reshaped` (issue 7496): the watch family's namespaces and
#   rows with a field added to the ledger's watch context kind, republishing
#   v1. It names no type of the lib, so the v1 context kind is not linked in.
# - `republish_hooks_v{1,2}` (issue 7535): the root `test.republish.hooks.parent`,
#   whose replace hooks succeed, return an error or trap as its config says,
#   and its inline `test.republish.hooks.counter`, which has saved state. v2's
#   counter returns an error from `on_rehydrate`, so it cannot be rebuilt.
[lib]
crate-type = ["rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
# The dependency successors declare `depends(ClipboardCapability)`. Marker face
# only.
aether-clipboard = { path = "../aether-clipboard", default-features = false }
# `republish_loader` and `republish_courier_v2` mail the component host. Identity face
# only.
aether-component = { path = "../aether-component", default-features = false }
aether-kinds = { path = "../aether-kinds" }

