[package]
name = "aether-bloomery-reactor-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Proc macros for signature-based bloomery reactor authoring (ADR-0222)."

# Proc-macro home for `#[reactor]` / `#[rule]`. Kept separate from
# `aether-bloomery-reactor` because a proc-macro crate must opt into
# `proc-macro = true` and can export nothing else. The runtime crate
# re-exports both macros so a consumer depends on one crate.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-reactor = { path = "../aether-bloomery-reactor" }
aether-bloomery-view = { path = "../aether-bloomery-view" }
aether-data = { path = "../aether-data", features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
trybuild = "1"

# trybuild fixtures compile as independent crates and name these crates in
# source the machete scan of this proc-macro package never opens.
[package.metadata.cargo-machete]
ignored = [
    "aether-bloomery-kinds", # aether-suppression-request: used by tests/ui fixtures, invisible to a source-only scan of this crate
    "aether-bloomery-reactor", # aether-suppression-request: used by tests/ui fixtures, invisible to a source-only scan of this crate
    "aether-bloomery-view", # aether-suppression-request: used by tests/ui fixtures, invisible to a source-only scan of this crate
    "aether-data", # aether-suppression-request: used by tests/ui fixtures, invisible to a source-only scan of this crate
    "serde", # aether-suppression-request: used through #[aether_data::kind] in tests/ui fixtures
]

[lints]
workspace = true
