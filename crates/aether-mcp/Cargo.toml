[package]
name = "aether-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The out-of-process MCP coordinator (issue 763 P5). Claude Code points
# `.mcp.json` at this binary; it owns the `rmcp` HTTP server and the
# tool surface, and reaches engines purely as an RPC *client* — it dials
# the hub's `RpcServerCapability` and relays tool calls as wire `Call`s.
# The wire surface comes from `aether-rpc` and the engines-cap config from
# `aether-fleet` (iamacoffeepot/aether#3735); the trace walk from
# `aether-trace`. Both native-only crates carry the substrate-side runtime, so
# the "no `aether-substrate` / wasmtime / wgpu in the production graph"
# invariant stays suspended (issue 2534).
#
# Until the P5d cutover the embedded `aether-substrate-bundle::hub::mcp`
# server keeps running on its own port — this crate is additive.
#
# The crate is also growing the *owned* Model Context Protocol library
# (`src/lib.rs`) that eventually replaces the `rmcp` executable above. The
# library half is pure: the capability kinds, the resolved configuration, the
# `SchemaType` → JSON Schema translator, and the protocol message model. The
# server actor, the derive sibling, and the client live in later steps of the
# design's ordered migration; until then the two halves coexist in one package
# and the `rmcp` binaries keep building unchanged.

# cargo-machete (the CI unused-deps gate) scans source without resolving
# features, so `clap` and `confique` are false positives — they are used only
# through the `#[derive(aether_substrate::Config)]` on `McpServerConfiguration`,
# which emits a `#[derive(clap::Args)]` overlay and a `#[derive(confique::Config)]`
# layer under the optional `runtime` feature.
[package.metadata.cargo-machete]
ignored = ["clap", "confique"] # aether-suppression-request: used only through derive(Config)'s emitted overlays under the runtime feature

# ADR-0122 identity/runtime split, as the design's feature layout states it:
# the kinds, the resolved configuration domain struct, and the schema
# translator are always available, so a provider that only declares tools
# depends on this crate at the marker-and-vocabulary tier. `runtime` carries
# the substrate-typed half — for now just the `Config` derive's native
# codegen; the server actor arrives with the runtime slice. `client` carries
# the strict stateless client the context canary moves onto.
#
# The protocol message model compiles under either `runtime` or `client`, per
# the design: it is the shared wire vocabulary of the server and the client,
# and a marker-only guest needs neither.
[features]
default = ["runtime"]
runtime = [
    "aether-component/runtime",
    "dep:aether-http",
    "dep:aether-substrate",
    "dep:clap",
    "dep:confique",
]
client = []

[[bin]]
name = "aether-mcp"
path = "src/main.rs"

# The lifecycle tunnel (iamacoffeepot/aether#1212 PR 2): the stable MCP
# front Claude connects to on `:8890`. It reverse-proxies `/mcp` to the
# `aether-mcp` child on `:8891` and supervises the hub + `aether-mcp`.
[[bin]]
name = "aether-tunnel"
path = "src/bin/aether-tunnel.rs"

[dependencies]
# ADR-0124: the wire vocabulary (`MailEnvelope`, `MailboxAddress`,
# `RpcClient`, `WireFrame`, …) — the coordinator's entire production surface.
aether-rpc = { path = "../aether-rpc" }
# The engines-cap config + server the test-support chassis boots
# (`FleetConfig` / `FleetServer`).
aether-fleet = { path = "../aether-fleet" }
# The `aether.trace` cap (extracted from capabilities, #3719): the
# always-on `walk::TreeWalk` stitch (`tools/mail.rs`) plus the runtime
# `TraceDispatchCapability` the test-support chassis mounts.
aether-trace = { path = "../aether-trace", features = ["runtime"] }
aether-codec = { path = "../aether-codec" }
# The `aether.fs.*` kind family (`aether.fs.write` / `.read` / `.list` / …).
# Identity-only — the coordinator never mounts the fs cap; it links the crate so
# those kinds' `Kind`-derived inventory submissions land in the static
# `descriptors::all()` vocabulary the per-engine encode cache prefills from
# (ADR-0091). Inherited transitively through the old capabilities monolith
# until the rpc/engine extraction (#3735) dropped that dependency.
aether-fs = { path = "../aether-fs", default-features = false }
# The `aether.inventory.*` kind family (`manifest` / `resolve` / `kinds` /
# `handlers`) the coordinator speaks to every engine. Identity-only, like
# `aether-fs` above — the coordinator never mounts the inventory cap, it links
# the crate for the kinds.
aether-inventory = { path = "../aether-inventory", default-features = false }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# The `#[mcp::router]` / `#[mcp::tool]` / `#[mcp::reply]` proc macros,
# re-exported from this crate's root. Unconditional and always-on, like
# `aether-http`'s dependency on its own derive sibling: a provider that takes
# this crate `default-features = false` to *declare* tools needs the macros as
# much as a hosted chassis does. Proc-macro crates are host-compiled, so the
# edge leaves a wasm build unaffected.
aether-mcp-derive = { path = "../aether-mcp-derive" }
# ADR-0121/ADR-0123: the `#[actor(singleton, root)]` identity on
# `McpServerCapability`, the `#[runtime]` dispatch attribute on its runtime
# impl, and the `Manual` / `HandlesKind` vocabulary the deferred tool surface
# names. Always-on and wasm-safe, like `aether-http`'s own dependency on it —
# the identity tier must compile without the substrate.
aether-actor = { path = "../aether-actor" }
# The design's authoring contract resolves a deferred tool's recipient against
# the *component host's* carry rather than the caller's, so one `defer` call
# site addresses both a native root cap and an embedded component
# (`aether-http`'s `defer.rs` is the grounded precedent). `default-features =
# false` keeps the marker tier free of wasmtime; `runtime` forwards it.
aether-component = { path = "../aether-component", default-features = false }
# The endpoint is a `POST /mcp` route registered with `HttpServerCapability`
# through `#[http::router]` — no socket code belongs to this crate. Optional
# because only the runtime half names it; the marker-and-vocabulary tier does
# not have an HTTP boundary.
aether-http = { path = "../aether-http", optional = true }
# The `runtime` half of the owned library. Today it carries only the
# `#[derive(aether_substrate::Config)]` codegen on `McpServerConfiguration`
# (ADR-0090); the server actor follows in the runtime slice. Optional so the
# marker-and-vocabulary tier — kinds, configuration domain struct, schema
# translator — compiles for a provider that only declares tools.
aether-substrate = { path = "../aether-substrate", optional = true }
# ADR-0090 unit g: the `Config` derive emits an `McpServerOverlay`
# `#[derive(clap::Args)]` struct and an `McpServerConfigurationLayer`
# `#[derive(confique::Config)]` layer beside the domain struct. Both ride the
# `runtime` feature so a marker-only build skips them.
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }

anyhow = { workspace = true }
axum = "0.8"
base64 = { workspace = true }
futures-util = "0.3"
libc = "0.2"
png = { workspace = true }
# The tunnel's upstream HTTP client. `stream` gives us
# `Response::bytes_stream()` so the long-lived SSE GET channel is piped
# through incrementally rather than buffered to EOF. Default features
# (TLS, etc.) are off — the upstream is plain-HTTP localhost.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "io-util"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `v4` random naming for the reply-`Bytes` spill temp files
# (`aether-reply-<uuid>.bin`, issue 2108). `aether-data` already pulls `uuid`
# (serde-only); this declares the `v4` feature for the coordinator's own
# build graph so `Uuid::new_v4()` resolves when `aether-mcp` builds alone.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# iamacoffeepot/aether#2517: `features = ["test-support"]` exposes the
# canonical `aether_substrate::testing` fixture (`TestChassis`) the
# `tools.rs` test module boots against. Dev-dependency feature unification
# applies to test builds only, so it stays out of the production graph.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The `boot_hub_with_inventory` test fixture installs the `aether.inventory`
# cap, so the (test-only) `test_support` module constructs its runtime.
aether-inventory = { path = "../aether-inventory", features = ["runtime"] }
# `StreamReader` bridges reqwest's byte stream into an `AsyncRead` so the
# tunnel's SSE integration test can read events line-by-line as they
# arrive (the back-pressure / no-buffering guard).
tokio-util = { version = "0.7", features = ["io"] }

# ADR-0121: the `Kind` derive on this crate's own capability kinds (`kinds.rs`)
# emits a `cfg(not(target_family = "wasm"))`-gated `inventory::submit!`, so
# native builds need `inventory` reachable. Wasm guests don't — the gate skips
# emission.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[lints]
workspace = true
