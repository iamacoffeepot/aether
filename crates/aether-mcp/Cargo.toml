[package]
name = "aether-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

# The out-of-process MCP coordinator (issue 763 P5). Claude Code points
# `.mcp.json` at this binary; it owns the `rmcp` HTTP server and the
# tool surface, and reaches engines purely as an RPC *client* — it dials
# the hub's `RpcServerCapability` and relays tool calls as wire `Call`s.
# The wire surface (`rpc::*`, `trace_walk::*`) comes from
# `aether-capabilities` (ADR-0124, which dissolved the `aether-rpc`
# crate). Interim posture: the dependency rides default features, so the
# coordinator's builds carry the substrate-side runtime; the "no
# `aether-substrate` / wasmtime / wgpu in the production graph" invariant
# is suspended until issue 2534 flips this dep to
# `default-features = false` under per-package feature unification.
#
# Until the P5d cutover the embedded `aether-substrate-bundle::hub::mcp`
# server keeps running on its own port — this crate is additive.

[[bin]]
name = "aether-mcp"
path = "src/main.rs"

# The lifecycle tunnel (iamacoffeepot/aether#1212 PR 2): the stable MCP
# front Claude connects to on `:8890`. It reverse-proxies `/mcp` to the
# `aether-mcp` child on `:8891` and supervises the hub + `aether-mcp`.
[[bin]]
name = "aether-tunnel"
path = "src/bin/aether-tunnel.rs"

[dependencies]
# ADR-0124: the wire vocabulary (`rpc::{MailEnvelope, MailboxAddress,
# RpcClient, WireFrame, ...}`) + the decentralized trace walk
# (`trace_walk::TreeWalk`) — the coordinator's entire production surface.
# Default features for now (see the manifest header); issue 2534 flips
# this to `default-features = false` once the marker-only host build is
# green.
aether-capabilities = { path = "../aether-capabilities" }
aether-codec = { path = "../aether-codec" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }

anyhow = { workspace = true }
axum = "0.8"
base64 = { workspace = true }
futures-util = "0.3"
libc = "0.2"
png = { workspace = true }
# The tunnel's upstream HTTP client. `stream` gives us
# `Response::bytes_stream()` so the long-lived SSE GET channel is piped
# through incrementally rather than buffered to EOF. Default features
# (TLS, etc.) are off — the upstream is plain-HTTP localhost.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "io-util"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `v4` random naming for the reply-`Bytes` spill temp files
# (`aether-reply-<uuid>.bin`, issue 2108) — the same `Uuid::new_v4()`
# staging the contentgen caps use. `aether-data` already pulls `uuid`
# (serde-only); this declares the `v4` feature for the coordinator's own
# build graph so `Uuid::new_v4()` resolves when `aether-mcp` builds alone.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The `#[actor]` attribute macro for the `tools.rs` test module's
# `RouteInventorySink` loopback fixture (issue 2672) — a `#[cfg(test)]`
# native actor at the `aether.engine` mailbox that answers the harness's
# `engine = Some` `aether.inventory.kinds` refresh RPC locally, so the
# field-mismatch refresh-and-retry path is exercised end-to-end without a
# forked substrate. Test builds only; out of the production graph.
aether-actor = { path = "../aether-actor" }
# iamacoffeepot/aether#2517: `features = ["test-support"]` exposes the
# canonical `aether_substrate::testing` fixture (`TestChassis`) the
# `tools.rs` test module boots against. Dev-dependency feature unification
# applies to test builds only, so it stays out of the production graph.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# `StreamReader` bridges reqwest's byte stream into an `AsyncRead` so the
# tunnel's SSE integration test can read events line-by-line as they
# arrive (the back-pressure / no-buffering guard).
tokio-util = { version = "0.7", features = ["io"] }

[lints]
workspace = true
