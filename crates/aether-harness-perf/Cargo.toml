[package]
name = "aether-harness-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Perf-comparison tooling over the substrate harness (issue #3814;
# iamacoffeepot/aether#1077). `aether-perf-trial` runs one latency sweep and
# emits a TrialReport JSON; `aether-perf-compare` interleaves K
# base/candidate trials and renders the noise-aware paired comparison
# (ADR-0085); `aether-perf-plot` renders per-cell sample distributions
# to PNGs (iamacoffeepot/aether#1155). Binary names unchanged across the move
# from the chassis bundle. `aether-perf-bloomery` (issue #7281, behind the
# `bloomery` feature) times a Muse session workload's driver steps over a stub
# vendor and emits the bloomery sections of a TrialReport.

# The bloomery benchmark's stack. A feature rather than plain dependencies:
# `aether-harness-bloomery` turns on `aether-substrate/test-support`, and
# feature unification would carry that into the `aether-perf-trial` build the
# perf comparison measures, shifting its baseline.
[features]
bloomery = [
    "dep:aether-harness-bloomery",
    "dep:aether-bloomery-driver",
    "dep:aether-bloomery-journal",
    "dep:aether-bloomery-kinds",
    "dep:aether-bloomery-muse",
    "dep:aether-data",
    "dep:tracing",
    "dep:tracing-subscriber",
]

# SPIKE (spike/load-drop-heap, issue 7414): the load and drop heap profiler.
heap-profile = [
    "dep:dhat",
    "dep:libc",
    "dep:aether-actor",
    "dep:aether-component",
    "dep:aether-data",
    "dep:aether-kinds",
    "dep:aether-substrate",
]

[[bin]]
name = "aether-perf-load-drop"
path = "src/bin/perf-load-drop/main.rs"
required-features = ["heap-profile"]

[[bin]]
name = "aether-perf-trial"
path = "src/bin/perf-trial.rs"

[[bin]]
name = "aether-perf-compare"
path = "src/bin/perf-compare.rs"

[[bin]]
name = "aether-perf-plot"
path = "src/bin/perf-plot.rs"

# iamacoffeepot/aether#4176: drives the real `Registry` for read scaling and
# the single-owner drain ceiling. Not part of the merge gate — it answers a
# question about the registry, not about a change.
[[bin]]
name = "aether-perf-registry"
path = "src/bin/perf-registry.rs"

[[bin]]
name = "aether-perf-bloomery"
path = "src/bin/perf-bloomery/main.rs"
required-features = ["bloomery"]

[dependencies]
# The mail-latency harness + trial-report vocabulary the bins drive.
aether-harness-substrate = { path = "../aether-harness-substrate" }
serde = { workspace = true, features = ["derive", "std"] }
# Trial reports + comparison output are JSON (#1077).
serde_json = { workspace = true }
png = { workspace = true }
# Distribution-plot rendering for `aether-perf-plot`. `ab_glyph` keeps
# fonts pure-Rust (no font-kit / system freetype — headless-CI
# friendly); we render to an RGB buffer and encode with the `png` dep
# above.
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "ab_glyph",
    "line_series",
] }
# The bloomery benchmark (`bloomery` feature): the in-process chassis harness
# and its stub vendor, the driver's step-span target, the journal reads, the
# kinds it seeds and scans, the digests and citations it builds, the Muse
# session vocabulary, and the subscriber that times the step spans.
aether-harness-bloomery = { path = "../aether-harness-bloomery", optional = true }
aether-bloomery-driver = { path = "../aether-bloomery-driver", optional = true }
aether-bloomery-journal = { path = "../aether-bloomery-journal", optional = true }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds", optional = true }
aether-bloomery-muse = { path = "../aether-bloomery-muse", optional = true }
aether-data = { path = "../aether-data", optional = true }
dhat = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
aether-actor = { path = "../aether-actor", optional = true }
aether-component = { path = "../aether-component", optional = true }
aether-kinds = { path = "../aether-kinds", optional = true }
aether-substrate = { path = "../aether-substrate", optional = true }
tracing = { workspace = true, optional = true, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true }

[lints]
workspace = true
