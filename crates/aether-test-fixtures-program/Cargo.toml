[package]
name = "aether-test-fixtures-program"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# WASM fixture for the program bundle root: `#[program]`s exported through
# the `bundle` generator. Structural discovery (cdylib + aether-actor) includes
# it in `cargo xtask build-wasm`.
[lib]
crate-type = ["cdylib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-bundle = { path = "../aether-bloomery-bundle" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-program = { path = "../aether-bloomery-program" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-http = { path = "../aether-http", default-features = false }

[lints]
workspace = true
