[package]
name = "aether-kit"
version.workspace = true
edition.workspace = true
license.workspace = true

# The gameplay-systems layer: reusable actors built on the engine that
# any tile game on the substrate can load. Each system is its own module
# that co-locates the actor with its own `kinds` file (the mail shapes
# peers send it) and support files; `export!(...)` packs the actors into
# a single cdylib (ADR-0096 multi-actor module). The crate is guest code
# throughout, so there is no data/runtime split — the `export!` FFI emits
# wasm32-only shims that stay inert in a host rlib, so integration tests
# link the same artifact.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
# iamacoffeepot/aether#3950: the widget set + its `EditorShell` arbiter and the
# `behavior` feature were extracted to `aether-kit-widget`. kit keeps an rlib
# dependency on it so `workbench` can inline-spawn `EditorShell` and the
# `set::*` widgets: the generic `spawn_inline_child::<A>` constructs the child
# in-guest through the `ErasedWasmActor` bound, so the type only needs linking
# into the spawning cdylib, not listing in kit's own `export!`.
# `features = ["library"]` takes the widget crate's entry-free rlib face: its
# `export!` emits no FFI entries in this wasm module. One `export!` (kit's own)
# owns the entry surface per module; without this the widget crate's `export!`
# shims (`receive_p32`, `init`, …) would collide with kit's at the wasm link step.
aether-kit-widget = { path = "../aether-kit-widget", features = ["library"] }
# iamacoffeepot/aether#3756: the component cap was extracted to
# `aether-component`. kit is a wasm guest, so it takes the marker-only
# identity face — it addresses `ComponentHostCapability`, resolves loaded
# peers through `ComponentHostWasmExt`, and reads `WasmTrampoline::NAMESPACE`
# to build trampoline addresses. This replaced the crate's last use of the
# old capabilities monolith, so that dependency is gone.
aether-component = { path = "../aether-component", default-features = false }
# iamacoffeepot/aether#3749: the lifecycle cap was extracted to
# `aether-lifecycle`. kit is a wasm guest, so it takes the marker-only
# identity face.
aether-lifecycle = { path = "../aether-lifecycle", default-features = false }
# iamacoffeepot/aether#3747: the input cap was extracted to `aether-input`.
# kit is a wasm guest, so it takes the marker-only identity face.
aether-input = { path = "../aether-input", default-features = false }
# iamacoffeepot/aether#3721: the render cap was extracted to `aether-render`.
# kit is a wasm guest, so it takes the marker-only identity face.
aether-render = { path = "../aether-render", default-features = false }
# iamacoffeepot/aether#3727: the text cap was extracted to `aether-text`.
# kit is a wasm guest, so it takes the marker-only identity face.
aether-text = { path = "../aether-text", default-features = false }
# The `aether.fs` cap (iamacoffeepot/aether#3706) — kit loads meshes / worlds
# through it. Marker face only (kit is a wasm component addressing fs by mail).
aether-fs = { path = "../aether-fs", default-features = false }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-kinds = { path = "../aether-kinds" }
aether-math = { path = "../aether-math" }
aether-mesh = { path = "../aether-mesh" }
# iamacoffeepot/aether#3951: the terrain stack (mark / world / terra / mover)
# was extracted to `aether-kit-terrain`. kit's sim, client, and workbench
# systems still consume its `CellPos` / `WorldPoint` / octimeter position
# vocabulary and its mark / terra / world types, so kit takes an rlib
# dependency on it. kit is itself a cdylib whose `export!` binds the fixed-name
# FFI entries, and a wasm module carries exactly one `export!`, so kit enables
# the terrain crate's `library` feature to strip its `export!` entry surface
# from the embedding wasm module.
aether-kit-terrain = { path = "../aether-kit-terrain", features = ["library"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# Substrate-side `aether.log` (ADR-0060) for warn-log on rejected mail
# (out-of-bounds teleport, etc.). Default-features-off per the SDK pattern.
tracing = { workspace = true, default-features = false }

# Every crate that derives `Kind` needs `inventory` reachable on native
# builds so the `aether.kinds` descriptor list picks up its types. Wasm
# guests skip the submission via the derive's cfg gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
inventory = { workspace = true }

# Integration tests boot a `SubstrateHarness`, load this crate's own wasm
# artifact, and assert mail-flow + render properties via direct
# `SubstrateHarness` calls. Tests run host-side; the wasm is built separately
# for `wasm32-unknown-unknown` and discovered at runtime under
# `target/wasm32-unknown-unknown/{debug,release}/`. Each scenario states its
# minimal cap composition on the `SubstrateHarnessBuilder` (issue #3764), so the
# cap crates a composition names appear here with their default `runtime`
# feature on — dev-only, the wasm lib build keeps the marker-only face above.
[dev-dependencies]
aether-input = { path = "../aether-input" }
aether-render = { path = "../aether-render" }
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-harness-substrate-capture = { path = "../aether-harness-substrate-capture" }
aether-text = { path = "../aether-text" }

[lints]
workspace = true
