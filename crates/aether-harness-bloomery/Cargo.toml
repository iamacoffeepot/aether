[package]
name = "aether-harness-bloomery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `BloomeryHarness` — journal-content scenarios over the shipped bloomery
# chassis, in process (issue #6264). Seeds a scratch journal from `Batch`es,
# boots `BloomeryChassis` over it, drives the mounted journal owner and bundle
# driver by proven reference, and asserts the records the loop appended
# against literals the scenario writes. Test support end to end: it is only
# ever a dev-dependency. It never resolves a dist artifact itself — a
# scenario that needs fixture wasm reads it through
# `aether_harness_substrate::test_helpers::require_wasm` and stages the bytes.

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-journal = { path = "../aether-bloomery-journal" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-view = { path = "../aether-bloomery-view" }
aether-chassis = { path = "../aether-chassis" }
aether-chassis-bloomery = { path = "../aether-chassis-bloomery" }
aether-data = { path = "../aether-data" }
# `test-support` for `BuiltChassis::send_for_reply` and
# `BuiltChassis::send_tracked`, the test-scoped pushes the harness drives the
# built-but-never-run chassis through.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
