[package]
name = "aether-test-fixtures-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The main fixture bundle: a single cdylib that consolidates the bulk of
# the workspace's wasm test fixtures as one ADR-0096 multi-actor module
# (`export!(default = Probe, public = […])`, `Probe` the entry). One `src/<name>.rs` module per
# former fixture; the integration tests load this one wasm and select an
# in-bundle actor with `export: Some("<NAMESPACE>")`. The typed↔reshaped
# replace pair lives in standalone satellite crates — a cross-module
# replace needs two distinct binaries. The `rlib` lets host tests name the
# actor types they load and the children those actors spawn.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
# iamacoffeepot/aether#3758: the http caps were extracted to `aether-http`;
# the http_handler fixture authors `#[http::router]` routes and addresses
# `HttpServerCapability`. `default-features = false` exercises the
# wasm-header-only build — the cap markers (Actor / Singleton /
# HandlesKind), the typed route surface, and the stream handles compile for
# wasm without dragging the native runtime in.
aether-http = { path = "../aether-http", default-features = false }
# iamacoffeepot/aether#3756: the component cap was extracted to
# `aether-component`; the http_handler fixture addresses
# `ComponentHostCapability`. Marker face only.
aether-component = { path = "../aether-component", default-features = false }
# iamacoffeepot/aether#3749: the lifecycle cap was extracted to
# `aether-lifecycle`; the cube / probe / ui_widget fixtures subscribe stage
# signals through it. Marker face only.
aether-lifecycle = { path = "../aether-lifecycle", default-features = false }
# ADR-0164 / iamacoffeepot/aether#4019: the probe fixture subscribes
# window-originated input through the neutral window identity. Marker face only.
aether-window = { path = "../aether-window", default-features = false }
# iamacoffeepot/aether#3721: the render cap was extracted to `aether-render`;
# these wasm fixtures take its marker-only identity face.
aether-render = { path = "../aether-render", default-features = false }
# iamacoffeepot/aether#3751: the tcp cap was extracted to `aether-tcp`; the
# tcp-load probe fixture dials and echoes through it. Marker face only.
aether-tcp = { path = "../aether-tcp", default-features = false }
# ADR-0141 / ADR-0230: the editor-region probe names `EditorShell` by bare type
# to announce itself, so it needs the widget crate's actor impls. `library`
# strips that crate's own `export!` entry surface (one `export!` per wasm
# module), leaving the impls without a second `receive_p32` / `init` colliding
# with this bundle's. `aether-kit-widget` takes this bundle back as a
# *dev*-dependency, and cargo permits that cycle because a dev-dependency edge
# is not part of the normal build graph; `xtask dist` builds each component
# package in its own cargo invocation, so the `library` feature enabled here
# cannot unify into the widget crate's own cdylib build.
aether-kit-widget = { path = "../aether-kit-widget", features = ["library"] }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-kinds = { path = "../aether-kinds" }
aether-math = { path = "../aether-math" }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
serde = { workspace = true, default-features = false, features = ["derive"] }
# Issue #581: the probe emits `tracing::info!` on the first tick; the
# actor-aware subscriber installed by `export!()` buffers + drains it to
# LogCapability. The source-observer fixture logs the same way.
tracing = { workspace = true, default-features = false }

# cargo-machete (the CI unused-deps gate) scans source without expanding
# macros, so it cannot see that `serde` is reached only through the
# `#[aether_data::kind(...)]` expansion, which emits `::serde::Serialize` /
# `::serde::Deserialize` on the fixtures' own kinds. The crate names serde
# nowhere in source; the dependency is real.
[package.metadata.cargo-machete]
ignored = ["serde"] # aether-suppression-request: serde is used only through the #[aether_data::kind] expansion, invisible to a source-only scan

[lints]
workspace = true
