[package]
name = "aether-bloomery-kinds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The shared vocabulary of bloomery kinds: unit keys, the tree, programs, heads, and journal mail."

[dependencies]
# `HeldReply` (ADR-0243 §1): the held reply kinds here name the answer a
# caller receives when the actor holding its debt closes first.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data", features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
unicode-normalization = { workspace = true }

[lints]
workspace = true
