[package]
name = "aether-lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `aether.lifecycle` capability (ADR-0082), extracted by the arc that
# dissolved the capabilities monolith (iamacoffeepot/aether#3749) as a leaf
# per-cap crate. Owns the lifecycle
# graph + its typestate builder (`graph`), the `LifecycleConfig` init
# config, the `LifecycleCapability` identity + its subscriber-table and
# settlement-gating runtime (`runtime`), and the `Publisher` impl the flat
# `ctx.subscribe` verb sends through. It is a pure leaf — no other capability
# depends on it, so capabilities keeps no `aether-lifecycle` dependency
# (no facade).
#
# The stage-signal ZSTs and `LifecycleAdvance` stay in `aether-kinds`: they
# are substrate protocol vocabulary many actors address. The subscribe family
# lives in this crate's `kinds` module, because an explicit subscriber is a
# `ProtocolPath` from `aether-actor`, which `aether-kinds` cannot depend on.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identity and `HandlesKind` markers compile always-on; the
# `aether_substrate`-typed runtime half (the graph state pointer,
# subscriber table, fan-out, and settlement state machine) is gated so a
# marker-only wasm guest can declare `#[actor(depends(LifecycleCapability))]`
# and subscribe with `ctx.subscribe::<LifecycleCapability, K>()` without
# dragging the substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate", "dep:tracing", "dep:clap", "dep:confique"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-kinds = { path = "../aether-kinds" }
# The subscription kinds in `kinds` derive through `#[aether_data::kind]`,
# whose expansion names `::bytemuck` on the two cast-shaped reflexive kinds and
# `::serde` on the reply.
bytemuck = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# Native-only runtime half — gated so wasm/marker builds skip the substrate
# runtime.
aether-substrate = { path = "../aether-substrate", optional = true }
# The settlement state machine warns on a force-completed advance and errors
# on a missing state pointer. Rides the `runtime` feature — those log sites
# are native-only.
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }
# `LifecycleConfig` derives `aether_substrate::Config` (ADR-0090 / ADR-0156),
# which emits a clap-shaped `LifecycleOverlay` (`#[derive(clap::Args)]`) and a
# confique-shaped `LifecycleConfigLayer` (`#[derive(confique::Config)]`), so
# the runtime half needs both crates reachable. Both ride the `runtime`
# feature (the derive is native-only).
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }

# cargo-machete scans source without expanding macros, so it cannot see that
# `clap` and `confique` are used only through the `#[derive(aether_substrate::Config)]`
# expansion on `LifecycleConfig`. False positives, so ignored here rather
# than dropped.
[package.metadata.cargo-machete]
ignored = ["bytemuck", "clap", "confique", "serde"] # aether-suppression-request: bytemuck and serde are used only through the #[aether_data::kind] expansion in `kinds`, invisible to a source-only scan

# The `#[actor]` macro emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` HandlerEntry per handler, so native builds need
# `inventory` reachable; wasm guests don't (the gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
# The runtime unit tests boot the `aether_substrate::testing` mailer
# fixture, enabled by the substrate `test-support` feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

[lints]
workspace = true
