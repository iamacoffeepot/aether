[package]
name = "aether-test-fixtures-mixed-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# WASM fixture for a bundle with one program and one reactor whose rule calls
# that program. Structural discovery (cdylib + aether-actor) includes it in
# `cargo xtask build-wasm`.
[lib]
crate-type = ["cdylib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-bundle = { path = "../aether-bloomery-bundle" }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
aether-bloomery-program = { path = "../aether-bloomery-program" }
aether-bloomery-reactor = { path = "../aether-bloomery-reactor" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }

[dev-dependencies]
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-kinds = { path = "../aether-kinds" }
wasmparser = "0.246"

[lints]
workspace = true
