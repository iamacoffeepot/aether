[package]
name = "aether-test-fixtures-stateful-typed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# ADR-0113 declarative-state replace SOURCE: a single-actor `Counter`
# (`NAMESPACE = "test.stateful.typed"`) that declares `type State = CounterState`
# plus the dehydrate / rehydrate accessors, so `#[actor]` generates the
# hot-swap hooks. Standalone (not in the bundle) because the decode-miss
# test entry-loads it and replaces it with the reshaped satellite — a
# cross-module replace needs two distinct binaries.
[lib]
crate-type = ["cdylib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }
serde = { workspace = true, default-features = false, features = ["derive"] }

# cargo-machete (the CI unused-deps gate) scans source without expanding
# macros, so it cannot see that `serde` is reached only through the
# `#[aether_data::kind(...)]` expansion on `CounterState`, which emits
# `::serde::Serialize` / `::serde::Deserialize`. The crate names serde
# nowhere in source; the dependency is real.
[package.metadata.cargo-machete]
ignored = ["serde"] # aether-suppression-request: serde is used only through the #[aether_data::kind] expansion, invisible to a source-only scan

[lints]
workspace = true
