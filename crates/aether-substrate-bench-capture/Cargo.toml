[package]
name = "aether-substrate-bench-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

# Render/GPU capture support for `aether-substrate-bench` (issue #3765):
# the offscreen wgpu pipeline (`Gpu`), the `GpuRenderExt`/`GpuFrameHook`
# pair that plugs into the core bench's `RenderExt`/`FrameHook` seam, the
# image-compare/`FrameCheck` scoring in `visual`, and the failure-only
# `ArtifactGuard`. Split from the core so only visual consumers carry the
# aether-render + wgpu edge in their `cargo xtask affected` closure.

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
aether-render = { path = "../aether-render" }
aether-substrate = { path = "../aether-substrate" }
aether-substrate-bench = { path = "../aether-substrate-bench" }
anyhow = { workspace = true }
png = { workspace = true }
pollster = "0.4.0"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
thiserror = "2"
wgpu = { workspace = true }

[lints]
workspace = true
