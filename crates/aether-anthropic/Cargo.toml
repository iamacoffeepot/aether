[package]
name = "aether-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0050 `aether.anthropic` provider vocabulary, reimplemented by ADR-0159
# (issues #3891 / #3893) as a wasm guest component. Owns the mail kinds
# (`kinds`) and the `AnthropicComponent` guest actor (`component`): the ported
# pure request/response logic plus its init-config. The component reaches HTTPS
# through `aether.http.fetch` (the Messages backend) and the `claude` subprocess
# through `aether.process.run` (the CLI backend), addressing both edge caps by
# mail — so it owns no socket and holds the API key in its init-config. It is a
# pure leaf: no other cap depends on it.
#
# The native cap half (the chassis-owned actor identity, the `ureq` Messages
# backend, the `claude` subprocess adapter, the task-queue runtime, and the
# derive-`Config`) retired with the provider caps' removal from chassis
# composition (ADR-0159 §6).

# The crate is the loadable guest component: `export!` emits the wasm32-only
# cdylib FFI (inert in a host rlib), so the same artifact links into both the
# wasm component build and the host integration test (the kit pattern).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `#[actor]` guest SDK + data / kind types the wire kinds and the guest
# actor carry.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
# The `MessagesSend` / `CliSend` result kinds carry an `aether.Usage` token +
# clock accounting.
aether-kinds = { path = "../aether-kinds" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# ADR-0159 guest edges — marker face only (the component addresses these caps by
# mail, so it takes the wasm-safe identity + wire kinds, never a native runtime).
# `aether.http.fetch` carries the Messages request; `aether.process.run` carries
# the `claude` CLI backend. The integration test re-enables their `runtime` face
# as a dev-dependency to boot them in the harness.
aether-http = { path = "../aether-http", default-features = false }
aether-process = { path = "../aether-process", default-features = false }
# JSON request-body building + response parsing over the http reply bytes.
serde_json = { workspace = true }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory` reachable;
# wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The ADR-0159 SubstrateHarness end-to-end test loads the built component wasm
# and boots the `aether.http` / `aether.process` edge caps (their `runtime`
# face) with empty allowlists to drive the deterministic refusal paths.
aether-http = { path = "../aether-http", features = ["runtime"] }
aether-process = { path = "../aether-process", features = ["runtime"] }
aether-harness-substrate = { path = "../aether-harness-substrate" }
aether-harness-substrate-capture = { path = "../aether-harness-substrate-capture" }
# The loaded component registers at `aether.component/aether.embedded:NAME`; the
# test builds that address from `WasmTrampoline::NAMESPACE`.
aether-component = { path = "../aether-component" }

[lints]
workspace = true
