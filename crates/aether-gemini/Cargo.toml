[package]
name = "aether-gemini"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0050 `aether.gemini` content-gen cap, extracted by the arc that dissolved
# the capabilities monolith (iamacoffeepot/aether#3705) as a leaf provider crate
# of the provider-cluster split. Owns the full Gemini stack: the mail kinds (`kinds`), the
# `GeminiConfig`, and the `GeminiCapability` identity + the `ureq` Nano Banana
# (image) / Lyria (music) backends, the hand-rolled base64 media decode, and the
# task-queue runtime that stages generated bytes as `gen/<uuid>.{png,wav}`. It is
# a pure leaf — no other cap depends on it, so nothing depends back on this
# crate (no facade).
#
# It builds on the shared content-gen layer `aether-contentgen` (the adapter
# traits + `ureq` transport + `gen/` staging), so it depends on
# `aether-contentgen` (identity-only by default; the `runtime` feature forwards
# `aether-contentgen/runtime`). Generated bytes stage through the `aether.fs`
# cap's `LocalFileAdapter`, so it also depends on `aether-fs`
# (identity-only by default; `runtime` forwards `aether-fs/runtime`). Long-tail
# calls ride the substrate's `aether_substrate::actor::native::TaskQueue`.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the wasm-safe
# identity, kinds, and `GeminiConfig` domain struct compile always-on; the
# `aether_substrate`-typed runtime half (the adapters + `ureq` backends + media
# decode + task queue + staging) is gated so a marker-only wasm guest can address
# `ctx.actor::<GeminiCapability>()` without dragging the transport / substrate
# stack through.

[features]
default = ["runtime"]
runtime = [
    "dep:aether-substrate",
    "aether-contentgen/runtime",
    "aether-fs/runtime",
    "dep:serde_json",
    "dep:ureq",
    "dep:clap",
    "dep:confique",
    "dep:tracing",
]

[dependencies]
# Always-on: the `#[actor]` identity SDK + data / kind types the marker face
# carries.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
# The generate result kinds carry an `aether.Usage` token + clock accounting —
# always-on.
aether-kinds = { path = "../aether-kinds" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# The shared content-gen layer: the `GeminiAdapter` trait + request / response
# types, the `ureq` transport, and the `gen/<uuid>.<ext>` staging path.
# `default-features = false` keeps the marker-only build from dragging the
# transport runtime; the `runtime` feature above forwards
# `aether-contentgen/runtime`.
aether-contentgen = { path = "../aether-contentgen", default-features = false }
# The `gen/` staging path writes generated bytes through the `aether.fs` cap's
# `LocalFileAdapter`. `default-features = false` keeps the marker-only build
# from dragging the fs runtime; the `runtime` feature above forwards
# `aether-fs/runtime`.
aether-fs = { path = "../aether-fs", default-features = false }
# Native-only runtime half — gated so marker builds skip the substrate runtime
# + the `ureq` backends / media decode / task queue / staging.
aether-substrate = { path = "../aether-substrate", optional = true }
# ADR-0050 §1: the Nano Banana / Lyria requests run through `ureq`; the request
# and response bodies are JSON.
ureq = { version = "3", optional = true, features = ["rustls"] }
serde_json = { workspace = true, optional = true }
# The `Config` derive emits the `GeminiConfigLayer`
# (`#[derive(confique::Config)]`) + `GeminiOverlay` (`#[derive(clap::Args)]`)
# structs; both ride the `runtime` feature so marker builds skip them.
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory` reachable;
# wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The runtime unit tests boot a chassis through the canonical
# `aether_substrate::testing` fixture, enabled by the substrate `test-support`
# feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }

# cargo-machete (the CI unused-deps gate) scans source without resolving
# features, so it cannot see that `clap` and `confique` are used only through
# the `Config` derive's codegen under the optional `runtime` feature. Both are
# false positives: the deps are real and runtime-gated.
[package.metadata.cargo-machete]
ignored = ["clap", "confique"]

[lints]
workspace = true
