[package]
name = "aether-gemini"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0050 `aether.gemini` content-gen provider, now dual-homed per ADR-0159:
# the wire kinds (`kinds`) plus the pure provider logic (`nanobanana` /
# `lyria` validation tables + response parsers, the `body` request builders +
# base64 codec, the `error` taxonomy) are shared, and two halves sit over them.
#
# - The **guest component** (`component`, the default) is the ADR-0159 wasm
#   actor: `GeminiComponent` reaches HTTPS through `aether.http.fetch`, stages
#   artifacts through `aether.fs.write`, and reads reference images through
#   `aether.fs.read` — it holds the API key in its init-config and owns no
#   socket. `export!` emits the wasm32-only cdylib FFI (inert in a host rlib),
#   so the crate is discovered structurally as a component (cdylib crate-type +
#   `aether-actor` dep) and built for `wasm32-unknown-unknown`.
# - The **native cap** (`runtime`) is the legacy chassis-owned actor:
#   `GeminiCapability` over the `ureq` Nano Banana / Lyria backends and the
#   `aether_substrate` `TaskQueue`. It stays intact for this PR; its retirement
#   is issue #3893. Native consumers opt in explicitly with
#   `default-features = false, features = ["runtime"]`.
#
# The two coexist in a workspace build (features unify): the guest `WasmActor`
# emits no native name-inventory entry, so it never collides with the native
# split cap's, and `export!`'s FFI is inert on native. Default features stay
# wasm-safe (no `aether-substrate`) so the structural component build compiles.

[lib]
# ADR-0159: the shared crate emits the guest cdylib (wasm) and still links as
# an rlib into the native chassis + integration tests. `export!`'s FFI is
# wasm32-only, so the rlib carries inert shims.
crate-type = ["cdylib", "rlib"]

[features]
# The guest component is the default so the structural wasm build (default
# features) yields the cdylib and never pulls `aether-substrate`.
default = ["component"]
# ADR-0159 wasm guest component: the `GeminiComponent` actor over
# `aether.http` / `aether.fs`, the shared pure logic, and `export!`.
component = ["dep:aether-http", "dep:serde_json", "dep:tracing"]
# ADR-0050 native chassis cap (the legacy runtime half): the `ureq` backends,
# the `aether_substrate` `TaskQueue`, and the derive-`Config`. Native
# consumers add this with `default-features = false`.
runtime = [
    "dep:aether-substrate",
    "aether-contentgen/runtime",
    "aether-fs/runtime",
    "dep:serde_json",
    "dep:ureq",
    "dep:clap",
    "dep:confique",
    "dep:tracing",
]

[dependencies]
# Always-on: the `#[actor]` identity + guest SDK and the data / kind types the
# wire kinds and the guest actor carry.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
# The generate result kinds carry an `aether.Usage` token + clock accounting —
# always-on.
aether-kinds = { path = "../aether-kinds" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# The shared content-gen layer: the adapter request / response types the pure
# `body` builders and parsers convert through, plus the always-on `strparse`
# helpers the `error` taxonomy calls. `default-features = false` keeps the guest
# build off the transport runtime; the `runtime` feature forwards it.
aether-contentgen = { path = "../aether-contentgen", default-features = false }
# The native staging path (`runtime`) writes generated bytes through the
# `aether.fs` cap's `LocalFileAdapter`; the guest addresses `aether.fs` by mail
# through the always-on marker face. `default-features = false` keeps the guest
# build off the fs runtime; the `runtime` feature forwards `aether-fs/runtime`.
aether-fs = { path = "../aether-fs", default-features = false }
# `component`-only: the guest reaches HTTPS through `aether.http.fetch`, addressed
# via the always-on marker face (`default-features = false`).
aether-http = { path = "../aether-http", default-features = false, optional = true }
# `runtime`-only: the native cap's substrate `TaskQueue` + derive-`Config`.
aether-substrate = { path = "../aether-substrate", optional = true }
# ADR-0050 §1: the native Nano Banana / Lyria requests run through `ureq`.
# `runtime`-only.
ureq = { version = "3", optional = true, features = ["rustls"] }
# Request-body construction + response parsing (both halves). Rides `component`
# and `runtime`; a marker-only build carries neither module and skips it.
serde_json = { workspace = true, optional = true }
# The native `Config` derive emits the `GeminiConfigLayer` + `GeminiOverlay`
# structs; both ride the `runtime` feature.
clap = { workspace = true, optional = true }
confique = { workspace = true, optional = true }
# Structured logging on both halves (guest warn-logs, native cap info-logs).
# Marker face carries neither module and skips it.
tracing = { workspace = true, optional = true }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory` reachable;
# wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The native runtime unit tests boot a chassis through the canonical
# `aether_substrate::testing` fixture, enabled by the substrate `test-support`
# feature. `runtime` is also enabled on this crate so `cargo test -p
# aether-gemini` exercises the native cap tests, not only the default (guest)
# build.
aether-gemini = { path = ".", features = ["runtime"] }
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The component scenario test composes the native `aether.http` egress cap
# (empty allowlist → deterministic refusal) and drives the loaded guest.
aether-http = { path = "../aether-http" }
aether-component = { path = "../aether-component" }
aether-kinds = { path = "../aether-kinds" }
aether-harness-substrate = { path = "../aether-harness-substrate" }

# cargo-machete (the CI unused-deps gate) scans source without resolving
# features, so it cannot see that `clap` and `confique` are used only through
# the native `Config` derive's codegen under the optional `runtime` feature.
# Both are false positives: the deps are real and runtime-gated.
[package.metadata.cargo-machete]
ignored = ["clap", "confique"]

[lints]
workspace = true
