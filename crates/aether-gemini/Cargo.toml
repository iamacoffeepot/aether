[package]
name = "aether-gemini"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0050 `aether.gemini` media-generation provider, reimplemented by ADR-0159
# (issues #3892 / #3893) as a wasm guest component. Owns the wire kinds (`kinds`)
# plus the pure provider logic (`nanobanana` / `lyria` validation tables +
# response parsers, the `body` request builders + base64 codec, the `error`
# taxonomy) and the `GeminiComponent` guest actor (`component`): it reaches
# HTTPS through `aether.http.fetch`, stages artifacts through `aether.fs.write`,
# and reads reference images through `aether.fs.read`, addressing each edge cap
# by mail — so it holds the API key in its init-config and owns no socket.
#
# The native cap half (the chassis-owned actor identity, the `ureq` Nano Banana /
# Lyria backends, the `aether_substrate` task-queue runtime, the `gen/<uuid>`
# staging, and the derive-`Config`) retired with the provider caps' removal from
# chassis composition (ADR-0159 §6).

# The crate emits the guest cdylib (wasm) and still links as an rlib into the
# host integration test. `export!`'s FFI is wasm32-only, so the rlib carries
# inert shims. Discovered structurally as a component (cdylib crate-type +
# `aether-actor` dep).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `#[actor]` guest SDK + the data / kind types the wire kinds and the guest
# actor carry.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
# The generate result kinds carry an `aether.Usage` token + clock accounting.
aether-kinds = { path = "../aether-kinds" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# The pure `GeminiImageRequest` DTO the body builder converts through, plus the
# `strparse` helpers the `error` taxonomy calls.
aether-contentgen = { path = "../aether-contentgen" }
# The guest stages artifacts and reads reference images through the `aether.fs`
# cap, addressed via the marker face (`default-features = false` keeps the guest
# build off the fs runtime).
aether-fs = { path = "../aether-fs", default-features = false }
# The guest reaches HTTPS through `aether.http.fetch`, addressed via the marker
# face (`default-features = false`).
aether-http = { path = "../aether-http", default-features = false }
# Request-body construction + response parsing.
serde_json = { workspace = true }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory` reachable;
# wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The component scenario test composes the native `aether.http` egress cap
# (empty allowlist → deterministic refusal) and drives the loaded guest.
aether-gemini = { path = "." }
aether-http = { path = "../aether-http" }
aether-component = { path = "../aether-component" }
aether-kinds = { path = "../aether-kinds" }
aether-harness-substrate = { path = "../aether-harness-substrate" }

[lints]
workspace = true
