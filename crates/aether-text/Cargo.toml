[package]
name = "aether-text"
version.workspace = true
edition.workspace = true
license.workspace = true

# ADR-0105 `aether.text` capability, extracted by the arc that dissolved the
# capabilities monolith (iamacoffeepot/aether#3727) as a leaf per-cap crate. Owns the full text stack: the mail kinds
# (`kinds`), the `TextCapability` identity, and the CPU-only runtime
# (`runtime`: the `fontdue` font registry, the shelf-packed glyph atlas, and the
# immediate-mode layout / draw path). It is a pure leaf — no other capability
# depends on it, so capabilities keeps no `aether-text` dependency (no facade).
#
# The text cap is CPU-only (no GPU dep): it composes `aether.render`'s texture /
# quad surface entirely by mail (it addresses render's texture / quad kinds and
# receives `CreateTextureResult`), and it loads fonts through the `aether.fs`
# cap. So it depends on `aether-render` and `aether-fs` — both identity-only by
# default; the `runtime` feature forwards `aether-render/runtime` and
# `aether-fs/runtime`.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identity, kinds, and `HandlesKind` markers compile always-on; the
# `aether_substrate`-typed runtime half (plus the native `fontdue` TTF parse /
# rasterize) is gated so a marker-only wasm guest can address
# `ctx.actor::<TextCapability>()` without dragging `fontdue` / the substrate
# through. The old capabilities `text` marker maps to this crate's default-off
# face; `text-runtime` maps to `runtime`.

[features]
default = ["runtime"]
# Pulls the substrate-side runtime half + the `fontdue` TTF parse / rasterize.
# Chassis builds activate it (the bundle's direct `features = ["runtime"]` dep).
# The text cap composes render and loads fonts through fs at runtime, so it
# forwards both `aether-render/runtime` and `aether-fs/runtime`.
runtime = [
    "dep:aether-substrate",
    "aether-render/runtime",
    "aether-fs/runtime",
    "dep:fontdue",
    "dep:tracing",
]

[dependencies]
# Always-on: target-agnostic SDK + data + kind types + math. These compile for
# `wasm32-unknown-unknown` and carry the identity markers a marker-only wasm
# guest relies on.
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# The text mail kinds carry an `Rgba` color multiplier (`aether_math::Rgba`),
# and the layout helpers build metrics with math types — always-on.
aether-math = { path = "../aether-math" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
# The text cap composes the render texture / quad surface by mail: it addresses
# `RenderCapability` + render's `CreateTexture` / `UpdateTexture` /
# `DrawTexturedQuads` / `TexturedQuad` kinds and receives `CreateTextureResult`.
# `default-features = false` keeps the marker-only wasm build from dragging the
# render (wgpu) runtime; the `runtime` feature above forwards `aether-render/runtime`.
aether-render = { path = "../aether-render", default-features = false }
# The text cap loads fonts through `aether.fs`: it addresses `FsCapability` + its
# `Read` / `ReadResult` / `FsError` kinds. `default-features = false` keeps the
# marker-only wasm build from dragging the fs runtime; the `runtime` feature
# above forwards `aether-fs/runtime`.
aether-fs = { path = "../aether-fs", default-features = false }
# Native-only runtime half — gated so wasm/marker builds skip the substrate
# runtime and the `fontdue` TTF parse / rasterize.
aether-substrate = { path = "../aether-substrate", optional = true }
# ADR-0105 §text: pure-Rust TTF parse + glyph rasterize + horizontal layout
# metrics. Rides the `runtime` feature so wasm / marker-only builds skip it.
fontdue = { version = "0.9", optional = true }
tracing = { workspace = true, optional = true, features = ["std", "attributes"] }

# The `Kind` derive emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` per kind, so native builds need `inventory`
# reachable; wasm guests don't (the derive's gate skips emission).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The runtime module's unit tests boot a chassis through the canonical
# `aether_substrate::testing` fixture, enabled by the substrate `test-support`
# feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The text scenario tests (`tests/text_scenario.rs`, rehomed from
# `aether-substrate-bundle` per issue #3772) drive an in-process
# `SubstrateBench` composed with the render + text + fs caps and score the
# captured frames through the capture crate's visual reductions.
aether-substrate-bench = { path = "../aether-substrate-bench" }
aether-substrate-bench-capture = { path = "../aether-substrate-bench-capture" }

[lints]
workspace = true
