[package]
name = "aether-bloomery-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Proc macros for bloomery authoring: views, reactors, programs, and the bundle export generator."

# Proc-macro home for `#[view]` / `#[fold]`, `#[reactor]` / `#[rule]`,
# `#[program]`, and the `bundle` generator's `__bundle_export_generate`. Kept
# separate from `aether-bloomery-program` because a proc-macro crate must opt
# into `proc-macro = true` and can export nothing else. The runtime crate
# re-exports every macro so a consumer depends on one crate.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
# `CONTENT_ADDRESSED_SECTION`, the marker every generated bundle root emits (ADR-0241 §3).
aether-data = { path = "../aether-data" }

[dev-dependencies]
aether-actor = { path = "../aether-actor" }
aether-bloomery-program = { path = "../aether-bloomery-program" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-http = { path = "../aether-http", default-features = false }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
trybuild = "1"

[lints]
workspace = true
