[package]
name = "aether-test-fixtures-short-path"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# ADR-0241 §5 fixture: guest parents whose children resolve by short path.
# `Trunk` spawns a private inline `Branch`, which spawns a private inline
# `Leaf`, and `Placed` is a `load_under` child of `Host`. It is standalone
# because a short-path hole fills only beneath a parent with one instanced
# child type: in the shared bundle a composable export sits beneath every
# parent, so every hole there is ambiguous. The `rlib` lets host tests name
# each type's namespace.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-test-fixtures-kinds = { path = "../aether-test-fixtures-kinds" }

[lints]
workspace = true
