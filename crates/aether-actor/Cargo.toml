[package]
name = "aether-actor"
version.workspace = true
edition.workspace = true
license.workspace = true

# Actor SDK shared by WASM components (via `wasm::WasmTransport` —
# folded in from the prior `aether-component` crate by issue 552 stage
# 0) and, eventually, native capabilities (via
# `aether-substrate::NativeBinding`). Holds the `MailTransport`
# trait, the typed mail/ctx/sink machinery generic over `T:
# MailTransport`, and the wasm-guest impl
# (`WasmTransport`, `WasmActor`, `Replaceable`, `export!` macro plus
# the `aether.kinds.inputs` / `aether.namespace` custom-section pins).
# Native-target stubs in `wasm::raw` panic if invoked, so the crate
# compiles for `cargo test --workspace` on the host without dragging
# the wasm FFI into the linker.
[dependencies]
aether-data = { path = "../aether-data", features = ["derive"] }
# The actor-SDK attribute macros (`actor`, `capability`, `fallback`,
# `handler`, `local`) are sourced directly here now that `aether-data` no
# longer re-exports them (ADR-0077 / issue 552 consolidated them into this
# crate for compile cost; aether-data forwards only the data-layer derives).
aether-actor-derive = { path = "../aether-actor-derive" }
# ADR-0030 Phase 2: `InitCtx::subscribe_input` self-addresses
# `aether.input.subscribe` for every `K::IS_INPUT` handler kind.
# The wasm-shim helpers in `wasm::{io, net, log}` (folded in by issue
# 552 stage 0) also build `aether.fs.*` / `aether.net.*` / `aether.log.*`
# request kinds — that whole vocabulary lives in `aether-kinds`.
aether-kinds = { path = "../aether-kinds" }
bytemuck = { workspace = true, default-features = false }
# Decoding typed payloads (e.g. `PriorState::decode_kind`,
# `Mail::decode_kind`) is serde-driven via `aether_data::wire`. The crate
# stays `no_std`-friendly with `default-features = false`.
serde = { workspace = true, default-features = false, features = ["alloc"] }
# ADR-0060: the wasm shim installs a `tracing::Subscriber`
# (`MailSubscriber`) at component boot that turns `tracing::warn!` /
# `error!` / `info!` inside the wasm sandbox into `aether.log` mail.
# The facade itself is `no_std`-friendly with `default-features = false`;
# we don't pull `tracing-subscriber`.
tracing = { workspace = true, default-features = false }

[dev-dependencies]
# Examples migrate from kind-typed `Mailbox` resolutions to actor-
# typed `ctx.actor::<R>()` calls (issue 575) — needs the cap markers
# in scope. `aether-substrate` deps back on `aether-actor`, but cargo
# permits dev-dep cycles for the test-target build graph.
# iamacoffeepot/aether#3749: the lifecycle cap was extracted to
# `aether-lifecycle`; the `hello` example addresses `LifecycleCapability`
# + `LifecycleMailboxExt`. Its departure left no path into the old
# capabilities monolith from any example, so that dependency is gone.
aether-lifecycle = { path = "../aether-lifecycle", default-features = false }
# ADR-0163 §2: the asset_sections test parses the built
# aether-test-fixtures-bundle wasm to pin export_asset!'s custom-section
# emission (name, exact bytes, absence from data segments). Same version
# aether-substrate uses for its section walks.
wasmparser = "0.246"
# iamacoffeepot/aether#3747: the input cap was extracted to `aether-input`;
# the `input_logger` example addresses `InputCapability` + `SubscribeInput`.
aether-input = { path = "../aether-input", default-features = false }
# iamacoffeepot/aether#3721: the render cap was extracted to `aether-render`;
# the `hello` example addresses `RenderCapability` + the render kinds (marker face).
aether-render = { path = "../aether-render", default-features = false }
aether-math = { path = "../aether-math" }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
bytemuck = { workspace = true, features = ["derive"] }
# Issue #243: `#[derive(Kind)]` test fixtures emit `inventory::submit!`
# on native targets; the macro path needs `::inventory` reachable.
# Tests run native, so an unconditional dev-dep is fine.
inventory = { workspace = true }
# iamacoffeepot/aether#3777: the addressing fleet tests
# (`fleetharness_inline_child`, `fleetharness_matrix_sweep`) rehomed here
# from aether-substrate-bundle — their subject is the lineage addressing
# this crate's SDK defines. They drive the real hub → RPC →
# forked-headless stack through `FleetHarness` (a dev-dep cycle back
# through the bundle, which cargo permits for the test-target graph —
# same precedent as aether-kit-commons).
aether-harness-fleet = { path = "../aether-harness-fleet" }
# The shared `Kind` definitions the fleet tests decode + assert against;
# also pinned (`use … as _`) so the fixture kinds' `inventory::submit!`
# descriptor entries land in each test binary.
aether-test-fixtures-kinds = { path = "../aether-test-fixtures/aether-test-fixtures-kinds" }
# iamacoffeepot/aether#3766: the fixture crate whose wasm the fleet tests
# load (`test.inline.*` / `test.matrix.*` / `test.source_observer`
# exports), declared so the source→consumer coupling is cargo-visible —
# determinator re-runs these tests when the fixture changes, and xtask's
# wasm-consumer rule fires the dist pre-build. The tests locate the built
# wasm by stem, so the code never imports the crate.
aether-test-fixtures-bundle = { path = "../aether-test-fixtures/aether-test-fixtures-bundle" }

# ADR-0021 input subscriptions smoke. Resolves all four substrate input
# kinds and broadcasts a `demo.input_observed` per event so
# `receive_mail` shows the dispatch landing.
[[example]]
name = "input_logger"
crate-type = ["cdylib"]

# First end-to-end component (formerly `aether-hello-component`):
# emits a fixed world-space triangle to the render sink each tick and
# echoes `aether.ping` back as `aether.pong`. Doubles as a minimal
# `#[actor]` reference and the canary referenced from
# ADR-0012/0013/0014/0033.
[[example]]
name = "hello"
crate-type = ["cdylib"]

# cargo-machete's source-only scan cannot see the wasm-coupling dev-dep:
# the fleet tests load the fixture's built wasm by stem rather than
# importing the crate, so the cargo edge exists purely for determinator /
# dist-pre-build visibility (iamacoffeepot/aether#3766).
[package.metadata.cargo-machete]
ignored = ["aether-test-fixtures-bundle"]

[lints]
workspace = true
