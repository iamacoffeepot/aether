[package]
name = "aether-behavior"
version.workspace = true
edition.workspace = true
license.workspace = true

# Script-side SDK for behavior scripts (ADR-0137). One crate with two
# faces: the always-compiled trunk holds the host<->script envelope, the
# packed-pointer ABI, the exports-manifest decoder, and the reserved
# lifecycle sentinels. The `runtime` feature (on by default, so a bare
# wasm32 build produces the full guest surface) adds the authoring SDK:
# `BehaviorCtx`, the widget/child/panel handles, the decode-once mirror,
# the effect accumulator, and the `Behavior` lifecycle trait. The default
# face depends on `aether-data` and `serde` only — never `aether-actor`,
# never `wasmi` — which is what keeps a behavior cdylib from classifying
# as a component (structural discovery keys on an `aether-actor`
# dependency) and keeps the tier boundary legible.
#
# The non-default `host` feature is the third face (ADR-0137, issue
# 2687): the `BehaviorHost` actor that embeds a `wasmi` interpreter and
# interposes at a tree slot. It turns on the optional `aether-actor` /
# `wasmi` deps, neither of which the default face
# names, so a script build never links them. Host-enabled wasm is
# compiled in a separate cargo invocation from script wasm (issue 2688),
# so `host` never feature-unifies into a script's build graph.
[features]
default = ["runtime"]
runtime = ["dep:aether-behavior-derive"]
# ADR-0137 / issue 2687: the in-cluster behavior script host. Pulls the
# actor SDK (the host is a wasm `#[actor]`), the `wasmi` interpreter it
# embeds (no_std, built-in fuel metering), the `aether-fs` cap crate for
# the `aether.fs` surface the host fetches scripts through, and `tracing`
# for the fail-open trap logs.
host = ["dep:aether-actor", "dep:wasmi", "dep:aether-fs", "dep:tracing"]

[dependencies]
aether-data = { path = "../aether-data", default-features = false, features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
# Home of the `#[behavior]` authoring macros, re-exported from this crate's
# runtime face so guests depend on one crate.
aether-behavior-derive = { path = "../aether-behavior-derive", optional = true }

# `host`-only optional deps. `dep:`-gated so the default face's dependency
# tree names none of them (the crate-boundary tripwire: `cargo tree -p
# aether-behavior` shows neither `wasmi` nor `aether-actor`; `-F host`
# shows both).
aether-actor = { path = "../aether-actor", optional = true }
# The `aether.fs` cap (iamacoffeepot/aether#3706) carries the
# `aether.fs.{read,read_result}` kinds + `FsCapability` the host fetches an
# `FsRef` script through. Marker face only (`default-features = false`) — no
# substrate runtime.
aether-fs = { path = "../aether-fs", default-features = false, optional = true }
wasmi = { version = "1.1", default-features = false, optional = true }
tracing = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
# Hand-built minimal wasm for the host-side unit tests (trap / passthrough
# / manifest fixtures). Behavior-script fixtures compiled from Rust are
# #2688's; these are tiny WAT modules parsed inline, no build wiring.
wat = "1"
# The behavior-host end-to-end gate (issue 2688) boots the in-process harness
# harness with the component host composed and drives the panel/host/slider
# cluster through `execute`.
aether-harness-substrate = { path = "../aether-harness-substrate" }
# The gate builds the panel/slider/behavior-host configs from the widget
# vocabulary and loads the `behavior`-feature widget wasm by stem
# (`aether_kit_widget_behavior`, built by `cargo xtask dist`). The widget set
# and its `behavior` feature were extracted from `aether-kit` to
# `aether-kit-widget` (iamacoffeepot/aether#3950).
aether-kit-widget = { path = "../aether-kit-widget" }
# The gate addresses the loaded panel + host by their `/`-rendered lineage
# built from `WasmTrampoline::NAMESPACE` (ADR-0099 §4).
aether-component = { path = "../aether-component" }
aether-actor = { path = "../aether-actor" }
aether-kinds = { path = "../aether-kinds" }
# The script wasms the gate loads by example stem (`intercept_slider`,
# `intercept_slider_v2`, `trap_script`, issue #3766): declared so the wasm
# coupling is cargo-visible even though nothing links the host rlib.
aether-test-fixtures-behavior = { path = "../aether-test-fixtures-behavior" }

# The script-wasm coupling above is load-by-stem only — no source import —
# so the source-scanning unused-deps gate cannot see it.
[package.metadata.cargo-machete]
ignored = ["aether-test-fixtures-behavior"]

[lints]
workspace = true
