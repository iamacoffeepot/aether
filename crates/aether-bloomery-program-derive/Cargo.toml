[package]
name = "aether-bloomery-program-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Proc macros for bloomery program authoring."

# Proc-macro home for `#[program]`. Kept separate from
# `aether-bloomery-program` because a proc-macro crate must opt into
# `proc-macro = true` and can export nothing else. The runtime crate
# re-exports it so a consumer depends on one crate.
[lib]
proc-macro = true

[dependencies]
aether-bloomery-kinds = { path = "../aether-bloomery-kinds" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
aether-bloomery-program = { path = "../aether-bloomery-program" }
aether-data = { path = "../aether-data", features = ["derive"] }
aether-http = { path = "../aether-http", default-features = false }
trybuild = "1"

[lints]
workspace = true
