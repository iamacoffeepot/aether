[package]
name = "aether-inventory"
version.workspace = true
edition.workspace = true
license.workspace = true

# `aether.inventory` reverse-lookup / live-registry cap (ADR-0088 §6,
# widened by ADR-0091 §5, ADR-0109 §5), extracted from `aether-capabilities`
# (iamacoffeepot/aether#3725) as a zero-dependency leaf per-cap crate of the
# arc that dissolves the capabilities monolith. Owns the `aether.inventory`
# dispatch cap: the `InventoryCapability` identity + its `aether_substrate`-
# typed runtime that services `Manifest` / `Resolve` / `ListKinds` /
# `ListHandlers` (the per-build name/template manifest, dynamic-instance
# reverse lookup, the live kind-schema registry view, and the native handler
# manifest). The request/reply kinds themselves (`Manifest`, `ManifestResult`,
# `Resolve`, `ResolveResult`, `ListKinds`, `ListKindsResult`, `ListHandlers`,
# `HandlersResult`, and the `*Wire` projections) live in `aether-kinds` — the
# ADR-0121 harness must-stay rule, since `aether-mcp` consumes them and is
# barred from an `aether-capabilities` dependency — so this crate only
# references them.
#
# It is a pure leaf — no other capability depends on it — so
# `aether-capabilities` keeps no `aether-inventory` dependency (no facade),
# matching the `aether-clipboard` zero-inbound pattern.
#
# NAME COLLISION: the CRATE is `aether-inventory`; the `inventory =
# { workspace = true }` dependency below is the unrelated crates.io `inventory`
# crate (link-time descriptor registration), reached via `inventory::submit!`
# in the `Kind` / `#[actor]` derives — not this cap.
#
# The ADR-0122 identity/runtime split rides the `runtime` feature: the
# wasm-safe identity + `HandlesKind` markers (and the always-on `HandlerEntry`
# reply-kind references) compile always-on; the `aether_substrate`-typed
# runtime half (the state struct holding the shared `Arc<Registry>`, the
# `#[runtime] impl`, and the wire-projection helpers) is gated so a marker-only
# wasm guest can address `ctx.actor::<InventoryCapability>()` without dragging
# the substrate through.

[features]
default = ["runtime"]
runtime = ["dep:aether-substrate"]

[dependencies]
aether-actor = { path = "../aether-actor" }
aether-data = { path = "../aether-data" }
aether-kinds = { path = "../aether-kinds" }
# Native-only runtime half — gated so wasm/marker builds skip the substrate
# runtime (the `Arc<Registry>` state + `thread_name` reverse-lookup arm).
aether-substrate = { path = "../aether-substrate", optional = true }

# The `#[actor]` macro emits a `cfg(not(target_family = "wasm"))`-gated
# `inventory::submit!` HandlerEntry per handler, so native builds need the
# crates.io `inventory` crate reachable; wasm guests don't (the gate skips
# emission). This is NOT the `aether.inventory` cap — it is the descriptor-
# registration dependency used workspace-wide.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
inventory = { workspace = true }

[dev-dependencies]
# The runtime handler tests boot the `aether_substrate`
# `NativeBinding::new_for_test` / `HubOutbound` loopback fixtures, enabled by
# the substrate `test-support` feature.
aether-substrate = { path = "../aether-substrate", features = ["test-support"] }
# The manifest test touches `aether_fs::FsCapability` (identity only) to force
# its link-time `NameEntry` into the test binary; the reverse-lookup test
# derives probe `Kind`s via `aether-data`'s derive.
aether-fs = { path = "../aether-fs", default-features = false }
aether-data = { path = "../aether-data", features = ["derive"] }
# The `ReplyProbeCap` test fixture derives `serde` on its probe kinds.
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }

[lints]
workspace = true
