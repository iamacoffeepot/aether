[workspace]

[package]
name = "symdiff"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "symdiff"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }

[profile.dev]
# Spike eval runs the bin once; keep rebuilds cheap.
incremental = true
