# Nested workspace: isolates the spike from the root aether workspace (a
# nested `[workspace]` is never absorbed by the outer one). `main` never
# carries a `spikes/` tree — this lives only on `spike/registry-view-contention`.
[workspace]

[package]
name = "registry-view-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
arc-swap = "1"
im = "15"
rustc-hash = "2"
