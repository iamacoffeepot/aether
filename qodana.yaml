version: "1.0"

# Rust linter — currently EAP (Early Access).
linter: jetbrains/qodana-rust:2026.1-eap

# Recommended profile = full inspection set. Start narrow (starter) if
# the recommended profile is too noisy on the EAP linter; flip back via
# follow-up once we've calibrated.
profile:
  name: qodana.recommended

# Quality gate: any in-scope finding fails the scan. Single source of truth —
# the CI Qodana job passes no --fail-threshold CLI override that would shadow
# this value.
failThreshold: 0

# Paths Qodana shouldn't analyse.
exclude:
  # Crate-version-upgrade nags are off project-wide: bumping a dependency
  # on a linter's say-so is a supply-chain risk, so version bumps stay a
  # deliberate human decision rather than a quality-gate finding.
  - name: NewCrateVersionAvailable
  # TCP is maintained and validated on its own assumptions; its current
  # qualification inspection is intentionally outside this sweep.
  - name: RsUnnecessaryQualifications
    paths:
      - crates/aether-capabilities/src/tcp/listener/runtime.rs
  # Verified false positive scoped to the struct-hosted #[actor] form
  # (ADR-0123). The macro harvests a cap's identity by reading its sibling
  # runtime.rs via proc_macro::Span::local_file(). Qodana's inspection
  # container builds under path remapping, so local_file() returns None and
  # the ADR-0123-recorded hard-error fallback fires, producing an
  # RsCompileErrorMacro finding on every #[actor] invocation in this crate.
  # Real cargo paths (clippy / nextest / doc / CI) compile every cap and the
  # dedicated split-cap fixture cleanly — the error is Qodana-container-only.
  # Scoped to the production capability crate and that one proof fixture so
  # genuine macro compile errors remain active everywhere else, including
  # aether-actor-derive itself.
  - name: RsCompileErrorMacro
    paths:
      - crates/aether-capabilities
      - crates/aether-test-fixtures/aether-test-fixtures-split-cap
  - name: All
    paths:
      - target
      - .claude
      - .cargo
      - archive
      - spikes
      # trybuild compile-fixtures (e.g. the #[transform] macro's
      # accept/reject cases) are standalone .rs files compiled
      # individually by trybuild — they are intentionally not `mod`-
      # attached to any cargo target, so Qodana's "Detached file"
      # inspection fires on every one. The detachment is the trybuild
      # contract, not a defect; exclude the fixture trees.
      - crates/aether-actor-derive/tests/ui
      - crates/aether-behavior-derive/tests/ui
      - crates/aether-data-derive/tests/ui
      - crates/aether-derive/tests/ui

# Native deps + toolchain bump.
#
# - libasound2-dev: cpal Linux backend (mirrors the clippy job in ci.yml).
# - rustup install/default 1.95.0: the qodana-rust:2026.1-eap image
#   ships rustc 1.94.0. Our workspace builds with 1.95.0 (stable since
#   2026-04-14); the gap surfaced as "Failure"-severity false positives
#   in earlier runs.
# - rustup component add rust-src rust-analyzer: an earlier bump used
#   `--profile minimal` and regressed: +106 Critical "Derived trait not
#   implemented" + 2 Critical "Unresolved path" Sanity-Check findings.
#   Root cause: Qodana's Rust analyzer needs the stdlib source
#   (rust-src) to resolve std types in derive expansion, and the
#   bundled rust-analyzer to walk the project model. `--profile
#   default` plus the explicit rust-src + rust-analyzer components
#   restores both.
#
# Both run as root (workflow passes -u root to qodana scan); see the
# rationale on `args:` in .github/workflows/qodana.yml. Bootstrap
# adds ~60-90s per run.
bootstrap: apt-get update && apt-get install -y libasound2-dev && rustup install 1.95.0 --profile default --no-self-update && rustup default 1.95.0 && rustup component add rust-src rust-analyzer
