# Approval policy — the tiered guard the Plan->Ready gate (/approve) consults to
# decide whether an issue may auto-advance, needs an LLM judge, or stops at the
# owner's desk. It maps path globs to an approval tier over an issue's declared
# surface (the `## Declared surface` glob block /scope emits at Plan).
#
# Resolution is most-restrictive-match-wins (human > judge > auto): a path's
# tier is the most restrictive rule that matches it, and a path matched by no
# rule takes `default` below. An issue's tier is the most restrictive tier over
# every path in its declared surface; order in the `rules` list does not matter.
#
# THE DEFAULT IS `judge` — not `auto`, and not `human`. Most work is fine to
# advance on its own: a change the owner scoped and expects to come back correct
# should not sit waiting on him. A `human` default encodes "trust nothing", which
# is false and makes him the bottleneck on every doc tweak. An `auto` default
# encodes "trust everything", which silently auto-approves a brand-new, unpoliced
# top-level surface the moment somebody creates one. `judge` is the honest
# middle: an unknown surface gets a second reader rather than a rubber stamp, and
# it upgrades gracefully — today `judge` still means the owner confirms (the
# judge runs in shadow mode, ADR-0146), and the day the judge earns its authority
# every `judge` surface becomes autonomous with no edit to this file.
#
# Globs use gitignore-style ** semantics (gitwildmatch): ** spans path segments,
# * stays within one segment, ? is one non-slash character, and a leading /
# anchors the repository root — the syntax .gitignore already trains readers to
# expect. Every consumer evaluates these same globs: the no-model reconciler,
# the Claude approval skill, and Codex's deterministic approval-tier resolver.
#
# Relaxing a tier is a one-line, owner-signed diff to this file, so the file's
# git history is the delegation ladder's audit trail. `.github/approval-policy.yml`
# is itself a `human`-tier glob below, so a relaxation can never auto-approve
# its own relaxation.
#
# The ADR hard gate lives ABOVE this file, in /approve's skill text, and is
# maturity-aware (ADR-0146 §6, amended #3306): an issue that carries an
# `ADR flag:` or writes/edits an ADR is ADR-bearing, and a NEW ADR or an
# amendment to an ESTABLISHED (non-Proposed) one routes to `human` before any
# policy lookup. Only a change whose every touched ADR is still `Status: Proposed`
# (an in-progress arc the owner already approved once) defers to this file — and
# the `docs/adr/**` entry below is `judge` precisely so that fall-through resolves
# to a shadow reader, not the owner. The new/established → `human` guarantee lives
# in the gate, not here (a glob matches paths, not maturity). Merely *citing* an
# ADR is not the test — every well-scoped issue cites several, and treating that
# as load-bearing routes the whole board to the owner and makes this file dead code.
#
# KNOWN GAP: a glob matches paths, not novelty, so "adding a new core system"
# cannot be fully expressed here. A new CRATE is caught — it must add a
# `crates/*/Cargo.toml`, which is `human` below. A new capability now IS a new
# crate (every cap owns one), so it is caught by that same rule; a new MODULE
# inside an existing cap crate is not, and lands in `judge`.

default: judge

rules:
  # Core APIs. Change one of these and every downstream consumer moves with it,
  # so the owner reads them before they advance — always.
  - glob: "crates/aether-data/**"
    tier: human
  - glob: "crates/aether-data-derive/**"
    tier: human
  - glob: "crates/aether-codec/**"
    tier: human
  - glob: "crates/aether-kinds/**"
    tier: human
  - glob: "crates/aether-actor/**"
    tier: human
  - glob: "crates/aether-actor-derive/**"
    tier: human
  - glob: "crates/aether-substrate/**"
    tier: human

  # New systems, and the supply chain. A new crate MUST add one of these, so this
  # is how "adding a new core system" is caught; a dependency change lands here
  # too, which is the same conversation.
  - glob: "/Cargo.toml"
    tier: human
  - glob: "crates/*/Cargo.toml"
    tier: human

  # ADRs. The routing decision lives in the ADR hard gate ABOVE this file
  # (maturity-aware, ADR-0146 §6, amended #3306): a new or established ADR is
  # already routed to the owner by the gate before this lookup runs, so this
  # entry is only ever consulted on the gate's in-progress fall-through — a
  # change to a still-Proposed ADR mid-arc, which the owner has said he does not
  # want to re-approve. `judge` is that fall-through tier: no owner force, a
  # shadow second-reader. A Proposed-ADR change that also touches a `human`-tier
  # surface still resolves `human` through that surface (most-restrictive-wins).
  - glob: "docs/adr/**"
    tier: judge

  # Constitutional, and every supported agent harness's own machinery.
  # Self-modification of the thing that decides what may self-modify is the
  # owner's alone.
  - glob: "/AGENTS.md"
    tier: human
  - glob: "/CLAUDE.md"
    tier: human
  - glob: ".agents/**"
    tier: human
  - glob: ".claude/**"
    tier: human
  - glob: ".codex/**"
    tier: human
  - glob: "/.mcp.json"
    tier: human
  - glob: ".github/workflows/**"
    tier: human
  - glob: ".github/approval-policy.yml"
    tier: human
  - glob: "scripts/surface-match.py"
    tier: human
  # The matcher's tests gate CI, so weakening them is the same conversation
  # as weakening the matcher.
  - glob: "scripts/test-surface-match.py"
    tier: human

  # Submitted-and-expected-to-come-back-right. These advance on their own.
  - glob: "docs/guide/**"
    tier: auto
  - glob: "crates/aether-kit/**"
    tier: auto
  - glob: "crates/aether-math/**"
    tier: auto
  - glob: "crates/aether-mcp/**"
    tier: auto
  - glob: "crates/aether-mesh/**"
    tier: auto
  - glob: "crates/aether-test-fixtures/**"
    tier: auto
  - glob: "scripts/**"
    tier: auto
  - glob: "xtask/**"
    tier: auto
  - glob: "fuzz/**"
    tier: auto

  # The engine's substantive middle. These take the `judge` default anyway; they
  # are spelled out because this is where a new capability or a chassis change
  # lands, and a reader should not have to infer the tier of the busiest tree in
  # the repo.
  - glob: "crates/aether-chassis/**"
    tier: judge
  - glob: "crates/aether-chassis-desktop/**"
    tier: judge
  - glob: "crates/aether-chassis-headless/**"
    tier: judge
  - glob: "crates/aether-chassis-hub/**"
    tier: judge
  - glob: "crates/aether-chassis-harness/**"
    tier: judge
  - glob: "crates/aether-chassis-bundle/**"
    tier: judge
  - glob: "crates/aether-behavior/**"
    tier: judge
