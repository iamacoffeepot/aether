name: "Aether CodeQL config"

# Test surfaces are excluded so alerts land only on production code. This
# paths-ignore filter is the whole reason CodeQL runs as advanced setup
# rather than the GitHub default setup (which has no path filtering and so
# flagged test code) — see issue #3610.
paths-ignore:
  - 'crates/*/tests/**'
  - '**/tests.rs'
  - '**/fixtures/**'

# security-and-quality is the narrower suite — a quieter first baseline
# than security-extended while the alert baseline is still being seen.
queries:
  - uses: security-and-quality
