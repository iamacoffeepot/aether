name: PR title

# Enforces Conventional Commit PR titles (main squash-merges with the PR
# title as the commit subject, so title quality is commit quality). Its own
# workflow, not a ci.yml job: the `edited` trigger re-lints a fixed title
# without re-running the Rust suite. `Lint PR title` is a required check in
# branch protection alongside `CI pass`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            perf
            refactor
            flake
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
