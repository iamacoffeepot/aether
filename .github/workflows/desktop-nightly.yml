name: Desktop nightly

# Desktop chassis tests run the full OS matrix because winit event loops,
# wgpu driver init, and platform-specific frame capture are the only places
# per-OS coverage catches real bugs; Linux is covered by ci.yml's workspace
# `test` job. Relocated here from ci.yml's `desktop` job (issue 3358): that
# job was gated on `startsWith(github.ref, 'refs/tags/')`, but nothing in
# the repo triggers on or pushes tags, so the gate was never true and the
# job never ran. A schedule reaches it instead, off the merge critical path
# — a per-OS regression surfaces the next morning rather than blocking a PR.
# `workflow_dispatch` runs it on demand without waiting for the nightly tick.

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Test desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    # A cold run compiles the four chassis packages plus the `cargo xtask
    # dist` artifact tree below, so the cap sits well above the observed
    # wall-clock rather than near it — the point is to stop a runner stall
    # eating the default 6h quota, not to police build time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `aether-chassis-hub`'s FleetHarness suites fork a real chassis
      # binary resolved through `dist/manifest.json`, and the harness
      # panics with a `cargo xtask dist` hint when that manifest is
      # absent rather than skipping (issue 3843). ci.yml's `test` job
      # provisions the same tree the same way ahead of its test step;
      # this lane never did, so the hub package failed every night on an
      # environment gap rather than on a real per-OS regression. The
      # `--describe` fork the store test uploads needs the chassis bins,
      # which `AETHER_HARNESS_FLEET_HEADLESS_BIN` cannot stand in for —
      # that override only reaches `headless_bin_path`, while the test
      # also resolves the desktop bin through `chassis_bin_path`.
      - name: Pre-build the chassis bins + dist manifest
        run: cargo xtask dist
      # --no-fail-fast: `aether-chassis-hub` sorts last of the four
      # packages and owned the only failing target, so one
      # environment-dependent failure masked every target ordered after
      # it. A nightly wants the complete per-OS signal, not the
      # first-failure one.
      - run: cargo test -p aether-chassis-desktop -p aether-chassis-headless -p aether-chassis-hub -p aether-chassis-harness --all-targets --no-fail-fast

      # File one triage issue per OS and comment subsequent failures on it
      # rather than filing duplicates — mirrors fuzz-nightly.yml's idiom.
      - name: File or update failure issue
        if: failure()
        # The step body is POSIX shell, but this job's matrix includes
        # `windows-latest`, where the default shell is PowerShell — it
        # parsed `if [ -n "$existing" ]` as a malformed `if` statement and
        # died, so a Windows nightly failure never reached an issue and the
        # lane looked macOS-only. Pin the shell to bash on every leg.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          title="ci: desktop nightly failing (${OS})"

          {
            echo "The desktop nightly matrix failed on \`${OS}\`."
            echo
            echo "- Run: ${RUN_URL}"
          } > issue_body.md

          existing=$(gh issue list --state open --search "${title} in:title" \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            echo "Commenting on existing issue #${existing}."
            gh issue comment "$existing" --body-file issue_body.md
          else
            echo "Filing new failure issue."
            # --label alert: marks a machine-filed triage ticket, which
            # issue-labels.yml exempts from the title lint.
            gh issue create --title "$title" --body-file issue_body.md --label alert
          fi
