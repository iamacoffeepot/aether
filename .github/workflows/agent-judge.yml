name: Agent judge

# The shadow-mode approver judge: when an issue reaches phase:plan, a fresh
# headless Claude reads its scope artifacts with an adversarial "refute
# readiness" stance and posts a structured verdict comment. ADR-0146 §6.
#
# ZERO AUTHORITY, deliberately. The judge writes one comment and nothing else —
# no phase:* label, no merge, no edit. The Plan->Ready flip stays the owner's
# (/approve). What accumulates is the judge-vs-owner record: the evidence a
# future step consumes before any tier of .github/approval-policy.yml is
# relaxed from `human` toward `judge` or `auto`. Bounded auto-approve authority
# is explicitly OUT of scope here — shadow mode is the whole of v1, deployed
# classifier-style (shadow first, authority only once the record earns it).
#
# The rubric is human-owned skill text at .claude/skills/judge/SKILL.md, not
# prompt text buried in this file: the judge applies taste but never edits what
# the taste is. .claude/** is a `human` tier in the policy file for exactly that
# reason.
#
# TRIGGERS (three paths, one single-issue body):
#   - issues: [labeled], gated to the moment phase:plan is applied. The primary
#     path — the judge fires when the plan lands.
#   - schedule on offset minutes (~every 20) — the MISSED-EVENT BACKSTOP. GitHub
#     drops `issues` events, so the label trigger needs the same backstop the
#     tick gives itself (agent-tick.yml). The `scan` job below enumerates open
#     phase:plan issues that lack a FRESH verdict (one posted after the most
#     recent phase:plan labeling) and workflow_dispatches this same workflow
#     once per issue, so the judging body stays single-issue on every path.
#     workflow_dispatch is the documented exception that a GITHUB_TOKEN-created
#     event still triggers a workflow, so the fan-out needs no App token.
#   - workflow_dispatch with a `ref` (issue number) — a manual kick, and the
#     deliberate re-judge: it bypasses the fresh-verdict check.
#
# Self-contained by design: the arc's dependency map lists #3133 -> #3132 only,
# so the judge must not hard-depend on the tick (#3131) existing. Once the tick
# is live its board scan is a natural place to ALSO dispatch a missed judge pass
# — a redundant backstop, never a prerequisite.
#
# INDEPENDENCE. The judge never judges a plan it authored. The judge box is
# cold, OR resumed only from the judge function-bucket of the warm session pool
# (#3314): a judge selects candidates from idx/judge/ alone, so it can only ever
# resume another JUDGE session, never a scoper's — scope and judge never share a
# session. The NEW-JOB preamble the pool prepends on a warm resume discards prior
# task state, so a re-judge that happens to resume a prior judge session is not
# anchored on that verdict. Independence is thus preserved by function-bucketing
# plus the preamble, and the rubric skill asserts the invariant in text as well.
# (Superseding this file's former "claude -p, never --resume" absolute — pooling
# makes the resume conditional, and function-bucketing keeps it independent.)
#
# SECURITY. Same least-privilege split as review.yml / agent-work.yml: the job
# that executes code (headless Claude under --dangerously-skip-permissions) is
# contents: read and holds no write scope; a separate `post` job, which never
# runs model output as code, holds issues: write to upsert the comment. The
# verdict is posted as data (-F body=@file), never evaluated. There is no
# untrusted PR branch here — the judge reads a phase:plan issue's body and
# origin/main files — but the split is kept for consistency with the arc.
#
# The `labeled` path carries no owner gate on the sender: applying a label
# already requires repo write access, and the primary applier IS the fleet (an
# agent-work scope run stamps phase:plan through the App), so an owner-only gate
# would disable the trigger it exists to serve. What the path can reach is
# bounded accordingly — origin/main code only, a read-only token, one comment.
#
# The comment is posted with the aether-agent App installation token, not
# GITHUB_TOKEN, so the identity is visibly the bot's and the comment event can
# wake downstream workflows.
#
# SECRETS (all SHARED with the rest of the arc — none new to this workflow):
#   - AGENT_CLAUDE_CODE_OAUTH_TOKEN — the agent subscription, the same
#     dedicated CI subscription review.yml/dogfood.yml now authenticate with,
#     so the fleet and QA chain share one rate pool; the owner's personal
#     token is retired from CI. ABSENT => the judge steps skip, no verdict
#     artifact is produced, and `post` no-ops. A judge that is not provisioned
#     is silent, never red.
#   - AGENT_APP_ID / AGENT_APP_PRIVATE_KEY — the aether-agent GitHub App.
#     ABSENT => `post` prints the remedy and no-ops rather than failing the run.

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Issue number to judge (forces a re-judge)
        type: string
        required: true

# The run's name answers "which issue is this judging?" at a glance; the cron
# backstop's fan-out run is named for what it is.
run-name: judge-${{ github.event.issue.number || inputs.ref || 'scan' }}

# One judge pass per issue; a re-label of phase:plan supersedes an in-flight pass
# rather than racing it to the same comment. Scheduled scans share one group (a
# newer scan subsumes an older one — it recomputes the same board).
#
# A label event that is NOT phase:plan gets a group of its own, and that is the
# whole point of this expression. GitHub evaluates `concurrency` BEFORE the job's
# `if`, so a run the gate will skip still joins the group and still cancels what
# is in flight there. Keyed on the bare issue number, every label event on the
# judged issue cancelled the judge — and /scope stamps size:* and model:* the
# instant after phase:plan, so the judge was cancelled two seconds into every
# correctly-scoped issue. It survived only on an issue whose scoper forgot those
# labels. Giving the skipped events a unique group makes them cancel nothing,
# while a genuine phase:plan re-label still supersedes as intended.
concurrency:
  group: agent-judge-${{ (github.event_name == 'issues' && github.event.label.name != 'phase:plan') && github.run_id || github.event.issue.number || inputs.ref || 'scan' }}
  cancel-in-progress: true

# These workflows run no actions/checkout — they are API orchestration, not builds.
# A bare `gh` subcommand (gh run list / gh workflow run / gh issue …) infers its
# target repo from the local git remote and dies with "failed to determine base
# repo" when there isn't one. GH_REPO is the documented way to name the repo
# without a checkout, and gh honours it for every subcommand, so it is set once
# here rather than per step. (`gh api` calls are unaffected — they carry the full
# repos/{owner}/{repo}/… path — which is why this only bit the dispatch paths.)
env:
  GH_REPO: ${{ github.repository }}

jobs:
  # The missed-event backstop. No Claude, no checkout — it enumerates the board
  # and fans out one workflow_dispatch per eligible issue, so every judging run
  # (label-triggered or cron-recovered) executes the identical single-issue body
  # below. Degrades to a clean no-op when nothing is stale.
  scan:
    name: Scan for unjudged plans
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # actions: write backs the workflow_dispatch fan-out; issues: read backs the
    # board enumeration. No write scope on any issue — the scan posts nothing.
    permissions:
      actions: write
      issues: read
      contents: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch a judge pass for every stale phase:plan issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Open, non-PR, phase:plan issues. `has("pull_request")|not` drops PRs,
          # which share the issues endpoint.
          gh api "repos/${REPO}/issues?state=open&labels=phase:plan&per_page=100" --paginate \
            --jq '.[] | select(has("pull_request")|not) | .number' > /tmp/plans.txt

          dispatched=0
          while IFS= read -r num; do
            [ -n "$num" ] || continue

            # The agent:dont-touch label blinds the whole fleet, the judge
            # included (agent-tick.yml's contract).
            labels="$(gh api "repos/${REPO}/issues/${num}/labels" --jq '.[].name' || true)"
            if grep -qxF 'agent:dont-touch' <<<"$labels"; then
              echo "#${num}: agent:dont-touch — skip"
              continue
            fi

            # Freshness: a verdict counts only when it was posted AFTER the most
            # recent phase:plan labeling. A re-scoped issue re-labelled phase:plan
            # therefore gets re-judged, while a settled one is left alone. The
            # marker is matched WITHOUT its issue-number suffix so a hand-moved
            # comment still de-dupes.
            planned_at="$(gh api "repos/${REPO}/issues/${num}/timeline?per_page=100" --paginate \
              --jq '[.[] | select(.event=="labeled" and .label.name=="phase:plan") | .created_at] | last // empty' || true)"
            verdict_at="$(gh api "repos/${REPO}/issues/${num}/comments?per_page=100" --paginate \
              --jq '[.[] | select(.body | contains("<!-- aether-judge:")) | .updated_at] | last // empty' || true)"
            if [ -n "$planned_at" ] && [ -n "$verdict_at" ]; then
              if [ "$(date -u -d "$verdict_at" +%s)" -ge "$(date -u -d "$planned_at" +%s)" ]; then
                echo "#${num}: verdict is fresh (posted ${verdict_at} >= plan ${planned_at}) — skip"
                continue
              fi
            fi

            gh workflow run agent-judge.yml -f ref="$num"
            echo "#${num}: dispatched a judge pass"
            dispatched=$((dispatched + 1))
          done < /tmp/plans.txt

          echo "backstop scan: dispatched ${dispatched} judge pass(es)." >> "$GITHUB_STEP_SUMMARY"

  judge:
    name: Judge the plan
    # The label path fires only on the moment phase:plan is applied; the dispatch
    # path is always allowed and resolves its own ref. The scheduled path never
    # lands here — it fans out through `scan` above.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'phase:plan')
    # ubuntu-latest, not a RunsOn box: no cargo, no build, no per-file fan-out —
    # one headless session reading an issue and a handful of files.
    runs-on: ubuntu-latest
    # Bring-up leash: a wedged session must not idle toward the 6h default.
    timeout-minutes: 30
    # Read-only on the repo. This job executes repo code (headless Claude under
    # --dangerously-skip-permissions), so it holds no repo write scope — the
    # comment is `post`'s alone. id-token: write exists ONLY for the warm-session-
    # pool steps (#3314): it lets the job assume the OIDC role scoped to
    # agent/pool/* on the session bucket, the same fence review.yml uses. There
    # is no untrusted PR branch here (the judge reads origin/main), and the pool
    # is inert unless the owner sets AGENT_POOL_ENABLE=true. Owner console
    # prerequisites for the pool on this box:
    #   (a) the OIDC role (AGENT_AWS_ROLE_ARN) must reach agent/pool/* on
    #       AGENT_SESSION_BUCKET (s3:GetObject/PutObject/DeleteObject/ListBucket)
    #       from the agent-judge OIDC subject (v1 granted it for review);
    #   (b) the SAME role must ADDITIONALLY grant agent/usage/* PutObject on the
    #       evidence bucket — this job is ubuntu-latest with no instance profile,
    #       so the meter step below cannot drop the OIDC creds and fall back to a
    #       profile the way review/dogfood do; it keeps the OIDC creds for the
    #       ledger write. Until granted, the write degrades cleanly (the judge
    #       stays green) — the grant is a documented prerequisite, not a gate;
    #   (c) the one-day bucket lifecycle rule on agent/pool/v2/* (v1's rule).
    permissions:
      contents: read
      id-token: write
    env:
      # Exposed at job level under the name the Claude Code binary reads, sourced
      # from the AGENT-isolated secret. Job-level presence is what lets the step
      # `if: env... != ''` gating work — an absent secret skips the session
      # cleanly, produces no artifact, and `post` no-ops.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}
      REPO: ${{ github.repository }}
    outputs:
      issue: ${{ steps.resolve.outputs.issue }}
      verdict_produced: ${{ steps.verdict.outputs.produced }}
    steps:
      # Resolve the issue and gate BEFORE any checkout or spend — pure API calls.
      # proceed=false is a clean no-op, never a failure.
      - name: Resolve the issue and apply gates
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          LABELED_ISSUE: ${{ github.event.issue.number }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            issue="$DISPATCH_REF"
          else
            issue="$LABELED_ISSUE"
          fi
          if [ -z "${issue:-}" ]; then
            echo "no issue resolved — nothing to judge."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

          # The judge judges Plan artifacts. An issue that has moved off
          # phase:plan (approved, bounced, re-scoped) has nothing for it to read,
          # so a stale trigger or a mis-aimed dispatch no-ops rather than posting
          # a verdict about a plan that is no longer the issue's state. Capture
          # then match with a here-string so grep's early exit cannot SIGPIPE gh
          # under pipefail.
          labels="$(gh api "repos/${REPO}/issues/${issue}/labels" --jq '.[].name')"
          if ! grep -qxF 'phase:plan' <<<"$labels"; then
            echo "issue #${issue} is not at phase:plan — nothing to judge."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qxF 'agent:dont-touch' <<<"$labels"; then
            echo "issue #${issue} carries agent:dont-touch — the fleet is blind to it, judge included."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # origin/main only. The judge reads the repo's own ADRs, policy file, and
      # targeted code as they are on the trunk — never a PR branch, never
      # untrusted code.
      - uses: actions/checkout@v4
        if: steps.resolve.outputs.proceed == 'true'
        with:
          ref: main

      # The repo's .claude hooks bind interactive sessions into per-session
      # worktrees and police edits outside them — actively harmful in CI, where
      # the SessionStart rebind would move the session out of $GITHUB_WORKSPACE.
      # The runner is ephemeral and single-purpose, so strip the hooks from this
      # checkout COPY; the hooks in the repo itself are untouched.
      - name: Strip interactive-session hooks from the checkout copy
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          jq 'del(.hooks)' .claude/settings.json > /tmp/settings.json
          mv /tmp/settings.json .claude/settings.json

      - name: Note when the OAuth token secret is absent
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "AGENT_CLAUDE_CODE_OAUTH_TOKEN is not set — the judge pass is skipped and no verdict is posted."
          echo "Mint one from the agent subscription with 'claude setup-token' and add it:"
          echo "  gh secret set AGENT_CLAUDE_CODE_OAUTH_TOKEN"

      # Pinned via AGENT_CLAUDE_CODE_VERSION (#3285): a CLI upgrade changes the
      # system-prompt bytes, which cold-misses the fleet-wide prompt cache and
      # invalidates any resumable session. Unset falls back to latest with a
      # warning — a missing var never bricks the fleet.
      - name: Install Claude Code
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          CLAUDE_CODE_VERSION: ${{ vars.AGENT_CLAUDE_CODE_VERSION }}
        run: |
          if [ -n "${CLAUDE_CODE_VERSION:-}" ]; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          else
            echo "::warning::AGENT_CLAUDE_CODE_VERSION is unset — installing latest; an upstream release cold-misses the fleet prompt cache (#3285)"
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      # Pre-trust the basecamp cwd (#3346) and the added checkout dir so
      # settings.json permissions aren't ignored with a warning under
      # skip-permissions.
      - name: Pre-trust the workspace for headless Claude
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: printf '{"projects":{"/home/runner/basecamp":{"hasTrustDialogAccepted":true},"%s":{"hasTrustDialogAccepted":true}}}\n' "$PWD" > "$HOME/.claude.json"

      # Auth in isolation before the real run: a one-line prompt, no tools. If
      # this fails the AGENT OAuth token itself is the problem, not the harness.
      # --max-turns 3 (not 1) because the model occasionally spends a turn before
      # emitting the reply, which a 1-turn cap turns into a spurious auth failure.
      - name: Auth probe (no tools)
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          claude -p "Reply with exactly: AUTH-OK" \
            --model claude-sonnet-5 \
            --max-turns 3 | tee /tmp/auth.log
          grep -q "AUTH-OK" /tmp/auth.log

      # The judge pass. A cold headless context, OR a warm one resumed from the
      # judge function-bucket of the session pool (#3314) — either way it reads
      # the rubric skill, the issue, the cited ADRs, and the policy file, then
      # writes the verdict body to judge-verdict.md. Independence holds on the
      # warm path because a judge only ever resumes another JUDGE session and the
      # NEW-JOB preamble discards prior task state (see the INDEPENDENCE header).
      # The rubric lives in the skill, NOT in this prompt — the prompt only
      # points at it, so a rubric change is a skill diff.
      #
      # The model writes the fenced block + reasoning ONLY. The marker comment's
      # header and the <!-- aether-judge:<n> --> marker are the post job's, so
      # the model can never break comment dedup.
      #
      # No backticks and no $(...) in the prompt: it is written through an
      # unquoted heredoc, where either would be shell-evaluated. ${GITHUB_WORKSPACE}
      # is the one intended interpolation.
      #
      # `|| true` so a session failure never fails the job — a missing verdict
      # file is the signal that no comment is posted.
      # The -p text is BYTE-CONSTANT across runs (#3285): the judged issue rides
      # /tmp/agent-task.json, so every judge box sends an identical first user
      # message and reads the shared prompt-cache prefix instead of re-writing
      # it. ${GITHUB_WORKSPACE} stays interpolated — byte-constant per runner
      # substrate. Keep the rest constant.
      - name: Stage the task parameters
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          ISSUE: ${{ steps.resolve.outputs.issue }}
        run: |
          jq -nc --arg issue "$ISSUE" '{issue: $issue}' > /tmp/agent-task.json

      # Warm session pool (#3314; design of record: the #3264 design comment,
      # v1.5; function-primary key #3319). Resume a deposited JUDGE session whose
      # beliefs are provably true at this checkout instead of re-deriving the
      # rubric skill + policy file + cited ADRs from scratch. The pool is an
      # optimization layer: every pool step is fenced so a failure degrades to
      # today's cold run — it must never block or redden a judge pass. Inert
      # unless the owner sets AGENT_POOL_ENABLE=true (console prerequisites in
      # this job's permissions comment above).
      - name: Configure AWS credentials for the session pool
        id: pool-creds
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.AGENT_POOL_ENABLE == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AGENT_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_AWS_REGION }}

      # Checkout half: GENERIC-WITHIN-FUNCTION selection. The judge box has no
      # cheap request-side subsystem key, so instead of review.yml's exact-slug
      # prefix it LISTs the whole idx/judge/<cli>/<model>/ prefix across every
      # slug and takes the newest candidate the belief-truth `eligible` gate
      # accepts, retiring a stale entry on the spot (delete-not-keep). Lease via
      # S3 conditional write with self-healing reclaim of an expired lease.
      # `set -e` is deliberately absent: every miss falls through to a cold run.
      - name: Pool checkout
        id: pool-checkout
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.AGENT_POOL_ENABLE == 'true' && steps.pool-creds.outcome == 'success'
        env:
          BUCKET: ${{ vars.AGENT_SESSION_BUCKET }}
          AGENT_POOL_CUTOFF_MINS: ${{ vars.AGENT_POOL_CUTOFF_MINS }}
          AGENT_POOL_CONTEXT_CAP_TOKENS: ${{ vars.AGENT_POOL_CONTEXT_CAP_TOKENS }}
        run: |
          set -uo pipefail
          # The pool logic runs from origin/main (this job checks out main, so
          # HEAD already is main; staging from origin/main keeps parity with
          # review.yml and guards the #3293 branch-cut-before-script case).
          git show origin/main:scripts/agent-pool.mjs > /tmp/agent-pool.mjs || true
          sid=""
          cli_version="$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          model="claude-sonnet-5"
          if [ -n "$cli_version" ] && [ -n "${BUCKET:-}" ]; then
            git ls-tree -r HEAD > /tmp/pool-ls-tree.txt
            # No slug segment — LIST every slug bucket under this function and let
            # the eligible gate pick the winner (generic-within-function).
            idx="agent/pool/v2/idx/judge/${cli_version}/${model}/"
            munged="$(echo "/home/runner/basecamp" | sed -E 's/[^a-zA-Z0-9]/-/g')"
            keys="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$idx" \
              --query 'sort_by(Contents||`[]`,&LastModified)[].Key' --output text 2>/dev/null \
              | tr '\t' '\n' | grep -v '^None$' | tail -5 | tac)" || keys=""
            for key in $keys; do
              aws s3 cp "s3://${BUCKET}/${key}" /tmp/pool-candidate.json >/dev/null 2>&1 || continue
              cand_sid="$(jq -r .session_id /tmp/pool-candidate.json)" || continue
              elig="$(node /tmp/agent-pool.mjs eligible --manifest /tmp/pool-candidate.json --ls-tree /tmp/pool-ls-tree.txt)" || continue
              if [ "$(echo "$elig" | jq -r .ok)" != "true" ]; then
                echo "pool: retired ${cand_sid} ($(echo "$elig" | jq -r .reason))" | tee -a "$GITHUB_STEP_SUMMARY"
                aws s3 rm "s3://${BUCKET}/${key}" >/dev/null 2>&1 || true
                aws s3 rm --recursive "s3://${BUCKET}/agent/pool/v2/sessions/${cand_sid}/" >/dev/null 2>&1 || true
                continue
              fi
              lease="agent/pool/v2/leases/${cand_sid}"
              echo "$(( $(date +%s) + 2100 ))" > /tmp/pool-lease.txt   # job leash 30 min + 5
              if ! aws s3api put-object --bucket "$BUCKET" --key "$lease" --body /tmp/pool-lease.txt --if-none-match '*' >/dev/null 2>&1; then
                held="$(aws s3 cp "s3://${BUCKET}/${lease}" - 2>/dev/null || echo 0)"
                if [ "${held:-0}" -lt "$(date +%s)" ] 2>/dev/null; then
                  # expired lease from a dead box — reclaim; a raced re-create still 412s for the loser
                  aws s3 rm "s3://${BUCKET}/${lease}" >/dev/null 2>&1 || true
                  aws s3api put-object --bucket "$BUCKET" --key "$lease" --body /tmp/pool-lease.txt --if-none-match '*' >/dev/null 2>&1 \
                    || { echo "pool: lease race lost on ${cand_sid}"; continue; }
                else
                  echo "pool: ${cand_sid} is leased"; continue
                fi
              fi
              mkdir -p "$HOME/.claude/projects/${munged}"
              if aws s3 sync "s3://${BUCKET}/agent/pool/v2/sessions/${cand_sid}/" "$HOME/.claude/projects/${munged}/" >/dev/null 2>&1; then
                sid="$cand_sid"
                cp /tmp/pool-candidate.json /tmp/pool-prior-manifest.json
                echo "pool: warm checkout ${sid} (root $(jq -r .subsystem_root /tmp/pool-candidate.json), $(jq -r .context_tokens /tmp/pool-candidate.json) ctx tokens)" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                aws s3 rm "s3://${BUCKET}/${lease}" >/dev/null 2>&1 || true
              fi
              break
            done
          fi
          [ -n "$sid" ] || echo "pool: cold run"
          { echo "cli_version=${cli_version}"; echo "session_id=${sid}"; } >> "$GITHUB_OUTPUT"

      # Claude runs from a constant, bare, git-less basecamp cwd (#3346) so its
      # prompt head carries no volatile cwd-git snapshot — a warm --resume stays
      # cache-hot across main movement. The checkout is reached via --add-dir.
      - name: Prepare the bare basecamp cwd
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: mkdir -p /home/runner/basecamp

      - name: Run the judge pass
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POOL_SESSION_ID: ${{ steps.pool-checkout.outputs.session_id }}
        run: |
          cat > /tmp/judge-task-prompt.md <<PROMPT
          You are running headless in CI on a checkout of origin/main.
          The repo checkout is at ${GITHUB_WORKSPACE}; cd into it and do all repo
          work there — your current directory is a bare scratch dir, not the repo.
          FIRST ACTION: read /tmp/agent-task.json. Its issue field is the issue
          number to judge — an issue of this repo that has just reached phase:plan.
          Read .claude/skills/judge/SKILL.md and follow it exactly — it is the
          human-owned rubric, it is normative, and you never edit it.
          Read the issue with: gh issue view <issue> --json title,body,labels
          (substituting the task file's issue number).
          Then read every ADR its Design notes cite (under docs/adr/), the approval
          policy at .github/approval-policy.yml, and whatever code on this checkout
          a plan step's coherence depends on.
          Take the adversarial stance the skill prescribes: try to REFUTE the
          readiness of these Plan artifacts, and report what you found.
          If you recognize this plan as your own authored work, ABSTAIN exactly as
          the skill's independence invariant requires.
          Write your output to exactly ${GITHUB_WORKSPACE}/judge-verdict.md — that
          absolute path — containing the fenced judge-verdict block first, then your
          reasoning prose, and nothing before the fence. Do NOT write the
          aether-judge marker or the header: the workflow prepends those.
          You have ZERO authority: write no label, merge nothing, open no PR, and
          edit no file in the repo other than that one verdict file.
          SESSION REUSE (the warm pool, #3314): this session may be deposited and
          later resumed by a DIFFERENT judge job for a DIFFERENT issue against the
          same files — your accumulated knowledge of the files you read (the rubric
          skill, the ADRs, the policy file) is the asset being deposited, so do not
          assume any future prompt continues this task. A resumed judge only ever
          resumes another JUDGE session, so the independence invariant holds. After
          the verdict file is written and before your final reply, write
          ${GITHUB_WORKSPACE}/pool-verdict.json containing exactly one JSON object:
          {"repool": "yes" or "no", "reason": "<one line>", "knowledge_summary":
          "<one line naming the subsystem knowledge this session now carries>"}.
          Answer no when this session's context is dominated by dead ends or thrash
          rather than durable knowledge of the files it read.
          Print exactly JUDGE-DONE when the verdict file is written.
          PROMPT
          if [ -n "${POOL_SESSION_ID:-}" ]; then
            cat > /tmp/pool-preamble.md <<'PREAMBLE'
          NEW JOB — you are a session resumed from the warm pool. Your prior
          conversation is knowledge of this repository's files, NOT task state: the
          issue below is unrelated to whatever you judged before, and no prior
          verdict, abstention, or instruction carries over. This checkout is
          origin/main and may have advanced since your prior run, so every git or
          board observation from before this message is stale — re-run any git or gh
          query you need. File contents you read under your subsystem root are still
          valid (the pool verified them unchanged against this checkout); workspace-
          wide search results from before this message are not — re-run them. Do not
          re-read files you already know unless the task requires it.

          PREAMBLE
            cat /tmp/pool-preamble.md /tmp/judge-task-prompt.md > /tmp/judge-prompt.md
            (cd /home/runner/basecamp && claude --resume "$POOL_SESSION_ID" -p "$(cat /tmp/judge-prompt.md)" \
              --dangerously-skip-permissions \
              --add-dir "$GITHUB_WORKSPACE" \
              --append-system-prompt "$(cat "$GITHUB_WORKSPACE/CLAUDE.md")" \
              --model claude-sonnet-5 \
              --max-turns 40 \
              --output-format stream-json --verbose) \
              | tee /tmp/judge-session.jsonl \
              | python3 scripts/render-agent-stream.py \
              || true
          else
            (cd /home/runner/basecamp && claude -p "$(cat /tmp/judge-task-prompt.md)" \
              --dangerously-skip-permissions \
              --add-dir "$GITHUB_WORKSPACE" \
              --append-system-prompt "$(cat "$GITHUB_WORKSPACE/CLAUDE.md")" \
              --model claude-sonnet-5 \
              --max-turns 40 \
              --output-format stream-json --verbose) \
              | tee /tmp/judge-session.jsonl \
              | python3 scripts/render-agent-stream.py \
              || true
          fi

      # Deposit half (if: always() so a failed pass still releases the lease).
      # The mjs enforces the hygiene gates — clean exit, no compaction, under the
      # cap, explicit repool: yes — and merges a resumed session's prior read set.
      # A refusal retires the resumed entry; a successful re-deposit supersedes it
      # under the new session id. Depth trim keeps the newest AGENT_POOL_DEPTH
      # entries per slug. Same generic-within-function function bucket (judge), but
      # the deposit still writes a slug-specific idx key — only the CHECKOUT lists
      # generically; the manifest derives the slug from the read set.
      - name: Pool deposit
        if: always() && steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.AGENT_POOL_ENABLE == 'true' && steps.pool-creds.outcome == 'success'
        env:
          BUCKET: ${{ vars.AGENT_SESSION_BUCKET }}
          CLI_VERSION: ${{ steps.pool-checkout.outputs.cli_version }}
          PRIOR_SID: ${{ steps.pool-checkout.outputs.session_id }}
          AGENT_POOL_DEPTH: ${{ vars.AGENT_POOL_DEPTH }}
          AGENT_POOL_CUTOFF_MINS: ${{ vars.AGENT_POOL_CUTOFF_MINS }}
          AGENT_POOL_CONTEXT_CAP_TOKENS: ${{ vars.AGENT_POOL_CONTEXT_CAP_TOKENS }}
        run: |
          set -uo pipefail
          git show origin/main:scripts/agent-pool.mjs > /tmp/agent-pool.mjs || true
          model="claude-sonnet-5"
          release_lease() {
            [ -n "${PRIOR_SID:-}" ] && aws s3 rm "s3://${BUCKET}/agent/pool/v2/leases/${PRIOR_SID}" >/dev/null 2>&1 || true
          }
          retire_prior() {
            if [ -n "${PRIOR_SID:-}" ] && [ -f /tmp/pool-prior-manifest.json ]; then
              old_slug="$(jq -r .slug /tmp/pool-prior-manifest.json 2>/dev/null)" || old_slug=""
              aws s3 rm "s3://${BUCKET}/agent/pool/v2/idx/judge/${CLI_VERSION:-unknown}/${model}/${old_slug}/${PRIOR_SID}.json" >/dev/null 2>&1 || true
              aws s3 rm --recursive "s3://${BUCKET}/agent/pool/v2/sessions/${PRIOR_SID}/" >/dev/null 2>&1 || true
            fi
          }
          [ -n "${BUCKET:-}" ] || exit 0
          [ -f /tmp/judge-session.jsonl ] || { release_lease; exit 0; }
          git ls-tree -r HEAD > /tmp/pool-ls-tree.txt
          prior_flag=""
          [ -f /tmp/pool-prior-manifest.json ] && prior_flag="--prior /tmp/pool-prior-manifest.json"
          out="$(node /tmp/agent-pool.mjs manifest \
            --transcript /tmp/judge-session.jsonl \
            --ls-tree /tmp/pool-ls-tree.txt \
            --verdict "$GITHUB_WORKSPACE/pool-verdict.json" \
            --cli-version "${CLI_VERSION:-unknown}" $prior_flag)" || out='{"ok":false,"reason":"manifest-error"}'
          # Record this box's re-pool disposition for the spend ledger's pool block
          # (#3166). A /tmp write, so it can never perturb the deposit control flow.
          echo "$out" | jq -r 'if .ok then "accepted" else .reason end' > /tmp/pool-deposit-reason.txt 2>/dev/null || true
          if [ "$(echo "$out" | jq -r .ok)" = "true" ]; then
            echo "$out" | jq .manifest > /tmp/pool-manifest-new.json
            new_sid="$(jq -r .session_id /tmp/pool-manifest-new.json)"
            slug="$(jq -r .slug /tmp/pool-manifest-new.json)"
            munged="$(echo "/home/runner/basecamp" | sed -E 's/[^a-zA-Z0-9]/-/g')"
            idx="agent/pool/v2/idx/judge/${CLI_VERSION:-unknown}/${model}/${slug}"
            if aws s3 sync "$HOME/.claude/projects/${munged}/" "s3://${BUCKET}/agent/pool/v2/sessions/${new_sid}/" >/dev/null 2>/tmp/pool-upload-err.txt \
               && aws s3 cp /tmp/pool-manifest-new.json "s3://${BUCKET}/${idx}/${new_sid}.json" >/dev/null 2>>/tmp/pool-upload-err.txt; then
              echo "pool: deposited ${new_sid} under ${idx} ($(jq -r .context_tokens /tmp/pool-manifest-new.json) ctx tokens)" | tee -a "$GITHUB_STEP_SUMMARY"
              [ "${PRIOR_SID:-}" != "$new_sid" ] && retire_prior
              depth="${AGENT_POOL_DEPTH:-1}"
              aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "${idx}/" \
                --query 'sort_by(Contents||`[]`,&LastModified)[].Key' --output text 2>/dev/null \
                | tr '\t' '\n' | grep -v '^None$' | head -n -"$depth" | while read -r stale; do
                    [ -n "$stale" ] || continue
                    ssid="$(basename "$stale" .json)"
                    aws s3 rm "s3://${BUCKET}/${stale}" >/dev/null 2>&1 || true
                    aws s3 rm --recursive "s3://${BUCKET}/agent/pool/v2/sessions/${ssid}/" >/dev/null 2>&1 || true
                    echo "pool: depth trim retired ${ssid}" | tee -a "$GITHUB_STEP_SUMMARY"
                  done
            else
              echo "pool: deposit upload failed — entry not published ($(tail -c 300 /tmp/pool-upload-err.txt 2>/dev/null | tr '\n' ' '))" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "pool: deposit refused ($(echo "$out" | jq -r .reason))" | tee -a "$GITHUB_STEP_SUMMARY"
            retire_prior
          fi
          release_lease
          exit 0

      # Meter the judge run into the same spend ledger as agent-work / review
      # (#3166) — this rung closes the gap that judge spend was invisible. The
      # envelope carries a `pool` block (warm-vs-cold, the re-pool verdict + the
      # box's compliance, this box's own re-pool disposition), assembled only when
      # AGENT_POOL_ENABLE is on, so the flag-flip is demonstrated against the
      # ledger rather than asserted.
      #
      # Credential care DIVERGES from review/dogfood: this job is ubuntu-latest
      # with NO instance profile, so it CANNOT drop the pool OIDC creds and fall
      # back to an ambient profile for the agent/usage/* write. It KEEPS the OIDC
      # creds, which requires the judge OIDC role to ALSO grant agent/usage/*
      # PutObject (this job's permissions comment documents it). The write
      # degrades cleanly (|| echo) until that grant lands — the judge stays green.
      # The script is staged from origin/main, never a PR head. Fenced like every
      # pool step: a metering slip never reddens a judge pass.
      - name: Meter the judge into the spend ledger
        if: always() && steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          ISSUE: ${{ steps.resolve.outputs.issue }}
          JOB_STATUS: ${{ job.status }}
          AGENT_POOL_ENABLE: ${{ vars.AGENT_POOL_ENABLE }}
          POOL_SESSION_ID: ${{ steps.pool-checkout.outputs.session_id }}
          POOL_CLI_VERSION: ${{ steps.pool-checkout.outputs.cli_version }}
        run: |
          set -uo pipefail
          [ -f /tmp/judge-session.jsonl ] || { echo "no transcript — nothing to meter"; exit 0; }
          command -v node >/dev/null || { echo "no node — ledger row skipped"; exit 0; }
          command -v aws  >/dev/null || { echo "no aws cli — ledger write skipped"; exit 0; }
          git show origin/main:scripts/agent-usage-record.mjs > /tmp/agent-usage-record.mjs || {
            echo "usage script not on origin/main yet — ledger row skipped"; exit 0; }

          pool_arg=""
          if [ "${AGENT_POOL_ENABLE:-}" = "true" ]; then
            warm=false; [ -n "${POOL_SESSION_ID:-}" ] && warm=true
            verdict="null"; reason=""; compliance="null"
            if [ -f "$GITHUB_WORKSPACE/pool-verdict.json" ]; then
              verdict="$(jq -r '.repool // "unknown"' "$GITHUB_WORKSPACE/pool-verdict.json")"
              reason="$(jq -r '.reason // ""' "$GITHUB_WORKSPACE/pool-verdict.json")"
              compliance="true"
            elif [ "$warm" = true ]; then
              compliance="false"   # warm session was asked to write a verdict and did not
            fi
            retire="$( [ -f /tmp/pool-deposit-reason.txt ] && cat /tmp/pool-deposit-reason.txt || true )"
            jq -nc \
              --argjson warm "$warm" \
              --arg session_id "${POOL_SESSION_ID:-}" \
              --arg cli_version "${POOL_CLI_VERSION:-}" \
              --arg verdict "$verdict" \
              --arg reason "$reason" \
              --argjson compliance "$compliance" \
              --arg retire "$retire" \
              '{
                 warm: $warm,
                 session_id: (if $session_id == "" then null else $session_id end),
                 cli_version: (if $cli_version == "" then null else $cli_version end),
                 repool_verdict: (if $verdict == "null" then null else $verdict end),
                 repool_reason: (if $reason == "" then null else $reason end),
                 repool_compliance: $compliance,
                 retire_reason: (if $retire == "" then null else $retire end)
               }' > /tmp/pool-meter.json && pool_arg="--pool /tmp/pool-meter.json"
          fi

          record="$(node /tmp/agent-usage-record.mjs \
            --transcript /tmp/judge-session.jsonl \
            --task judge --ref "$ISSUE" --run-id "$GITHUB_RUN_ID" \
            --conclusion "$JOB_STATUS" --model claude-sonnet-5 \
            --created-at "$(date -u +%FT%TZ)" $pool_arg)" \
            || { echo "usage derivation failed — ledger row skipped"; exit 0; }
          printf '%s\n' "$record" > /tmp/judge-usage-record.json

          # KEEP the pool OIDC creds (no instance profile here) for the write —
          # unlike review/dogfood, which unset them and ride an instance profile.
          # The creds are only in the env when the pool-creds step ran (pool on);
          # with no instance profile to fall back on, a pool-off run has nothing to
          # authenticate the write, so derive the row for the transcript but skip
          # the write rather than emit a misleading IAM-grant failure.
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "no pool OIDC creds in env (AGENT_POOL_ENABLE off?) — ledger row derived, not written"
            exit 0
          fi
          aws s3 cp /tmp/judge-usage-record.json \
            "s3://aether-evidence/agent/usage/$(date -u +%F)/${GITHUB_RUN_ID}.json" \
            --content-type application/json \
            || echo "ledger write failed (judge OIDC role's agent/usage/* grant pending?) — judge stays green"

      # Whether a WELL-FORMED verdict was produced gates the post job. A file with
      # no greppable `verdict:` line is not a verdict — the fenced block is the
      # ledger substrate, so a session that produced only prose fails loudly rather
      # than posting an unparseable comment. The quiet-skip path exists only for
      # the absent-secret case, which never reaches the else branch.
      - name: Note whether a verdict was produced
        id: verdict
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          set -uo pipefail
          if [ -f judge-verdict.md ] && grep -q '^verdict:' judge-verdict.md; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "the judge ran but produced no well-formed verdict — failing loudly. Session's final events:"
            if [ -f /tmp/judge-session.jsonl ]; then
              tail -n 5 /tmp/judge-session.jsonl | cut -c1-2000
            else
              echo "(no session transcript)"
            fi
            exit 1
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.verdict.outputs.produced == 'true'
        with:
          name: judge-verdict
          path: judge-verdict.md
          if-no-files-found: ignore

      # The full session transcript (stream-json JSONL) — uploaded even on
      # failure, since a dead run's transcript is exactly what diagnoses it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-session-transcript
          path: /tmp/judge-session.jsonl
          if-no-files-found: ignore

  post:
    name: Post the verdict
    needs: judge
    # No-op when the judge produced no verdict (secret absent, gated out, or the
    # session failed).
    if: needs.judge.outputs.verdict_produced == 'true'
    runs-on: ubuntu-latest
    # The only job with a write scope, and it never runs model output as code:
    # the verdict is posted as DATA (-F body=@file), never evaluated. issues:
    # write is the correct scope — the judge posts on an ISSUE, never on a PR
    # (a comment or label on a PR would need pull-requests: write instead).
    permissions:
      issues: write
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ needs.judge.outputs.issue }}
      APP_ID: ${{ secrets.AGENT_APP_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: judge-verdict

      - name: Note when the App secrets are absent
        if: env.APP_ID == ''
        run: |
          echo "AGENT_APP_ID / AGENT_APP_PRIVATE_KEY are not set — the verdict is not posted."
          echo "Register the aether-agent GitHub App, install it on ${REPO}, and store its"
          echo "id + private key as AGENT_APP_ID / AGENT_APP_PRIVATE_KEY (see agent-work.yml's header)."
          echo "The verdict is still available as this run's judge-verdict artifact."

      # The comment rides the App installation token: the identity is visibly the
      # bot's, and an App-created comment can wake downstream workflows where a
      # GITHUB_TOKEN-created one cannot.
      - name: Mint the App installation token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # Compose the comment (marker + shadow-mode header + the model's verdict)
      # and upsert it: PATCH the existing marker comment if there is one, else
      # POST a new one — so a re-judge REFRESHES the verdict and never duplicates
      # it. The marker carries the issue number so a ledger sweep can key on it.
      #
      # The ADR advisory-only stamp is asserted here, mechanically, on top of
      # whatever the model wrote: an ADR-bearing issue is advisory-only in every
      # end state (the ADR hard gate sits above the policy file, permanently), and
      # that flag is what keeps a future promotion step from ever counting an ADR
      # issue toward auto-approve evidence. It is too load-bearing to leave to the
      # model's memory, so the deterministic check wins.
      - name: Upsert the verdict comment
        if: env.APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          marker="<!-- aether-judge:${ISSUE} -->"

          # ADR-bearing: the body cites an ADR (a docs/adr path, an ADR-NNNN
          # reference, or an "ADR flag:" line) or declares docs/adr/** surface.
          gh api "repos/${REPO}/issues/${ISSUE}" --jq '.body // ""' > /tmp/issue-body.md
          if grep -qE 'docs/adr/|ADR-[0-9]{4}|ADR flag:' /tmp/issue-body.md; then
            echo "issue #${ISSUE} is ADR-bearing — asserting advisory_only: true."
            sed -E 's/^advisory_only:[[:space:]]*.*$/advisory_only:        true/' \
              judge-verdict.md > /tmp/verdict.md
            mv /tmp/verdict.md judge-verdict.md
          fi

          {
            echo "$marker"
            echo "**Judge verdict — shadow mode (zero authority; the label flip stays the owner's)**"
            echo
            echo "Adversarial pass: attempted to *refute* the readiness of these Plan artifacts."
            echo
            cat judge-verdict.md
          } > /tmp/comment.md

          # Find an existing verdict comment by its marker. Capture first, then
          # filter — a paginated gh piped into an early-exiting reader can SIGPIPE
          # under pipefail.
          comments="$(gh api "repos/${REPO}/issues/${ISSUE}/comments?per_page=100" --paginate)"
          existing="$(jq -r --arg m "$marker" \
            '[.[] | select(.body | contains($m)) | .id] | last // empty' <<<"$comments")"

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@/tmp/comment.md > /dev/null
            echo "refreshed the verdict comment on #${ISSUE} (comment ${existing})."
          else
            gh api -X POST "repos/${REPO}/issues/${ISSUE}/comments" -F body=@/tmp/comment.md > /dev/null
            echo "posted a verdict comment on #${ISSUE}."
          fi
          grep '^verdict:' judge-verdict.md >> "$GITHUB_STEP_SUMMARY"
