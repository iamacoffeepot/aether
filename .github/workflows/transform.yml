name: Transform
run-name: transform ${{ inputs.command }} ${{ inputs.nonce }}

# ADR-0149 §Execution's thin worker wrapper: `workflow_dispatch`-only, checks
# out the exact digest a resolved work order names, runs the same
# `cargo xtask transform` entrypoint a contributor runs locally, and uploads
# the resulting nonce-tagged evidence bytes. No decision logic lives here —
# the wrapper checks out, runs, uploads, and nothing else. Untrusted lanes
# run zero-secret on ephemeral hosted runners per the ADR, so this workflow
# carries `permissions: { contents: read }` and no secrets.
#
# The uploaded artifact's NAME is the intake's data channel (#3501): the
# pull side decodes `attempt.<verdict>.<failure_mask>.<subject_hex>.<detail_hex>.<nonce>`
# from the name alone (`NameEvidenceClaims`), no artifact-byte fetch. The
# `displayed` input carries the scope-revision digest hex the evidence must
# name (the executor resolves it from the work order's evidence-binding
# input); the verdict token is `pass`/`fail` from the transform's exit, the
# exact four-digit failure mask is the interned `failure_mask` the lane wrote
# (bit assignment from the checkout's pipeline.toml; this wrapper only
# `printf '%04x'`s the integer so the token stays four hex digits), and the
# detail hex is the sha256 of the evidence bytes. A dispatch without
# `displayed` (a manual smoke run) falls back to the legacy
# `evidence-<nonce>` name, which the intake skips as a stray upload.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Typed verify id (fmt/clippy/docs/test/dup/deps/suppress, or the verify.check umbrella)"
        required: true
      subject:
        description: "Exact digest (checkout target) the resolved work order names"
        required: true
      nonce:
        description: "Idempotency nonce stamped into evidence.json"
        required: true
      displayed:
        description: "Scope-revision digest hex the returned evidence names (attempt-artifact binding); empty = legacy evidence-<nonce> name"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  transform:
    name: Transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.subject }}
          fetch-depth: 0
      # The pinned toolchain, not a channel: this lane's verdict is only worth
      # anything if it was produced by the compiler the merge gate runs (ci.yml
      # resolves the same file). `rust-toolchain.toml` declares the components.
      - run: rustup toolchain install
      - name: Install ALSA dev headers (cpal Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - id: transform
        continue-on-error: true
        run: cargo xtask transform ${{ inputs.command }} --out evidence --nonce ${{ inputs.nonce }}
      - name: Compose the attempt artifact name
        id: artifact
        env:
          DISPLAYED: ${{ inputs.displayed }}
          NONCE: ${{ inputs.nonce }}
          OUTCOME: ${{ steps.transform.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then verdict=pass; else verdict=fail; fi
          if [ ! -f evidence/evidence.json ]; then
            echo "::error::transform produced no evidence.json"
            exit 1
          fi
          status=$(jq -er '.status | select(. == "pass" or . == "fail")' evidence/evidence.json)
          if [ "$status" != "$verdict" ]; then
            echo "::error::evidence status does not match transform outcome"
            exit 1
          fi
          mask_value=$(jq -er '
            if .status == "pass" and has("failed_verifiers") then
              error("passing evidence must omit failed_verifiers")
            elif .status == "fail" and (has("failed_verifiers") | not) then
              error("failing evidence must carry failed_verifiers")
            elif (.failed_verifiers // [] | type) != "array" then
              error("failed_verifiers must be an array")
            elif .status == "fail" and ((.failed_verifiers // []) | length) == 0 then
              error("failing evidence must carry a nonempty failure set")
            else
              (.failure_mask // 0) as $mask
              | if ($mask | type) != "number" or ($mask % 1) != 0 or $mask < 0 or $mask > 65535 then
                  error("failure_mask must be an integer in 0..=65535")
                else
                  $mask
                end
            end
          ' evidence/evidence.json)
          mask=$(printf '%04x' "$mask_value")
          if [ "$verdict" = "pass" ] && [ "$mask" != "0000" ]; then
            echo "::error::passing evidence must encode mask 0000"
            exit 1
          fi
          if [ "$verdict" = "fail" ] && [ "$mask" = "0000" ]; then
            echo "::error::failing evidence must encode a nonzero mask"
            exit 1
          fi
          if [ -z "$DISPLAYED" ]; then
            echo "name=evidence-$NONCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          detail=$(sha256sum evidence/evidence.json | cut -d' ' -f1)
          echo "name=attempt.$verdict.$mask.$DISPLAYED.$detail.$NONCE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: evidence
      - name: Propagate the transform's failure to the run conclusion
        if: steps.transform.outcome == 'failure'
        run: exit 1
