name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A push to a branch supersedes that branch's in-flight run: cancel it
# instead of letting it hold 8-vCPU runners to completion (the account
# spot quota is the scarce resource). Main is exempt — every main push
# is a distinct merge whose full run carries the cache-save and scan
# signal — and each main push gets its own group (keyed by sha):
# GitHub allows only one running + one queued run per group, so a
# shared main group would serialize back-to-back merges and silently
# cancel the intermediate runs.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      qodana: ${{ steps.filter.outputs.qodana }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'xtask/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.config/**'
              # ci.yml only, not workflows/**: the fleet workflows
              # (agent-work, review, dogfood, judge, chat, ...) cannot
              # change a Rust build's outcome, and re-running the whole
              # suite on their edits stalls the workflow-iteration loop
              # (#3297). ci.yml defines these jobs, so it stays.
              - '.github/workflows/ci.yml'
            # Qodana's gate is the code set plus its own config, so a
            # qodana.yaml edit still triggers a scan even though it
            # changes no Rust.
            qodana:
              - 'crates/**'
              - 'xtask/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.config/**'
              # ci.yml only, not workflows/**: the fleet workflows
              # (agent-work, review, dogfood, judge, chat, ...) cannot
              # change a Rust build's outcome, and re-running the whole
              # suite on their edits stalls the workflow-iteration loop
              # (#3297). ci.yml defines these jobs, so it stays.
              - '.github/workflows/ci.yml'
              - 'qodana.yaml'

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  dogfood-token-table:
    name: Dogfood contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/dogfood-token-table.test.mjs scripts/post-dogfood-rollup.test.mjs scripts/dogfood-action-contract.test.mjs scripts/post-review-rollup.test.mjs scripts/agent-pool.test.mjs scripts/agent-usage-record.test.mjs

  # The declared-surface matcher and the approval-tier resolver gate what the
  # unattended fleet may advance, and their strict policy parser fails closed:
  # a malformed .github/approval-policy.yml would silently stop every auto
  # dispatch. These suites (which also parse the real policy file) are the loud
  # version of that failure. Cheap and unconditional, like the dogfood
  # contracts above.
  approval-machinery:
    name: Approval machinery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-surface-match.py
      - run: python3 .agents/skills/approve/scripts/test_resolve_approval_tier.py

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # PR runs are latency-sensitive (the push-watch-fix loop), so they
    # get an 8 vCPU ephemeral EC2 spot runner (RunsOn stack, us-east-1)
    # with extras=s3-cache redirecting the GitHub cache API (rust-cache
    # included) to the stack's S3 bucket — no 10 GB repo cap. Main
    # pushes are post-merge — nobody blocks on them — so they run on
    # free GitHub-hosted runners, keeping the whole spot quota for PRs.
    runs-on: ${{ github.event_name == 'pull_request' && format('runs-on={0}/runner=8cpu-linux-x64/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.event_name == 'pull_request'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Install ALSA dev headers (cpal Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install ALSA dev headers (cpal Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # `[workspace.lints.rustdoc]` in the root Cargo.toml tracks the
      # rustdoc lints at `warn`. RUSTDOCFLAGS escalates the tracked
      # set to hard failures here without poisoning local `cargo doc`
      # runs. Phase 5c (iamacoffeepot/aether#913) swept the broken /
      # private intra-doc-link backlog so all three can deny now.
      - name: cargo doc with tracked rustdoc lints denied
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::redundant_explicit_links
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps

  # Marker-only host build (iamacoffeepot/aether#2583). The transport-only
  # tier — `aether-capabilities` with `default-features = false`, so the
  # `runtime` feature is off — must compile on the host triple, the config a
  # component author's reflexive `cargo build` hits against a marker-only
  # consumer. The other jobs never exercise it: clippy / docs / test build
  # `--workspace`, where resolver-3 feature unification turns `runtime` back on
  # for the crate (ADR-0122 §33), and the wasm cross-build elides the native
  # half. So this guard is an isolated `-p` build — never `--workspace`, which
  # would mask the failure vacuously.
  marker-build:
    name: Marker-only host build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aether-capabilities --no-default-features

  # Workspace-wide tests run on linux only. Non-chassis crates
  # (aether-kinds, aether-data, aether-actor, aether-actor-derive,
  # demo components) are pure Rust with no per-OS behavior — a matrix
  # triples CI time without catching anything new. See ADR-0035 § CI
  # matrix scope.
  test:
    name: Test (workspace, linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # PR runs on the fast spot runner, main pushes on GitHub-hosted —
    # rationale on the clippy job.
    # volume=150gb: the default ~40 GB root volume ENOSPCs under the
    # full runner image + the --all-features workspace test build +
    # fleetbench's per-test substrate copies; the volume lives only
    # for the job so the size is effectively free. (The GitHub-hosted
    # side survives on the free-disk-space reclaim step instead.)
    runs-on: ${{ github.event_name == 'pull_request' && format('runs-on={0}/runner=8cpu-linux-x64/volume=150gb/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}
    # Quota-gated single job: the account's 32-vCPU spot quota can't
    # absorb two 8-vCPU shards alongside clippy + qodana when runs
    # overlap (MaxSpotInstanceCountExceeded -> on-demand fallback /
    # queueing). The 2-way nextest name-hash shard split
    # (iamacoffeepot/aether#2803) costs ~half the test execution in
    # wall clock (~2 min) when collapsed, which sccache's member-crate
    # caching more than buys back. Restore the split when the pending
    # spot-quota increase lands: matrix partition [1, 2] + nextest
    # --partition 'hash:N/2' + shard-qualified artifact name.
    timeout-minutes: 30
    env:
      # Use mold to reduce peak link memory and speed up the test
      # build — keeps the linker OOM (collect2: ld terminated with
      # signal 7) off the runner. CI-scoped so dev machines are
      # unaffected. Target-scoped to the native host triple: the
      # wasm32 component cross-build links with rust-lld, which
      # rejects -fuse-ld=mold, so a job-wide RUSTFLAGS would break it.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clink-arg=-fuse-ld=mold
      # line-tables-only (instead of full DWARF) shrinks test
      # binaries and the linked artifacts on disk.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      # Issue #612: fetch-depth 2 (PR) / 0 (push) so the changed-crate
      # filter in `Run tests` can `git diff HEAD^1 HEAD` (or against
      # `event.before`/`after`). PR #610 originally added a second
      # `actions/checkout@v3` after pre-build to get this history; the
      # default `clean: true` on that re-checkout wiped the wasm
      # artifacts the pre-build step had just produced, so scenario
      # tests (gated by AETHER_REQUIRE_RUNTIME) panicked. Configuring
      # fetch-depth on the initial checkout keeps target/ alive into
      # the test step.
      - uses: runs-on/action@v2
        if: github.event_name == 'pull_request'
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      # Main pushes run on GitHub-hosted runners, whose ~14 GB of free
      # disk can't hold the --all-features workspace test build.
      # Reclaim ~19 GB by removing preinstalled Android / .NET /
      # Haskell tooling the build never uses (the slow apt-purge
      # categories stay pinned off; see iamacoffeepot/aether#2803).
      # PR runs get a 150 GB volume from the runner label instead.
      - name: Free disk space (GitHub-hosted only)
        if: github.event_name != 'pull_request'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: 'true'
          dotnet: 'true'
          haskell: 'true'
          large-packages: 'false'
          docker-images: 'false'
          swap-storage: 'false'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux deps (ALSA for cpal, Mesa lavapipe for wgpu, mold linker)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
          mesa-vulkan-drivers mold
      - uses: Swatinem/rust-cache@v2
      # sccache caches individual rustc invocations content-keyed in
      # the RunsOn S3 cache bucket (in-VPC, instance-profile creds) —
      # covering the workspace-member crates that rust-cache
      # deliberately excludes, which dominate this job's compile time
      # (the workspace build and every per-package `xtask dist` wasm
      # build). The key prefix sits under cache/ so entries fall under
      # the bucket's 10-day expiration rule. Incremental compilation
      # is off because sccache cannot cache incremental artifacts —
      # a fresh runner has no incremental state to reuse anyway.
      # PR-only: the S3 bucket env exists only on RunsOn runners, and
      # main pushes on GitHub-hosted compile without a wrapper.
      - name: Configure sccache (S3 backend)
        if: github.event_name == 'pull_request'
        run: |
          echo "SCCACHE_BUCKET=$RUNS_ON_S3_BUCKET_CACHE" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=$RUNS_ON_AWS_REGION" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: github.event_name == 'pull_request'
      # Pre-build the packaged artifact tree the scenario runner loads
      # at test time. Without this, ADR-0067 per-component scenarios
      # silently skip in CI ("wasm not built"); `AETHER_REQUIRE_RUNTIME=1`
      # on the test step turns any missing wasm into a hard failure so a
      # discovery miss is loud, not silent. `cargo xtask dist` discovers
      # component crates structurally (issue 439): a package depending on
      # `aether-actor` that exposes a `cdylib` lib or `[[example]]` target.
      # The dep IS the component contract — anything importing the SDK
      # (init, receive_p32, MailTransport, etc.) deps on it. Each package
      # cross-builds in its own cargo invocation: consolidated component
      # crates (e.g. `aether-camera`) gate their `aether_actor::export!()`
      # FFI emission behind a default `runtime` feature, and trunk-type
      # consumers opt out via `default-features = false`. A
      # multi-package build would feature-unify, re-enabling `runtime` for
      # the trunk consumer → wasm-lld duplicate-symbol on `init` /
      # `receive_p32`; xtask keeps each build's feature resolve isolated.
      # The wasm lands under `target/wasm32-unknown-unknown/` (where the
      # scenario tests read it) as well as `dist/`.
      - name: Pre-build component wasm for scenario tests
        run: cargo xtask dist
      # Run the full workspace test suite under nextest. The
      # changed-crate filter the prior step had is gone — nextest's
      # process-per-test isolation surfaces cross-test contamination
      # that the per-crate filter could mask, and the CI profile's
      # `slow-timeout` bounds runaway tests cleanly. The whole suite runs
      # at full parallelism; the `aether-substrate-bundle` integration
      # tests that fork real substrates carry a generous per-test
      # slow-timeout in `.config/nextest.toml` so concurrent fork
      # contention stretches their wall-clock without tripping the
      # steady-state cap.
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: Run tests (workspace, parallel)
        run: cargo nextest run --all-features --profile ci
        env:
          AETHER_REQUIRE_RUNTIME: "1"
      # iamacoffeepot/aether#2914: a failing direct TestBench visual
      # assertion that armed `test_bench::artifacts::ArtifactGuard`
      # leaves its actual/mask/measurements set under
      # `target/test-bench-artifacts/`; a passing run writes nothing
      # there. Upload ignores the tree being absent, matching the
      # fuzz-crash-artifact upload pattern in fuzz-nightly.yml.
      - name: Upload test-bench failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-bench-artifacts
          path: target/test-bench-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload FleetBench TCP load metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleetbench-tcp-load-metrics
          path: target/fleetbench-metrics/tcp-load.json
          if-no-files-found: ignore
          retention-days: 7
      # Hit-rate visibility while the S3 backend beds in; harmless to
      # keep once it does.
      - name: sccache stats
        if: always() && github.event_name == 'pull_request'
        run: sccache --show-stats

  # Qodana scan folded in from .github/workflows/qodana.yml so the
  # ci-pass aggregator can needs: it directly (iamacoffeepot/aether#941).
  # Gated on the `qodana` changes filter (code paths + qodana.yaml) so a
  # docs / .claude / scripts-only PR skips it instead of blocking the
  # merge gate on a multi-minute scan with no Rust to analyze
  # (iamacoffeepot/aether#1089); ci-pass accepts a skipped qodana the
  # same way it does clippy/docs/test. The cache cycle is split out of
  # qodana-action so we can interleave an ownership chown between the
  # root-written scan and the tar save (qodana-action's built-in save
  # runs inside its own step, before any post-scan step we could add, so
  # we can't fix the ownership in time without taking over the save side).
  qodana:
    name: Qodana scan
    needs: changes
    if: needs.changes.outputs.qodana == 'true'
    # PR runs on the fast spot runner, main pushes on GitHub-hosted —
    # rationale on the clippy job.
    runs-on: ${{ github.event_name == 'pull_request' && format('runs-on={0}/runner=8cpu-linux-x64/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: runs-on/action@v2
        if: github.event_name == 'pull_request'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore Qodana cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.1-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            qodana-2026.1-${{ github.ref }}-
            qodana-2026.1-

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          # -u root forwards through `qodana scan` to the underlying
          # `docker run`, keeping the container's design-default user.
          # The qodana-action's wrapper otherwise passes `-u $(id -u)`
          # to preserve the runner user's ownership of the workspace
          # dir — but that flips the container to non-root, and the
          # baked /usr/local/cargo (registry + global-cache) is
          # root-owned, so cargo metadata perm-denies and Qodana
          # leaves the entire workspace unanalysed. Running as root
          # inside the container is the documented default — see
          # https://www.jetbrains.com/help/qodana/docker-image-configuration.html
          # § "Run as a non-root user". The CARGO_HOME override on
          # the prior approach (iamacoffeepot/aether#911) is now
          # unnecessary.
          #
          # The fail-threshold lives in qodana.yaml (`failThreshold`),
          # the single source of truth this job reads. It stays explicit there
          # (not the action's default, which could shift across version
          # bumps — iamacoffeepot/aether#941), so no --fail-threshold
          # CLI override here, which would shadow the yaml value.
          args: --linter qodana-rust -u root
          # We own restore/save (steps above + below); qodana-action's
          # built-in cache save runs root-owned and trips tar exit 2.
          use-caches: false
          # Upload SARIF + qodana.sarif.json as a workflow artifact
          # ('qodana-report') so triagers can grab findings without
          # depending on the JB web dashboard.
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Reclaim qodana cache ownership for tar
        # Qodana ran as root in the container; new cache files inherit
        # uid 0 on the bind-mount. The save step below runs as the
        # runner user (uid 1001) and would tar-exit-2 on those files.
        # Chown the tree back so save can read everything.
        #
        # `if: always()` so the chown still runs when qodana itself
        # exits non-zero on findings. `|| true` because the cache dir
        # may not exist at all if the scan crashed before populating.
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/qodana/caches" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/qodana/caches" || true
          fi

      - name: Save Qodana cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.1-${{ github.ref }}-${{ github.sha }}

  # Desktop chassis tests run the full OS matrix because winit event
  # loops, wgpu driver init, and platform-specific frame capture are
  # the only places per-OS coverage catches real bugs. Linux is covered
  # by the workspace job above; this job adds macOS + Windows.
  desktop:
    name: Test desktop (${{ matrix.os }})
    needs: changes
    # only run this job on tagged releases
    if: needs.changes.outputs.code == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    # Normal run is ≤ 2 min; cap at 15 so a runner stall (hub mac
    # CI flaked on 2026-04-21 against PR #164's commit, then
    # re-ran clean on the same SHA) doesn't eat the default 6h
    # quota. Long-term we'd rather treat repeat flakes as a real
    # scheduler/concurrency signal than keep growing this bound.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aether-substrate-bundle --all-targets

  ci-pass:
    name: CI pass
    if: always()
    needs: [ changes, fmt, dogfood-token-table, approval-machinery, clippy, docs, marker-build, test, desktop, qodana ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "fmt:     ${{ needs.fmt.result }}"
          echo "dogfood-token-table: ${{ needs.dogfood-token-table.result }}"
          echo "approval-machinery: ${{ needs.approval-machinery.result }}"
          echo "clippy:  ${{ needs.clippy.result }}"
          echo "docs:    ${{ needs.docs.result }}"
          echo "marker-build: ${{ needs.marker-build.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "desktop: ${{ needs.desktop.result }}"
          echo "qodana:  ${{ needs.qodana.result }}"
          fail=0
          [[ "${{ needs.changes.result }}" == "success" ]] || fail=1
          [[ "${{ needs.fmt.result }}"     == "success" ]] || fail=1
          [[ "${{ needs.dogfood-token-table.result }}" == "success" ]] || fail=1
          [[ "${{ needs.approval-machinery.result }}" == "success" ]] || fail=1
          [[ "${{ needs.clippy.result }}"  == "success" || "${{ needs.clippy.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.docs.result }}"    == "success" || "${{ needs.docs.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.marker-build.result }}" == "success" || "${{ needs.marker-build.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.test.result }}"    == "success" || "${{ needs.test.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.desktop.result }}" == "success" || "${{ needs.desktop.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.qodana.result }}"  == "success" || "${{ needs.qodana.result }}" == "skipped" ]] || fail=1
          exit $fail
