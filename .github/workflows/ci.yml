name: CI

on:
  pull_request:
    # Landing proposals onto the day's bloomery ref are correspondence
    # (ADR-0186): bloomery's own gates already proved the tree, and the
    # pull-request jobs are not consumed. Skip them so paid runners are
    # not spent on a wait nothing reads. PRs onto `main` still run.
    branches-ignore:
      - 'bloomery/daily/**'
  push:
    # `bloomery/daily/**` is ADR-0186's preferred backstop posture
    # (iamacoffeepot/aether#4946). A bloom lands on the day's ref without a
    # pull request, so until sync-back nothing exercised the repository-wide
    # suite over it: an affected-set or scoping miss stayed green inside its
    # wave and accumulated for the rest of the day. Running the full suite at
    # each landing caps that at about one bloom.
    #
    # It is a backstop, not a gate. Nothing here is a required check, no
    # branch protection changes, and a red run is read by an operator — the
    # quarantine and repair-bloom reaction stays deliberately outside this
    # workflow, because workflow credentials must not become an unreviewed
    # coordinator-control channel.
    branches:
      - main
      - 'bloomery/daily/**'
  # The full-suite lane runs only on a push to `main` or a daily ref, so
  # without a manual trigger there is no way to exercise a change to it
  # before merging it. A dispatch takes the same non-pull-request path: the
  # GitHub-hosted runner, the sharded full suite, and no affected-package
  # narrowing.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A push to a branch supersedes that branch's in-flight run: cancel it
# instead of letting it hold 8-vCPU runners to completion (the account
# spot quota is the scarce resource).
#
# Integration pushes — `main` and the day's bloomery ref — are exempt, and
# each gets its own group keyed by sha. Every one of them is a distinct
# landing whose full run carries the cache-save and scan signal, and GitHub
# allows only one running + one queued run per group, so a shared group
# would serialize back-to-back landings and silently cancel the intermediate
# runs. On the daily ref that cancellation is the whole failure mode the
# backstop exists to prevent: a branch-ref group would let bloom N+1 cancel
# bloom N's run and erase the first red landing, which is exactly the commit
# an operator needs named.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bloomery/daily/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/bloomery/daily/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # A manual dispatch is an explicit request to run the suite, and it
      # carries no diff base for the filter to reason from, so it bypasses
      # the filter rather than being classified by it.
      #
      # A daily landing bypasses it too, and for the opposite reason: the
      # backstop exists specifically to catch a wave whose affected set was
      # wrong (iamacoffeepot/aether#4946), so classifying it by the same kind
      # of path selection would let the miss it is hunting decide whether it
      # runs at all.
      code: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/bloomery/daily/') || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/bloomery/daily/')
        with:
          filters: |
            code:
              - 'crates/**'
              - 'xtask/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.config/**'
              # ci.yml only, not workflows/**: the other workflows
              # (nightlies, docs, release, ...) cannot change a Rust
              # build's outcome, so their edits skip the Rust suite.
              # ci.yml defines these jobs, so it stays. Every gate's own
              # calibration now lives in `xtask/**`, which the rule above
              # already covers.
              - '.github/workflows/ci.yml'

  # A suppression makes the tool it targets green by construction, so this
  # check must sit outside the affected-code filter. It scans only additions
  # in the PR's exact merge-base/head diff. A pull_request checkout exposes the
  # proposed tree, so the scanner itself is materialized from the event base;
  # otherwise the same PR could weaken the scanner that judges it. The one
  # bootstrap exception is a base that does not contain the newly introduced
  # scanner yet. Findings stay visible even when an owner-edited, commit-bound
  # hidden marker in the current PR body signs them off; pushes and manual runs
  # have no PR authorization context and skip.
  suppressions:
    name: New suppressions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Materialize the trusted suppression scanner
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCANNER_PATH: ${{ runner.temp }}/check-suppressions.py
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          if git cat-file -e "${BASE_SHA}:scripts/check-suppressions.py"; then
            git show "${BASE_SHA}:scripts/check-suppressions.py" > "${SCANNER_PATH}"
            echo "Using suppression scanner from event base ${BASE_SHA}"
          else
            # Bootstrap only: the base of the PR that introduces this gate has
            # no trusted scanner blob yet. Once landed, every later PR takes
            # the base branch above and cannot execute its proposed scanner.
            git show "${HEAD_SHA}:scripts/check-suppressions.py" > "${SCANNER_PATH}"
            echo "::notice::Event base has no suppression scanner; using head ${HEAD_SHA} for bootstrap"
          fi
          test -s "${SCANNER_PATH}"
      - name: Reject newly introduced suppressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCANNER_PATH: ${{ runner.temp }}/check-suppressions.py
        run: >-
          python3 "${SCANNER_PATH}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --pull-request "${{ github.event.pull_request.number }}"
          --repository "${{ github.repository }}"

  # Every mechanical gate below invokes `cargo xtask transform verify.<id>`
  # (iamacoffeepot/aether#4883). `xtask/src/transform/verify` owns each gate's
  # program, argv, environment, exit-code interpretation and verdict; the
  # Bloomery verify lane runs the same arm, so a calibration edit — the jscpd
  # threshold, the machete flags, a rustdoc lint — is one Rust change that moves
  # the gate and the lane's prediction of it together. Stating the invocation
  # here as well is exactly the two-site duplication this repository has already
  # been burned by twice (#4856, #4863).
  #
  # Scheduling stays in YAML: job names, `needs`, conditions, runners, caches,
  # tool installation, the affected-package computation, matrix cardinality and
  # artifact uploads are the executor's business, not the gate's.
  #
  # Each arm captures the tool's stdout+stderr into `<out>/verify.<id>.log`
  # instead of streaming it, and writes throwaway evidence beside it under
  # `${RUNNER_TEMP}`. The step therefore prints that log and re-raises the arm's
  # own exit code — `|| status=$?` suppresses `bash -e` for the one command
  # without laundering its status.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The toolchain comes from `rust-toolchain.toml`, never from a channel
      # named here. A Bloomery lane's `verify.check` runs the pinned toolchain
      # (rustup resolves the file), so a gate on `stable` judges the candidate
      # with a different compiler than the one that verified it — and the two
      # drift apart on their own every six weeks. `rustup toolchain install`
      # with no argument reads the file, including its `components` and
      # `targets`, so each job's needs are declared once, in the repo.
      - run: rustup toolchain install
      # The gate is now an xtask build, so the job caches like the other Rust
      # jobs rather than paying a cold compile of the executor every run.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format gate
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/verify-fmt"
          status=0
          cargo xtask transform verify.fmt --out "$out" || status=$?
          cat "$out/verify.fmt.log" 2>/dev/null || true
          exit "$status"

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # PR runs are latency-sensitive (the push-watch-fix loop), so they
    # get an 8 vCPU ephemeral EC2 spot runner (RunsOn stack, us-east-1)
    # with extras=s3-cache redirecting the GitHub cache API (rust-cache
    # included) to the stack's S3 bucket — no 10 GB repo cap. Main
    # pushes are post-merge — nobody blocks on them — so they run on
    # free GitHub-hosted runners, keeping the whole spot quota for PRs.
    runs-on: ${{ github.event_name == 'pull_request' && format('runs-on={0}/runner=8cpu-linux-x64/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2
        if: github.event_name == 'pull_request'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup toolchain install
      - name: Install ALSA dev headers (cpal Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The arm runs clippy non-denying under `--message-format=json` and
      # applies the same fail-on-any-warning predicate `-D warnings` encodes
      # over the complete diagnostic list (#4706): denying makes a lint a
      # compile error, so a lib that trips one is never built and everything
      # depending on it is never linted at all. The verdict is identical and the
      # coverage is strictly wider.
      #
      # The captured log is that JSON stream, so the step renders `.message
      # .rendered` back to the text a reader expects. That rendering carries no
      # calibration — the verdict is the arm's exit code and nothing here can
      # change it — so it is display, not a second copy of the gate.
      - name: Clippy gate
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/verify-clippy"
          status=0
          cargo xtask transform verify.clippy --out "$out" || status=$?
          log="$out/verify.clippy.log"
          grep -v '^{' "$log" || true
          jq -Rr 'fromjson? | select(.reason == "compiler-message") | .message.rendered // empty' "$log" || true
          exit "$status"

  # Not the guide: docs.yml builds the mdBook. This job denies the
  # tracked rustdoc lints over the API docs.
  docs:
    name: Rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup toolchain install
      - name: Install ALSA dev headers (cpal Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `[workspace.lints.rustdoc]` in the root Cargo.toml tracks the
      # rustdoc lints at `warn`. RUSTDOCFLAGS escalates the tracked
      # set to hard failures here without poisoning local `cargo doc`
      # runs. Phase 5c (iamacoffeepot/aether#913) swept the broken /
      # private intra-doc-link backlog so all three can deny now.
      # `--document-private-items` extends link resolution to private
      # items (iamacoffeepot/aether#4308), so a refactor that moves a
      # private item across a module boundary breaks the build instead
      # of silently dangling. `--all-features` (iamacoffeepot/aether#4836)
      # is what makes a module behind a non-default feature reach these
      # denied lints at all — without it, cargo never compiles that
      # module, so a broken or private link inside it is never checked.
      # The flag moves that blind spot rather than removing it: with
      # every feature on, an item gated `#[cfg(not(feature = "…"))]` is
      # compiled out and goes unchecked instead — the mirror image of
      # the hole above, over a much smaller surface (fallback stubs).
      # `#[cfg(test)]` modules sit outside either selection: rustdoc
      # does not document them at all, so a doc link inside one stays
      # unchecked under any feature set.
      #
      # RUSTDOCFLAGS is the arm's own environment, not the job's: escalating a
      # tracked lint on one side and not the other is exactly the gate a lane
      # cannot predict.
      - name: Rustdoc gate
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/verify-docs"
          status=0
          cargo xtask transform verify.docs --out "$out" || status=$?
          cat "$out/verify.docs.log" 2>/dev/null || true
          exit "$status"

  # Workspace-wide tests run on linux only. Non-chassis crates
  # (aether-kinds, aether-data, aether-actor, aether-actor-derive,
  # demo components) are pure Rust with no per-OS behavior — a matrix
  # triples CI time without catching anything new. See ADR-0035 § CI
  # matrix scope.
  test:
    name: Test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # PR runs on the fast spot runner, main pushes on GitHub-hosted —
    # rationale on the clippy job.
    # volume=150gb: the default ~40 GB root volume ENOSPCs under the
    # full runner image + the --all-features workspace test build +
    # fleetharness's per-test substrate copies; the volume lives only
    # for the job so the size is effectively free. (The GitHub-hosted
    # side survives on the free-disk-space reclaim step instead.)
    runs-on: ${{ github.event_name == 'pull_request' && format('runs-on={0}/runner=8cpu-linux-x64/volume=150gb/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}
    # The two lanes shard differently because their scarce resource
    # differs (iamacoffeepot/aether#4213).
    #
    # A pull request runs an affected subset (#3611) on one 8-vCPU spot
    # runner and stays a single job: the account's 32-vCPU spot quota
    # can't absorb parallel 8-vCPU shards alongside clippy when runs
    # overlap (MaxSpotInstanceCountExceeded -> on-demand fallback /
    # queueing), so the split #2803 tried there was collapsed back.
    #
    # Every other event runs the whole suite, and `main` deliberately
    # stays on free GitHub-hosted runners because it pays that cost on
    # every squash-merge. Splitting is what buys the wall clock back
    # there without a paid runner: three `ubuntu-latest` jobs each run a
    # third of the tests, and GitHub-hosted concurrency on a public
    # repository is the resource that is not scarce.
    #
    # One matrixed job rather than a second job definition: the lane's
    # ~20 steps (disk reclaim, toolchain, deps, wasm pre-build, uploads)
    # stay written once, and `strategy.job-total` feeds the shard count
    # straight into the nextest partition below, so the matrix and the
    # partition cannot drift apart.
    strategy:
      # A failing shard must not cancel its siblings: the other two thirds
      # of the suite are exactly the signal a `main` red is missing.
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'pull_request' && fromJSON('[1]') || fromJSON('[1, 2, 3]') }}
    timeout-minutes: 30
    env:
      # Use mold to reduce peak link memory and speed up the test
      # build — keeps the linker OOM (collect2: ld terminated with
      # signal 7) off the runner. CI-scoped so dev machines are
      # unaffected. Target-scoped to the native host triple: the
      # wasm32 component cross-build links with rust-lld, which
      # rejects -fuse-ld=mold, so a job-wide RUSTFLAGS would break it.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clink-arg=-fuse-ld=mold
      # line-tables-only (instead of full DWARF) shrinks test
      # binaries and the linked artifacts on disk.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      # Issue #612: fetch-depth 2 (PR) / 0 (push) so the changed-crate
      # filter in `Run tests` can `git diff HEAD^1 HEAD` (or against
      # `event.before`/`after`). PR #610 originally added a second
      # `actions/checkout@v3` after pre-build to get this history; the
      # default `clean: true` on that re-checkout wiped the wasm
      # artifacts the pre-build step had just produced, so scenario
      # tests (gated by AETHER_REQUIRE_RUNTIME) panicked. Configuring
      # fetch-depth on the initial checkout keeps target/ alive into
      # the test step.
      - uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2
        if: github.event_name == 'pull_request'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      # Main pushes run on GitHub-hosted runners, whose ~14 GB of free
      # disk can't hold the --all-features workspace test build.
      # Reclaim ~19 GB by removing preinstalled Android / .NET /
      # Haskell tooling the build never uses (the slow apt-purge
      # categories stay pinned off; see iamacoffeepot/aether#2803).
      # PR runs get a 150 GB volume from the runner label instead.
      - name: Free disk space (GitHub-hosted only)
        if: github.event_name != 'pull_request'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: 'true'
          dotnet: 'true'
          haskell: 'true'
          large-packages: 'false'
          docker-images: 'false'
          swap-storage: 'false'
      - run: rustup toolchain install
      - name: Install Linux deps (ALSA for cpal, Mesa lavapipe for wgpu, mold linker)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
          mesa-vulkan-drivers mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # rust-cache keys on the job id, which the matrix does not vary,
          # so every shard restores and would then write the same entry.
          # Let one shard save it: the shards build an identical tree, and
          # three uploads of the same multi-gigabyte entry would churn the
          # repository's 10 GB cache budget for nothing.
          save-if: ${{ matrix.shard == 1 }}
      # sccache caches individual rustc invocations content-keyed in
      # the RunsOn S3 cache bucket (in-VPC, instance-profile creds) —
      # covering the workspace-member crates that rust-cache
      # deliberately excludes, which dominate this job's compile time
      # (the workspace build and every per-package `xtask dist` wasm
      # build). The key prefix sits under cache/ so entries fall under
      # the bucket's 10-day expiration rule. Incremental compilation
      # is off because sccache cannot cache incremental artifacts —
      # a fresh runner has no incremental state to reuse anyway.
      # PR-only: the S3 bucket env exists only on RunsOn runners, and
      # main pushes on GitHub-hosted compile without a wrapper.
      - name: Configure sccache (S3 backend)
        if: github.event_name == 'pull_request'
        run: |
          echo "SCCACHE_BUCKET=$RUNS_ON_S3_BUCKET_CACHE" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=$RUNS_ON_AWS_REGION" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        if: github.event_name == 'pull_request'
      # Pre-build the packaged artifact tree the scenario runner loads
      # at test time. Without this, ADR-0067 per-component scenarios
      # silently skip in CI ("wasm not built"); `AETHER_REQUIRE_RUNTIME=1`
      # on the test step turns any missing wasm into a hard failure so a
      # discovery miss is loud, not silent. `cargo xtask dist` discovers
      # component crates structurally (issue 439): a package depending on
      # `aether-actor` that exposes a `cdylib` lib or `[[example]]` target.
      # The dep IS the component contract — anything importing the SDK
      # (init, receive_p32, MailTransport, etc.) deps on it. Each package
      # cross-builds in its own cargo invocation: consolidated component
      # crates (e.g. `aether-camera`) gate their `aether_actor::export!()`
      # FFI emission behind a default `runtime` feature, and trunk-type
      # consumers opt out via `default-features = false`. A
      # multi-package build would feature-unify, re-enabling `runtime` for
      # the trunk consumer → wasm-lld duplicate-symbol on `init` /
      # `receive_p32`; xtask keeps each build's feature resolve isolated.
      # The wasm lands under `target/wasm32-unknown-unknown/` (where the
      # scenario tests read it) as well as `dist/`.
      #
      # Issue #3611: PR runs test only the reverse-dependency closure of
      # the changed paths (`cargo xtask affected` — guppy + determinator),
      # so a leaf-crate PR skips the heavy bundle suites and the wasm
      # pre-build. Selection is conservative: graph-shaping paths
      # (lockfile, root manifest, toolchain, .cargo/, .config/,
      # clippy.toml, ci.yml, xtask/) and any path matching no package and
      # no rule run everything, and the couplings cargo's graph can't see
      # (component/behavior wasm executed by the bundle's scenario tests;
      # bloomery/ config read by aether-chassis-bloomery tests) are injected
      # in xtask. Pushes to main always run the unconditional full suite
      # below — squash-merge means main tests the exact landed tree, so a
      # selection miss delays a red signal but never loses it. That same
      # backstop answers the nextest-era removal of the previous
      # changed-crate filter (per-crate filtering can mask cross-test
      # contamination): contamination still surfaces on main's full run,
      # and the Clippy job compiles the whole workspace on every PR, so
      # only test execution narrows — never compile coverage.
      - name: Compute affected packages (PR only)
        id: affected
        if: github.event_name == 'pull_request'
        run: cargo xtask affected --base HEAD^1 --github-output
      - name: Pre-build component wasm for scenario tests
        if: github.event_name != 'pull_request' || steps.affected.outputs.run_all == 'true' || steps.affected.outputs.wasm_needed == 'true'
        run: cargo xtask dist
      # The CI profile's `slow-timeout` bounds runaway tests cleanly. The
      # suite runs at full parallelism; the fleet
      # integration suites that fork real substrates carry a generous
      # per-test slow-timeout in `.config/nextest.toml` so concurrent fork
      # contention stretches their wall-clock without tripping the
      # steady-state cap.
      - name: Install latest nextest release
        uses: taiki-e/install-action@e658debeddbabf20b2b866d9235eb08a2375b1ad # nextest
      # Issue #4215: xtask's own suite carries the checks that keep the
      # affected selection honest — that a `tests/` tree feeds nothing but
      # its own test binaries, and that every package resolving a dist
      # artifact by path is classified as a dist consumer. Those scan the
      # whole workspace, so a violation is introduced by a PR touching any
      # crate, while the affected set for such a PR contains that crate
      # and not xtask. Running them regardless of the affected set is what
      # makes the guard fire on the PR that breaks a property rather than
      # on the `main` push after it lands. Skipped when the whole suite
      # runs below, which already covers it.
      #
      # Must sit after the nextest install: it landed above it in #4217 and
      # failed every PR with `no such command: nextest`, which that pull
      # request could not have caught — it touched `.github/` and `xtask/`,
      # so `run_all` was true and this step skipped itself.
      - name: Check affected-selection invariants (PR only)
        if: github.event_name == 'pull_request' && steps.affected.outputs.run_all == 'false'
        run: cargo nextest run -p xtask --profile ci
      # `slice` rather than `count` or `hash` (iamacoffeepot/aether#4213).
      # All three select a third of the tests and all three sum back to
      # the whole suite; they differ in where the expensive ones land, and
      # this suite's cost is concentrated in a few dozen GPU and
      # fork-a-substrate integration tests.
      #
      # `count` partitions independently within each binary, so a binary
      # holding a single test always yields it to shard 1. Thirty-five
      # binaries have exactly one test, among them `world_case_atlas`,
      # `terrain_workbench_scenario`, `fleetharness_logs` and
      # `fleetharness_tcp_load` — four of the slowest in the suite, all
      # piled onto one shard by construction (measured: 1139/1076/1028
      # tests, with the heavy tail loaded onto the largest).
      #
      # `hash` scatters by test name, which is even in expectation but
      # blind to where the heavy tests land: it splits `render_scenario`
      # 4/6/8 and `widget_render_interaction` 3/8/4.
      #
      # `slice` deals the whole cross-binary list out round-robin, so
      # shard sizes are even by construction (1081/1081/1081) and a
      # multi-test binary's tests go to different shards rather than
      # clumping — `render_scenario` 6/6/6, `widget_render_interaction`
      # 5/5/5. A single-test binary still falls wherever its position in
      # that list puts it, which no count-based mode can weigh; what
      # changes is that the position varies instead of always being
      # shard 1. `hash`'s one advantage, a test keeping its shard as the
      # suite grows, buys nothing here: no cache or artifact is keyed by
      # shard.
      #
      # `strategy.job-total` is 1 on the pull-request lane, and
      # `slice:1/1` selects every test, so the flag is inert there.
      #
      # The one gate still spelled here rather than as `verify.test`
      # (iamacoffeepot/aether#4883). The arm runs the suite whole: it takes no
      # partition, no package selection, and it re-runs `cargo xtask dist` as
      # its own prepare, so routing this job through it would discard the
      # affected subset, run the full suite three times over, and pay the wasm
      # cross-build twice per shard. Aligning it needs the arm to accept those
      # three scheduling inputs — an explicit package set, the nextest
      # partition, and an attestation that the conditional pre-build step above
      # already ran — which is a change to `xtask/src/transform/verify`.
      - name: Run tests (workspace, parallel)
        if: github.event_name != 'pull_request' || steps.affected.outputs.run_all == 'true'
        run: cargo nextest run --all-features --profile ci --partition slice:${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          AETHER_REQUIRE_RUNTIME: "1"
      # `package_args` interpolates package names only (alphanumeric plus
      # dashes, straight from the cargo workspace list), so the expansion
      # is shell-safe. An empty affected set skips both test steps — the
      # affected step's log records why.
      - name: Run tests (affected packages)
        if: github.event_name == 'pull_request' && steps.affected.outputs.run_all == 'false' && steps.affected.outputs.package_args != ''
        run: cargo nextest run ${{ steps.affected.outputs.package_args }} --all-features --profile ci
        env:
          AETHER_REQUIRE_RUNTIME: "1"
      # iamacoffeepot/aether#2914: a failing direct SubstrateHarness visual
      # assertion that armed `substrate_harness::artifacts::ArtifactGuard`
      # leaves its actual/mask/measurements set under
      # `target/substrate-harness-artifacts/`; a passing run writes nothing
      # there. Upload ignores the tree being absent, matching the
      # fuzz-crash-artifact upload pattern in fuzz-nightly.yml.
      - name: Upload substrate-harness failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Shard-qualified: upload-artifact v4 rejects a second upload
          # under a name another job already claimed, so two failing
          # shards would race and one would lose its diagnostics.
          name: substrate-harness-artifacts-shard-${{ matrix.shard }}
          path: target/substrate-harness-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload FleetHarness TCP load metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Shard-qualified for the same reason as the upload above: only
          # the shard that drew the load test writes the file, but which
          # shard that is follows from the partition, not from the name.
          name: fleetharness-tcp-load-metrics-shard-${{ matrix.shard }}
          path: target/fleetharness-metrics/tcp-load.json
          if-no-files-found: ignore
          retention-days: 7
      # Hit-rate visibility while the S3 backend beds in; harmless to
      # keep once it does.
      - name: sccache stats
        if: always() && github.event_name == 'pull_request'
        run: sccache --show-stats

  # Token-based duplicate-code detection (jscpd). The gate — min-tokens and
  # the duplicated-line percentage threshold — is `verify.dup`'s argv; jscpd
  # exits non-zero when the tree exceeds it. Whole-tree scan of crates/ (not a
  # diff-scoped run): jscpd only finds clones among the files it scans, so
  # scanning just the PR's changed files would miss a changed file
  # duplicating an unchanged one.
  #
  # Settings ride that argv rather than a `.jscpd.json`, and the repository has
  # no such file (#4856): jscpd answers a malformed config with one stderr
  # warning and a silent fall back to built-in defaults — threshold included —
  # so the gate went green at the moment its configuration broke. A bad flag it
  # rejects outright (exit 2). No ignore flag is needed: jscpd honours
  # .gitignore, which already covers target/.
  #
  # The scan itself is node-only; the executor that states its calibration is
  # not, which is why this job now installs a toolchain and caches like the
  # Rust jobs. That build is the price of the calibration living in one place.
  dup-check:
    name: Duplicate code
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Duplicate-code gate
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/verify-dup"
          status=0
          cargo xtask transform verify.dup --out "$out" || status=$?
          cat "$out/verify.dup.log" 2>/dev/null || true
          exit "$status"

  # Unused-dependency detection (cargo-machete). Scoped to crates/ to
  # match dup-check. False positives (a dep used only through a
  # macro-emitted path or an optional feature, which machete's
  # source-only scan cannot see) are silenced per-crate via
  # `[package.metadata.cargo-machete] ignored`, not by dropping the dep.
  unused-deps:
    name: Unused dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-machete --locked
      # `verify.deps` carries `--no-ignore` because cargo-machete skips
      # gitignored files by default, so a .gitignore pattern that happens to
      # match a crate path retires it from this gate silently — exit 0, "Good
      # job!", never scanned (#4863). `--skip-target-dir` then re-excludes
      # target/, which is the only thing .gitignore was doing for this scan.
      #
      # The arm invokes the `cargo-machete` binary directly rather than through
      # `cargo machete`, which hands the subcommand its own name as argv[1] and
      # walks a nonexistent `machete/` alongside `crates/` (#4706). Same scan,
      # same paths.
      - name: Unused-dependency gate
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/verify-deps"
          status=0
          cargo xtask transform verify.deps --out "$out" || status=$?
          cat "$out/verify.deps.log" 2>/dev/null || true
          exit "$status"

  # Cargo.lock records every workspace package's dependency list, so a
  # manifest edit that lands without the matching lock update leaves the
  # committed lock stale and every fresh clone permanently dirty. The
  # push-early policy means no local cargo build regenerates it, so the
  # gate has to be here: `--locked` resolves the graph and fails when the
  # lock does not match the manifests. No build, so it costs seconds.
  lock-freshness:
    name: Cargo lock freshness
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The resolved graph goes to the arm's captured log rather than to this
      # job's, which is what the previous `> /dev/null` was for: the exit code
      # is the verdict and the JSON body is never read.
      #
      # Spelled out rather than through the `cargo xtask` alias so the
      # executor's own build carries `--locked`. Without it, building the
      # executor is the first thing in this job to resolve the graph, and cargo
      # would silently regenerate the very lock the arm is about to judge — the
      # gate would then pass over a lockfile it had just repaired in place.
      - name: Cargo lock freshness gate
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/verify-lock"
          status=0
          cargo run --locked --quiet --package xtask -- transform verify.lock --out "$out" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Cargo.lock is stale. Run 'cargo metadata --format-version 1 --offline > /dev/null' and commit the regenerated Cargo.lock."
          fi
          exit "$status"

  # The one required check. Every job above must resolve to `success`
  # here, or to `skipped` where the path filter is allowed to skip it —
  # any other result (`failure`, `cancelled`, or a `skipped` the filter
  # does not license) fails the gate. `needs.test.result` is the matrix
  # aggregate across every shard: it reads `success` only when all of
  # them succeeded, and reports `failure` or `cancelled` if any single
  # shard did, so adding shards does not widen the gate.
  ci-pass:
    name: CI pass
    if: always()
    needs: [ changes, suppressions, fmt, clippy, docs, test, dup-check, unused-deps, lock-freshness ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "suppressions: ${{ needs.suppressions.result }}"
          echo "fmt:     ${{ needs.fmt.result }}"
          echo "clippy:  ${{ needs.clippy.result }}"
          echo "docs:    ${{ needs.docs.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "dup-check: ${{ needs.dup-check.result }}"
          echo "unused-deps: ${{ needs.unused-deps.result }}"
          echo "lock-freshness: ${{ needs.lock-freshness.result }}"
          fail=0
          [[ "${{ needs.changes.result }}" == "success" ]] || fail=1
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ needs.suppressions.result }}" == "success" ]] || fail=1
          else
            [[ "${{ needs.suppressions.result }}" == "skipped" ]] || fail=1
          fi
          [[ "${{ needs.fmt.result }}"     == "success" ]] || fail=1
          [[ "${{ needs.clippy.result }}"  == "success" || "${{ needs.clippy.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.docs.result }}"    == "success" || "${{ needs.docs.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.test.result }}"    == "success" || "${{ needs.test.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.dup-check.result }}" == "success" || "${{ needs.dup-check.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.unused-deps.result }}" == "success" || "${{ needs.unused-deps.result }}" == "skipped" ]] || fail=1
          [[ "${{ needs.lock-freshness.result }}" == "success" || "${{ needs.lock-freshness.result }}" == "skipped" ]] || fail=1
          exit $fail
