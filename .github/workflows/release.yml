name: Release

# Manually triggered: build the standalone loco-motion game for Windows and
# upload a zip of the package depot to download and hand out. `cargo xtask
# package` emits a depot directory (the chassis executable plus a content-
# addressed `pack/`); the job renames the chassis exe to `loco-motion.exe` and
# zips the whole directory. The host target on `windows-latest` is
# `x86_64-pc-windows-msvc`, so `cargo xtask package` cross-builds the component
# for wasm32 and builds the desktop chassis for Windows in one step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    name: Windows loco-motion package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build the standalone game package (release)
        run: cargo xtask package --profile release --chassis desktop --components aether-kit-commons --title loco-motion
      - name: Rename the chassis executable for hand-out
        run: Rename-Item target/package/aether-substrate loco-motion.exe
      - name: Zip the package depot
        run: Compress-Archive -Path target/package/* -DestinationPath loco-motion-windows.zip
      - name: Upload the Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loco-motion-windows
          path: loco-motion-windows.zip
          if-no-files-found: error
