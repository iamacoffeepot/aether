name: Agent tick

# The cloud-agent dispatcher: a hosted, no-Claude, no-cargo workflow that scans
# the issue board, computes which items are advanceable, and fires agent-work
# runs — a wavefront that pushes every issue one step forward through the flat
# phase ladder (#3126) until the board is at rest. agent-work.yml (#3129) is the
# executor that runs one pipeline step for one ref; this workflow decides WHAT to
# dispatch and WHEN. It also carries the fleet's global controls: the
# AGENT_ENABLED kill switch and the wave governor (repo variables that bound wave
# width, inter-wave gap, and daily budget from one choke point). ADR-0146 §4.
#
# TRIGGER MODEL (three paths, one job body):
#   - workflow_run on "Agent work" completed — the COMPLETION CHAIN. Each
#     finishing step re-invokes the tick, which dispatches the next wave the
#     moment quiescence returns, so waves chain at the natural pace of the work.
#     The list matches the executor's `name:` (display name "Agent work"), the
#     same way review.yml/reconciler.yml key on "CI".
#   - schedule on offset minutes (~every 20) — a PURE BEST-EFFORT BACKSTOP.
#     GitHub drops scheduled events under load (observed: a `7,27,47` cron silent
#     for 2.5h, #3256), so cron is NOT a liveness dependency — the self-sustaining
#     wavefront below owns liveness; cron only shortens a recovery window if the
#     self-dispatch ever misses.
#   - workflow_dispatch — two callers, split by the `reason` input. An EMPTY
#     reason is a human manual kick: it bypasses the gap/budget gate (the
#     deliberate operator override) but not the quiescence barrier. `reason=defer`
#     is a SELF-ARMED SUCCESSOR (below): it honors the gate like any scheduled or
#     completion-chain tick, so the re-arm chain paces against the minimum
#     interval rather than collapsing it to ~0.
#
# SELF-SUSTAINING WAVEFRONT (#3256, ADR-0146 §4 amended). The completion chain
# re-arms the tick only while boxes keep completing, so a tick that dispatches
# NOTHING — a governor gap/budget decline, or an owed wave that cannot be slotted
# (width cap) or run (not quiescent) — produces no box, no completion event, and
# no successor: the chain saws off its own branch, leaving cron (unreliable) the
# sole revival. Observed live: a gap-declined tick was the last tick for ~55min
# with five phase:ready issues waiting. The fix: a tick that declines/defers a
# wave WHILE ONE IS OWED arms a single successor tick itself (arm_successor),
# instead of exiting. It is idempotent and single-in-flight — it arms nothing
# when another agent-tick run is already queued/in-progress, so a future tick is
# GUARANTEED exactly when the chain would otherwise have none, with no fan-out
# and no held runner (each successor is a short scan that exits, not a sleeping
# box). A genuinely quiescent board with nothing owed arms nothing and rests.
# This demotes cron from a liveness dependency to the pure best-effort backstop
# above. A residual stall — dispatchable work with no live box and no recent tick
# — additionally surfaces as a machine-filed `alert` issue (the stall-alert step),
# so a lost wavefront is visible rather than silent.
#
# COMPUTED LIVENESS, NEVER STORED. A live agent-work run IS the claim on its
# (task, ref) pair; the deterministic run-name `work-{task}-{ref}` (#3129's
# contract) makes the claim observable. The tick enumerates runs from the
# platform (`gh run list --workflow agent-work.yml`) and classifies each by
# parsing its name — no claim label, nothing to desync on a crash. That live set
# is both the BARRIER (quiescent = no live non-land run) and the double-dispatch
# guard (an item with a matching live run is skipped). A crashed run leaves the
# resting phase unmoved and drops out of the live set, so the next tick
# re-dispatches by absence — crash recovery needs no bookkeeping.
#
# THE GOVERNOR is repo variables at one choke point, all computed statelessly
# from run history (no counter is stored):
#   - AGENT_ENABLED     — the kill switch, checked FIRST. Anything but 'true'
#                         ends the run with a summary line and zero dispatch.
#                         Flippable from the repo Variables UI with no code or
#                         secret access; halts all new dispatch within one tick.
#   - AGENT_WAVE_WIDTH  — the N-cap (default 2). Free slots = width minus the
#                         live non-land count.
#   - AGENT_MIN_WAVE_GAP_MINUTES — minimum gap since the last wave (default 0).
#   - AGENT_SCOPE_TYPES — comma-separated type:* values the fleet will scope
#                         (default feat,fix,chore,docs,perf,refactor,flake — the
#                         closed set). An issue with no type:* label, or a type
#                         outside this list, is left alone; so is anything tagged
#                         `alert`. This is the dial for WHICH KINDS of work the
#                         fleet takes on.
#   - AGENT_DAILY_WAVE_BUDGET    — daily dispatch cap (0/unset = unlimited).
#   - AGENT_NUDGE_DAYS  — stale-awaiting-answer nudge threshold in days
#                         (0/unset = nudge disabled).
#   - AGENT_STALL_ALERT_MINUTES — the residual-stall detector's silence window in
#                         minutes (default 30; 0/unset disables). A stall — ready
#                         work, no live box, no prior tick within this window —
#                         files a machine `alert` issue (#3256).
# Free-running is not a mode: it is these dials opened wide (width high, gap 0,
# budget 0), one governor with one set of knobs.
#
# THE WAVE. advanceable() maps a resting phase to a task:
#   no phase:* (Backlog)          -> scope     (framable body; agent-work's scope
#                                               self-bounces an unframable one)
#   phase:define / phase:design   -> scope     (resume a crashed scope run)
#   phase:plan                    -> approve-sweep (AUTO TIER ONLY — see below; a
#                                               judge/human-tier issue rests here
#                                               for its reader. ONE batched
#                                               dispatch covers every queued
#                                               issue; the per-issue approve
#                                               task survives for question-
#                                               resume and manual kicks)
#   phase:ready                   -> implement
#   phase:building/qa/findings    -> none       (reconciler-owned; #3126)
#   phase:held                    -> land       (ref is the open closing PR)
#   phase:bounced (directive)     -> scope       (resume via bounce-to:*; no
#                                               agent:awaiting-answer present)
#   phase:bounced (question) /
#     phase:stalled                -> none       (rest until an owner acts;
#                                               agent:awaiting-answer is what
#                                               splits directive from question)
#
# THE APPROVAL TIER (#3176) is what makes `phase:plan -> approve` safe to
# dispatch unattended. The tick decides WHETHER to dispatch; the executor's
# /approve run decides whether to APPROVE — so the gate logic keeps exactly one
# definition (the skill's) and the tick only pre-filters, cheaply, so a Claude
# run is never spent where it provably cannot advance anything. Per phase:plan
# issue: the ADR hard gate first (an `ADR flag:` line, or `docs/adr/` in the
# declared surface, makes the issue ADR-bearing; a NEW or ESTABLISHED touched
# ADR routes to the owner ahead of any policy lookup, while an in-progress-only
# Proposed-ADR touch defers to policy — ADR-0146 §6, amended #3306), then the
# issue's `## Declared surface` globs resolved against
# .github/approval-policy.yml by scripts/surface-match.py — the same matcher the
# reconciler holds a merged diff to, so the tier is resolved over exactly the
# surface that is later enforced. Most-restrictive-wins (human > judge > auto);
# an issue that declares NO surface takes the policy default and is never
# dispatched. Only `auto` advances; every other outcome logs a skip line with
# the resolved tier and rests. This is the one thing in the tick that needs repo
# code, hence the actions/checkout below — still no Claude and no cargo, so the
# tick stays free and deterministic.
#
# THE APPROVE SWEEP (#3188). Auto-tier plan issues do not dispatch one run each:
# the tick counts them and dispatches at most ONE `work-approve-sweep-all` run
# per wave, whose /approve-sweep-headless wrapper enumerates the queue itself
# and walks every eligible issue through the full per-issue gates. Approval is
# the cheapest, read-mostly step on the ladder, and batch pre-approval can queue
# many issues at once — one box per label flip wasted a wave slot and a budget
# unit apiece. The tick's per-issue tier lines above remain the pre-filter (and
# the log of WHY the sweep is worth dispatching); the sweep re-resolves each
# tier before writing, so the gate logic keeps exactly one definition. The
# sweep's (task, ref) is (approve-sweep, all): the constant ref keeps the
# run-name grammar, makes the singleton platform-enforced, and the claim it
# encodes is the whole approve queue. Crash recovery is unchanged — approved
# issues rest at phase:ready and drop out of the next enumeration, the rest are
# re-processed by the next sweep.
#
# PER-ISSUE ASKS (#3316, retiring the central verdict ticket #3190). The sweep no
# longer files one shared machine ticket for everything it cannot advance. Each
# non-advanced reply-actionable plan issue — a judge/human tier awaiting a
# verdict, a gate failure needing owner input, or a blocked-needs-you dependency
# — instead carries its OWN parked ask: the fixed awaiting-answer marker comment
# plus the agent:awaiting-answer label, exactly the per-issue ask-and-park the
# single-issue /approve-headless already writes. A self-healing candidate (an
# ordinary open dependency) rests at phase:plan with a run-summary line only.
# Convergence is the label, not a ledger: the sweep's own enumeration excludes
# agent:awaiting-answer issues, so a parked ask is not re-enumerated and cannot
# be re-asked — an unchanged ask is silent by construction. The owner's
# board-wide "what is waiting on me" view is scripts/status-sweep.sh, computed on
# demand rather than maintained as a ticket. A parked plan issue is excluded from
# the queue counts below the same way every other awaiting-answer issue is, and
# resumes down the single-issue approve path on the owner's reply.
#
# approval:pre-approved is the owner's per-issue override on that lookup: it
# resolves the tier to `auto` whatever the policy says. It CANNOT pass the ADR
# hard gate WHEN THAT GATE FIRES — a new or established ADR is load-bearing by
# definition, so there is no passable gate for one; an in-progress-only Proposed
# ADR does not fire the gate, so the override resolves it like any deferred
# issue — and it counts only when the timeline actor who applied it is the
# owner, the same verification approval:surface-ok uses. An agent
# may apply the label; it does not count. It waives the TIER (who approves), never
# /approve's gate checks (whether the issue is approvable at all), so a
# half-scoped plan still refuses rather than advancing into implement.
#
# agent:dont-touch items are filtered out of the whole scan first (the label
# blinds the dispatcher, per its contract). The snapshot is ordered
# land > question-resume > approve/implement/scope and slots are filled in that
# order.
# `land` BYPASSES THE BARRIER — dispatched every tick regardless of quiescence
# and excluded from the barrier's live set — because land runs are minutes long,
# agent-work's merged-check makes re-dispatch idempotent, and landing unblocks
# downstream. Question-resume is a backstop tier: the primary resume path is the
# owner's comment re-dispatching agent-work directly, but the tick also picks up
# an agent:awaiting-answer item whose latest comment is the owner's (they
# answered), dispatching the task matching its resting phase. A non-land item
# dispatches only when quiescent; a still-parked awaiting-answer item (no owner
# reply) is left alone. Chat runs (#3130) never enter the barrier: the run list
# is scoped to agent-work.yml, so a live owner conversation cannot stall the
# wavefront. Wave decisions go to $GITHUB_STEP_SUMMARY, not the issue timeline —
# issues and labels stay the only durable state.
#
# NUDGE. An agent:awaiting-answer item whose park (its most recent
# awaiting-answer label event) is older than AGENT_NUDGE_DAYS gets one @-owner
# nudge comment carrying an <!-- aether-nudge --> marker, de-duped by that
# marker's age so it re-nudges on cadence, not every tick. Skipped when the owner
# has already replied.
#
# IDENTITY. Every dispatch and nudge rides the aether-agent App installation
# token (actions/create-github-app-token), NOT GITHUB_TOKEN: App-created
# workflow_dispatch events trigger downstream workflows where GITHUB_TOKEN-created
# ones do not, so the completion chain would break silently on the default token.
# Least-privilege job scopes: actions: write (dispatch + run list), issues: write
# (nudge comments), contents: read.
#
# Owner console checklist (maintainer console work, NOT part of this file's
# merge — the workflow degrades cleanly until these exist, and the first dispatch
# is the acceptance test once they do):
#   Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#     - AGENT_ENABLED             set 'true' to go live (absent/other = halted)
#     - AGENT_WAVE_WIDTH          initial '2'
#     - AGENT_MIN_WAVE_GAP_MINUTES initial '0' (or unset)
#     - AGENT_DAILY_WAVE_BUDGET   initial '0'/unset (unlimited)
#     - AGENT_NUDGE_DAYS          initial '3' (0/unset disables the nudge)
#     - AGENT_STALL_ALERT_MINUTES initial '30' (0/unset disables the stall alert)
#   Secrets (SHARED with agent-work — no new secret; the App must additionally
#   hold the Actions: write permission so the tick can list runs and dispatch):
#     - AGENT_APP_ID, AGENT_APP_PRIVATE_KEY — the aether-agent GitHub App.
# Absent AGENT_ENABLED the run exits clean at step one; absent the App secrets it
# exits clean at the preflight — a red tick every 20 minutes is not the failure
# mode a periodic scanner should have.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_run:
    workflows: ["Agent work"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: >-
          Dispatch reason. Empty = a human manual kick (bypasses the gap/budget
          gate, the deliberate operator override). 'defer' = a self-armed
          successor tick (honors the gate so the re-arm chain paces against the
          minimum interval instead of collapsing it). See SELF-SUSTAINING
          WAVEFRONT in this file's header (#3256).
        required: false
        default: ""
        type: string

# Serialize overlapping triggers (a cron landing on a completion event) into one
# tick at a time so two runs never race the barrier read. cancel-in-progress is
# false: a tick is short and a superseded one still finishes its dispatch cleanly.
concurrency:
  group: agent-tick
  cancel-in-progress: false

# The tick's checkout is data, not a build: it brings the approval policy and the
# shared matcher onto the runner and nothing else compiles or runs from it. A bare
# `gh` subcommand (gh run list / gh workflow run / gh issue …) infers its target
# repo from the local git remote, so it would pick the repo up from that checkout
# anyway — but GH_REPO is the documented way to name it explicitly, it costs
# nothing, and it keeps the dispatch paths working whatever the checkout does.
# (`gh api` calls are unaffected — they carry the full repos/{owner}/{repo}/…
# path — which is why this only ever bit the dispatch paths.)
env:
  GH_REPO: ${{ github.repository }}

jobs:
  tick:
    name: Dispatch a wave
    runs-on: ubuntu-latest
    # Least privilege on the default token: actions: write backs the run list +
    # workflow_dispatch, issues: write backs the nudge comment. Every write in
    # fact rides the App token minted below; these scopes match its needs and
    # keep the default token from over-reaching.
    permissions:
      actions: write
      issues: write
      contents: read
    env:
      REPO: ${{ github.repository }}
      OWNER: iamacoffeepot
      EVENT: ${{ github.event_name }}
    steps:
      # Kill switch + required-secret preflight, before any spend. Both degrade
      # cleanly (proceed=false, exit 0): a periodic scanner must not go red every
      # tick when the fleet is deliberately off or not yet provisioned.
      - name: Preflight — kill switch and required secrets
        id: preflight
        env:
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "${AGENT_ENABLED:-}" != "true" ]; then
            echo "AGENT_ENABLED is '${AGENT_ENABLED:-unset}', not 'true' — kill switch engaged; no dispatch." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "kill switch engaged (AGENT_ENABLED != true) — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "${APP_ID:-}" ] || missing="${missing} AGENT_APP_ID"
          [ -n "${APP_PRIVATE_KEY:-}" ] || missing="${missing} AGENT_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "App secret(s) not set:${missing} — dispatcher idle until the aether-agent App is provisioned (see this workflow's header)." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "required App secret(s) missing:${missing} — degrading to a clean no-op."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Mint the App installation token — the identity every dispatch and nudge
      # rides. App-created events wake downstream workflows where GITHUB_TOKEN
      # ones do not, which is what lets the completion chain re-trigger the tick.
      - name: Mint the App installation token
        id: app-token
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # The approval policy and the shared matcher, off the default branch — the
      # two files the tier lookup below needs. Pinned to the default branch for
      # the same reason the reconciler pins its copy: an issue must not be able to
      # relax the policy it is being tiered by. Shallow; the tick builds nothing.
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.proceed == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The wave: governor gate, then the computed barrier, board scan, priority,
      # and dispatch — one step so a tick's whole reasoning is legible in one log
      # group (the reconciler's posture). The live set and the governor both read
      # the single run enumeration below.
      - name: Compute and dispatch the wave
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WAVE_WIDTH: ${{ vars.AGENT_WAVE_WIDTH }}
          SCOPE_TYPES: ${{ vars.AGENT_SCOPE_TYPES }}
          MIN_WAVE_GAP_MINUTES: ${{ vars.AGENT_MIN_WAVE_GAP_MINUTES }}
          DAILY_WAVE_BUDGET: ${{ vars.AGENT_DAILY_WAVE_BUDGET }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          owner="${REPO%/*}"
          name="${REPO#*/}"
          width="${WAVE_WIDTH:-2}"
          gap_minutes="${MIN_WAVE_GAP_MINUTES:-0}"
          daily_budget="${DAILY_WAVE_BUDGET:-0}"

          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "$1"; }
          # Per-issue decision detail goes to stdout only — the categorized
          # render below is what the job summary shows. trace() preserves the
          # existing debug line byte-for-byte on stdout; summary() stays
          # reserved for the header and the governor early-exit lines.
          trace() { echo "$1"; }
          summary "## Agent tick — $(date -u +%FT%TZ) (${EVENT})"

          # Enumerate agent-work runs once. This one read is the platform state
          # the whole tick computes over: the barrier's live set and the
          # governor's gap/budget both derive from it.
          gh run list --workflow agent-work.yml \
            --json databaseId,name,status,event,createdAt --limit 100 > /tmp/runs.json

          # Live set: non-terminal runs, keyed by the deterministic run-name.
          # A run with a name that is not `work-{task}-{ref}` is ignored.
          live_names="$(jq -r '.[]
            | select(.status=="queued" or .status=="in_progress"
                     or .status=="requested" or .status=="waiting" or .status=="pending")
            | .name' /tmp/runs.json)"
          live_pairs=""
          live_nonland=0
          while IFS= read -r rn; do
            [ -n "$rn" ] || continue
            case "$rn" in
              work-*) rest="${rn#work-}"; task="${rest%-*}"; ref="${rest##*-}" ;;
              *) continue ;;
            esac
            [ -n "$task" ] && [ -n "$ref" ] || continue
            live_pairs="${live_pairs}${task}:${ref}"$'\n'
            [ "$task" != "land" ] && live_nonland=$((live_nonland + 1))
          done <<< "$live_names"
          live_total="$(printf '%s' "$live_pairs" | grep -c . || true)"
          summary "- live agent-work runs: ${live_total} (${live_nonland} non-land)"

          # Glob match against the newline-delimited set, not a printf | grep -q
          # pipe: grep's early exit on a hit would SIGPIPE the printf under
          # pipefail and read back as a miss, dropping the double-dispatch guard.
          is_live() {
            case $'\n'"${live_pairs}" in
              *$'\n'"$1:$2"$'\n'*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Governor gap/budget gate — statelessly computed from run history. A
          # bare manual workflow_dispatch (empty reason) is the deliberate
          # operator override and skips this gate; a self-armed successor
          # (reason=defer) honors it like any scheduled/completion-chain tick, so
          # the re-arm chain paces against the minimum interval (#3256). A decline
          # here does NOT exit — it records that a wave is owed (gov_declined), so
          # the dispatch phase can arm a successor instead of sawing off the chain.
          manual_override=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "${REASON:-}" ]; then
            manual_override=true
          fi
          gov_declined=false
          gov_reason=""
          if [ "$manual_override" != "true" ]; then
            if [ "$gap_minutes" -gt 0 ]; then
              last_created="$(jq -r '[.[].createdAt] | max // empty' /tmp/runs.json)"
              if [ -n "$last_created" ]; then
                last_epoch="$(date -u -d "$last_created" +%s)"
                age_minutes=$(( ( $(date -u +%s) - last_epoch ) / 60 ))
                if [ "$age_minutes" -lt "$gap_minutes" ]; then
                  summary "- governor: last wave ${age_minutes}m ago < gap ${gap_minutes}m — no dispatch this tick."
                  gov_declined=true
                  gov_reason="gap ${gap_minutes}m (last wave ${age_minutes}m ago)"
                fi
              fi
            fi
            if [ "$gov_declined" != "true" ] && [ "$daily_budget" -gt 0 ]; then
              midnight="$(date -u -d 'today 00:00:00' +%s)"
              today_count="$(jq -r --argjson m "$midnight" \
                '[.[] | select((.createdAt | fromdateiso8601) >= $m)] | length' /tmp/runs.json)"
              if [ "$today_count" -ge "$daily_budget" ]; then
                summary "- governor: ${today_count} waves today >= budget ${daily_budget} — no dispatch this tick."
                gov_declined=true
                gov_reason="daily budget ${daily_budget} (${today_count} waves today)"
              fi
            fi
          fi

          # Board scan → advanceable snapshot. Open non-PR issues with labels;
          # `has("pull_request")|not` drops PRs (they share the issues endpoint).
          # `type` and `alert` back the scope-eligibility gate below.
          # The await read matches only a REAL park marker — the full HTML
          # comment opening at the start of a line, the shape every park
          # writer emits — never a bare substring: an issue that merely
          # QUOTES the marker in prose (backticked, mid-sentence, unclosed)
          # must not self-park (#3330 sat unlabeled and undispatchable
          # because its own body documented the marker). The (^|\n)
          # alternation anchors the line start without relying on the jq
          # regex engine's multi-line ^ default.
          gh api "repos/${REPO}/issues?state=open&per_page=100" --paginate \
            --jq '.[] | select(has("pull_request")|not)
              | [ .number,
                  ([.labels[].name | select(startswith("phase:"))] | .[0] // "none"),
                  (if (([.labels[].name] | index("agent:awaiting-answer"))
                       or ((.body // "") | test("(^|\\n)<!-- aether-agent:awaiting-answer[^>]*-->"))) then "await" else "-" end),
                  (if ([.labels[].name] | index("agent:dont-touch")) then "dt" else "-" end),
                  ([.labels[].name | select(startswith("type:")) | ltrimstr("type:")] | .[0] // "-"),
                  (if ([.labels[].name] | index("alert")) then "alert" else "-" end),
                  (if ([.labels[].name] | index("approval:pre-approved")) then "pre" else "-" end) ]
              | @tsv' > /tmp/board.tsv

          # Scope-eligibility. Backlog means "no phase:* label", which is also true
          # of every machine-filed alert that lands in the repo — and the tick used
          # to scope those. The context-budget canary and the nightly fuzzer both
          # file issues with NO labels at all, so the fleet had a standing feed of
          # alerts it would walk through Define/Design/Plan, each costing a full
          # Claude run to discover it should not have (#3179 was scoped for seven
          # minutes before being cancelled by hand).
          #
          # Filtering by AUTHOR would be wrong: the fleet's own App files real work
          # — a scoping agent split the fat #3145 into #3162 and #3163, and those
          # must be scoped. The signal that separates them is `type:*`. Every real
          # work item carries one (/sketch stamps it from the conventional-commit
          # title, and split children inherit it); an alert filed outside the
          # pipeline carries none.
          #
          # AGENT_SCOPE_TYPES is the owner's dial for WHICH KINDS of work the fleet
          # takes on, alongside the other governors. An issue whose type is not in
          # the list is left alone, and so is anything tagged `alert`. Fail-safe: an
          # issue the tick cannot classify is NOT scoped — silence costs a human one
          # label, the opposite costs a Claude run and a design nobody asked for.
          scope_types="${SCOPE_TYPES:-feat,fix,chore,docs,perf,refactor,flake}"
          scopeable() {
            case ",${scope_types}," in
              *",$1,"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Resolve the open PR that closes a held issue — land's ref is that PR,
          # not the issue. includeClosedPrs:false already excludes merged/closed.
          resolve_open_pr() {
            gh api graphql -f query='
              query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  issue(number:$number){
                    closedByPullRequestsReferences(first:20, includeClosedPrs:false){
                      nodes{ number state merged }
                    }
                  }
                }
              }' -f owner="$owner" -f name="$name" -F number="$1" \
              --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[]
                     | select(.state=="OPEN" and (.merged|not))] | .[0].number // empty'
          }

          # Park-anchored owner-reply read (#3330). The old read took only the
          # LATEST comment author, and agent-chat acks every owner comment on
          # a parked issue — the ack landed after the reply, so the newest
          # author was always the bot and owner_answered could never become
          # true (observed on #3316: the park was unclearable by commenting).
          # Anchor on the park moment instead and ask whether ANY comment
          # after it is owner-authored — no later automated comment can bury
          # the reply. The anchor is the newest comment carrying a real park
          # marker (the full HTML comment opening at line start, same anchored
          # form as the board scan above), falling back to the newest
          # agent:awaiting-answer label event for a marker-less park.
          # RFC3339-Z timestamps (what the API returns) compare
          # chronologically as plain strings. Comments come oldest-first;
          # head/tail -n1 under `|| true` is the file's SIGPIPE-safe idiom.
          park_anchor() {
            local ts
            ts="$(gh api "repos/${REPO}/issues/${1}/comments?per_page=100" --paginate \
              --jq '[.[] | select(.body // "" | test("(^|\\n)<!-- aether-agent:awaiting-answer[^>]*-->")) | .created_at] | last // empty' \
              | tail -n1 || true)"
            if [ -z "$ts" ]; then
              ts="$(gh api "repos/${REPO}/issues/${1}/timeline?per_page=100" --paginate \
                --jq '[.[] | select(.event=="labeled" and .label.name=="agent:awaiting-answer") | .created_at] | last // empty' \
                | tail -n1 || true)"
            fi
            printf '%s' "$ts"
          }

          # The owner's first comment strictly after the park anchor — empty
          # when the question is unanswered or no park anchor exists.
          owner_answer_ts() {
            local park
            park="$(park_anchor "$1")"
            [ -n "$park" ] || return 0
            gh api "repos/${REPO}/issues/${1}/comments?per_page=100" --paginate \
              --jq ".[] | select(.user.login == \"${OWNER}\" and .created_at > \"${park}\") | .created_at" \
              | head -n1 || true
          }

          owner_answered() {
            [ -n "$(owner_answer_ts "$1")" ]
          }

          # A rescued answer older than one tick interval (the ~20m schedule
          # cadence) means the primary agent-chat path had its chance and did NOT
          # clear the park: the tick backstop is rescuing a silently-stranded
          # answer, which warrants a visible alert (#3265). The grace is one tick
          # interval so a freshly-answered surface the tick legitimately picks up
          # is never alerted. Ages the owner's park-anchored reply itself, not
          # the newest comment — a later bot ack must not reset the clock.
          STRAND_GRACE_SECS=1200
          answer_stale() {
            local ts age
            ts="$(owner_answer_ts "$1")"
            [ -n "$ts" ] || return 1
            age=$(( $(date -u +%s) - $(date -u -d "$ts" +%s) ))
            [ "$age" -ge "$STRAND_GRACE_SECS" ]
          }

          # The approval tier of a phase:plan issue — the pre-filter that decides
          # whether an auto-approval run is worth dispatching at all. Echoes one
          # word: `adr` (the ADR hard gate fired), `none` (no declared surface),
          # or the resolved tier (`auto` / `judge` / `human` / `?` when the policy
          # is unreadable). Only `auto` dispatches; every other word rests the
          # issue at phase:plan for its human or judge reader. Fail-safe by
          # construction — nothing but an explicit `auto` opens the gate.
          approval_tier() {
            local body surface adr_flag=0 adr_lines
            body="$(gh api "repos/${REPO}/issues/${1}" --jq '.body // ""')"
            # ADR hard gate, ahead of the policy lookup, exactly as /approve
            # states it (ADR-0146 §6, amended #3306): the gate is MATURITY-aware,
            # not presence-aware. An issue is ADR-bearing when it NEEDS an ADR
            # (the flag line /scope emits) or WRITES/edits one (docs/adr/ in the
            # surface). A NEW ADR (absent on origin/main) or an amendment to an
            # ESTABLISHED one (Status != Proposed) is the owner's; only a change
            # to a still-Proposed ADR mid-arc defers to the policy lookup below.
            # Merely citing an ADR is not the test — every well-scoped issue does.
            grep -qi 'ADR flag:' <<<"$body" && adr_flag=1
            surface="$(awk '/^## Declared surface/{f=1; next} /^## /{f=0} f' <<<"$body" \
              | sed -n '/^[[:space:]]*```/,/^[[:space:]]*```/p' | sed '1d;$d' \
              | grep -v '^[[:space:]]*$' || true)"
            adr_lines="$(grep '^[[:space:]]*docs/adr/' <<<"$surface" || true)"
            # ADR-bearing: an ADR flag OR a declared docs/adr/ path. Run the
            # maturity read; a non-ADR issue skips it and falls straight through.
            if [ "$adr_flag" = 1 ] || [ -n "$adr_lines" ]; then
              local proposed_seen=0 path status
              # Classify each declared docs/adr/ file against origin/main. New
              # (absent) or established (Status != Proposed) fires the gate ->
              # human. Track whether any line resolved to an existing Proposed
              # ADR; when none does (an ADR flag naming a not-yet-written ADR, an
              # unreadable status line, or a path resolving to no file), fail
              # safe to the owner — in-progress maturity must be PROVEN.
              while IFS= read -r path; do
                path="$(printf '%s' "$path" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                [ -z "$path" ] && continue
                if ! git cat-file -e "origin/main:${path}" 2>/dev/null; then
                  echo "adr"; return
                fi
                status="$(git show "origin/main:${path}" 2>/dev/null \
                  | grep -m1 '^- \*\*Status:\*\*' || true)"
                if [ -z "$status" ]; then echo "adr"; return; fi
                if grep -qi 'Proposed' <<<"$status"; then
                  proposed_seen=1
                else
                  echo "adr"; return
                fi
              done <<<"$adr_lines"
              if [ "$proposed_seen" != 1 ]; then echo "adr"; return; fi
              # Every touched ADR is an existing Proposed one — defer to policy.
            fi
            if [ -z "$surface" ]; then echo "none"; return; fi
            printf '%s\n' "$surface" > "/tmp/surface-${1}.txt"
            # Isolated mode keeps a changed checkout from shadowing stdlib imports
            # beside this trusted matcher while the App token is in scope.
            python3 -I scripts/surface-match.py --tier "/tmp/surface-${1}.txt" .github/approval-policy.yml
          }

          # Bucket advanceable items by priority tier. land bypasses the barrier
          # and the slot budget; approve/scope/implement need quiescence; an
          # awaiting-answer approve/scope/implement item only advances when the
          # owner has replied (question-resume), else it is left parked.
          land_items=""
          resume_items=""
          strand_items=""
          work_items=""
          approve_queue=0

          # Categorized job-summary render (additive over the trace above): each
          # terminal decision below appends one compact entry to the matching
          # accumulator, rendered as a "### <Category> (<count>)" block at the
          # end of the step. Empty categories are omitted from the render.
          cat_dispatched=""
          cat_deferred=""
          cat_waiting=""
          cat_resting=""
          cat_excluded=""
          cat_warnings=""

          while IFS=$'	' read -r num phase await dt itype alert preapp; do
            [ -n "$num" ] || continue
            if [ "$dt" = "dt" ]; then
              trace "- skip #${num}: agent:dont-touch"
              cat_excluded="${cat_excluded}#${num} — agent:dont-touch"$'\n'
              continue
            fi
            if [ "$alert" = "alert" ]; then
              trace "- skip #${num}: alert — machine-filed, not a work item"
              cat_excluded="${cat_excluded}#${num} — alert, machine-filed"$'\n'
              continue
            fi
            case "$phase" in
              none|phase:define|phase:design|phase:bounced)
                # A bounced issue resumes via the bounce-to:* contract /scope
                # already implements (#3250 evidence); await-parking below (the
                # "$await" = "await" check) is what splits a directive bounce
                # (dispatched here) from a question bounce (parked instead).
                #
                # The type gate applies to the whole scope arm, not just Backlog: an
                # issue already at define/design got there through the pipeline and
                # will carry a type:*, so a missing one still means "not ours".
                if [ "$itype" = "-" ]; then
                  trace "- skip #${num}: no type:* label — not a pipeline work item"
                  cat_excluded="${cat_excluded}#${num} — no type:* label"$'\n'
                  continue
                fi
                if ! scopeable "$itype"; then
                  trace "- skip #${num}: type:${itype} not in AGENT_SCOPE_TYPES (${scope_types})"
                  cat_excluded="${cat_excluded}#${num} — type:${itype} not in AGENT_SCOPE_TYPES"$'\n'
                  continue
                fi
                task="scope"; ref="$num"
                ;;
              phase:plan)
                tier="$(approval_tier "$num")"
                # approval:pre-approved is the owner's per-issue override: it
                # resolves the tier to auto. It sits BELOW the ADR hard gate and
                # cannot pass it — an ADR is load-bearing by definition, so there is
                # no passable gate for one, and `adr` is matched first below.
                #
                # It must be the OWNER'S label. Verified against the timeline actor
                # of the most recent `labeled` event, the same shape as
                # approval:surface-ok. An agent may apply the label;
                # it simply does not count. Without this check an agent could grant
                # itself unbounded approval authority through a side door, which is
                # the one thing the whole tier policy exists to prevent.
                #
                # It waives the TIER (who approves), never the gate checks (whether
                # the issue is approvable at all — sections present, one model:*,
                # dependencies closed, freshness). Those still run in /approve; a
                # half-scoped plan is a defect to fix, not something to wave into
                # implement.
                if [ "$tier" != "adr" ] && [ "$preapp" = "pre" ]; then
                  actor="$(gh api "repos/${REPO}/issues/${num}/timeline" --paginate \
                    --jq '[.[] | select(.event=="labeled" and .label.name=="approval:pre-approved")] | last | .actor.login // empty')"
                  if [ "$actor" = "$OWNER" ]; then
                    trace "- #${num}: approval:pre-approved by the owner (tier was ${tier}) — treated as auto"
                    tier="auto"
                  else
                    trace "- #${num}: approval:pre-approved ignored — applied by '${actor:-unknown}', not the owner"
                  fi
                fi
                case "$tier" in
                  auto)
                    # Auto-tier issues do not dispatch one run each — they queue
                    # for the wave's single approve sweep (THE APPROVE SWEEP,
                    # header above). The one exception is question-resume: an
                    # awaiting-answer issue keeps the per-issue approve task so
                    # an answered park resumes down the single-issue path rather
                    # than being batch-processed.
                    if [ "$await" = "await" ]; then
                      trace "- #${num}: approval tier auto — awaiting-answer, per-issue approve on owner reply"
                      task="approve"; ref="$num"
                    else
                      trace "- #${num}: approval tier auto — queued for the approve sweep"
                      approve_queue=$((approve_queue + 1))
                      continue
                    fi
                    ;;
                  # A non-auto outcome rests at phase:plan — the sweep parks the
                  # reply-actionable ones per issue (PER-ISSUE ASKS, header above);
                  # the tick only skips and logs, never counts a separate queue.
                  adr)
                    trace "- skip #${num}: ADR hard gate — the owner approves this one"
                    cat_waiting="${cat_waiting}#${num} — ADR hard gate"$'\n'
                    continue ;;
                  none)
                    trace "- skip #${num}: no declared surface — not auto-approvable"
                    cat_waiting="${cat_waiting}#${num} — no declared surface"$'\n'
                    continue ;;
                  *)
                    trace "- skip #${num}: approval tier ${tier} — awaiting its reader"
                    cat_waiting="${cat_waiting}#${num} — approval tier ${tier}, awaiting its reader"$'\n'
                    continue ;;
                esac
                ;;
              phase:ready)
                # A pure umbrella never dispatches implement (#3212): /implement
                # refuses any non-empty ## Sub-issues issue, so a dispatch is a
                # box-burn loop. When every listed child is closed the umbrella
                # itself is done — the tick closes it here, because an umbrella
                # never gets a PR and so is structurally unreachable by the
                # PR-driven reconciler. Otherwise it rests. A parse failure
                # (no child references found) rests rather than closes.
                sub_issues="$(gh api "repos/${REPO}/issues/${num}" --jq '.body // ""' \
                  | awk '/^## Sub-issues/{f=1; next} /^## /{f=0} f' \
                  | grep -v '^[[:space:]]*$' || true)"
                if [ -n "$sub_issues" ]; then
                  children="$(grep -oE '^[[:space:]]*-[[:space:]]+#[0-9]+' <<<"$sub_issues" \
                    | grep -oE '[0-9]+' | sort -u || true)"
                  found=0 open_children=0
                  for child in $children; do
                    found=$((found + 1))
                    child_state="$(gh api "repos/${REPO}/issues/${child}" --jq '.state' || echo unknown)"
                    [ "$child_state" = "closed" ] || open_children=$((open_children + 1))
                  done
                  if [ "$found" -ge 1 ] && [ "$open_children" -eq 0 ]; then
                    gh api -X DELETE "repos/${REPO}/issues/${num}/labels/phase:ready" >/dev/null \
                      || { w="- warn #${num}: umbrella close could not delete phase:ready"; trace "$w"; cat_warnings="${cat_warnings}${w}"$'\n'; }
                    gh api -X PATCH "repos/${REPO}/issues/${num}" -f state=closed -f state_reason=completed >/dev/null \
                      || { w="- warn #${num}: umbrella close PATCH failed"; trace "$w"; cat_warnings="${cat_warnings}${w}"$'\n'; }
                    printf 'Pure umbrella auto-closed by the tick: all %s listed children are closed (#3212).\n' "$found" > /tmp/umbrella-close.md
                    gh api -X POST "repos/${REPO}/issues/${num}/comments" -F body=@/tmp/umbrella-close.md >/dev/null \
                      || { w="- warn #${num}: umbrella close comment failed"; trace "$w"; cat_warnings="${cat_warnings}${w}"$'\n'; }
                    trace "- closed #${num}: pure umbrella, all ${found} children closed"
                    cat_dispatched="${cat_dispatched}#${num} — pure umbrella auto-closed (${found} children closed)"$'\n'
                  else
                    trace "- skip #${num}: pure umbrella, ${open_children}/${found} children still open — resting at phase:ready"
                    cat_resting="${cat_resting}#${num} — pure umbrella, ${open_children}/${found} children still open"$'\n'
                  fi
                  continue
                fi
                task="implement"; ref="$num" ;;
              phase:held) task="land"; ref="" ;;
              *) continue ;;
            esac
            if [ "$task" = "land" ]; then
              ref="$(resolve_open_pr "$num" || true)"
              if [ -z "$ref" ]; then
                trace "- skip #${num}: phase:held but no open closing PR"
                cat_excluded="${cat_excluded}#${num} — phase:held, no open closing PR"$'\n'
                continue
              fi
            fi
            if is_live "$task" "$ref"; then
              trace "- skip work-${task}-${ref}: already live"
              cat_deferred="${cat_deferred}work-${task}-${ref} — already live"$'\n'
              continue
            fi
            if [ "$task" = "land" ]; then
              if [ "$await" = "await" ] && ! owner_answered "$num"; then
                trace "- skip #${num}: phase:held land parked on agent:awaiting-answer, owner has not replied"
                cat_waiting="${cat_waiting}#${num} — phase:held land parked, owner has not replied"$'\n'
                continue
              fi
              land_items="${land_items}${task} ${ref}"$'\n'
              continue
            fi
            if [ "$await" = "await" ]; then
              if owner_answered "$num"; then
                resume_items="${resume_items}${task} ${ref}"$'\n'
                # The owner answered but the surface is still parked, so the tick
                # is the backstop rescuing it. If that answer has sat past the
                # grace, the primary agent-chat path dropped it silently — record
                # the strand so a visible alert is filed once it dispatches (#3265).
                if answer_stale "$num"; then
                  strand_items="${strand_items}${num} "
                fi
              else
                trace "- skip #${num}: agent:awaiting-answer, owner has not replied — parked"
                cat_waiting="${cat_waiting}#${num} — agent:awaiting-answer, owner has not replied"$'\n'
              fi
            else
              work_items="${work_items}${task} ${ref}"$'\n'
            fi
          done < /tmp/board.tsv

          # At most one approve sweep per wave, dispatched on auto-tier issues to
          # advance. It is a single work-approve-sweep-all item at the head of the
          # work list, costing one slot and one budget unit whatever the queue
          # depth. The sweep's own run walks the whole plan queue — advancing the
          # auto set and parking the reply-actionable non-auto remainder per issue
          # (PER-ISSUE ASKS, header above) — so the tick counts only the auto
          # queue as the dispatch reason. The is_live read is the same singleton
          # guard every task uses (a live sweep also holds the quiescence barrier
          # below, so this line mostly buys the summary).
          sweep_why=""
          if [ "${approve_queue}" -gt 0 ]; then
            sweep_why="${approve_queue} auto-tier"
          fi
          if [ -n "${sweep_why}" ]; then
            if is_live "approve-sweep" "all"; then
              trace "- skip approve sweep: work-approve-sweep-all already live (${sweep_why})"
              cat_deferred="${cat_deferred}work-approve-sweep-all — already live (${sweep_why})"$'\n'
            else
              work_items="approve-sweep all"$'\n'"${work_items}"
              trace "- approve sweep: ${sweep_why} plan issue(s) — one work-approve-sweep-all dispatch"
            fi
          fi

          dispatch() {
            gh workflow run agent-work.yml -f task="$1" -f ref="$2"
            trace "- dispatched: work-${1}-${2}"
            cat_dispatched="${cat_dispatched}work-${1}-${2}"$'\n'
          }

          # Guarantee a successor tick when a wave is owed but this tick did not
          # dispatch it (#3256). Idempotent and single-in-flight: if any
          # agent-tick run other than this one is already queued/in-progress a
          # future tick is already guaranteed, so we arm nothing — this is what
          # bounds the re-arm to at most one extra tick in flight (no fan-out) and
          # what makes it a no-op in normal operation, where completion events
          # keep a tick queued. The successor carries reason=defer so it honors
          # the gap/budget gate (it is a short scan that exits, never a sleeping
          # held runner); the concurrency: agent-tick group serializes it.
          arm_successor() {
            local others
            others="$(gh run list --workflow agent-tick.yml --json databaseId,status --limit 100 \
              --jq '[.[] | select(.status=="queued" or .status=="in_progress"
                                  or .status=="requested" or .status=="waiting" or .status=="pending")
                      | .databaseId | select(. != '"${GITHUB_RUN_ID}"')] | length' 2>/dev/null || echo 0)"
            if [ "${others:-0}" -gt 0 ]; then
              summary "- successor already armed (${others} agent-tick run(s) in flight) — not re-arming (${1})."
              return 0
            fi
            gh workflow run agent-tick.yml -f reason=defer
            summary "- armed a successor tick (reason=defer) — ${1} owes a wave."
          }

          # Governor declined this tick (gap/budget): dispatch nothing, but if a
          # wave is OWED — advanceable work is on the board that the decline held
          # back — arm one successor so the owed wave is not stranded waiting on a
          # completion event that will not fire. Nothing owed → the chain rests.
          if [ "$gov_declined" = "true" ]; then
            if [ -n "${land_items}${resume_items}${work_items}" ]; then
              arm_successor "governor decline (${gov_reason})"
            else
              summary "- governor declined and nothing advanceable — no wave owed, chain rests."
            fi
            exit 0
          fi

          # Land first — every held PR, regardless of quiescence, off the slot
          # budget.
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            # shellcheck disable=SC2086
            set -- $entry
            dispatch "$1" "$2"
          done <<< "$land_items"

          # Non-land only when quiescent (no live non-land run). Slots = width
          # minus the live non-land count (0 here, so width); question-resume
          # fills ahead of fresh work.
          deferred_nonland=0
          if [ "$live_nonland" -eq 0 ]; then
            slots=$(( width - live_nonland ))
            [ "$slots" -lt 0 ] && slots=0
            filled=0
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              if [ "$filled" -ge "$slots" ]; then
                trace "- deferred (slots full): ${entry}"
                cat_deferred="${cat_deferred}work-${entry%% *}-${entry#* } — slots full"$'\n'
                deferred_nonland=$((deferred_nonland + 1))
                continue
              fi
              # shellcheck disable=SC2086
              set -- $entry
              dispatch "$1" "$2"
              filled=$((filled + 1))
            done <<< "${resume_items}${work_items}"
            trace "- filled ${filled}/${slots} non-land slot(s)."

            # A rescued strand means an owner answer did not resume via the
            # primary agent-chat path — file a visible alert so a dropped decision
            # is not a silent green success (#3265). Keep one open alert issue and
            # append, mirroring context-budget-canary.yml's upsert; the hidden
            # marker dedups against the open alert.
            if [ -n "${strand_items}" ]; then
              alert_title="ci: owner answer stranded — resumed by the tick backstop"
              {
                echo "<!-- aether-alert:stranded-answer -->"
                echo "The tick backstop re-dispatched an owner-answered awaiting-answer surface whose answer had already sat past the grace: the primary \`agent-chat\` path did not resume it. Each such rescue is an owner decision that read as a green success while nothing moved."
                echo
                printf 'Stranded this tick:'
                for s in ${strand_items}; do printf ' #%s' "$s"; done
                echo
                echo
                echo "- Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
              } > /tmp/strand-alert.md
              existing_alert="$(gh issue list --state open --search "${alert_title} in:title" \
                --json number,title \
                --jq "map(select(.title == \"${alert_title}\")) | .[0].number // empty" || true)"
              if [ -n "$existing_alert" ]; then
                gh issue comment "$existing_alert" --body-file /tmp/strand-alert.md \
                  && { trace "- alert: appended stranded-answer rescue to #${existing_alert} (${strand_items})"; \
                       cat_dispatched="${cat_dispatched}stranded-answer alert appended to #${existing_alert} (${strand_items})"$'\n'; } \
                  || { w="- warn: could not append stranded-answer rescue to #${existing_alert}"; trace "$w"; cat_warnings="${cat_warnings}${w}"$'\n'; }
              else
                gh issue create --title "$alert_title" --body-file /tmp/strand-alert.md --label alert \
                  && { trace "- alert: filed stranded-answer rescue issue (${strand_items})"; \
                       cat_dispatched="${cat_dispatched}stranded-answer alert filed (${strand_items})"$'\n'; } \
                  || { w="- warn: could not file stranded-answer rescue issue (${strand_items})"; trace "$w"; cat_warnings="${cat_warnings}${w}"$'\n'; }
              fi
            fi
          else
            deferred_nonland="$(printf '%s' "${resume_items}${work_items}" | grep -c . || true)"
            trace "- not quiescent: ${live_nonland} live non-land run(s) — deferring new approve/scope/implement."
            cat_deferred="${cat_deferred}approve/scope/implement — not quiescent (${live_nonland} live non-land run(s))"$'\n'
          fi

          # An owed wave that could not be slotted (width cap) or run (not
          # quiescent) still needs a guaranteed successor — the not-quiescent case
          # normally re-arms via the completing box's workflow_run event, but that
          # event can be dropped, so arm here too. The idempotency guard keeps this
          # a no-op whenever a tick is already queued.
          if [ "$deferred_nonland" -gt 0 ]; then
            arm_successor "${deferred_nonland} non-land item(s) deferred"
          fi

          # Categorized job-summary render — additive over the trace() detail
          # above, which already reached stdout as each decision was made. A
          # summary-only echo (not trace) keeps this pass from doubling stdout.
          # Empty categories are omitted so a quiet tick's summary stays short.
          summary_only() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          render_category() {
            local title="$1" acc="$2" count
            count="$(printf '%s' "$acc" | grep -c . || true)"
            [ "$count" -gt 0 ] || return 0
            summary_only ""
            summary_only "### ${title} (${count})"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              summary_only "- ${line}"
            done <<< "$acc"
          }
          render_category "Dispatched" "$cat_dispatched"
          render_category "Deferred — will retry next tick" "$cat_deferred"
          render_category "Waiting on the owner" "$cat_waiting"
          render_category "Resting" "$cat_resting"
          render_category "Excluded" "$cat_excluded"
          render_category "Warnings" "$cat_warnings"

      # Stall visibility (#3256). The self-sustaining wavefront above guards
      # against a lost chain, but a genuine liveness loss — a future regression, or
      # a self-dispatch that somehow misses — must be VISIBLE rather than silent:
      # the incident that motivated this ran ~55min unnoticed. This is the
      # residual-stall detector. On the conjunction of (dispatchable work on the
      # board) AND (no live non-land agent-work run) AND (no agent-tick run other
      # than this one within the last AGENT_STALL_ALERT_MINUTES), it upserts one
      # `alert` issue by title — the same dedup-by-title, file-or-comment shape the
      # context-budget canary and the nightly fuzzer use. Its own step, independent
      # of the governor gate, so a stall inside a gap window is still surfaced.
      - name: File a stall alert when the wavefront is lost
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCOPE_TYPES: ${{ vars.AGENT_SCOPE_TYPES }}
          STALL_MINUTES: ${{ vars.AGENT_STALL_ALERT_MINUTES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          stall_minutes="${STALL_MINUTES:-30}"
          if [ "$stall_minutes" -le 0 ]; then
            echo "AGENT_STALL_ALERT_MINUTES is '${stall_minutes}' — stall detection disabled."
            exit 0
          fi

          # (1) Any live non-land agent-work run means the fleet is working — not
          # stalled — so stop early. Land runs are excluded (they bypass the
          # barrier and are minutes-long, so a live land is not "the fleet works").
          gh run list --workflow agent-work.yml --json name,status --limit 100 > /tmp/stall-runs.json
          live_nonland=0
          while IFS= read -r rn; do
            [ -n "$rn" ] || continue
            case "$rn" in work-land-*) continue ;; work-*) live_nonland=$((live_nonland + 1)) ;; esac
          done < <(jq -r '.[]
            | select(.status=="queued" or .status=="in_progress"
                     or .status=="requested" or .status=="waiting" or .status=="pending")
            | .name' /tmp/stall-runs.json)
          if [ "$live_nonland" -gt 0 ]; then
            echo "${live_nonland} live non-land run(s) — fleet is working, no stall."
            exit 0
          fi

          # (2) The most recent agent-tick run OTHER than this one. This run is a
          # tick happening now, so it cannot itself prove liveness — the signal is
          # whether the PREVIOUS tick was long enough ago that the fleet went
          # silent (the completion chain died and only this tick, likely cron or a
          # manual kick, revived it).
          prev_tick="$(gh run list --workflow agent-tick.yml --json databaseId,createdAt --limit 100 \
            --jq '[.[] | select(.databaseId != '"${GITHUB_RUN_ID}"')] | max_by(.createdAt) | .createdAt // empty')"
          if [ -n "$prev_tick" ]; then
            prev_age_min=$(( ( $(date -u +%s) - $(date -u -d "$prev_tick" +%s) ) / 60 ))
            if [ "$prev_age_min" -lt "$stall_minutes" ]; then
              echo "previous tick ${prev_age_min}m ago < ${stall_minutes}m — ticks are firing, no stall."
              exit 0
            fi
            prev_desc="${prev_age_min}m ago"
          else
            prev_desc="never (no prior agent-tick run found)"
          fi

          # (3) Is there dispatchable work the fleet should be advancing? A lite
          # board scan mirroring the dispatcher's advanceable/scopeable logic:
          # ready/plan/held are dispatchable directly; a backlog/define/design/
          # bounced issue is dispatchable only with a scopeable type:*. Parked
          # (agent:awaiting-answer), alert, and dont-touch items are not owed.
          scope_types="${SCOPE_TYPES:-feat,fix,chore,docs,perf,refactor,flake}"
          scopeable() { case ",${scope_types}," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          gh api "repos/${REPO}/issues?state=open&per_page=100" --paginate \
            --jq '.[] | select(has("pull_request")|not)
              | [ .number,
                  ([.labels[].name | select(startswith("phase:"))] | .[0] // "none"),
                  (if ([.labels[].name] | index("agent:awaiting-answer")) then "await" else "-" end),
                  (if ([.labels[].name] | index("agent:dont-touch")) then "dt" else "-" end),
                  ([.labels[].name | select(startswith("type:")) | ltrimstr("type:")] | .[0] // "-"),
                  (if ([.labels[].name] | index("alert")) then "alert" else "-" end) ]
              | @tsv' > /tmp/stall-board.tsv
          dispatchable=0
          while IFS=$'\t' read -r num phase await dt itype alert; do
            [ -n "$num" ] || continue
            { [ "$dt" = "dt" ] || [ "$alert" = "alert" ] || [ "$await" = "await" ]; } && continue
            case "$phase" in
              phase:ready|phase:plan|phase:held) dispatchable=$((dispatchable + 1)) ;;
              none|phase:define|phase:design|phase:bounced)
                if [ "$itype" != "-" ] && scopeable "$itype"; then dispatchable=$((dispatchable + 1)); fi ;;
            esac
          done < /tmp/stall-board.tsv
          if [ "$dispatchable" -eq 0 ]; then
            echo "no dispatchable work on the board — an idle fleet is not a stall."
            exit 0
          fi

          # All three hold: dispatchable work, no live box, no recent prior tick.
          # Upsert one alert issue by title (file-or-comment, dedup by exact
          # title), matching the canary/fuzzer shape. The alert label makes the
          # dispatcher skip it as a non-work item.
          title="alert: agent fleet stall - dispatchable work with no live box"
          {
            echo "The agent fleet appears to have stalled: **${dispatchable}** dispatchable issue(s) on the board, no live non-land \`agent-work\` run, and the previous \`agent-tick\` was ${prev_desc} (threshold ${stall_minutes}m)."
            echo
            echo "The completion chain likely sawed off its own branch — a no-op tick left no successor (#3256) — and cron did not cover it. This tick is filing the alert as it recovers; if this recurs, investigate why the self-sustaining wavefront did not arm a successor."
            echo
            echo "- Run: ${RUN_URL}"
          } > /tmp/stall-alert.md
          existing="$(gh issue list --state open --search "${title} in:title" \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            echo "Commenting on existing stall alert #${existing}."
            gh issue comment "$existing" --body-file /tmp/stall-alert.md
          else
            echo "Filing stall alert."
            gh issue create --title "$title" --body-file /tmp/stall-alert.md --label alert
          fi

      # Re-notify the owner about stale parked questions. Independent of the wave
      # governor (a stale question is nudged even inside a gap window), so it is
      # its own step guarded on the preflight alone.
      - name: Nudge stale awaiting-answers
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUDGE_DAYS: ${{ vars.AGENT_NUDGE_DAYS }}
        run: |
          set -euo pipefail
          nudge_days="${NUDGE_DAYS:-0}"
          if [ "$nudge_days" -le 0 ]; then
            echo "AGENT_NUDGE_DAYS is '${nudge_days}' — nudge disabled."
            exit 0
          fi
          now_epoch="$(date -u +%s)"
          threshold=$(( nudge_days * 86400 ))

          gh api "repos/${REPO}/issues?state=open&per_page=100&labels=agent:awaiting-answer" --paginate \
            --jq '.[] | select(has("pull_request")|not) | .number' > /tmp/await.txt

          while IFS= read -r num; do
            [ -n "$num" ] || continue

            labels="$(gh api "repos/${REPO}/issues/${num}/labels" --jq '.[].name' || true)"
            if grep -qxF 'agent:dont-touch' <<<"$labels"; then
              echo "#${num}: agent:dont-touch — skip"; continue
            fi

            # Park time = the most recent agent:awaiting-answer label event.
            park="$(gh api "repos/${REPO}/issues/${num}/timeline?per_page=100" --paginate \
              --jq '[.[] | select(.event=="labeled" and .label.name=="agent:awaiting-answer") | .created_at] | last // empty' || true)"
            [ -n "$park" ] || continue
            park_age=$(( now_epoch - $(date -u -d "$park" +%s) ))
            if [ "$park_age" -lt "$threshold" ]; then
              echo "#${num}: parked $(( park_age / 86400 ))d < ${nudge_days}d — not stale"; continue
            fi

            # Do not nudge a question the owner has already answered — any
            # owner comment after the park counts, not just the newest: a
            # later bot ack must not bury the reply and re-nudge an answered
            # question (#3330). RFC3339-Z timestamps compare as strings, and
            # $park is already in hand from the label-event read above.
            owner_reply="$(gh api "repos/${REPO}/issues/${num}/comments?per_page=100" --paginate \
              --jq ".[] | select(.user.login == \"${OWNER}\" and .created_at > \"${park}\") | .created_at" \
              | head -n1 || true)"
            if [ -n "$owner_reply" ]; then
              echo "#${num}: owner already replied — skip nudge"; continue
            fi

            # De-dup: re-nudge on cadence, not every tick. A marker comment
            # younger than the threshold means the last nudge is still fresh.
            last_nudge="$(gh api "repos/${REPO}/issues/${num}/comments?per_page=100" --paginate \
              --jq '[.[] | select(.body | contains("<!-- aether-nudge -->")) | .created_at] | last // empty' || true)"
            if [ -n "$last_nudge" ]; then
              if [ $(( now_epoch - $(date -u -d "$last_nudge" +%s) )) -lt "$threshold" ]; then
                echo "#${num}: nudged within the cadence — skip"; continue
              fi
            fi

            cat > /tmp/nudge.md <<EOF
          @${OWNER} — issue #${num} has been waiting on your answer for $(( park_age / 86400 )) day(s). Reply here and the fleet resumes it on the next tick.

          <!-- aether-nudge -->
          EOF
            gh api -X POST "repos/${REPO}/issues/${num}/comments" -F body=@/tmp/nudge.md
            echo "#${num}: nudged"
          done < /tmp/await.txt

          # Stale bounces: a directive bounce dispatches on the next quiescent
          # wave (the scope arm above), so a healthy one never sits at
          # phase:bounced long enough to cross the day-scale threshold below.
          # This loop only ever fires for one that's stuck (kill switch off,
          # type:* outside AGENT_SCOPE_TYPES, or a persistent re-scope loop).
          # A question bounce also carries agent:awaiting-answer and is already
          # nudged by the loop above, so it's excluded here to avoid a double
          # nudge.
          gh api "repos/${REPO}/issues?state=open&per_page=100&labels=phase:bounced" --paginate \
            --jq '.[] | select(has("pull_request")|not) | .number' > /tmp/bounced.txt

          while IFS= read -r num; do
            [ -n "$num" ] || continue

            labels="$(gh api "repos/${REPO}/issues/${num}/labels" --jq '.[].name' || true)"
            if grep -qxF 'agent:dont-touch' <<<"$labels"; then
              echo "#${num}: agent:dont-touch — skip"; continue
            fi
            if grep -qxF 'agent:awaiting-answer' <<<"$labels"; then
              echo "#${num}: agent:awaiting-answer — already covered by the loop above"; continue
            fi

            # Park time = the most recent phase:bounced label event.
            park="$(gh api "repos/${REPO}/issues/${num}/timeline?per_page=100" --paginate \
              --jq '[.[] | select(.event=="labeled" and .label.name=="phase:bounced") | .created_at] | last // empty' || true)"
            [ -n "$park" ] || continue
            park_age=$(( now_epoch - $(date -u -d "$park" +%s) ))
            if [ "$park_age" -lt "$threshold" ]; then
              echo "#${num}: bounced $(( park_age / 86400 ))d < ${nudge_days}d — not stale"; continue
            fi

            # De-dup: re-nudge on cadence, not every tick.
            last_nudge="$(gh api "repos/${REPO}/issues/${num}/comments?per_page=100" --paginate \
              --jq '[.[] | select(.body | contains("<!-- aether-nudge -->")) | .created_at] | last // empty' || true)"
            if [ -n "$last_nudge" ]; then
              if [ $(( now_epoch - $(date -u -d "$last_nudge" +%s) )) -lt "$threshold" ]; then
                echo "#${num}: nudged within the cadence — skip"; continue
              fi
            fi

            cat > /tmp/nudge.md <<EOF
          @${OWNER} — issue #${num} was bounced $(( park_age / 86400 )) day(s) ago and hasn't resumed — address the reason on the issue, or reply here.

          <!-- aether-nudge -->
          EOF
            gh api -X POST "repos/${REPO}/issues/${num}/comments" -F body=@/tmp/nudge.md
            echo "#${num}: nudged (stale bounce)"
          done < /tmp/bounced.txt
