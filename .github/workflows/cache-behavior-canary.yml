name: cache-behavior-canary

# Watches the undocumented Claude Code prompt-cache behavior the warm session
# pool (#3313) is built on: a bare git-less cwd plus `--add-dir` at the target
# repo yields BYTE-STABLE resumes, so a warm box re-writes only tens of tokens
# of the cached head instead of the full ~200k prefix. Any Claude Code release
# can silently change prompt composition (a new volatile head block,
# `--add-dir` starting to inject the repo snapshot, `--append-system-prompt`
# placement, a TTL-tier change), and the fleet pins AGENT_CLAUDE_CODE_VERSION,
# so a version bump is the known risk moment. This probe runs the minimal
# prompt-cache experiment under the pinned CLI on a cheap haiku model and files
# a machine `alert` issue when the byte-stable-resume invariant moves (#3347).
#
# Five legs, one session each, turn-1 cache_creation ("write") read via
# scripts/agent-pool.mjs resume-cost:
#   1. bare cwd, resume unchanged            → write must stay tiny
#   2. bare cwd, resume after a target churn → write must stay tiny
#      (a bare cwd does NOT embed the repo snapshot, so a commit is invisible)
#   3. IN-REPO CONTROL: cwd inside the repo, resume after a churn → write must
#      go LARGE. This is the non-vacuity proof: it shows the measurement can
#      still see a head re-write, so a passing run of legs 1-2 means "tiny",
#      not "the probe is blind". V0 (the control seed's write) is reported for
#      context; the gating control assertion is the tiny/large threshold.
#   4. bare cwd, resume at the SAME --effort  → write must stay tiny (the
#      shape a same-effort pooled resume holds once task-keyed effort routing
#      (#3375) is live).
#   5. bare cwd, resume at a DIFFERENT --effort → write must go LARGE. This is
#      the effort-axis non-vacuity proof: a different effort fully invalidates
#      the prompt cache back to the system-prompt region, confirming effort
#      really is a cache-key dimension. Legs 4-5 run on EFFORT_MODEL
#      (claude-sonnet-5), not the haiku MODEL legs 1-3 use — Haiku ignores
#      --effort at the API level, which would make both effort legs vacuous.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Auth is the same dedicated CI subscription token the fleet uses. When
      # it is absent (a fork, or an un-provisioned repo) every claude-bearing
      # step is skipped and the job no-ops green rather than failing.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}
      # A byte-stable bare resume writes only tens of tokens of the cached head;
      # this ceiling separates that from a full head re-write. Tune here.
      BARE_MAX_WRITE: "500"
    steps:
      - uses: actions/checkout@v4

      # Pinned via AGENT_CLAUDE_CODE_VERSION (#3285), warn-and-latest fallback
      # exactly as agent-work.yml — the pin is the whole point: the canary must
      # probe the same CLI the fleet runs.
      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          CLAUDE_CODE_VERSION: ${{ vars.AGENT_CLAUDE_CODE_VERSION }}
        run: |
          if [ -n "${CLAUDE_CODE_VERSION:-}" ]; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          else
            echo "::warning::AGENT_CLAUDE_CODE_VERSION is unset — installing latest; the canary is probing an unpinned CLI (#3285)"
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      - name: Probe prompt-cache resume behavior
        id: canary
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        run: |
          set -uo pipefail
          MODEL=claude-haiku-4-5
          EFFORT_MODEL=claude-sonnet-5
          PROMPT="Reply with the single word OK."
          CLI="$(claude --version 2>/dev/null || echo unknown)"
          POOL="$GITHUB_WORKSPACE/scripts/agent-pool.mjs"

          TARGET="$(mktemp -d)"; BARE="$(mktemp -d)"
          git -C "$TARGET" init -q
          git -C "$TARGET" config user.email canary@example.com
          git -C "$TARGET" config user.name "cache canary"
          printf 'seed\n' > "$TARGET/file.txt"
          git -C "$TARGET" add -A && git -C "$TARGET" commit -qm seed

          # turn-1 cache_creation from a leg's transcript, via the shared helper.
          write_of() {
            node "$POOL" resume-cost --transcript "$1" 2>/dev/null \
              | sed -n 's/.*write=\([0-9]\{1,\}\).*/\1/p' | head -1
          }
          run_claude() {  # $1=cwd  $2=model  $3..=extra args (prompt/flags appended)
            local cwd="$1"; local model="$2"; shift 2
            ( cd "$cwd" && claude "$@" -p "$PROMPT" --model "$model" \
                --dangerously-skip-permissions --max-turns 1 \
                --output-format stream-json --verbose ) 2>/dev/null || true
          }
          sid_of() { jq -r 'select(.type=="system" and .subtype=="init") | .session_id' "$1" 2>/dev/null | head -1; }

          # Bare-cwd session (git-less cwd + --add-dir at the repo).
          run_claude "$BARE" "$MODEL" --add-dir "$TARGET" > /tmp/seed-bare.jsonl
          SID_BARE="$(sid_of /tmp/seed-bare.jsonl)"; W0="$(write_of /tmp/seed-bare.jsonl)"
          # Leg 1 — resume unchanged.
          run_claude "$BARE" "$MODEL" --add-dir "$TARGET" --resume "$SID_BARE" > /tmp/leg1.jsonl
          W1="$(write_of /tmp/leg1.jsonl)"
          # Leg 2 — churn the target repo, resume.
          printf 'change\n' >> "$TARGET/file.txt"; git -C "$TARGET" commit -qam churn-bare
          run_claude "$BARE" "$MODEL" --add-dir "$TARGET" --resume "$SID_BARE" > /tmp/leg2.jsonl
          W2="$(write_of /tmp/leg2.jsonl)"

          # In-repo control: cwd IS the repo. Seed (baseline V0), churn, resume.
          run_claude "$TARGET" "$MODEL" > /tmp/seed-ctrl.jsonl
          SID_CTRL="$(sid_of /tmp/seed-ctrl.jsonl)"; V0="$(write_of /tmp/seed-ctrl.jsonl)"
          printf 'change2\n' >> "$TARGET/file.txt"; git -C "$TARGET" commit -qam churn-ctrl
          run_claude "$TARGET" "$MODEL" --resume "$SID_CTRL" > /tmp/leg3.jsonl
          W3="$(write_of /tmp/leg3.jsonl)"

          # Effort seed: bare cwd, fixed --effort, on a model that honors it.
          run_claude "$BARE" "$EFFORT_MODEL" --add-dir "$TARGET" --effort high > /tmp/seed-effort.jsonl
          SID_EFFORT="$(sid_of /tmp/seed-effort.jsonl)"; E0="$(write_of /tmp/seed-effort.jsonl)"
          # Leg 4 — resume at the SAME effort → must stay tiny.
          run_claude "$BARE" "$EFFORT_MODEL" --add-dir "$TARGET" --resume "$SID_EFFORT" --effort high > /tmp/leg4.jsonl
          W4="$(write_of /tmp/leg4.jsonl)"
          # Leg 5 — resume at a DIFFERENT effort → must go large (non-vacuity).
          run_claude "$BARE" "$EFFORT_MODEL" --add-dir "$TARGET" --resume "$SID_EFFORT" --effort low > /tmp/leg5.jsonl
          W5="$(write_of /tmp/leg5.jsonl)"

          echo "CLI ${CLI}: W0(bare-seed)=${W0:-?} W1(bare-unchanged)=${W1:-?} W2(bare-churned)=${W2:-?} V0(ctrl-seed)=${V0:-?} W3(ctrl-churned)=${W3:-?} E0(effort-seed)=${E0:-?} W4(effort-same)=${W4:-?} W5(effort-diff)=${W5:-?} (threshold ${BARE_MAX_WRITE})"

          is_num() { case "$1" in ''|*[!0-9]*) return 1;; *) return 0;; esac; }
          breach=""
          add_breach() { breach="${breach}- ${1}"$'\n'; }

          # Every leg must have produced a readable turn-1 write; a MISSING value
          # is itself drift (the transcript shape or the helper moved).
          for leg in "bare-unchanged:$W1" "bare-churned:$W2" "ctrl-seed:$V0" "ctrl-churned:$W3" "effort-same:$W4" "effort-diff:$W5"; do
            if ! is_num "${leg#*:}"; then add_breach "**${leg%%:*}**: could not read a turn-1 write (\`${leg#*:}\`) — transcript shape or resume-cost helper changed"; fi
          done

          if [ -z "$breach" ]; then
            # Bare resumes must stay tiny (the byte-stable-resume invariant).
            is_num "$W1" && [ "$W1" -ge "$BARE_MAX_WRITE" ] && add_breach "**bare-unchanged**: turn-1 write ${W1} ≥ ${BARE_MAX_WRITE} — a bare-cwd resume is no longer byte-stable"
            is_num "$W2" && [ "$W2" -ge "$BARE_MAX_WRITE" ] && add_breach "**bare-churned**: turn-1 write ${W2} ≥ ${BARE_MAX_WRITE} — a bare cwd is now embedding the target repo snapshot"
            # Non-vacuity control: the in-repo churned resume MUST re-write the
            # head (write large), proving the probe can still see the failure.
            is_num "$W3" && [ "$W3" -le "$BARE_MAX_WRITE" ] && add_breach "**ctrl-churned (non-vacuity)**: in-repo resume write ${W3} ≤ ${BARE_MAX_WRITE} — the control did NOT re-write the head, so the probe can no longer detect drift (measurement is vacuous)"
            # Effort-axis: a same-effort resume must stay tiny, a
            # different-effort resume must fully invalidate (non-vacuity proof
            # that effort really is a cache-key dimension).
            is_num "$W4" && [ "$W4" -ge "$BARE_MAX_WRITE" ] && add_breach "**effort-same**: turn-1 write ${W4} ≥ ${BARE_MAX_WRITE} — a same-effort resume is no longer byte-stable"
            is_num "$W5" && [ "$W5" -le "$BARE_MAX_WRITE" ] && add_breach "**effort-diff (non-vacuity)**: turn-1 write ${W5} ≤ ${BARE_MAX_WRITE} — a different-effort resume no longer re-writes the head — effort is no longer a cache dimension, so the pool's effort bucketing is unverifiable"
          fi

          if [ -n "$breach" ]; then
            {
              echo "The prompt-cache behavior canary detected drift in Claude Code's resume composition — the warm session pool (#3313) rests on this behavior."
              echo
              echo "CLI version: \`${CLI}\`"
              echo
              echo "Turn-1 cache_creation (\"write\") per leg (threshold ${BARE_MAX_WRITE}):"
              echo
              echo "| leg | write |"
              echo "| --- | --- |"
              echo "| bare seed (static head) | ${W0:-?} |"
              echo "| bare, resume unchanged | ${W1:-?} |"
              echo "| bare, resume after target churn | ${W2:-?} |"
              echo "| in-repo control seed (V0) | ${V0:-?} |"
              echo "| in-repo control, resume after churn | ${W3:-?} |"
              echo "| effort seed (E0, bare, --effort high) | ${E0:-?} |"
              echo "| effort, resume at same effort | ${W4:-?} |"
              echo "| effort, resume at different effort | ${W5:-?} |"
              echo
              echo "Moved invariant(s):"
              echo
              printf '%s' "$breach"
              echo
              echo "The basecamp bare-cwd recipe and the pool economics need re-verification against this CLI version."
            } > /tmp/cache-canary-breach.md
            echo "cache-behavior canary BREACH — see /tmp/cache-canary-breach.md"
            exit 1
          fi
          echo "cache-behavior canary OK — bare resumes stayed under ${BARE_MAX_WRITE}, control re-wrote the head."

      # Keep one open alert issue and append subsequent breach runs — the same
      # file-or-comment upsert context-budget-canary.yml / fuzz-nightly use.
      - name: File or update cache-behavior alert
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="ci: prompt-cache behavior canary breach"
          if [ ! -s /tmp/cache-canary-breach.md ]; then
            {
              echo "The prompt-cache canary failed before producing a per-leg comparison — the probe itself broke (CLI install, auth, or a claude invocation error)."
              echo
              echo "Inspect the workflow run for the failing step."
            } > /tmp/cache-canary-breach.md
          fi
          {
            cat /tmp/cache-canary-breach.md
            echo
            echo "- Run: ${RUN_URL}"
          } > /tmp/cache-canary-issue.md

          existing=$(gh issue list --state open --search "${title} in:title" \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            echo "Commenting on existing cache-behavior issue #${existing}."
            gh issue comment "$existing" --body-file /tmp/cache-canary-issue.md
          else
            echo "Filing cache-behavior issue."
            # --label alert: a machine-filed alert is not a pipeline work item;
            # the fleet's dispatcher skips anything carrying it (#3180).
            gh issue create --title "$title" --body-file /tmp/cache-canary-issue.md --label alert
          fi

      - name: Fail on cache-behavior breach
        if: steps.canary.outcome == 'failure'
        run: exit 1
