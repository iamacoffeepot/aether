name: Review

# Producer-side quality check: run the repo's five-pillar review workflow
# (.claude/workflows/review.js) over a PR's diff via headless Claude Code,
# and post the rollup as inline PR annotations + a summary comment with an
# advisory `review:unresolved` label. The five-pillar verdicts are agent
# judgment posted as a COMMENT review, never REQUEST_CHANGES — advisory in
# content. The `gate` job below mirrors the label into a required `Review
# gate` commit status that blocks merge on a Rust-touching PR; a non-Rust
# PR is never held.
#
# Trigger is first-green, then incremental. The workflow fires when a PR's CI
# run completes successfully (`workflow_run` on "CI") and resolves the PR from
# the run's head branch. The first review covers `origin/main...HEAD`; each
# later green push reviews only the delta from the head SHA recorded in the
# `<!-- aether-review -->` marker comment. Same-SHA triggers and non-Rust
# deltas are no-ops, while an unreachable recorded SHA falls back to a full
# review. State lives on the PR itself, with no external bookkeeping.
# Deliberate re-runs go through `workflow_dispatch` with a `pr` input, which
# forces a full review (findings already posted are deduped by the
# poster's fingerprints, so a re-run never double-annotates).
#
# Two skip paths guard against reviewing mass mechanical sweeps: an
# owner-applied `review:skip` label waives the review (gate success only
# when the timeline actor is the owner — agents never apply it), and a
# changed-`.rs`-file cap (AETHER_REVIEW_MAX_FILES) skips the session and
# FAILS the gate closed until the owner waives or dispatches a full review.
# `workflow_dispatch` bypasses both — the deliberate "review it anyway".
#
# Same security posture as the dogfood runner: subscription OAuth token
# (CLAUDE_CODE_OAUTH_TOKEN), same-repo head only, and a least-privilege
# split — the code-executing `review` job is read-only on the repo, and
# only the `post` job (which never runs branch code) holds write scopes.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review (forces a full review)
        required: true

# One review per PR; a newer trigger supersedes an in-flight one. Keyed by
# the head branch on the workflow_run path, or the dispatched PR number.
concurrency:
  group: review-${{ github.event.workflow_run.head_branch || github.event.inputs.pr }}
  cancel-in-progress: true

# One-place knob for the review size cap: a PR changing more `.rs` files
# than this skips the session (no fan-out spend) and the gate FAILS CLOSED
# until the owner applies `review:skip` or dispatches a full review.
env:
  AETHER_REVIEW_MAX_FILES: "40"

jobs:
  review:
    name: Five-pillar review
    # Runs-On 8cpu, not ubuntu-latest: the Workflow tool caps concurrent
    # agents at ~min(16, cores - 2), so the 4-core GitHub-hosted box
    # squeezes the per-file finder fan-out to ~2-wide while every agent
    # just waits on inference. 8 cores buys ~6-wide fan-out; the job's
    # own compute stays trivial (no cargo build, no s3-cache needed — the
    # correctness refuter's write-and-run cargo-test path is gated off here
    # via the noBuild: true workflow arg, so this premise is enforced, not
    # just asserted; see the "Run the five-pillar review" step).
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64
    # Bring-up leash: a wedged in-flight workflow (the session now waits
    # for it indefinitely, iamacoffeepot/aether#2979) must not idle an
    # EC2 runner toward the 6h default.
    timeout-minutes: 45
    # Read-only on the repo. This job checks out and executes PR-head code
    # (headless Claude Code drives the review over the branch's checkout),
    # so it must never hold a write scope — all posting is the `post` job's.
    permissions:
      contents: read
    # Job-level guard: on the workflow_run path the parent CI must have
    # succeeded and the head must be this repo (fork PRs never see the
    # secret and never run here); the manual dispatch path is always
    # allowed and resolves its own PR.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      # Present at job level so step-level `if: env... != ''` gating works
      # (mirrors the dogfood runner). Absent secret => the CC steps skip
      # cleanly and no rollup artifact is produced, so `post` no-ops.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      # head_sha + touches_rust feed the `gate` job's per-SHA status post,
      # so they are emitted the moment a PR resolves — even when the review
      # session is skipped (marker present) — not only on the proceed path.
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      touches_rust: ${{ steps.resolve.outputs.touches_rust }}
      diff_base: ${{ steps.resolve.outputs.diff_base }}
      review_mode: ${{ steps.resolve.outputs.review_mode }}
      # skip_reason (label | cap) marks a deliberately-skipped session; the
      # gate turns it into an owner-verified success (label) or a fail-closed
      # decision prompt (cap). rs_count rides along for the cap description.
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      rs_count: ${{ steps.resolve.outputs.rs_count }}
      rollup_produced: ${{ steps.rollup.outputs.produced }}
    steps:
      - uses: runs-on/action@v2
      # Resolve the PR and apply the run gates BEFORE any checkout — these
      # are pure GitHub API calls. Sets proceed=false (a clean no-op) when
      # there is no open PR, this SHA was reviewed, or a delta has no Rust.
      # head_sha feeds the checkout. Once a PR resolves, pr_number, head_sha,
      # and touches_rust are emitted immediately, ahead of the reviewed-SHA decision,
      # so the `gate` job can post the required status on the head SHA even
      # on the marker-present runs where the session itself is a no-op.
      - name: Resolve PR and apply gates
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pr="$DISPATCH_PR"
          else
            # Resolve the PR from the CI run's head branch. `head` is
            # owner:branch; state=open bounds it to a live PR.
            pr="$(gh api "repos/${REPO}/pulls?head=iamacoffeepot:${HEAD_BRANCH}&state=open" \
              --jq '.[0].number // empty')"
          fi
          if [ -z "${pr:-}" ]; then
            echo "No open PR for branch '${HEAD_BRANCH}' — nothing to review."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Emit pr_number AND head_sha the moment a PR resolves, BEFORE the
          # reviewed-SHA decision below. The `gate` job posts the required
          # `Review gate` status on this head SHA on EVERY trigger — including
          # the marker-present runs that short-circuit the session — so it
          # must have the SHA even when this step exits with proceed=false.
          # That per-SHA re-post on each green push keeps the live review
          # verdict aligned with the per-SHA required check.
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          head_sha="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          # Read comment bodies once. The stable marker anchors the summary;
          # the parallel token records the head SHA covered by its last run.
          comments="$(gh api "repos/${REPO}/issues/${pr}/comments" --paginate --jq '.[].body')"
          reviewed_token="$(grep -m1 -oE 'aether-reviewed-sha:[0-9a-f]+' <<<"$comments" || true)"
          reviewed_sha="${reviewed_token#aether-reviewed-sha:}"

          # Owner waiver: a `review:skip` label skips the review session
          # outright. The gate decides whether it counts — it verifies the
          # label was applied by the repo owner (timeline actor check) and
          # posts success only then; any other applier keeps the gate red.
          # A workflow_dispatch bypasses the label and reviewed-SHA decision:
          # dispatching is the deliberate "review it all again" path.
          # Capture then match with a here-string so grep -q can't SIGPIPE
          # the paginated gh under pipefail.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            pr_labels="$(gh api "repos/${REPO}/issues/${pr}/labels" --jq '.[].name')"
            if grep -qx 'review:skip' <<<"$pr_labels"; then
              echo "PR #$pr carries review:skip — review session skipped; gate verifies the applier."
              echo "skip_reason=label" >> "$GITHUB_OUTPUT"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Rust-touch detection drives the gate verdict: classification
          # tracks changed `.rs` source only — the surface the five pillars
          # judge; a PR that changes any `.rs` file is held to the review
          # verdict, every other PR gets an automatic success. A
          # manifest-only PR (lockfile / `Cargo.toml` edit with no `.rs`
          # change) is intentionally treated as no-Rust: there is no
          # reviewable surface, so the gate auto-succeeds rather than
          # holding a PR the review can never produce a verdict for.
          # Capture the file list first, then match with a here-string (not
          # a pipe) so a `grep -q` early exit can't SIGPIPE the paginated gh
          # under `pipefail`.
          files="$(gh api "repos/${REPO}/pulls/${pr}/files" --paginate --jq '.[].filename')"
          if grep -qE '\.rs$' <<<"$files"; then
            echo "touches_rust=true" >> "$GITHUB_OUTPUT"
          else
            # No Rust source in the diff (including a manifest-only PR) →
            # skip the review session entirely, not just the verdict: the
            # /review skill refuses an empty .rs file set, so running it
            # here would loud-fail on every docs/workflow/manifest-only PR.
            # The gate job still posts its success-skip status from the
            # touches_rust output above.
            echo "touches_rust=false" >> "$GITHUB_OUTPUT"
            echo "PR #$pr touches no Rust — review session skipped."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Select the caller-side diff base and the file set that controls
          # this session. The gate's touches_rust classification above stays
          # whole-PR; only incremental session gating and the cap use delta
          # files. Missing legacy tokens and unreachable/orphaned bases fall
          # back to a safe full review.
          diff_base="origin/main"
          review_mode="full"
          review_files="$files"
          if [ "$EVENT" != "workflow_dispatch" ] && grep -q '<!-- aether-review -->' <<<"$comments"; then
            if [ -z "$reviewed_sha" ]; then
              echo "PR #$pr has a legacy marker without a reviewed SHA — falling back to a full review."
            elif [ "$reviewed_sha" = "$head_sha" ]; then
              echo "diff_base=$reviewed_sha" >> "$GITHUB_OUTPUT"
              echo "review_mode=incremental" >> "$GITHUB_OUTPUT"
              echo "PR #$pr head $head_sha is already reviewed — skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              compare_status="unreachable"
              if compare="$(gh api "repos/${REPO}/compare/${reviewed_sha}...${head_sha}")"; then
                compare_status="$(jq -r '.status' <<<"$compare")"
              fi

              if [ "$compare_status" = "ahead" ]; then
                diff_base="$reviewed_sha"
                review_mode="incremental"
                review_files="$(jq -r '.files[]?.filename' <<<"$compare")"
                if ! grep -qE '\.rs$' <<<"$review_files"; then
                  echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"
                  echo "review_mode=$review_mode" >> "$GITHUB_OUTPUT"
                  echo "PR #$pr delta from $reviewed_sha touches no Rust — review session skipped."
                  echo "proceed=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              else
                echo "PR #$pr recorded SHA $reviewed_sha is not an ancestor of $head_sha ($compare_status) — falling back to a full review."
              fi
            fi
          fi

          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"
          echo "review_mode=$review_mode" >> "$GITHUB_OUTPUT"

          # Size cap: full reviews count the whole PR; incremental reviews
          # count only their delta. Over the cap the session never spawns and
          # the gate FAILS CLOSED until the owner waives or dispatches a full
          # review. workflow_dispatch deliberately bypasses the cap.
          rs_count=$(grep -cE '\.rs$' <<<"$review_files")
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$rs_count" -gt "$AETHER_REVIEW_MAX_FILES" ]; then
            echo "PR #$pr $review_mode review changes $rs_count .rs files (cap $AETHER_REVIEW_MAX_FILES) — review session skipped; gate fails closed."
            echo "skip_reason=cap" >> "$GITHUB_OUTPUT"
            echo "rs_count=$rs_count" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Hand the resolved PR to the chained Dogfood workflow. Dogfood triggers
      # on this workflow's completion, but a workflow_run-triggered run object
      # attaches to the latest MAIN commit — its head_branch is always "main" —
      # so a downstream chain can never re-derive the PR from the event the way
      # this workflow does from CI's push-triggered run. This artifact is the
      # explicit hand-off. It is written on EVERY path that resolves a PR
      # (label/cap/non-Rust/same-SHA/delta skips included), matching the `gate` job's
      # coverage, so dogfood can apply its own gate stack (the live `Review
      # gate` status among them) to the right PR.
      - name: Write the review-context hand-off for Dogfood
        if: steps.resolve.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          jq -nc --argjson pr "$PR_NUMBER" --arg head_sha "$HEAD_SHA" \
            '{pr: $pr, head_sha: $head_sha}' > "$RUNNER_TEMP/review-context.json"
          cat "$RUNNER_TEMP/review-context.json"
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.pr_number != ''
        with:
          name: review-context
          path: ${{ runner.temp }}/review-context.json
          # Consumed by the Dogfood run that fires minutes later; nothing
          # reads it after that.
          retention-days: 1

      # Check out the PR head with full history so an incremental base SHA is
      # present. Fetch origin/main explicitly for first/full/fallback reviews.
      - uses: actions/checkout@v4
        if: steps.resolve.outputs.proceed == 'true'
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0
      - name: Fetch the diff base (origin/main)
        if: steps.resolve.outputs.proceed == 'true'
        run: git fetch origin main:refs/remotes/origin/main

      # The repo's .claude hooks serve concurrent interactive sessions
      # sharing a clone: SessionStart binds each session into its own
      # worktree, and the boundary hooks police edits outside it. Inside
      # CI they are actively harmful — run 29084427000's session was
      # rebound into a per-session worktree (so the rollup landed outside
      # $GITHUB_WORKSPACE) and deleted the live transcript tee target as
      # "untracked scratch in the main checkout" (#2986). The runner is
      # ephemeral and single-purpose, so strip the hooks from this
      # checkout COPY; the hooks in the repo itself are untouched and
      # stay active for interactive sessions.
      - name: Strip interactive-session hooks from the checkout copy
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          jq 'del(.hooks)' .claude/settings.json > /tmp/settings.json
          mv /tmp/settings.json .claude/settings.json

      - name: Note when the OAuth token secret is absent
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set — the review is skipped."
          echo "Mint one with 'claude setup-token' and add it: gh secret set CLAUDE_CODE_OAUTH_TOKEN"

      - name: Install Claude Code
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      # Pre-trust the checkout so settings.json permissions aren't ignored
      # with a warning under skip-permissions.
      - name: Pre-trust the workspace for headless Claude
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: printf '{"projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' "$PWD" > "$HOME/.claude.json"

      # Auth in isolation before the real run: a one-line prompt, no tools.
      # --max-turns 3 (not 1) because the model occasionally spends a turn
      # before emitting the reply, and a 1-turn cap turns that into a
      # spurious failure that reads like an auth problem (spike #2961).
      - name: Auth probe (no tools)
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          claude -p "Reply with exactly: AUTH-OK" \
            --model claude-sonnet-5 \
            --max-turns 3 | tee /tmp/auth.log
          grep -q "AUTH-OK" /tmp/auth.log

      # The review itself. Headless Claude invokes the repo's /review skill
      # in integrated mode (it owns the caller-side prep — changed-file set,
      # per-file diffs, issue text from the PR's closing reference) and
      # writes the workflow's returned rollup JSON verbatim to
      # review-rollup.json. GH_TOKEN lets the skill resolve the closing
      # issue via gh. `|| true` so a review failure never fails the job —
      # a missing rollup file is the signal that no post happens.
      #
      # stream-json + the jq renderer make the session watchable LIVE in
      # the Actions log (assistant text + tool names as they happen), and
      # the tee'd JSONL is the durable session transcript, uploaded as an
      # artifact below (iamacoffeepot/aether#2981). The tee target lives
      # in /tmp, outside the checkout, so the session can never mistake
      # it for repo scratch and delete it (#2986). The wait contract is
      # MECHANICAL, not prose: the prompt prescribes a concrete poll loop
      # (sleep + check for the rollup file) because two live runs proved a
      # session will end on a promise with the workflow still in flight.
      - name: Run the five-pillar review
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          DIFF_BASE: ${{ steps.resolve.outputs.diff_base }}
        run: |
          claude -p "You are running headless in CI on a checkout of PR #${PR_NUMBER}'s head branch.
          The diff base is ${DIFF_BASE}; the head is the current HEAD.
          Invoke the repo's /review skill in INTEGRATED mode against ${DIFF_BASE}...HEAD:
          resolve the changed .rs files and their per-file diffs from git, and read the issue
          text this PR closes (use gh to find the PR's closing reference for issue #${PR_NUMBER}
          if needed). Pass noBuild: true and depth: gate in the /review invocation's workflow
          args — this runner has no Rust toolchain, so the high-severity correctness refuter must
          ground read-only rather than write and run a scratch cargo test. Let the skill run the
          review.js workflow in a single pass.
          THE WAIT CONTRACT (load-bearing — two prior runs died on this): the Workflow tool
          runs in the BACKGROUND. In headless mode your final reply exits the process and
          KILLS the in-flight workflow, so you may not produce a final reply until
          ${GITHUB_WORKSPACE}/review-rollup.json exists on disk. While the workflow runs, poll
          mechanically: run the Bash command
          'sleep 60; ls ${GITHUB_WORKSPACE}/review-rollup.json 2>/dev/null || echo waiting'
          again and again, as many turns as it takes — the completion notification or the
          workflow result will reach you between polls. Polling turns are cheap; an early
          final reply wastes the whole run. The file will never appear on its own — the
          workflow returns the rollup as a VALUE, and YOU write the file when it does.
          When the workflow returns { rollup, files }, write the returned ROLLUP object as JSON
          verbatim to exactly ${GITHUB_WORKSPACE}/review-rollup.json — that absolute path, not
          a path relative to your working directory (the rollup, not the whole return).
          Do not edit any source (the noBuild flag above keeps the correctness refuter
          subagent non-editing too). Print exactly REVIEW-DONE when the file is written." \
            --dangerously-skip-permissions \
            --model claude-sonnet-5 \
            --max-turns 80 \
            --output-format stream-json --verbose \
            | tee /tmp/review-session.jsonl \
            | jq -rj --unbuffered '
                if .type == "assistant" then
                  ([.message.content[]? | if .type == "text" then "\n■ " + .text + "\n"
                    elif .type == "tool_use" then "▸ " + .name + "\n" else empty end] | join(""))
                elif .type == "result" then "\n== result (\(.subtype)) ==\n" + (.result // "") + "\n"
                else empty end' \
            || true

      # Whether the run produced a rollup gates the `post` job. Kept as a
      # step so `post` can `needs`-read it without inspecting the artifact.
      # A missing rollup after the review actually ran (gates passed, token
      # present) is a FAILURE, not a quiet skip — the inaugural run
      # (iamacoffeepot/aether#2979) skipped silently and reported success
      # when the headless session exited with the workflow still in flight.
      # The quiet-skip path exists only for the absent-secret case, which
      # never reaches the else branch here.
      - name: Note whether a rollup was produced
        id: rollup
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          if [ -f review-rollup.json ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "review ran but produced no rollup — failing loudly. Session's final events:"
            # An if, not `tail … || echo`: the pipeline's exit status is
            # cut's, so the || fallback can never fire (#2986).
            if [ -f /tmp/review-session.jsonl ]; then
              tail -n 5 /tmp/review-session.jsonl | cut -c1-2000
            else
              echo "(no session transcript)"
            fi
            exit 1
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.rollup.outputs.produced == 'true'
        with:
          name: review-rollup
          path: review-rollup.json
          if-no-files-found: ignore

      # The full session transcript (stream-json JSONL) — uploaded even on
      # failure, since a dead run's transcript is exactly what diagnoses
      # it. This is the same transcript.jsonl artifact the evidence design
      # (#2967) wants long-term.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-session-transcript
          path: /tmp/review-session.jsonl
          if-no-files-found: ignore

  post:
    name: Post review rollup
    needs: review
    # No-op when the review job produced no rollup (token absent, no open
    # PR, gated out, or the review itself failed).
    if: needs.review.outputs.rollup_produced == 'true'
    runs-on: ubuntu-latest
    # The only job with write scopes, and it never executes branch code:
    # the default checkout is the base repo (main), so the poster script is
    # the trusted version — the PR head is only ever read as data. actions:
    # write is for the terminal reconciler poke below.
    permissions:
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: review-rollup
      - name: Fetch the PR's changed files + diff hunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ needs.review.outputs.pr_number }}/files" \
            --paginate > pr-files.json
      - name: Post the rollup as annotations + summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.review.outputs.review_mode }}
          ROLLUP_PATH: review-rollup.json
          FILES_PATH: pr-files.json
        run: node scripts/post-review-rollup.mjs

      # Poke the reconciler with the exact PR number this review just posted
      # for, so its linked issue's phase recomputes the moment the review
      # verdict lands rather than waiting on the cron backstop. workflow_dispatch
      # is the documented exception that a GITHUB_TOKEN-created event still
      # triggers a workflow. continue-on-error: a failed poke degrades to the
      # reconciler's scheduled recompute and must never fail the rollup post.
      - name: Poke the reconciler
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.review.outputs.pr_number }}
        run: gh workflow run reconciler.yml -f pr="$PR"

  gate:
    name: Review gate
    needs: [review, post]
    # Runs on EVERY trigger that resolved a PR — including same-SHA and
    # non-Rust-delta runs where the session is skipped and `post` no-ops.
    # `always()`
    # so a skipped/failed upstream job never suppresses the status post; the
    # pr_number guard drops the fork / no-open-PR cases where the review job
    # never resolved a PR (and so emitted no outputs).
    if: always() && needs.review.outputs.pr_number != ''
    runs-on: ubuntu-latest
    # Only scope needed: post a commit status. Never touches branch code.
    permissions:
      statuses: write
    steps:
      # Mirror the advisory `review:unresolved` label into a required
      # `Review gate` commit status on the PR's head SHA. This status is the
      # bridge between the review trigger and a per-SHA required check. This
      # status is recomputed from the LIVE label on every green push, including
      # pushes whose delta session is skipped. A non-Rust PR is never held to
      # the verdict; a Rust PR mirrors its label; an infra failure in the review job posts
      # failure rather than leaving the required context missing.
      #
      # Verdict table (first match wins):
      #   review:skip, applied by owner  -> success  (owner waiver; session never ran)
      #   review:skip, any other actor   -> failure  (waiver is the owner's signoff alone)
      #   over the .rs file cap          -> failure  (too large to auto-review; owner
      #                                               waives with review:skip or forces a
      #                                               full review via workflow_dispatch)
      #   review job did not succeed     -> failure  (infra/cancelled; re-run via dispatch)
      #   PR touches no Rust             -> success  (review not required)
      #   Rust + review:unresolved set   -> failure  (points at the rollup)
      #   Rust + label absent            -> success
      #
      # The review:skip waiver is verified against the issue timeline: the
      # most recent review:skip `labeled` event's actor must be the repo
      # owner. That blocks any non-owner identity; an agent operating the
      # owner's own token is API-indistinguishable from the owner, so that
      # layer is process — agents never apply review:skip (recorded in the
      # /land skill's never-do list, same class as never stripping
      # review:unresolved).
      #
      # The infra-failure check runs first so a review job that dies before
      # computing touches_rust (leaving it empty) fails closed rather than
      # falling through to the non-Rust success branch — an empty value must
      # never read as "no Rust changes". Keyed on REVIEW_RESULT != "success"
      # (not == "failure") so a cancelled run fails closed too.
      #
      # Wedge hazard (issue #2996 rollout is two-phase): branch protection
      # must NOT require this context until the poster is proven live on real
      # PRs — a required context that nothing posts wedges every open PR.
      - name: Post the Review gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.review.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          TOUCHES_RUST: ${{ needs.review.outputs.touches_rust }}
          SKIP_REASON: ${{ needs.review.outputs.skip_reason }}
          RS_COUNT: ${{ needs.review.outputs.rs_count }}
          REVIEW_RESULT: ${{ needs.review.result }}
          OWNER: iamacoffeepot
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Owner waiver first — it is the explicit human override, so it
          # outranks every other row (including a stale review:unresolved
          # from an earlier review of this PR). Verify the applier via the
          # timeline: the most recent review:skip labeled event's actor.
          if [ "$SKIP_REASON" = "label" ]; then
            actor="$(gh api "repos/${REPO}/issues/${PR}/timeline" --paginate \
              --jq '[.[] | select(.event=="labeled" and .label.name=="review:skip")] | last | .actor.login // empty')"
            if [ "$actor" = "$OWNER" ]; then
              state="success"
              description="review skipped — review:skip applied by owner"
            else
              state="failure"
              description="review:skip ignored: applied by '${actor:-unknown}', not the owner. Owner must re-apply, or workflow_dispatch a full review."
            fi
          elif [ "$SKIP_REASON" = "cap" ]; then
            # Fail closed on size: an unreviewed mass change never goes
            # green on size alone — the owner decides (waive or review).
            state="failure"
            description="${RS_COUNT} .rs files exceed cap ${AETHER_REVIEW_MAX_FILES} — owner: apply review:skip to waive, or workflow_dispatch a full review."
          # Infra-failure check next: a review job that dies before computing
          # touches_rust leaves it empty, which must fail closed rather than
          # fall through to the non-Rust success branch below. Keyed on
          # != "success" (not == "failure") so a cancelled run fails closed
          # too — the review can't be bypassed by an infra flake; re-run to
          # clear.
          elif [ "$REVIEW_RESULT" != "success" ]; then
            state="failure"
            description="review run failed (infra). Re-run via workflow_dispatch."
          elif [ "$TOUCHES_RUST" != "true" ]; then
            # Non-Rust PR with a completed review job: never required to pass
            # the review.
            state="success"
            description="no Rust changes — review not required"
          else
            # Rust PR with a verdict: mirror the LIVE label. Capture then match
            # with a here-string (not a pipe) so grep -q can't SIGPIPE gh.
            labels="$(gh api "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')"
            if grep -qx 'review:unresolved' <<<"$labels"; then
              state="failure"
              description="review unresolved; see rollup. Fix: workflow_dispatch clears it. Decline: strip label, next CI green re-mirrors (not dispatch, re-sets it)."
            else
              state="success"
              description="review verdict clear"
            fi
          fi
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="Review gate" \
            -f description="$description" \
            -f target_url="$RUN_URL"
