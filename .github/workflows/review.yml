name: Review

# Producer-side quality check: run the repo's five-pillar review workflow
# (.claude/workflows/review.js) over a PR's diff via headless Claude Code,
# and post the rollup as inline PR annotations + a summary comment. The
# five-pillar verdict is submitted NATIVELY by the reviewer App `iamacritic`
# (ADR-0148) — an `APPROVE` (clean or out-of-scope) or `REQUEST_CHANGES`
# (actionable) review; critic authors no PR, so GitHub does not 422 its
# self-verdict the way it would builder's. Branch protection's native required
# review is the merge gate: a PR merges only once critic's standing verdict is
# APPROVE, or the owner approves / dismisses the verdict natively.
#
# The review runs on an explicit request, and every request yields a full
# `origin/main...HEAD` review with one verdict. Two triggers, both of which
# execute main's copy of this file (the ADR-0148 invariant that approval
# authority stays pinned to `main` whatever a PR branch does):
#   - `workflow_dispatch` with a `pr` input — the implement box dispatches it
#     once its PR's CI is green (the explicit hand-off), and the owner can
#     force one.
#   - `issue_comment` — an `@iamacritic review` / `@iamacritic full review` comment
#     on the PR, restricted to the owner and the fleet App; the findings loop
#     re-requests this way after a fix push, which is what makes
#     `dismiss_stale_reviews` compose instead of deadlocking.
# Findings already posted are deduped by the poster's fingerprints, so a
# re-request never double-annotates.
#
# A changed-reviewable-file cap (AETHER_REVIEW_MAX_FILES) guards against
# reviewing mass mechanical sweeps: over the cap the session is skipped and
# critic submits no verdict, so the PR rests blocked on the native required
# review until the owner forces a full review or approves it natively. The cap
# counts the reviewable files of the selected class — the `.rs` count for a
# Rust PR, the workflow/action/script count for a light one.
# `workflow_dispatch` and `@iamacritic full review` bypass the cap — the
# deliberate "review it anyway"; plain `@iamacritic review` does not.
#
# Same security posture as the dogfood runner: dedicated CI subscription
# OAuth token (CLAUDE_CODE_OAUTH_TOKEN, shared with the fleet), same-repo
# head only, and a least-privilege
# split — the code-executing `review` job is read-only on the repo, and
# only the `post` job (which never runs branch code) holds write scopes.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
  issue_comment:
    types: [created]

# The stage-keying grammar: a run is keyed by the object its task mutates —
# work-{task}-<issue> for the issue-mutating stages, work-land-<pr> and this
# review-<pr> for the PR-mutating ones. Mirrors the concurrency expression
# below, run-id fallback included, so an ordinary comment's all-skip run
# never wears a review key.
run-name: >-
  review-${{
    github.event_name == 'workflow_dispatch' && inputs.pr ||
    (github.event.sender.login == 'iamacoffeepot' || github.event.sender.login == 'iamabuilder[bot]') &&
    (contains(github.event.comment.body, '@iamacritic review') || contains(github.event.comment.body, '@iamacritic full review')) && github.event.issue.number ||
    github.run_id
  }}

# One review per PR; a newer request supersedes an in-flight one. Keyed by
# the dispatched PR number, or the commented PR's issue number. issue_comment
# fires on EVERY new comment and a run whose jobs all skip still cancels its
# concurrency group, so a comment that is not a review request keys to its own
# run id — an ordinary PR comment must never cancel an in-flight review.
concurrency:
  group: >-
    review-${{
      github.event_name == 'workflow_dispatch' && inputs.pr ||
      (github.event.sender.login == 'iamacoffeepot' || github.event.sender.login == 'iamabuilder[bot]') &&
      (contains(github.event.comment.body, '@iamacritic review') || contains(github.event.comment.body, '@iamacritic full review')) && github.event.issue.number ||
      github.run_id
    }}
  cancel-in-progress: true

# One-place knob for the review size cap: a PR changing more reviewable files
# than this (the selected class's `.rs` or workflow/action/script count) skips
# the session (no fan-out spend). With no verdict submitted, the PR rests
# blocked on the native required review until the owner forces a full review or
# approves it natively.
env:
  AETHER_REVIEW_MAX_FILES: "40"
  # Small-diff bar for the `trivial-small-light` tier (issue #3404): a
  # `light`-class PR whose summed additions+deletions sit at or under this
  # gets the session-less critic APPROVE instead of a review session. `rust`
  # never skips on size alone — a small `.rs` diff is semantics by definition.
  AETHER_REVIEW_TRIVIAL_MAX_LINES: "20"

jobs:
  review:
    name: Five-pillar review
    # Runs-On 8cpu, not ubuntu-latest: the Workflow tool caps concurrent
    # agents at ~min(16, cores - 2), so the 4-core GitHub-hosted box
    # squeezes the per-file finder fan-out to ~2-wide while every agent
    # just waits on inference. 8 cores buys ~6-wide fan-out; the job's
    # own compute stays trivial (no cargo build, no s3-cache needed — the
    # correctness refuter's write-and-run cargo-test path is gated off here
    # via the noBuild: true workflow arg, so this premise is enforced, not
    # just asserted; see the "Run the five-pillar review" step).
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64
    # Bring-up leash: a wedged in-flight workflow (the session now waits
    # for it indefinitely, iamacoffeepot/aether#2979) must not idle an
    # EC2 runner toward the 6h default.
    timeout-minutes: 45
    # Read-only on the repo. This job checks out and executes PR-head code
    # (headless Claude Code drives the review over the branch's checkout),
    # so it must never hold a write scope — all posting is the `post` job's.
    # id-token: write exists ONLY for the warm-session-pool steps (#3286):
    # it lets the job assume the OIDC role scoped to agent/pool/* on the
    # session bucket. That is an S3-prefix write surface reachable by
    # PR-head code, bounded by three fences: the role's policy covers only
    # agent/pool/*, fork PR heads never reach the session steps (the
    # resolve step drops them), and the pool is inert unless the owner sets
    # AGENT_POOL_ENABLE=true. Owner console prerequisites for the pool:
    #   (a) widen the OIDC role (AGENT_AWS_ROLE_ARN) with
    #       s3:GetObject/PutObject/DeleteObject/ListBucket on
    #       arn:aws:s3:::<AGENT_SESSION_BUCKET>/agent/pool/* (+ ListBucket
    #       prefix condition), assumable from this repo's OIDC sub;
    #   (b) add a bucket lifecycle rule expiring agent/pool/v2/* after 1 day
    #       (entries are cache-worthless past the hour; GH artifacts remain
    #       the forensic copy);
    #   (c) set repo vars AGENT_POOL_ENABLE=true (the flip — gated on the
    #       #3286 board-state review) and optionally AGENT_POOL_DEPTH /
    #       AGENT_POOL_CUTOFF_MINS / AGENT_POOL_CONTEXT_CAP_TOKENS
    #       (defaults 1 / 55 / 150000).
    permissions:
      contents: read
      id-token: write
    # Job-level guard: the dispatch path is always allowed (the implement
    # box's CI-green hand-off, or the owner forcing a review). The comment
    # path requires the comment to sit on a PR (an issue_comment on a plain
    # issue carries no pull_request key), the body to carry the command, and
    # the sender to be the owner or the fleet App — no other identity can
    # summon critic. Both events execute main's copy of this file, so
    # approval authority stays pinned to main (ADR-0148); the same-repo
    # head check (fork PRs never see the secret) moves into the resolve
    # step, which reads the PR itself.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.sender.login == 'iamacoffeepot' || github.event.sender.login == 'iamabuilder[bot]') &&
       (contains(github.event.comment.body, '@iamacritic review') || contains(github.event.comment.body, '@iamacritic full review')))
    env:
      # Present at job level so step-level `if: env... != ''` gating works
      # (mirrors the dogfood runner). Absent secret => the CC steps skip
      # cleanly and no rollup artifact is produced, so `post` no-ops.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      # approve_route feeds the `approve` job: a non-empty route (a PR the
      # tier table resolved below the session bar — `out-of-scope`,
      # `trivial-comment-only`, or `trivial-small-light`; issue #3404) gets a
      # session-less critic APPROVE naming the matched tier, so it carries a
      # standing verdict for the native required review. An empty route flows
      # to the review session and the `post` job. Emitted the moment a PR
      # resolves, even when the session is skipped (cap / tier), not only on
      # the proceed path.
      approve_route: ${{ steps.resolve.outputs.approve_route }}
      review_class: ${{ steps.resolve.outputs.review_class }}
      rollup_produced: ${{ steps.rollup.outputs.produced }}
    steps:
      - uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2
      # Resolve the PR and apply the run gates BEFORE any checkout — these
      # are pure GitHub API calls. The PR number is explicit on both
      # triggers (the dispatch input, or the commented PR's issue number),
      # so there is no inference: this step reads the PR, drops a fork or
      # closed one, and applies the non-Rust / size-cap skips. head_sha feeds
      # the checkout. The DEEP-vs-CONFIRM pass selection (issue #3390) also
      # lives here: a plain `@iamacritic review` on a PR critic already carries a
      # standing verdict on is a CONFIRM pass (diff_base = that last-reviewed
      # SHA); every other request is a DEEP pass (diff_base = origin/main).
      - name: Resolve PR and apply gates
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          COMMENT_PR: ${{ github.event.issue.number }}
          # workflow_dispatch and `@iamacritic full review` bypass the size
          # cap; plain `@iamacritic review` does not. The same flag selects the
          # DEEP pass: a bypass request always re-reviews in full, so only a
          # plain `@iamacritic review` with a standing verdict can be a CONFIRM.
          BYPASS_CAP: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@iamacritic full review') }}
          REPO: ${{ github.repository }}
          CRITIC_LOGIN: iamacritic[bot]
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pr="$DISPATCH_PR"
          else
            pr="$COMMENT_PR"
          fi

          # Read the PR once. A fork head never runs here (this job checks
          # out and executes PR-head code with the OAuth secret present),
          # and a closed PR has nothing to vouch for; both exit before
          # pr_number is emitted so the downstream jobs skip entirely.
          pr_info="$(gh api "repos/${REPO}/pulls/${pr}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_info")"
          if [ "$head_repo" != "$REPO" ]; then
            echo "PR #$pr head is '$head_repo', not this repo — fork heads are never reviewed here."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.state' <<<"$pr_info")" != "open" ]; then
            echo "PR #$pr is not open — nothing to review."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Emit pr_number AND head_sha the moment the PR resolves, ahead of
          # the classification below: head_sha feeds the checkout on the
          # proceed path (rust / light), and the `approve` job needs it to post
          # a session-less critic APPROVE on this SHA for a `none`-class PR,
          # where the session is a no-op.
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          head_sha="$(jq -r '.head.sha' <<<"$pr_info")"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          # Three-way classification over the changed-file list drives both
          # the review profile and the verdict routing:
          #   rust  — any `.rs` in the diff → today's full five-pillar review.
          #   light — no `.rs`, but the diff touches the fleet's own automation
          #           surface (`.github/workflows/**`, `.github/actions/**`,
          #           `scripts/**`) → a light-profile review session
          #           (correctness + convention, cargo-oriented refuter off).
          #           A logic/liveness/state-accounting bug in bash-inside-YAML
          #           parses fine and leaves unrelated CI green, so this surface
          #           is exactly the invariant class the pillars catch and CI
          #           cannot — it must not land unreviewed.
          #   none  — everything else (docs / ADR / `.md` / manifest-only, incl.
          #           a lockfile / `Cargo.toml` edit with no `.rs` change) → the
          #           session-less out-of-scope critic APPROVE (the `approve`
          #           job); there is no reviewable surface to hold a verdict.
          # Fetch the changed-file set once, patches included — the class
          # split and both trivial-tier predicates read it. `--paginate`
          # concatenates top-level arrays, so `jq -s 'add'` normalizes to one.
          # Match with here-strings (not pipes) so a `grep -q` early exit
          # can't SIGPIPE the paginated gh under `pipefail`.
          gh api "repos/${REPO}/pulls/${pr}/files" --paginate | jq -s 'add' > /tmp/pr-files.json
          files="$(jq -r '.[].filename' /tmp/pr-files.json)"
          light_re='^(\.github/workflows/|\.github/actions/|scripts/)'
          if grep -qE '\.rs$' <<<"$files"; then
            review_class=rust
            reviewable_count=$(grep -cE '\.rs$' <<<"$files")
          elif grep -qE "$light_re" <<<"$files"; then
            review_class=light
            reviewable_count=$(grep -cE "$light_re" <<<"$files")
          else
            review_class=none
          fi
          echo "review_class=$review_class" >> "$GITHUB_OUTPUT"

          # Tier table (issue #3404) — ordered, fully mechanical, top match
          # wins. A matched tier routes to the session-less `approve` job via
          # the approve_route output: the reviewer picks its tools, and a diff
          # below the session bar gets a verdict without a session. An
          # explicit request (BYPASS_CAP — workflow_dispatch or `@iamacritic
          # full review`) skips the trivial tiers exactly as it skips the size
          # cap: "review it anyway".
          #
          #   out-of-scope         — review_class=none (docs / ADR / `.md` /
          #                          manifest-only): no reviewable surface to
          #                          hold a verdict. Today's rule, unchanged.
          #   trivial-comment-only — any class: every changed line (adds AND
          #                          removes), trimmed, is blank or starts
          #                          with its file's comment leader (`#` for
          #                          .yml/.yaml/.sh/.toml, `//` for
          #                          .rs/.js/.mjs). A file with no mapped
          #                          leader or no patch fails the predicate.
          #                          The per-file `.patch` from `pulls/{}/files`
          #                          carries no `---`/`+++` header lines (hunks
          #                          start at `@@`, which never matches `^[+-]`),
          #                          so `^[+-]` lines are exactly the changed
          #                          lines. Pure comment sweeps need no session
          #                          whatever their size.
          #   trivial-small-light  — light class only: summed additions +
          #                          deletions ≤ AETHER_REVIEW_TRIVIAL_MAX_LINES.
          #                          rust never skips on size alone — a small
          #                          `.rs` diff is semantics by definition.
          approve_route=""
          if [ "$review_class" = "none" ]; then
            approve_route="out-of-scope"
          elif [ "$BYPASS_CAP" != "true" ]; then
            comment_only="$(jq -r '
              def leader(f): if (f|test("\\.(yml|yaml|sh|toml)$")) then "#"
                elif (f|test("\\.(rs|js|mjs)$")) then "//" else null end;
              (length > 0) and
              ([ .[] | leader(.filename) as $l |
                 if $l == null or .patch == null then false
                 else ([ .patch | split("\n")[] |
                         select(test("^[+-]")) |
                         sub("^[+-]"; "") | gsub("^\\s+|\\s+$"; "") ] |
                       all(. == "" or startswith($l)))
                 end ] | all)' /tmp/pr-files.json)"
            total_changed="$(jq '[.[] | .additions + .deletions] | add // 0' /tmp/pr-files.json)"
            if [ "$comment_only" = "true" ]; then
              approve_route="trivial-comment-only"
            elif [ "$review_class" = "light" ] && [ "$total_changed" -le "$AETHER_REVIEW_TRIVIAL_MAX_LINES" ]; then
              approve_route="trivial-small-light"
            fi
          fi
          echo "approve_route=$approve_route" >> "$GITHUB_OUTPUT"
          if [ -n "$approve_route" ]; then
            # Below the session bar → skip the review session entirely, not
            # just the verdict: the /review skill refuses an empty or trivial
            # reviewable-file set. The `approve` job posts the session-less
            # APPROVE naming this tier from the approve_route output above.
            echo "PR #$pr — tier: $approve_route — review session skipped; session-less critic APPROVE."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Size cap: over the cap the session never spawns and no verdict is
          # submitted, so the PR rests blocked on the native required review
          # until the owner forces a full review (workflow_dispatch or
          # `@iamacritic full review`, which set BYPASS_CAP above) or approves it
          # natively. The cap applies to the selected class's reviewable-file
          # count — the `.rs` count for `rust`, the matched-glob count for
          # `light`.
          if [ "$BYPASS_CAP" != "true" ] && [ "$reviewable_count" -gt "$AETHER_REVIEW_MAX_FILES" ]; then
            echo "PR #$pr changes $reviewable_count reviewable files (cap $AETHER_REVIEW_MAX_FILES) — review session skipped; PR rests blocked on the native required review."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deep-vs-confirm pass selection (issue #3390). Critic's latest standing
          # verdict (its most recent APPROVE / CHANGES_REQUESTED review) is the
          # last-reviewed SHA. A plain `@iamacritic review` on a PR that already has one
          # is a CONFIRM pass: the session confirms the reported findings were
          # addressed against the delta since that SHA rather than re-running the
          # whole five-pillar fan-out. Every bypass request (workflow_dispatch /
          # `@iamacritic full review`) and every first review (no standing verdict) is a
          # DEEP pass against origin/main. The deep pass happens at most once per PR —
          # "needs a full re-review" is the restart signal, not a second deep.
          # Stream the matching commit_ids (per-page `.[]` jq so --paginate
          # concatenates in chronological order) and take the last with tail -1 — the
          # newest verdict, robust across pages; tail consumes fully, no SIGPIPE.
          last_verdict_sha="$(gh api "repos/${REPO}/pulls/${pr}/reviews" --paginate \
            --jq ".[] | select(.user.login==\"${CRITIC_LOGIN}\" and (.state==\"APPROVED\" or .state==\"CHANGES_REQUESTED\")) | .commit_id" | tail -1)"
          if [ "$BYPASS_CAP" = "true" ] || [ -z "$last_verdict_sha" ]; then
            echo "review_pass=deep" >> "$GITHUB_OUTPUT"
            echo "diff_base=origin/main" >> "$GITHUB_OUTPUT"
            echo "PR #$pr — DEEP pass (diff base origin/main)."
          else
            echo "review_pass=confirm" >> "$GITHUB_OUTPUT"
            echo "diff_base=$last_verdict_sha" >> "$GITHUB_OUTPUT"
            # The last-reviewed SHA can be unreachable from any live ref (a
            # force-advanced branch, an intervening merge) — fetch it by SHA so
            # the confirm diff has the object regardless.
            git fetch -q origin "$last_verdict_sha" || echo "warning: could not fetch confirm diff base $last_verdict_sha — the session's diff step will fail loudly rather than diff against a missing object"
            echo "PR #$pr — CONFIRM pass against last-reviewed SHA $last_verdict_sha."
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Check out the PR head with full history, then fetch origin/main
      # explicitly — the diff base every review runs against.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.resolve.outputs.proceed == 'true'
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0
      - name: Fetch the diff base (origin/main)
        if: steps.resolve.outputs.proceed == 'true'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Note when the OAuth token secret is absent
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "AGENT_CLAUDE_CODE_OAUTH_TOKEN secret is not set — the review is skipped."
          echo "Mint one with 'claude setup-token' and add it: gh secret set AGENT_CLAUDE_CODE_OAUTH_TOKEN"

      # Shared headless-Claude scaffold (#3359): strip hooks, pinned install,
      # basecamp mkdir + pre-trust, auth probe. The composite folds in the
      # former separate "Prepare the bare basecamp cwd" mkdir under trust-basecamp.
      - name: Headless Claude setup
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: ./.github/actions/headless-claude
        with:
          claude-code-version: ${{ vars.AGENT_CLAUDE_CODE_VERSION }}
          oauth-token: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}

      # The review itself. Headless Claude invokes the repo's /review skill
      # in integrated mode (it owns the caller-side prep — changed-file set,
      # per-file diffs, issue text from the PR's closing reference) and
      # writes the workflow's returned rollup JSON verbatim to
      # review-rollup.json. GH_TOKEN lets the skill resolve the closing
      # issue via gh. `|| true` so a review failure never fails the job —
      # a missing rollup file is the signal that no post happens.
      #
      # stream-json + the jq renderer make the session watchable LIVE in
      # the Actions log (assistant text + tool names as they happen), and
      # the tee'd JSONL is the durable session transcript, uploaded as an
      # artifact below (iamacoffeepot/aether#2981). The tee target lives
      # in /tmp, outside the checkout, so the session can never mistake
      # it for repo scratch and delete it (#2986). The wait contract mirrors
      # dogfood's #3086 shape — launch the background workflow, end the turn,
      # let the harness re-invoke on completion under the raised ceiling —
      # because the CLI blocks sleep-polling and the old mechanical poll loop
      # raced the ten-minute default ceiling (#3295, run 29249216987).
      # The -p text is BYTE-CONSTANT across runs (#3285): the per-run parameters
      # (pr_number, diff_base) ride /tmp/agent-task.json, so every review box
      # sends an identical first user message and reads the shared prompt-cache
      # prefix instead of re-writing it. ${GITHUB_WORKSPACE} stays interpolated —
      # it is byte-constant per runner substrate. Keep the rest constant.
      - name: Stage the task parameters
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          # diff_base is origin/main on a deep pass and critic's last-reviewed SHA
          # on a confirm pass; review_pass tells the session which prompt it is under
          # (issue #3390). Both ride the file, not the -p text, so the prompt stays
          # byte-constant per class for the #3285 prompt cache.
          DIFF_BASE: ${{ steps.resolve.outputs.diff_base }}
          REVIEW_PASS: ${{ steps.resolve.outputs.review_pass }}
        run: |
          jq -nc --arg pr "$PR_NUMBER" --arg base "$DIFF_BASE" --arg head "$(git rev-parse HEAD)" --arg pass "$REVIEW_PASS" \
            '{pr_number: $pr, diff_base: $base, head_sha: $head, review_pass: $pass}' > /tmp/agent-task.json

      # Warm session pool (#3286; design of record: the #3264 design comment,
      # v1.5). Resume a deposited session whose beliefs are provably true at
      # this checkout instead of re-deriving the subsystem from scratch. The
      # pool is an optimization layer: every pool step is fenced so a failure
      # degrades to today's cold run — it must never block or redden review.
      # Inert unless the owner sets AGENT_POOL_ENABLE=true (console
      # prerequisites in this job's permissions comment above).
      - name: Configure AWS credentials for the session pool
        id: pool-creds
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.AGENT_POOL_ENABLE == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AGENT_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_AWS_REGION }}

      # Checkout half: request-side key from the PR's changed files, newest
      # eligible manifest wins, belief-truth validation retires stale entries
      # on the spot (delete-not-keep), lease via S3 conditional write with
      # self-healing reclaim of an expired lease. `set -e` is deliberately
      # absent: every miss falls through to a cold run.
      - name: Pool checkout
        id: pool-checkout
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.AGENT_POOL_ENABLE == 'true' && steps.pool-creds.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUCKET: ${{ vars.AGENT_SESSION_BUCKET }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          AGENT_POOL_CUTOFF_MINS: ${{ vars.AGENT_POOL_CUTOFF_MINS }}
          AGENT_POOL_CONTEXT_CAP_TOKENS: ${{ vars.AGENT_POOL_CONTEXT_CAP_TOKENS }}
        run: |
          set -uo pipefail
          # The pool logic runs from origin/main (fetched by the diff-base step),
          # never from the PR-head checkout: a branch cut before the script
          # landed would otherwise silently kill the pool (#3293), and PR-head
          # code must not be able to tamper with manifest derivation.
          git show origin/main:scripts/agent-pool.mjs > /tmp/agent-pool.mjs || true
          sid=""; slug=""
          cli_version="$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          model="claude-sonnet-5"
          if [ -n "$cli_version" ] && [ -n "${BUCKET:-}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > /tmp/pool-changed.txt || true
            slug="$(node /tmp/agent-pool.mjs root < /tmp/pool-changed.txt | jq -r .slug)" || slug=""
            git ls-tree -r HEAD > /tmp/pool-ls-tree.txt
            idx="agent/pool/v2/idx/review/${cli_version}/${model}/${slug}/"
            munged="$(echo "/home/runner/basecamp" | sed -E 's/[^a-zA-Z0-9]/-/g')"
            keys="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$idx" \
              --query 'sort_by(Contents||`[]`,&LastModified)[].Key' --output text 2>/dev/null \
              | tr '\t' '\n' | grep -v '^None$' | tail -5 | tac)" || keys=""
            for key in $keys; do
              aws s3 cp "s3://${BUCKET}/${key}" /tmp/pool-candidate.json >/dev/null 2>&1 || continue
              cand_sid="$(jq -r .session_id /tmp/pool-candidate.json)" || continue
              elig="$(node /tmp/agent-pool.mjs eligible --manifest /tmp/pool-candidate.json --ls-tree /tmp/pool-ls-tree.txt)" || continue
              if [ "$(echo "$elig" | jq -r .ok)" != "true" ]; then
                echo "pool: retired ${cand_sid} ($(echo "$elig" | jq -r .reason))" | tee -a "$GITHUB_STEP_SUMMARY"
                aws s3 rm "s3://${BUCKET}/${key}" >/dev/null 2>&1 || true
                aws s3 rm --recursive "s3://${BUCKET}/agent/pool/v2/sessions/${cand_sid}/" >/dev/null 2>&1 || true
                continue
              fi
              lease="agent/pool/v2/leases/${cand_sid}"
              echo "$(( $(date +%s) + 3000 ))" > /tmp/pool-lease.txt   # job leash 45 min + 5
              if ! aws s3api put-object --bucket "$BUCKET" --key "$lease" --body /tmp/pool-lease.txt --if-none-match '*' >/dev/null 2>&1; then
                held="$(aws s3 cp "s3://${BUCKET}/${lease}" - 2>/dev/null || echo 0)"
                if [ "${held:-0}" -lt "$(date +%s)" ] 2>/dev/null; then
                  # expired lease from a dead box — reclaim; a raced re-create still 412s for the loser
                  aws s3 rm "s3://${BUCKET}/${lease}" >/dev/null 2>&1 || true
                  aws s3api put-object --bucket "$BUCKET" --key "$lease" --body /tmp/pool-lease.txt --if-none-match '*' >/dev/null 2>&1 \
                    || { echo "pool: lease race lost on ${cand_sid}"; continue; }
                else
                  echo "pool: ${cand_sid} is leased"; continue
                fi
              fi
              mkdir -p "$HOME/.claude/projects/${munged}"
              if aws s3 sync "s3://${BUCKET}/agent/pool/v2/sessions/${cand_sid}/" "$HOME/.claude/projects/${munged}/" >/dev/null 2>&1; then
                sid="$cand_sid"
                cp /tmp/pool-candidate.json /tmp/pool-prior-manifest.json
                echo "pool: warm checkout ${sid} (root $(jq -r .subsystem_root /tmp/pool-candidate.json), $(jq -r .context_tokens /tmp/pool-candidate.json) ctx tokens)" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                aws s3 rm "s3://${BUCKET}/${lease}" >/dev/null 2>&1 || true
              fi
              break
            done
          fi
          [ -n "$sid" ] || echo "pool: cold run"
          { echo "cli_version=${cli_version}"; echo "session_id=${sid}"; } >> "$GITHUB_OUTPUT"

      # The -p text stays BYTE-CONSTANT on the cold path (#3285). The warm
      # path prepends a constant NEW-JOB preamble that draws the v1.5 trust
      # boundary: file knowledge under the validated root is good; workspace-
      # wide search results and git/board observations predate the resume and
      # must be re-derived; no prior approval or task state carries over.
      # Both paths carry the reuse notice + re-pool verdict contract — the
      # deposit step below refuses to pool a session without an explicit yes.
      - name: Run the five-pillar review
        if: steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POOL_SESSION_ID: ${{ steps.pool-checkout.outputs.session_id }}
          REVIEW_CLASS: ${{ steps.resolve.outputs.review_class }}
          REVIEW_PASS: ${{ steps.resolve.outputs.review_pass }}
          # The wait contract the prompt states ("raises the wait ceiling to
          # forty minutes", the #3086 dogfood shape): without this the fan-out
          # path inherits the ten-minute default and a size:l review's
          # background workflow is killed at ~600s with no rollup (#3536,
          # run 29503476220). Matches dogfood.yml; job timeout-minutes is 45.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "2400000"
        run: |
          # Pass- and profile-conditional task prompt. A CONFIRM pass (issue #3390,
          # judged in-session since #3404) takes precedence over the class split: the
          # resumed session itself adjudicates {prior findings, delta} and writes the
          # rollup — no review.js invocation, no Workflow tool, no spawned agents — so
          # it neither fans out nor cares whether the diff is Rust or
          # light. Otherwise `light` (workflow/action/script diff, no Rust) resolves
          # the three globs and runs correctness + convention with the cargo refuter
          # off; `rust` keeps today's full five-pillar prompt verbatim. Each prompt is
          # byte-constant with other runs of the same pass/class for the prompt cache
          # (#3285) — the per-run params ride /tmp/agent-task.json.
          if [ "$REVIEW_PASS" = "confirm" ]; then
          cat > /tmp/review-task-prompt.md <<PROMPT
          You are running headless in CI on a checkout of a PR's head branch.
          The repo checkout is at ${GITHUB_WORKSPACE}; cd into it and do all repo
          work there — your current directory is a bare scratch dir, not the repo.
          FIRST ACTION: read /tmp/agent-task.json. Its pr_number field is the PR under
          review; its diff_base field is critic's LAST-REVIEWED SHA (not origin/main);
          its head_sha field is the checkout's HEAD; its review_pass field is 'confirm'.
          This is a CONFIRM pass, NOT a full review. The deep five-pillar pass already
          ran on this PR and critic posted findings. Your job is to confirm whether the
          delta since the last-reviewed SHA ADDRESSED those findings — never to re-review
          the whole change or hunt for new nits (that non-converging ratchet is exactly
          what this pass exists to stop).
          Resolve two things caller-side (do all of this yourself, in this session):
          1. PRIOR FINDINGS — use gh to read this PR's critic review verdict bodies, its
          inline review comments, and the '<!-- aether-review -->' summary comment. Each
          reported finding carries an 'aether-review-fp:PATH|LINE|PILLAR' marker next to
          its rendered text ('**pillar/category** (severity) — symbol recommendation:
          suggested_form'). Parse each into an object { file (PATH), line (LINE, null if
          '-'), pillar, category, symbol, severity, recommendation, suggested_form, gate
          ('soft-hold' if the finding was under a soft-hold section, else 'advisory') }.
          Deduplicate by PATH|LINE|PILLAR (the same finding appears on multiple surfaces).
          2. DELTA — the changed files and per-file diff hunks since the last-reviewed
          SHA: 'git diff --name-only <diff_base>...HEAD' and 'git diff <diff_base>...HEAD
          -- <file>' per file, substituting the file's diff_base value.
          Then adjudicate DIRECTLY IN THIS SESSION (issue #3404) — do NOT invoke the
          /review skill, do NOT use the Workflow tool, do NOT spawn subagents; the whole
          judgment is yours, in this context. For each prior finding decide: does the
          delta resolve it (the concern it named no longer holds)? Note the resolving
          hunk, or why it is still open. Emit NO new ordinary findings — a would-be nit
          on unchanged code is the deep pass's own miss and lands as a non-blocking
          advisory at most. Separately decide the restart signal: true only when the
          delta is so large or divergent that a full re-review is warranted — a
          fundamental rework, not an ordinary fix round.
          Then write ${GITHUB_WORKSPACE}/review-rollup.json yourself — that absolute
          path — containing exactly one JSON object in this shape (the confirm rollup
          contract; the post job reads it verbatim):
          {"reviewPass": "confirm",
           "restart": {"signaled": <bool>, "rationale": "<why / why not>"},
           "bounce": <null, or {"to": "design", "reason": "<restart rationale>"} iff restart.signaled>,
           "totals": {"priorFindings": <N>, "stillOpen": <M>, "advisories": <K>},
           "spec": null,
           "confirmed": [<one row per STILL-OPEN prior finding, re-asserted UNCHANGED so
             its fingerprint matches across rounds: {"file", "pillar", "source": "confirm",
             "category", "line" (null if unknown), "symbol", "severity",
             "gate" ("soft-hold" only if the prior finding was soft-hold, else "advisory"),
             "recommendation", "suggested_form"}>],
           "softHolds": [<the subset of confirmed whose gate is "soft-hold">],
           "followUps": [<one row per unchanged-code advisory: {"file", "pillar",
             "source": "confirm-advisory", "category": "unchanged-code", "line" (null ok),
             "symbol", "severity": "low", "gate": "advisory", "suggested_form": "<the note>"}>],
           "grouped": {}, "lintCandidates": [], "spared": [], "uncertain": []}
          An addressed finding appears in NO array — only still-open findings are
          re-asserted. If you cannot resolve the prior findings or the delta, do NOT
          fabricate a rollup file: leave the failure in the session transcript so the
          action records an actionable no-rollup attempt.
          Do not edit any source.
          SESSION REUSE (the warm pool, #3286): this session may be deposited and later
          resumed by a DIFFERENT job for a DIFFERENT task against the same files — your
          accumulated knowledge of the files you read is the asset being deposited, so
          do not assume any future prompt continues this task. After the rollup file is
          written and before your final reply, write ${GITHUB_WORKSPACE}/pool-verdict.json
          containing exactly one JSON object: {"repool": "yes" or "no", "reason": "<one
          line>", "knowledge_summary": "<one line naming the subsystem knowledge this
          session now carries>"}. Answer no when this session's context is dominated by
          dead ends, thrash, or an abandoned approach rather than durable knowledge of
          the files it read.
          Print exactly REVIEW-DONE when the rollup and verdict files are written.
          PROMPT
          elif [ "$REVIEW_CLASS" = "light" ]; then
          cat > /tmp/review-task-prompt.md <<PROMPT
          You are running headless in CI on a checkout of a PR's head branch.
          The repo checkout is at ${GITHUB_WORKSPACE}; cd into it and do all repo
          work there — your current directory is a bare scratch dir, not the repo.
          FIRST ACTION: read /tmp/agent-task.json. Its pr_number field is the PR under
          review; its diff_base field is the diff base; its head_sha field is the
          checkout's HEAD.
          This is a LIGHT-PROFILE review: the PR changes no Rust, but it touches the
          fleet's own automation surface (.github/workflows/**, .github/actions/**,
          scripts/**), where a logic / liveness / state-accounting bug in
          bash-inside-YAML parses fine and leaves unrelated CI green.
          READ THE DIFF FIRST, THEN SIZE YOUR OWN MACHINERY (issue #3414). The tier table
          already decided this diff earns a review session; your call is how much machinery
          above that floor to spend. Resolve the changed files matching .github/workflows/**,
          .github/actions/**, and scripts/** (NOT .rs) and their per-file diffs from git:
          'git diff --name-only <diff_base>...HEAD' and 'git diff <diff_base>...HEAD -- <file>'
          per file, substituting the file's diff_base value. Read the issue text this PR
          closes (use gh to find the PR's closing reference for the pr_number if needed).
          Then judge how much this diff earns — you have two paths, and the choice is yours.
          INLINE PATH (the default for a small, simple light diff). When the diff is small
          enough that you can review it confidently in this one context, apply the light
          profile's two pillars — correctness and convention — DIRECTLY IN THIS SESSION: do
          NOT invoke the /review skill, do NOT use the Workflow tool, do NOT spawn subagents,
          and therefore observe NO wait contract (the whole judgment is yours, in this
          context, like a confirm pass). Judge logic / control-flow / state-accounting
          invariants in the diff's actual language (shell / YAML / JS), not Rust-anchored
          hazards, and classify each flagged bug's provenance against the merge-base
          <diff_base> (a bug reachable on the base is a pre-existing advisory follow-up,
          never an in-PR demand). Then write ${GITHUB_WORKSPACE}/review-rollup.json yourself
          — that absolute path — containing exactly one JSON object in the deep-rollup shape
          the post job reads (the same shape review.js returns; the deep-only channels are
          empty because no fan-out ran):
          {"reviewPass": "deep",
           "restart": null,
           "bounce": null,
           "totals": {"files": <N>, "findings": <total flagged>, "confirmed": <M>, "softHolds": <S>},
           "spec": null,
           "confirmed": [<one row per IN-PR finding: {"file" (full changed-file path), "pillar" ("correctness" or "convention"), "source": "high-confidence", "category", "line" (null if unknown), "symbol", "severity", "gate" ("soft-hold" for a high-severity correctness finding, else "advisory"), "recommendation", "suggested_form"}>],
           "softHolds": [<the subset of confirmed whose gate is "soft-hold">],
           "followUps": [<one row per PRE-EXISTING (base-reachable) finding: {"file", "pillar", "source": "deep-advisory", "category", "line" (null ok), "symbol", "severity", "gate": "advisory", "suggested_form": "<the note>"}>],
           "grouped": {}, "lintCandidates": [], "spared": [], "uncertain": []}
          A clean inline review writes the same object with confirmed / softHolds / followUps
          all empty — do NOT fabricate findings to fill it. restart / bounce stay null: a
          diff so divergent it would warrant a restart is exactly a diff you should NOT be
          inlining — escalate to the fan-out below instead. If you cannot resolve the diff
          or the closing issue text, do NOT write a rollup file: leave the failure in the
          session transcript so the action records an actionable no-rollup attempt.
          FAN-OUT PATH (escalation — always safe). When the diff exceeds what you can review
          confidently in one context — many files, tangled control flow, a change whose blast
          radius you are unsure of — do NOT inline. Invoke the repo's /review skill in
          INTEGRATED mode against <diff_base>...HEAD, substituting the file's diff_base value:
          resolve the same changed files (.github/workflows/**, .github/actions/**,
          scripts/**; NOT .rs) and their per-file diffs, and read the closing issue text.
          Pass lenses: ['correctness', 'convention'], noBuild: true, depth: gate,
          diffBase: <diff_base> (read from the file), and reviewMode: full in the /review
          invocation's workflow args — the light profile runs only the correctness and
          convention pillars with the cargo-oriented correctness refuter off (noBuild), so
          it judges logic / control-flow / state-accounting invariants in the diff's actual
          language (shell / YAML / JS) rather than Rust-anchored hazards; diffBase +
          reviewMode let it classify a flagged bug's provenance against the merge-base (a
          pre-existing bug reachable on the base becomes an advisory follow-up, never an
          in-PR demand). Let the skill run the review.js workflow in a single pass.
          THE WAIT CONTRACT (load-bearing — headless runs die on this; applies to the
          FAN-OUT PATH ONLY, since the inline path spawns nothing): the Workflow tool
          runs in the BACKGROUND. Launch it, then end your turn with a one-line status
          note — nothing else. The headless harness holds the process open for the
          in-flight background workflow (this step raises the wait ceiling to forty
          minutes) and re-invokes you with a completion notification when it finishes.
          Do NOT poll for the result: sleep-based polling is blocked here, and a Monitor
          on the rollup path is useless because that file only appears when YOU write
          it. Do NOT stop the workflow task, and NEVER treat the status note as the end
          of the job. When the completion notification arrives, read the workflow's
          returned { rollup, files } value (from the task output file if the
          notification truncates it) and write the returned ROLLUP object as JSON
          verbatim to exactly ${GITHUB_WORKSPACE}/review-rollup.json — that absolute
          path, not a path relative to your working directory (the rollup, not the
          whole return). The file never appears on its own — YOU write it. If the
          workflow reports an error or no rollup, do NOT fabricate a replacement file:
          leave the failure in the session transcript so the action records an
          actionable no-rollup attempt.
          WHEN IN DOUBT, ESCALATE. Escalating a small diff to the fan-out is always safe;
          inlining a diff too large to review confidently is the only unsafe move. Never
          review below the fan-out floor out of thrift — the floor is the mechanical table's
          call, the spend above it is yours.
          Do not edit any source (on the fan-out path the noBuild flag keeps the correctness
          refuter subagent non-editing too).
          SESSION REUSE (the warm pool, #3286): this session may be deposited and later
          resumed by a DIFFERENT job for a DIFFERENT task against the same files — your
          accumulated knowledge of the files you read is the asset being deposited, so
          do not assume any future prompt continues this task. After the rollup file is
          written and before your final reply, write ${GITHUB_WORKSPACE}/pool-verdict.json
          containing exactly one JSON object: {"repool": "yes" or "no", "reason": "<one
          line>", "knowledge_summary": "<one line naming the subsystem knowledge this
          session now carries>"}. Answer no when this session's context is dominated by
          dead ends, thrash, or an abandoned approach rather than durable knowledge of
          the files it read.
          Print exactly REVIEW-DONE when the rollup and verdict files are written.
          PROMPT
          else
          cat > /tmp/review-task-prompt.md <<PROMPT
          You are running headless in CI on a checkout of a PR's head branch.
          The repo checkout is at ${GITHUB_WORKSPACE}; cd into it and do all repo
          work there — your current directory is a bare scratch dir, not the repo.
          FIRST ACTION: read /tmp/agent-task.json. Its pr_number field is the PR under
          review; its diff_base field is the diff base; its head_sha field is the
          checkout's HEAD.
          Invoke the repo's /review skill in INTEGRATED mode against <diff_base>...HEAD,
          substituting the file's diff_base value: resolve the changed .rs files and their
          per-file diffs from git, and read the issue text this PR closes (use gh to find
          the PR's closing reference for the pr_number
          if needed). Pass noBuild: true, depth: gate, diffBase: <diff_base> (read from the
          file), and reviewMode: full in the /review invocation's workflow
          args — this runner has no Rust toolchain, so the high-severity correctness refuter must
          ground read-only rather than write and run a scratch cargo test, and diffBase + reviewMode
          let it classify a flagged correctness bug's provenance against the merge-base (a pre-existing
          bug reachable on the base becomes an advisory follow-up, never an in-PR demand). Let the skill run the
          review.js workflow in a single pass.
          THE WAIT CONTRACT (load-bearing — headless runs die on this): the Workflow tool
          runs in the BACKGROUND. Launch it, then end your turn with a one-line status
          note — nothing else. The headless harness holds the process open for the
          in-flight background workflow (this step raises the wait ceiling to forty
          minutes) and re-invokes you with a completion notification when it finishes.
          Do NOT poll for the result: sleep-based polling is blocked here, and a Monitor
          on the rollup path is useless because that file only appears when YOU write
          it. Do NOT stop the workflow task, and NEVER treat the status note as the end
          of the job. When the completion notification arrives, read the workflow's
          returned { rollup, files } value (from the task output file if the
          notification truncates it) and write the returned ROLLUP object as JSON
          verbatim to exactly ${GITHUB_WORKSPACE}/review-rollup.json — that absolute
          path, not a path relative to your working directory (the rollup, not the
          whole return). The file never appears on its own — YOU write it. If the
          workflow reports an error or no rollup, do NOT fabricate a replacement file:
          leave the failure in the session transcript so the action records an
          actionable no-rollup attempt.
          Do not edit any source (the noBuild flag above keeps the correctness refuter
          subagent non-editing too).
          SESSION REUSE (the warm pool, #3286): this session may be deposited and later
          resumed by a DIFFERENT job for a DIFFERENT task against the same files — your
          accumulated knowledge of the files you read is the asset being deposited, so
          do not assume any future prompt continues this task. After the rollup file is
          written and before your final reply, write ${GITHUB_WORKSPACE}/pool-verdict.json
          containing exactly one JSON object: {"repool": "yes" or "no", "reason": "<one
          line>", "knowledge_summary": "<one line naming the subsystem knowledge this
          session now carries>"}. Answer no when this session's context is dominated by
          dead ends, thrash, or an abandoned approach rather than durable knowledge of
          the files it read.
          Print exactly REVIEW-DONE when the rollup and verdict files are written.
          PROMPT
          fi
          if [ -n "${POOL_SESSION_ID:-}" ]; then
            cat > /tmp/pool-preamble.md <<'PREAMBLE'
          NEW JOB — you are a session resumed from the warm pool. Your prior
          conversation is knowledge of this repository's files, NOT task state: the
          task below is unrelated to whatever you did before, and no prior approval,
          waiver, or instruction carries over. The checkout has moved: its HEAD is the
          head_sha in /tmp/agent-task.json, so every git or board observation from
          before this message is stale — re-run any git or gh query you need. File
          contents you read under your subsystem root are still valid (the pool
          verified them unchanged against this checkout); workspace-wide search
          results from before this message are not — re-run them. Do not re-read
          files you already know unless the task requires it.

          PREAMBLE
            cat /tmp/pool-preamble.md /tmp/review-task-prompt.md > /tmp/review-prompt.md
            (cd /home/runner/basecamp && claude --resume "$POOL_SESSION_ID" -p "$(cat /tmp/review-prompt.md)" \
              --dangerously-skip-permissions \
              --add-dir "$GITHUB_WORKSPACE" \
              --append-system-prompt "$(cat "$GITHUB_WORKSPACE/CLAUDE.md")" \
              --model claude-sonnet-5 \
              --effort high \
              --max-turns 80 \
              --output-format stream-json --verbose) \
              | tee /tmp/review-session.jsonl \
              | python3 scripts/render-agent-stream.py \
              || true
          else
            (cd /home/runner/basecamp && claude -p "$(cat /tmp/review-task-prompt.md)" \
              --dangerously-skip-permissions \
              --add-dir "$GITHUB_WORKSPACE" \
              --append-system-prompt "$(cat "$GITHUB_WORKSPACE/CLAUDE.md")" \
              --model claude-sonnet-5 \
              --effort high \
              --max-turns 80 \
              --output-format stream-json --verbose) \
              | tee /tmp/review-session.jsonl \
              | python3 scripts/render-agent-stream.py \
              || true
          fi

      # Warm-resume drift signal (#3347). Print the resumed session's turn-1
      # cache accounting so a warm box that suddenly re-writes head-plus-body
      # instead of tens of tokens is one glance in the run summary, not
      # transcript archaeology. Warm resumes only (session_id set); staged from
      # origin/main like the pool steps, fully fenced so a parse miss never
      # touches the job result.
      - name: Pool resume-cost printout
        if: always() && steps.pool-checkout.outputs.session_id != ''
        run: |
          set -uo pipefail
          [ -f /tmp/review-session.jsonl ] || exit 0
          git show origin/main:scripts/agent-pool.mjs > /tmp/agent-pool.mjs 2>/dev/null || exit 0
          cost="$(node /tmp/agent-pool.mjs resume-cost --transcript /tmp/review-session.jsonl 2>/dev/null)" || exit 0
          [ -n "$cost" ] && echo "pool: resume turn-1 ${cost}" | tee -a "$GITHUB_STEP_SUMMARY" || true

      # Deposit half (if: always() so a failed review still releases the
      # lease). The mjs enforces the hygiene gates — clean exit, no
      # compaction, under the cap, explicit repool: yes — and merges a
      # resumed session's prior read set (the declared set is cumulative). A
      # refusal retires the resumed entry rather than reverting it; a
      # successful re-deposit supersedes it under the new session id. Depth
      # trim keeps the newest AGENT_POOL_DEPTH entries per slug.
      - name: Pool deposit
        if: always() && steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.AGENT_POOL_ENABLE == 'true' && steps.pool-creds.outcome == 'success'
        env:
          BUCKET: ${{ vars.AGENT_SESSION_BUCKET }}
          CLI_VERSION: ${{ steps.pool-checkout.outputs.cli_version }}
          PRIOR_SID: ${{ steps.pool-checkout.outputs.session_id }}
          AGENT_POOL_DEPTH: ${{ vars.AGENT_POOL_DEPTH }}
          AGENT_POOL_CUTOFF_MINS: ${{ vars.AGENT_POOL_CUTOFF_MINS }}
          AGENT_POOL_CONTEXT_CAP_TOKENS: ${{ vars.AGENT_POOL_CONTEXT_CAP_TOKENS }}
        run: |
          set -uo pipefail
          # Same origin/main staging as Pool checkout (#3293) — this step runs
          # even when checkout was skipped, so it stages its own copy.
          git show origin/main:scripts/agent-pool.mjs > /tmp/agent-pool.mjs || true
          model="claude-sonnet-5"
          release_lease() {
            [ -n "${PRIOR_SID:-}" ] && aws s3 rm "s3://${BUCKET}/agent/pool/v2/leases/${PRIOR_SID}" >/dev/null 2>&1 || true
          }
          retire_prior() {
            if [ -n "${PRIOR_SID:-}" ] && [ -f /tmp/pool-prior-manifest.json ]; then
              old_slug="$(jq -r .slug /tmp/pool-prior-manifest.json 2>/dev/null)" || old_slug=""
              aws s3 rm "s3://${BUCKET}/agent/pool/v2/idx/review/${CLI_VERSION:-unknown}/${model}/${old_slug}/${PRIOR_SID}.json" >/dev/null 2>&1 || true
              aws s3 rm --recursive "s3://${BUCKET}/agent/pool/v2/sessions/${PRIOR_SID}/" >/dev/null 2>&1 || true
            fi
          }
          [ -n "${BUCKET:-}" ] || exit 0
          [ -f /tmp/review-session.jsonl ] || { release_lease; exit 0; }
          git ls-tree -r HEAD > /tmp/pool-ls-tree.txt
          prior_flag=""
          [ -f /tmp/pool-prior-manifest.json ] && prior_flag="--prior /tmp/pool-prior-manifest.json"
          out="$(node /tmp/agent-pool.mjs manifest \
            --transcript /tmp/review-session.jsonl \
            --ls-tree /tmp/pool-ls-tree.txt \
            --verdict "$GITHUB_WORKSPACE/pool-verdict.json" \
            --cli-version "${CLI_VERSION:-unknown}" $prior_flag)" || out='{"ok":false,"reason":"manifest-error"}'
          # Record this box's re-pool disposition for the spend ledger's pool
          # block (#3166) — accepted, or the refusal/retirement reason. A /tmp
          # write, so it can never perturb the deposit's own control flow.
          echo "$out" | jq -r 'if .ok then "accepted" else .reason end' > /tmp/pool-deposit-reason.txt 2>/dev/null || true
          if [ "$(echo "$out" | jq -r .ok)" = "true" ]; then
            echo "$out" | jq .manifest > /tmp/pool-manifest-new.json
            new_sid="$(jq -r .session_id /tmp/pool-manifest-new.json)"
            slug="$(jq -r .slug /tmp/pool-manifest-new.json)"
            munged="$(echo "/home/runner/basecamp" | sed -E 's/[^a-zA-Z0-9]/-/g')"
            idx="agent/pool/v2/idx/review/${CLI_VERSION:-unknown}/${model}/${slug}"
            if aws s3 sync "$HOME/.claude/projects/${munged}/" "s3://${BUCKET}/agent/pool/v2/sessions/${new_sid}/" >/dev/null 2>/tmp/pool-upload-err.txt \
               && aws s3 cp /tmp/pool-manifest-new.json "s3://${BUCKET}/${idx}/${new_sid}.json" >/dev/null 2>>/tmp/pool-upload-err.txt; then
              echo "pool: deposited ${new_sid} under ${idx} ($(jq -r .context_tokens /tmp/pool-manifest-new.json) ctx tokens)" | tee -a "$GITHUB_STEP_SUMMARY"
              [ "${PRIOR_SID:-}" != "$new_sid" ] && retire_prior
              depth="${AGENT_POOL_DEPTH:-1}"
              aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "${idx}/" \
                --query 'sort_by(Contents||`[]`,&LastModified)[].Key' --output text 2>/dev/null \
                | tr '\t' '\n' | grep -v '^None$' | head -n -"$depth" | while read -r stale; do
                    [ -n "$stale" ] || continue
                    ssid="$(basename "$stale" .json)"
                    aws s3 rm "s3://${BUCKET}/${stale}" >/dev/null 2>&1 || true
                    aws s3 rm --recursive "s3://${BUCKET}/agent/pool/v2/sessions/${ssid}/" >/dev/null 2>&1 || true
                    echo "pool: depth trim retired ${ssid}" | tee -a "$GITHUB_STEP_SUMMARY"
                  done
            else
              echo "pool: deposit upload failed — entry not published ($(tail -c 300 /tmp/pool-upload-err.txt 2>/dev/null | tr '\n' ' '))" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "pool: deposit refused ($(echo "$out" | jq -r .reason))" | tee -a "$GITHUB_STEP_SUMMARY"
            retire_prior
          fi
          release_lease
          exit 0

      # Meter the review run into the same spend ledger as agent-work (#3166).
      # Review boxes run the warm session pool (#3286/#3290), so their envelope
      # carries a `pool` block beside the cost/token columns: warm-vs-cold, the
      # re-pool verdict and whether the box complied by writing it, and this
      # box's own re-pool disposition (accepted / refusal reason). That is what
      # lets the pool's flag-flip be demonstrated against the ledger instead of
      # asserted. The pool block is assembled only when AGENT_POOL_ENABLE is on.
      #
      # Credential care: the pool-creds step exported OIDC creds scoped to
      # agent/pool/* into the job env, and they cannot reach agent/usage/* — so
      # this step clears the AWS_* credential triplet and lets the RunsOn
      # instance profile (which reaches the evidence bucket ambiently, like
      # dogfood's write) carry the PutObject. Region is left intact. The script
      # is staged from origin/main — never the PR head — so a branch cut before
      # it landed still meters, and PR-head code can't tamper with derivation.
      # Fenced like every pool step: a metering slip never reddens a review.
      - name: Meter the review into the spend ledger
        if: always() && steps.resolve.outputs.proceed == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          JOB_STATUS: ${{ job.status }}
          AGENT_POOL_ENABLE: ${{ vars.AGENT_POOL_ENABLE }}
          POOL_SESSION_ID: ${{ steps.pool-checkout.outputs.session_id }}
          POOL_CLI_VERSION: ${{ steps.pool-checkout.outputs.cli_version }}
        run: |
          set -uo pipefail
          [ -f /tmp/review-session.jsonl ] || { echo "no transcript — nothing to meter"; exit 0; }
          command -v node >/dev/null || { echo "no node — ledger row skipped"; exit 0; }
          command -v aws  >/dev/null || { echo "no aws cli — ledger write skipped"; exit 0; }
          git show origin/main:scripts/agent-usage-record.mjs > /tmp/agent-usage-record.mjs || {
            echo "usage script not on origin/main yet — ledger row skipped"; exit 0; }

          pool_arg=""
          if [ "${AGENT_POOL_ENABLE:-}" = "true" ]; then
            warm=false; [ -n "${POOL_SESSION_ID:-}" ] && warm=true
            verdict="null"; reason=""; compliance="null"
            if [ -f "$GITHUB_WORKSPACE/pool-verdict.json" ] && jq -e empty "$GITHUB_WORKSPACE/pool-verdict.json" 2>/dev/null; then
              verdict="$(jq -r '.repool // "unknown"' "$GITHUB_WORKSPACE/pool-verdict.json")"
              reason="$(jq -r '.reason // ""' "$GITHUB_WORKSPACE/pool-verdict.json")"
              compliance="true"
            elif [ "$warm" = true ]; then
              compliance="false"   # warm session was asked to write a verdict and did not (or it was malformed)
            fi
            retire="$( [ -f /tmp/pool-deposit-reason.txt ] && cat /tmp/pool-deposit-reason.txt || true )"
            jq -nc \
              --argjson warm "$warm" \
              --arg session_id "${POOL_SESSION_ID:-}" \
              --arg cli_version "${POOL_CLI_VERSION:-}" \
              --arg verdict "$verdict" \
              --arg reason "$reason" \
              --argjson compliance "$compliance" \
              --arg retire "$retire" \
              '{
                 warm: $warm,
                 session_id: (if $session_id == "" then null else $session_id end),
                 cli_version: (if $cli_version == "" then null else $cli_version end),
                 repool_verdict: (if $verdict == "null" then null else $verdict end),
                 repool_reason: (if $reason == "" then null else $reason end),
                 repool_compliance: $compliance,
                 retire_reason: (if $retire == "" then null else $retire end)
               }' > /tmp/pool-meter.json && pool_arg="--pool /tmp/pool-meter.json"
          fi

          record="$(node /tmp/agent-usage-record.mjs \
            --transcript /tmp/review-session.jsonl \
            --task review --ref "$PR_NUMBER" --run-id "$GITHUB_RUN_ID" \
            --conclusion "$JOB_STATUS" --model claude-sonnet-5 \
            --created-at "$(date -u +%FT%TZ)" $pool_arg)" \
            || { echo "usage derivation failed — ledger row skipped"; exit 0; }
          printf '%s\n' "$record" > /tmp/review-usage-record.json

          # Drop the pool OIDC creds so the instance profile carries the write.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          aws s3 cp /tmp/review-usage-record.json \
            "s3://aether-evidence/agent/usage/$(date -u +%F)/${GITHUB_RUN_ID}.json" \
            --content-type application/json \
            || echo "ledger write failed (IAM grant on agent/usage/* pending?) — review stays green"

      # Whether the run produced a rollup gates the `post` job. Kept as a
      # step so `post` can `needs`-read it without inspecting the artifact.
      # A missing rollup after the review actually ran (gates passed, token
      # present) is a FAILURE, not a quiet skip — the inaugural run
      # (iamacoffeepot/aether#2979) skipped silently and reported success
      # when the headless session exited with the workflow still in flight.
      # The quiet-skip path exists only for the absent-secret case, which
      # never reaches the else branch here.
      - name: Note whether a rollup was produced
        id: rollup
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          if [ -f review-rollup.json ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "review ran but produced no rollup — failing loudly. Session's final events:"
            # An if, not `tail … || echo`: the pipeline's exit status is
            # cut's, so the || fallback can never fire (#2986).
            if [ -f /tmp/review-session.jsonl ]; then
              tail -n 5 /tmp/review-session.jsonl | cut -c1-2000
            else
              echo "(no session transcript)"
            fi
            exit 1
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.rollup.outputs.produced == 'true'
        with:
          name: review-rollup
          path: review-rollup.json
          if-no-files-found: ignore

      # The full session transcript (stream-json JSONL) — uploaded even on
      # failure, since a dead run's transcript is exactly what diagnoses
      # it. This is the same transcript.jsonl artifact the evidence design
      # (#2967) wants long-term.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review-session-transcript
          path: /tmp/review-session.jsonl
          if-no-files-found: ignore

  post:
    name: Post review rollup
    needs: review
    # No-op when the review job produced no rollup (token absent, no open
    # PR, gated out, or the review itself failed).
    if: needs.review.outputs.rollup_produced == 'true'
    runs-on: ubuntu-latest
    # The only job with write scopes, and it never executes branch code:
    # the default checkout is the base repo (main), so the poster script is
    # the trusted version — the PR head is only ever read as data. actions:
    # write is for the terminal reconciler poke below.
    permissions:
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-rollup
      # Mint the critic installation token that AUTHORS the native verdict.
      # Minting is confined to this trusted `post` job (which runs only main's
      # code and reads the PR head as data) — never the branch-code-executing
      # `review` job — so the approval channel is reachable only from main,
      # exactly as ADR-0148 requires. Same pattern as agent-work.yml's writer
      # App mint; critic authors no PR, so GitHub does not 422 its verdict.
      - name: Mint the critic installation token
        id: critic-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.CRITIC_APP_ID }}
          private-key: ${{ secrets.CRITIC_APP_PRIVATE_KEY }}
      - name: Fetch the PR's changed files + diff hunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ needs.review.outputs.pr_number }}/files" \
            --paginate > pr-files.json
      - name: Post the rollup as annotations + summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The verdict-submission POST rides critic; every other call (summary
          # comment, dedup reads) stays on GITHUB_TOKEN.
          CRITIC_TOKEN: ${{ steps.critic-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          ROLLUP_PATH: review-rollup.json
          FILES_PATH: pr-files.json
        run: node scripts/post-review-rollup.mjs

      # Poke the reconciler with the exact PR number this review just posted
      # for, so its linked issue's phase recomputes the moment the review
      # verdict lands rather than waiting on the cron backstop. workflow_dispatch
      # is the documented exception that a GITHUB_TOKEN-created event still
      # triggers a workflow. continue-on-error: a failed poke degrades to the
      # reconciler's scheduled recompute and must never fail the rollup post.
      - name: Poke the reconciler
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.review.outputs.pr_number }}
        run: gh workflow run reconciler.yml -f pr="$PR"

  approve:
    name: Below-the-bar approve
    needs: review
    # A PR the tier table resolved below the session bar (a non-empty
    # approve_route — `out-of-scope`, `trivial-comment-only`, or
    # `trivial-small-light`; issue #3404) gets a session-less critic APPROVE
    # naming the matched tier, so critic carries a standing verdict the native
    # required review reads. `always()` because the `post` job is skipped for
    # these routes (no rollup), and the pr_number guard drops the fork /
    # no-open-PR cases. Over-cap PRs carry an empty route, so they never reach
    # here — they rest blocked on the absent verdict.
    if: >
      always() &&
      needs.review.outputs.pr_number != '' &&
      needs.review.outputs.approve_route != ''
    runs-on: ubuntu-latest
    # A pure-API job: no branch checkout, no repo write scope. The APPROVE rides
    # the minted critic token, not the job's GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - name: Mint the critic installation token
        id: critic-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.CRITIC_APP_ID }}
          private-key: ${{ secrets.CRITIC_APP_PRIVATE_KEY }}
      - name: Submit the below-the-bar APPROVE as critic
        env:
          GH_TOKEN: ${{ steps.critic-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.review.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          APPROVE_ROUTE: ${{ needs.review.outputs.approve_route }}
          CRITIC_LOGIN: iamacritic[bot]
        run: |
          set -euo pipefail
          # Skip when critic already approved this head SHA, so repeated
          # requests on a below-the-bar PR don't spam duplicate approvals.
          # Stream the matching review ids (a per-page `.[]` jq, so --paginate
          # concatenates cleanly rather than emitting one length per page) and
          # test non-empty.
          approved="$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
            --jq ".[] | select(.user.login==\"${CRITIC_LOGIN}\" and .commit_id==\"${HEAD_SHA}\" and .state==\"APPROVED\") | .id")"
          if [ -n "$approved" ]; then
            echo "critic already approved ${HEAD_SHA} — skipping."
            exit 0
          fi
          # The verdict body names the matched tier so the APPROVE is
          # self-explaining on the PR.
          case "$APPROVE_ROUTE" in
            out-of-scope) why='no reviewable surface changed (docs / ADR / manifest only)' ;;
            trivial-comment-only) why='every changed line is a comment or blank — no behavior to review' ;;
            trivial-small-light) why='automation-surface diff under the small-diff bar (AETHER_REVIEW_TRIVIAL_MAX_LINES)' ;;
            *) why="tier $APPROVE_ROUTE" ;;
          esac
          gh api -X POST "repos/${REPO}/pulls/${PR}/reviews" \
            -f event=APPROVE \
            -f commit_id="${HEAD_SHA}" \
            -f body="Below the review-session bar — tier \`${APPROVE_ROUTE}\`: ${why}. Auto-approved by critic so the PR carries a standing verdict for the native required review; the owner can force a full review session on this PR anyway."
