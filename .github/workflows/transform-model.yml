name: Transform (model lane, BYO)
run-name: transform-model ${{ inputs.command }} ${{ inputs.nonce }}

# ADR-0149 §Execution's WORKER-SIDE model lane (#3511) — the sibling of the
# zero-secret mechanical `transform.yml`. The model lanes — `construct.implement`
# and `review.critic` — run headless Claude, so they need a Claude credential;
# that credential is non-delegable and holder-restricted (BYO-worker). A
# contributor runs THIS wrapper in their own fork with their own Claude secret:
# it checks out the exact digest a resolved work order names, runs the same
# `cargo xtask transform <command>` entrypoint at the coordinator-resolved model
# + effort, and uploads the nonce-tagged result-record evidence.
#
# The BYO boundary is the whole point: the coordinator dispatches by nonce+digest
# and validates the returned evidence by nonce+digest — it never sets this
# secret and never sees the credential. Do NOT add the Claude secret to the
# coordinator repo; that would collapse the boundary this lane exists to keep.
# `transform.yml` stays zero-secret and is the only lane the coordinator runs.

# Invariants this lane must preserve (ADR-0149 §Execution, #3572):
#   1. The workflow DEFINITION stays pinned. The coordinator fires this dispatch
#      at the protected `executor_dispatch_ref`, so the wrapper text that runs is
#      always the reviewed one; only the CHECKOUT TARGET below moves per order.
#   2. Subjects are sealed content. The `subject` this checks out is the git
#      commit a sealed bloom's resolved work order named — admission at seal is
#      what makes the tree trusted enough to build against.
#   3. The credential boundary is unchanged. The BYO Claude token reaches only
#      the construct step; the nonce-stamped evidence contract is untouched.
on:
  workflow_dispatch:
    inputs:
      command:
        # The model lane is not one command: `construct.implement` and
        # `review.critic` both run a model, and the coordinator dispatches
        # whichever the order names. Hardcoding one here would silently run the
        # constructor for a review order.
        description: "Typed model-lane command id (construct.implement / review.critic)"
        required: true
      subject:
        # The checkout TARGET (invariants 1 & 2) — the exact git commit the
        # resolved work order names, distinct from the pinned dispatch ref the
        # coordinator fires this workflow at. Named `subject`, not `ref`, so it
        # can never be confused with that dispatch ref (the confusion the stub
        # `submit` fell into, populating the checkout input with the pinned ref).
        description: "Exact git commit the attempt's worker checks out (the sealed source the work order names)"
        required: true
      nonce:
        description: "Idempotency nonce stamped into evidence.json"
        required: true
      model:
        description: "Coordinator-resolved model (from the sealed scope-revision override)"
        required: true
      effort:
        description: "Coordinator-resolved reasoning effort tier"
        required: false
      displayed:
        # The same evidence binding `transform.yml` carries: the intake decodes
        # the attempt artifact's NAME and admits nothing else, so a model-lane
        # run that uploaded the legacy `evidence-<nonce>` name would be skipped
        # as a stray upload and its work never counted.
        description: "Scope-revision digest hex the returned evidence names (attempt-artifact binding); empty = legacy evidence-<nonce> name"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  transform-model:
    name: Transform (model lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Invariant 1: the checkout target is the order's subject, NOT the
          # pinned ref this workflow was dispatched at — the tree the work runs on.
          ref: ${{ inputs.subject }}
      - run: rustup toolchain install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the model lane (worker-side, BYO credential)
        id: transform
        continue-on-error: true
        # The worker's own Claude secret, set in the worker's fork — never the
        # coordinator's. The result-record derivation runs node over the
        # transcript; the credential reaches only this step.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          cargo xtask transform ${{ inputs.command }}
          --out evidence
          --subject ${{ inputs.subject }}
          --nonce ${{ inputs.nonce }}
          --model ${{ inputs.model }}
          --effort ${{ inputs.effort }}
      - name: Compose the attempt artifact name
        id: artifact
        env:
          DISPLAYED: ${{ inputs.displayed }}
          NONCE: ${{ inputs.nonce }}
          OUTCOME: ${{ steps.transform.outcome }}
        run: |
          if [ -z "$DISPLAYED" ]; then
            echo "name=evidence-$NONCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then verdict=pass; else verdict=fail; fi
          if [ -f evidence/evidence.json ]; then
            detail=$(sha256sum evidence/evidence.json | cut -d' ' -f1)
          else
            detail=$(printf '0%.0s' $(seq 64))
          fi
          echo "name=attempt.$verdict.$DISPLAYED.$detail.$NONCE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: evidence
      - name: Propagate the transform's failure to the run conclusion
        if: steps.transform.outcome == 'failure'
        run: exit 1
