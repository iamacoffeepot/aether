name: Transform (model lane, BYO)

# ADR-0149 §Execution's WORKER-SIDE model lane (#3511) — the sibling of the
# zero-secret mechanical `transform.yml`. The `construct.implement` lane runs
# headless Claude, so it needs a Claude credential; that credential is
# non-delegable and holder-restricted (BYO-worker). A contributor runs THIS
# wrapper in their own fork with their own Claude secret: it checks out the exact
# digest a resolved work order names, runs the same `cargo xtask transform
# construct.implement` entrypoint at the coordinator-resolved model + effort, and
# uploads the nonce-tagged result-record evidence.
#
# The BYO boundary is the whole point: the coordinator dispatches by nonce+digest
# and validates the returned evidence by nonce+digest — it never sets this
# secret and never sees the credential. Do NOT add the Claude secret to the
# coordinator repo; that would collapse the boundary this lane exists to keep.
# `transform.yml` stays zero-secret and is the only lane the coordinator runs.

# Invariants this lane must preserve (ADR-0149 §Execution, #3572):
#   1. The workflow DEFINITION stays pinned. The coordinator fires this dispatch
#      at the protected `executor_dispatch_ref`, so the wrapper text that runs is
#      always the reviewed one; only the CHECKOUT TARGET below moves per order.
#   2. Subjects are sealed content. The `subject` this checks out is the git
#      commit a sealed bloom's resolved work order named — admission at seal is
#      what makes the tree trusted enough to build against.
#   3. The credential boundary is unchanged. The BYO Claude token reaches only
#      the construct step; the nonce-stamped evidence contract is untouched.
on:
  workflow_dispatch:
    inputs:
      subject:
        # The checkout TARGET (invariants 1 & 2) — the exact git commit the
        # resolved work order names, distinct from the pinned dispatch ref the
        # coordinator fires this workflow at. Named `subject`, not `ref`, so it
        # can never be confused with that dispatch ref (the confusion the stub
        # `submit` fell into, populating the checkout input with the pinned ref).
        description: "Exact git commit the attempt's worker checks out (the sealed source the work order names)"
        required: true
      nonce:
        description: "Idempotency nonce stamped into evidence.json"
        required: true
      model:
        description: "Coordinator-resolved model (from the sealed scope-revision override)"
        required: true
      effort:
        description: "Coordinator-resolved reasoning effort tier"
        required: false

permissions:
  contents: read

jobs:
  transform-model:
    name: Transform (model lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Invariant 1: the checkout target is the order's subject, NOT the
          # pinned ref this workflow was dispatched at — the tree the work runs on.
          ref: ${{ inputs.subject }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the construct lane (worker-side, BYO credential)
        # The worker's own Claude secret, set in the worker's fork — never the
        # coordinator's. The result-record derivation runs node over the
        # transcript; the credential reaches only this step.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          cargo xtask transform construct.implement
          --out evidence
          --subject ${{ inputs.subject }}
          --nonce ${{ inputs.nonce }}
          --model ${{ inputs.model }}
          --effort ${{ inputs.effort }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ inputs.nonce }}
          path: evidence
