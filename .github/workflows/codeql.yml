name: CodeQL

# Advisory-only first rung (issue #3610): results upload to the repo's
# code-scanning tab, but this workflow is NOT in branch protection's
# required set and does not fail the pipeline on findings. Promotion to a
# required, severity-gating check is a later deliberate owner step.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, Monday 03:27 UTC — the standard CodeQL cadence, off the hour
    # so it does not pile onto the top-of-hour scheduled-run spike.
    - cron: '27 3 * * 1'

# A push to a branch supersedes that branch's in-flight scan; main is
# exempt (each merge is a distinct scan) and keyed by sha, mirroring
# ci.yml's concurrency rule.
concurrency:
  group: codeql-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Every language real in this repo: Rust crates; GitHub Actions
        # workflows; scripts/*.mjs + *.js; scripts/*.py.
        language: [ rust, actions, javascript-typescript, python ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          languages: ${{ matrix.language }}
          # Source-based extraction for every language — no cargo build for
          # Rust, which is both cheaper and what lets the config's
          # paths-ignore filter Rust source paths (compiled extraction
          # weakens source-path filtering).
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          category: "/language:${{ matrix.language }}"
