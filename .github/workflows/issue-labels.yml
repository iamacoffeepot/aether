name: Issue labels

# Repository hygiene for issues; gates no merge. Lints each issue title
# against `{type}({scope}): <subject>`, applies the matching `type:*` and
# `crate:*` labels, and keeps one rolling bot comment (plus an
# `invalid-title` label) on a title that does not match. Machine-filed
# `alert` issues are exempt. The crate list comes from
# `scripts/issue-title-scopes.sh` on the default branch.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  contents: read

# One run at a time per issue. Creating an issue with labels fires `opened`
# and `labeled` together, and two runs racing the same issue could each find
# no bot comment and post one. Runs are serialized rather than cancelled: a
# cancel could stop a run between adding and removing labels.
concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enforce:
    name: Lint title and auto-apply type/crate labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve canonical issue title scopes
        id: scopes
        shell: bash
        run: |
          set -euo pipefail
          scripts/issue-title-scopes.sh --self-test
          {
            echo 'valid_crates<<EOF'
            scripts/issue-title-scopes.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALID_CRATES: ${{ steps.scopes.outputs.valid_crates }}
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            // Machine-filed triage tickets (the nightlies' `alert` issues) are
            // not work items: their titles are generated, not conventional, so
            // linting them just files noise. Exempt them — and clean up any
            // residue a pre-exemption run left (an invalid-title label and a bot
            // comment), so an exempted issue self-heals on its next event.
            const EXEMPT = ['alert'];
            if (EXEMPT.some(l => labels.includes(l))) {
              if (labels.includes('invalid-title')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'invalid-title',
                });
              }
              const exemptMarker = '<!-- issue-label-bot -->';
              const { data: exemptComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });
              const residue = exemptComments.find(c => c.body && c.body.includes(exemptMarker));
              if (residue) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: residue.id,
                });
              }
              return;
            }

            // Allowed types match the existing `type:*` label set.
            const TYPES = ['feat', 'fix', 'chore', 'docs', 'perf', 'refactor', 'flake'];

            // Meta-scopes: cross-cutting work that isn't a single crate.
            // No `crate:*` label is applied for these.
            const META_SCOPES = ['ci', 'docs', 'adr', 'repo', 'release', 'workflow', 'guide'];

            // {type}({scope}): <subject>  OR  {type}({scope}/{subfeat}): <subject>
            const titleRegex = new RegExp(
              '^(' + TYPES.join('|') + ')\\(([a-z0-9-]+)(?:/[a-z0-9-]+)?\\): .+$'
            );
            const m = issue.title.match(titleRegex);

            const messages = [];
            const labelsToAdd = [];
            const labelsToRemove = [];

            if (!m) {
              messages.push(
                'Title must match `{type}({crate}): <subject>` ' +
                '(subfeatures allowed via `{type}({crate}/{subfeat}): <subject>`).'
              );
              messages.push('Allowed types: ' + TYPES.join(', ') + '.');
              if (!labels.includes('invalid-title')) {
                labelsToAdd.push('invalid-title');
              }
            } else {
              const typeFromTitle = m[1];
              const crateFromTitle = m[2];

              const validCrates = process.env.VALID_CRATES.split('\n').filter(Boolean).sort();

              const isCrate = validCrates.includes(crateFromTitle);
              const isMeta = META_SCOPES.includes(crateFromTitle);

              if (!isCrate && !isMeta) {
                messages.push(
                  'Scope `' + crateFromTitle + '` is not a known crate or meta-scope. ' +
                  'Valid crates: ' + validCrates.join(', ') + '. ' +
                  'Valid meta-scopes: ' + META_SCOPES.join(', ') + '.'
                );
                if (!labels.includes('invalid-title')) {
                  labelsToAdd.push('invalid-title');
                }
              } else {
                const wantType = 'type:' + typeFromTitle;
                if (!labels.includes(wantType)) labelsToAdd.push(wantType);
                if (isCrate) {
                  const wantCrate = 'crate:' + crateFromTitle;
                  if (!labels.includes(wantCrate)) labelsToAdd.push(wantCrate);
                }
                if (labels.includes('invalid-title')) {
                  labelsToRemove.push('invalid-title');
                }
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              });
            }
            for (const name of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name,
              });
            }

            // Comment management — single rolling comment marker.
            const marker = '<!-- issue-label-bot -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (messages.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const body = [
              marker,
              ...messages,
              '',
              'This comment auto-resolves once the title matches the convention.',
            ].join('\n');

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            }
