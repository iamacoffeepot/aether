name: Docs

# Builds the mdBook guide (docs/) and, on main, publishes it to GitHub Pages.
# On pull requests the build runs as a check only — a broken book fails the PR
# without touching the live site. Pages source must be set to "GitHub Actions"
# in the repo settings for the deploy job to publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'docs/evidence-viewer/**'
      - 'docs/book.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/guide/**'
      - 'docs/evidence-viewer/**'
      - 'docs/book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.4.40'
      - name: Build the guide
        run: mdbook build docs
      - name: Copy the evidence viewer
        run: cp -r docs/evidence-viewer docs/book/evidence
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/book

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
