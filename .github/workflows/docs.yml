name: Docs

# Builds the mdBook guide (docs/) and, on main, publishes it to GitHub Pages.
# On pull requests the build runs as a check only — a broken book fails the PR
# without touching the live site. Pages source must be set to "GitHub Actions"
# in the repo settings for the deploy job to publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'docs/evidence-viewer/**'
      - 'docs/pipeline-deck/**'
      - 'docs/book.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/guide/**'
      - 'docs/evidence-viewer/**'
      - 'docs/pipeline-deck/**'
      - 'docs/book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        uses: taiki-e/install-action@e658debeddbabf20b2b866d9235eb08a2375b1ad # nextest
        with:
          tool: mdbook@0.4.40
      - name: Build the guide
        run: mdbook build docs
      - name: Copy the evidence viewer
        run: cp -r docs/evidence-viewer docs/book/evidence
      - name: Copy the pipeline deck
        run: cp -r docs/pipeline-deck docs/book/pipeline
      - name: Verify standalone pages
        run: |
          test -s docs/book/evidence/index.html
          test -s docs/book/pipeline/index.html
      - name: Archive the guide as a Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs/book \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
