name: Lint title

# Enforces Conventional Commit pull-request titles (main squash-merges with
# the title as the commit subject, so title quality is commit quality). Its
# own workflow, not a ci.yml job: the `edited` trigger re-lints a fixed
# title without re-running the Rust suite. `main` carries no branch
# protection, so nothing enforces it; `Lint title` is the check to wait on
# for the title, alongside `CI pass` for the tree.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

# A newer title edit or push supersedes the run judging the old one.
concurrency:
  group: lint-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: Lint title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            perf
            refactor
            flake
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
