name: Agent work

# The cloud-agent executor: turn a task request into real engineering work on
# an ephemeral RunsOn machine. Given task=scope|approve|implement|land and a ref,
# it forks a runner, drives headless Claude Code through the matching #3128
# headless-wrapper skill (/scope-headless, /approve-headless,
# /implement-headless, /land-headless), and leaves the durable state — labels,
# comments, commits, PRs — behind when the runner dies. This is rung ①'s producer
# half; the QA-chain workflows (review.yml, dogfood.yml) grade LANDED PRs,
# whereas this one PRODUCES the scope artifacts, the implementation PR, and the
# merge.
#
# `approve` is the Plan->Ready gate (#3176), and it is the one task with an
# authority bound of its own: the wrapper runs the real /approve skill, which
# resolves the issue's approval tier and advances ONLY an `auto`-tier one. The
# tick pre-filters to the auto tier so a Claude run is not spent to learn that,
# but this workflow is dispatchable by anything holding actions: write, so the
# refusal lives in the skill the executor runs — not in the caller.
#
# `approve-sweep` (#3188) is approve's batched shape and the one the tick
# dispatches: one run processes EVERY eligible phase:plan issue through the same
# per-issue gates and authority bound, so a wave spends one runner on approval
# instead of one per issue. Its ref is the constant `all` — the run-name
# work-approve-sweep-all keeps the (task, ref) grammar, and the claim it makes
# is on the whole approve queue rather than one issue. The single-issue
# `approve` task remains for the per-issue paths: agent-chat's question-resume
# re-dispatch and a maintainer's manual kick.
#
# Manual dispatch only at this rung — no cron, no autonomy. A maintainer runs
# workflow_dispatch with a task and a ref; every later rung (#3130 chat, #3131
# tick) dispatches into this same workflow.
#
# Liveness is computed, never persisted: a live run IS the claim on its
# (task, ref) pair. The deterministic run-name work-{task}-{ref} makes the claim
# observable at a glance, and the concurrency singleton below (cancel-in-progress
# FALSE) makes it exclusive without any claim label. A crash-and-re-dispatch is
# safe because the re-entrancy guard recomputes state from the board — the phase
# label never moved, so the guard routes to a clean no-op or a resume.
#
# Identity and auth follow two deliberate separations:
#   - GitHub writes ride an App INSTALLATION token, not GITHUB_TOKEN. Events
#     created by GITHUB_TOKEN do not trigger downstream workflows (the documented
#     anti-recursion rule), so a scope run that writes a phase label could never
#     wake the tick and an implement run's PR would never trigger CI/review. The
#     App token is what lets the arc chain event-driven; it is not optional
#     hardening. A maintainer-registered App carries it (owner checklist below).
#   - Claude auth is AGENT_CLAUDE_CODE_OAUTH_TOKEN — the same dedicated CI
#     subscription review.yml/dogfood.yml now authenticate with, so the fleet
#     and QA chain share one rate pool; the owner's personal token is retired
#     from CI.
#
# Security posture mirrors review.yml/dogfood.yml: the code-executing job is
# read-only on GITHUB_TOKEN (contents: read) and every write goes through the
# App token; the checkout copy has its interactive-session hooks stripped; the
# workspace is pre-trusted for headless Claude; an AUTH-OK probe fails loudly on
# a bad token before any real spend.
#
# Owner console checklist (maintainer console work, NOT part of this file's
# merge — the workflow merges without them, and the first dispatch is the
# acceptance test once they exist):
#   (a) register a GitHub App `aether-agent` — no webhook, no hosted code;
#       permissions contents / pull_requests / issues / actions: write;
#   (b) install it on iamacoffeepot/aether;
#   (c) store its App id + private key as repo secrets AGENT_APP_ID /
#       AGENT_APP_PRIVATE_KEY;
#   (d) mint AGENT_CLAUDE_CODE_OAUTH_TOKEN from the Max 20x subscription
#       (`claude setup-token`) and `gh secret set` it.
#   (e) set repo variable AGENT_MAIN_STRICT=false once main's branch protection
#       is confirmed strict-off, so a land box takes the direct-merge path for
#       a behind+clean PR instead of the App token's doomed protection read;
#       absent it (or on drift after a protection change) the fleet keeps
#       today's conservative merge-in of origin/main.
# Absent any of these, the preflight step fails early with the exact remedy.

on:
  workflow_dispatch:
    inputs:
      task:
        description: Pipeline task to run
        type: choice
        required: true
        options:
          - scope
          - approve
          - approve-sweep
          - implement
          - land
          - resolve
      ref:
        description: Ref to act on (issue number for scope/approve/implement, PR number for land/resolve, the constant `all` for approve-sweep)
        type: string
        required: true

# The run's name IS the human-visible claim; keep it deterministic so a glance
# at the Actions list answers "is (task, ref) already being worked?".
run-name: work-${{ inputs.task }}-${{ inputs.ref }}

# A live run is the claim on this (task, ref). cancel-in-progress is FALSE (the
# inversion from the QA workflows' true): a second dispatch must queue-or-drop,
# never preempt an in-flight worker mid-commit / mid-merge and corrupt the very
# durable state the design leans on. The key is per (task, ref), not per ref, so
# a land can proceed while a stale scope of the same number is still settling.
concurrency:
  group: work-${{ inputs.task }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  work:
    name: Run ${{ inputs.task }} on ${{ inputs.ref }}
    # Per-task runner sizing against the RunsOn label pattern (dogfood.yml uses
    # the same runs-on=<run_id>/runner=<size> form): scope and approve are
    # API-and-prose work on a small box (approve's heaviest step is a git-log
    # freshness read); implement and resolve build the workspace and want
    # s3-cache to warm sccache across a retrying PR's runs (resolve drives the
    # same CI Refine loop implement does); land is a merge on a non-spot box so a
    # spot reclaim can never interrupt the squash.
    runs-on: runs-on=${{ github.run_id }}/runner=${{ (inputs.task == 'implement' || inputs.task == 'resolve') && '8cpu-linux-x64/extras=s3-cache' || (inputs.task == 'land' && '2cpu-linux-x64/spot=false' || '2cpu-linux-x64') }}
    # Bring-up leash per task (review.yml's rationale: a wedged in-flight run must
    # not idle an EC2 runner toward the 6h default). implement's CI Refine loop is
    # the long pole, so it gets the widest leash; resolve runs the same loop, so
    # it shares that leash; approve-sweep walks a whole queue of per-issue gate
    # checks, so it gets double the single-approve leash.
    timeout-minutes: ${{ (inputs.task == 'implement' || inputs.task == 'resolve') && 90 || (inputs.task == 'approve-sweep' && 60 || 30) }}
    # Read-only on GITHUB_TOKEN. This job checks out and executes repo code
    # (headless Claude drives the wrapper skill under --dangerously-skip-permissions),
    # so it must never hold a write scope on the default token — every write
    # (labels, comments, commits, PR ops) rides the App installation token minted
    # below, mirroring review.yml's read-only executing job.
    permissions:
      contents: read
    env:
      # Exposed at job level under the name the Claude Code binary reads, sourced
      # from AGENT_CLAUDE_CODE_OAUTH_TOKEN — the same dedicated CI subscription
      # review.yml/dogfood.yml now share, since the owner's personal token is
      # retired from CI. Job-level presence lets step `if: env... != ''` gating
      # work.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}
      # The full repo slug and its owner/name halves, used by the gh API steps.
      REPO: ${{ github.repository }}
      TASK: ${{ inputs.task }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: runs-on/action@v2

      # Fail early and clearly when a required secret is absent, rather than
      # letting the App-token mint fail with a cryptic error. All three secrets
      # are owner-provisioned console work (checklist in the header); without any
      # of them a live run cannot do its job, so this halts with the exact remedy.
      # The private key rides in step-level env only, never job-wide.
      - name: Preflight — required secrets present
        env:
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APP_ID:-}" ] || missing="${missing} AGENT_APP_ID"
          [ -n "${APP_PRIVATE_KEY:-}" ] || missing="${missing} AGENT_APP_PRIVATE_KEY"
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || missing="${missing} AGENT_CLAUDE_CODE_OAUTH_TOKEN"
          if [ -n "$missing" ]; then
            echo "Required secret(s) not set:${missing}"
            echo "Owner console setup (see this workflow's header comment):"
            echo "  - register the aether-agent GitHub App, install it on ${REPO},"
            echo "    and store its id + private key as AGENT_APP_ID / AGENT_APP_PRIVATE_KEY"
            echo "  - mint AGENT_CLAUDE_CODE_OAUTH_TOKEN with 'claude setup-token' and gh secret set it"
            exit 1
          fi
          echo "all required secrets present"

      # Mint the App installation token — the identity every write below rides.
      # App-created events trigger downstream workflows where GITHUB_TOKEN-created
      # ones do not, which is the whole reason the arc can chain event-driven.
      - name: Mint the App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # The unconditional first work step, before any Claude spend. Pure GitHub
      # API, keyed on the task: it recomputes state from observable board facts so
      # a crash-and-re-dispatch is safe — the state never moved, and the guard
      # routes to a clean no-op (proceed=false) or a resume (proceed=true, the
      # wrapper's own re-entrancy guard then resumes from the observed phase). The
      # #3126 flat-ladder phase labels (phase:building/phase:held/…) the checks
      # read do not all exist yet; a live dispatch before #3126 lands understands
      # its label reads to be against those names.
      - name: Re-entrancy guard
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          owner="${REPO%/*}"
          name="${REPO#*/}"

          # agent:dont-touch, checked at the point of spend rather than trusting the
          # caller. The tick honours the label, but the tick is not the only thing
          # that dispatches this workflow — agent-chat re-dispatches it on an owner
          # reply, and anything holding actions: write can dispatch it directly. A
          # control enforced only in one caller is escaped by every other path, so
          # the executor refuses the work itself. For a land task REF is a PR, whose
          # closing issue is where the label lives; the label is read off REF either
          # way, so a benched PR is honoured too and a benched issue never reaches a
          # land dispatch (the tick already filters it out of the scan). approve-sweep
          # is the one task whose REF (`all`) names no issue, so the read is skipped
          # for it; the same point-of-spend enforcement lives inside the sweep instead
          # — its wrapper's enumeration excludes agent:dont-touch issues per candidate.
          if [ "$TASK" != "approve-sweep" ] && \
             gh api "repos/${REPO}/issues/${REF}/labels" --jq '.[].name' 2>/dev/null \
             | grep -qx 'agent:dont-touch'; then
            echo "#${REF} carries agent:dont-touch — benched by the owner; refusing ${TASK}."
            echo "- refused \`${TASK}\` on #${REF}: agent:dont-touch" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$TASK" in
            scope)
              # scope walks Backlog -> phase:plan. A label at or beyond a post-plan
              # rung means scoping already completed; a re-dispatch is a clean no-op.
              labels="$(gh api "repos/${REPO}/issues/${REF}/labels" --jq '.[].name')"
              if grep -qxE 'phase:(ready|refine|executing|building|qa|findings|held)' <<<"$labels"; then
                echo "issue #${REF} is at/past a post-plan rung — scope already complete; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            approve)
              # approve is the phase:plan -> phase:ready gate. A label at or beyond
              # a post-plan rung means the gate already cleared, so a re-dispatch (a
              # crashed run, a duplicate tick, a hand kick) is a clean no-op. An
              # issue that has not reached phase:plan yet is left to the skill's own
              # Phase gate, which refuses it and says so.
              labels="$(gh api "repos/${REPO}/issues/${REF}/labels" --jq '.[].name')"
              if grep -qxE 'phase:(ready|refine|executing|building|qa|findings|held)' <<<"$labels"; then
                echo "issue #${REF} is at/past a post-plan rung — approve already complete; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            approve-sweep)
              # The sweep claims the whole approve queue, so the guard is a board
              # probe, not a per-ref label read: no open phase:plan issue at all
              # means a stale or duplicate dispatch with provably nothing to do — a
              # clean no-op before any Claude spend. One or more means proceed; the
              # wrapper resolves per-issue eligibility (tier, dont-touch, parks)
              # itself, and a crashed sweep resumes by re-enumeration — approved
              # issues rest at phase:ready and drop out, the rest are re-processed.
              plan_count="$(gh api "repos/${REPO}/issues?labels=phase:plan&state=open&per_page=1" \
                --jq 'map(select(has("pull_request")|not)) | length')"
              # An open verdict digest (#3190) is also work: the sweep must read
              # an answered one (or close a stale one) even when the plan queue
              # emptied between the park and the reply, so an open digest keeps
              # the dispatch alive on its own.
              digest_count="$(gh api "repos/${REPO}/issues?labels=agent:digest&state=open&per_page=1" \
                --jq 'map(select(has("pull_request")|not)) | length')"
              if [ "${plan_count:-0}" -eq 0 ] && [ "${digest_count:-0}" -eq 0 ]; then
                echo "no open phase:plan issue and no open digest — the approve queue is empty; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            implement)
              # /implement cuts a PR from the issue. A MERGED PR that closes this
              # issue means the work already landed → clean no-op. An open PR means
              # resume, which the wrapper's own re-entrancy guard handles, so only a
              # merged PR short-circuits here. closedByPullRequestsReferences is the
              # canonical "PRs that close this issue" field.
              merged="$(gh api graphql -f query='
                query($owner:String!,$name:String!,$number:Int!){
                  repository(owner:$owner,name:$name){
                    issue(number:$number){
                      closedByPullRequestsReferences(first:20, includeClosedPrs:true){
                        nodes{ number merged }
                      }
                    }
                  }
                }' -f owner="$owner" -f name="$name" -F number="$REF" \
                --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[] | select(.merged)] | length')"
              if [ "${merged:-0}" -gt 0 ]; then
                echo "issue #${REF} already has a merged closing PR — implement already landed; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            land)
              # A crashed land job that already merged leaves nothing to redo.
              merged="$(gh api "repos/${REPO}/pulls/${REF}" --jq '.merged')"
              if [ "$merged" = "true" ]; then
                echo "PR #${REF} is already merged — land already complete; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Informational: confirm the closing issue carries phase:held (the
              # #3128/#3127 land precondition). The label vocabulary is #3126's, so
              # this only logs — the wrapper's /land gate enforces the precondition
              # and parks to the owner if it is unmet.
              issue="$(gh api graphql -f query='
                query($owner:String!,$name:String!,$number:Int!){
                  repository(owner:$owner,name:$name){
                    pullRequest(number:$number){
                      closingIssuesReferences(first:1){ nodes{ number } }
                    }
                  }
                }' -f owner="$owner" -f name="$name" -F number="$REF" \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty')"
              if [ -n "$issue" ]; then
                ilabels="$(gh api "repos/${REPO}/issues/${issue}/labels" --jq '.[].name' || true)"
                if grep -qx 'phase:held' <<<"$ilabels"; then
                  echo "closing issue #${issue} is phase:held — land precondition met."
                else
                  echo "closing issue #${issue} is not phase:held; the wrapper's /land gate will decide."
                fi
              fi
              ;;
            resolve)
              # resolve rebuilds a DIRTY PR's head on a merge of origin/main and
              # drives it green — so a PR that is already merged, or whose conflict
              # is already gone, has nothing to resolve. A merged PR short-circuits;
              # so does a mergeable_state that is neither dirty (the conflict this
              # task exists to fix) nor unknown (GitHub is still computing it —
              # proceed and let the wrapper's own guard re-read it). Any settled
              # non-dirty state (clean/behind/blocked/unstable/…) means a prior
              # resolve landed or main moved back under the branch: a clean no-op.
              merged="$(gh api "repos/${REPO}/pulls/${REF}" --jq '.merged')"
              if [ "$merged" = "true" ]; then
                echo "PR #${REF} is already merged — nothing to resolve."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              state="$(gh api "repos/${REPO}/pulls/${REF}" --jq '.mergeable_state')"
              if [ "$state" != "dirty" ] && [ "$state" != "unknown" ]; then
                echo "PR #${REF} mergeable_state is '${state}' (not dirty) — the conflict is already resolved; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The human-visible claim marker (the machine claim is the live run itself),
      # linking back to this run. Posted on the ref's issue/PR conversation — the
      # issues/<n>/comments endpoint serves both. Body written to a file first so
      # its content is not shell-expanded. approve-sweep has no single conversation
      # to mark (its ref is the queue), so it posts nothing here — the wrapper
      # leaves per-issue comments only where the sweep acts on an issue.
      - name: Post the start-of-work comment
        if: steps.guard.outputs.proceed == 'true' && inputs.task != 'approve-sweep'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/start-comment.md <<EOF
          🤖 Started \`${TASK}\` on this ref — [run log](${RUN_URL}).

          A live run is the claim on \`work-${TASK}-${REF}\`; a re-dispatch after a crash recomputes state from the board and resumes or no-ops.
          EOF
          gh api -X POST "repos/${REPO}/issues/${REF}/comments" -F body=@/tmp/start-comment.md

      # Assert the commit git identity before any commit/merge. scope and
      # approve (single and sweep) write no commits (approve reads git for its
      # freshness gate and writes only labels), so this is gated off for them.
      # Commits author as the owner's PUBLIC identity (#3215) — the fleet works in
      # the owner's name, and the push still rides the App installation token, so
      # push-wake semantics and branch protection are unchanged. The owner's real
      # name and personal email never appear; the public identity below is the
      # only sanctioned author.
      - name: Assert the commit git identity
        if: steps.guard.outputs.proceed == 'true' && inputs.task != 'scope' && inputs.task != 'approve' && inputs.task != 'approve-sweep'
        run: |
          set -euo pipefail
          git config --global user.name "iamacoffeepot"
          git config --global user.email "me@iamateapot.dev"
          name="$(git config --global user.name || true)"
          email="$(git config --global user.email || true)"
          if [ -z "$name" ] || [ -z "$email" ]; then
            echo "commit git identity is unset — refusing to proceed to a commit."
            exit 1
          fi
          echo "committing as ${name} <${email}>"

      # Check out the default branch (the skills live here and the wrapper cuts
      # its own branch from origin/main). The App token is persisted as the git
      # credential so any push the wrapper issues rides the App identity and wakes
      # downstream workflows. implement/land need full history, and so do approve
      # and approve-sweep — the freshness gate reads `git log origin/main
      # --since=<scoped-at>` over each plan's targeted paths, which a shallow
      # clone cannot answer. Only scope is shallow.
      - uses: actions/checkout@v4
        if: steps.guard.outputs.proceed == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: ${{ inputs.task == 'scope' && 1 || 0 }}

      # The repo's .claude hooks bind interactive sessions into per-session
      # worktrees and police edits outside them — actively harmful in CI, where
      # the SessionStart rebind would move the session out of $GITHUB_WORKSPACE.
      # The runner is ephemeral and single-purpose, so strip the hooks from this
      # checkout COPY; the hooks in the repo itself are untouched.
      - name: Strip interactive-session hooks from the checkout copy
        if: steps.guard.outputs.proceed == 'true'
        run: |
          jq 'del(.hooks)' .claude/settings.json > /tmp/settings.json
          mv /tmp/settings.json .claude/settings.json

      # Pinned via AGENT_CLAUDE_CODE_VERSION (#3285): a CLI upgrade changes the
      # system-prompt bytes, which cold-misses the fleet-wide prompt cache and
      # invalidates any resumable session. Unset falls back to latest with a
      # warning — a missing var never bricks the fleet.
      - name: Install Claude Code
        if: steps.guard.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_VERSION: ${{ vars.AGENT_CLAUDE_CODE_VERSION }}
        run: |
          if [ -n "${CLAUDE_CODE_VERSION:-}" ]; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          else
            echo "::warning::AGENT_CLAUDE_CODE_VERSION is unset — installing latest; an upstream release cold-misses the fleet prompt cache (#3285)"
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      # Pre-trust the checkout so settings.json permissions aren't ignored with a
      # warning under skip-permissions.
      - name: Pre-trust the workspace for headless Claude
        if: steps.guard.outputs.proceed == 'true'
        run: printf '{"projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' "$PWD" > "$HOME/.claude.json"

      # Auth in isolation before the real run: a one-line prompt, no tools. If
      # this fails the AGENT OAuth token itself is the problem, not the harness.
      # --max-turns 3 (not 1) because the model occasionally spends a turn before
      # emitting the reply, which a 1-turn cap turns into a spurious auth failure.
      - name: Auth probe (no tools)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          claude -p "Reply with exactly: AUTH-OK" \
            --model claude-sonnet-5 \
            --max-turns 3 | tee /tmp/auth.log
          grep -q "AUTH-OK" /tmp/auth.log

      # Resolve the driving model from the issue's model:* label (scope stamps it
      # at Plan; /implement and /approve gate on it). scope/approve/implement's ref
      # is the issue; land's ref is a PR, so resolve its closing issue. Default to
      # the proven headless sonnet string; an explicit label wins in either
      # direction. scope's default INVERTS to opus (#3203): a pre-scope issue
      # cannot carry the label — scope is what stamps it — so the label read is
      # structurally a no-op for fresh scope work, and the sonnet default was
      # guaranteeing the ladder's most judgment-heavy task the cheapest model.
      - name: Resolve the driving model
        id: model
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          owner="${REPO%/*}"
          name="${REPO#*/}"
          case "$TASK" in
            scope|approve|implement) issue="$REF" ;;
            # The sweep spans issues, so no single model:* label can route it —
            # and none needs to: approve is gate-reading and label writes, not
            # design work, so the proven headless sonnet default drives every
            # sweep regardless of what models the queued issues route their
            # implementation to.
            approve-sweep) issue="" ;;
            land|resolve)
              issue="$(gh api graphql -f query='
                query($owner:String!,$name:String!,$number:Int!){
                  repository(owner:$owner,name:$name){
                    pullRequest(number:$number){
                      closingIssuesReferences(first:1){ nodes{ number } }
                    }
                  }
                }' -f owner="$owner" -f name="$name" -F number="$REF" \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty')"
              ;;
          esac
          model="claude-sonnet-5"
          if [ "$TASK" = "scope" ]; then
            model="opus"
          fi
          if [ -n "${issue:-}" ]; then
            labels="$(gh api "repos/${REPO}/issues/${issue}/labels" --jq '.[].name' || true)"
            if grep -qx 'model:opus' <<<"$labels"; then
              model="opus"
            fi
            # A bounced issue re-entering scope carries the label its Plan
            # stamped — an explicit model:sonnet wins over scope's opus default.
            if grep -qx 'model:sonnet' <<<"$labels"; then
              model="claude-sonnet-5"
            fi
          fi
          echo "model resolved to ${model}"
          echo "model=${model}" >> "$GITHUB_OUTPUT"

      # Drive headless Claude through the #3128 wrapper for the dispatched task.
      # The wrapper executes the original /<task> skill verbatim and applies
      # .claude/skills/headless/protocol.md for the interaction surface: it runs
      # its own re-entrancy guard first, then follows ask-and-park / end-turn-not-
      # wait rather than blocking on a human. The workflow just launches it.
      #
      # The -p text is BYTE-CONSTANT across dispatches (#3285): the per-run
      # parameters ride /tmp/agent-task.json, staged in the step below, so every
      # box of this workflow sends an identical first user message and reads the
      # shared prompt-cache prefix instead of re-writing ~26K tokens at the cache
      # write premium. Keep it constant — one interpolation here re-prices every
      # dispatch. If #3128 ever renames the wrappers, the constant instruction
      # below is the single edit site. stream-json + the jq renderer make
      # the session watchable live in the Actions log; the tee'd JSONL is the
      # durable transcript, uploaded below. The tee target lives in /tmp, outside
      # the checkout, so the session can never mistake it for repo scratch. `|| true`
      # so a session failure never fails the job — the durable state is on GitHub
      # and the transcript diagnoses a dead run.
      #
      # CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS was meant to hold the claude -p
      # process open across a pending background task, but it does not reliably
      # do so in this box (iamacoffeepot/aether#3245), so the headless CI waits
      # (implement's Refine loop, land's rebase / Qodana waits) are realized as a
      # mechanical in-turn poll that never ends a turn on a pending background
      # task — see .claude/skills/headless/protocol.md, the CI-wait contract. The
      # var is left set as a harmless backstop; nothing now depends on it.
      - name: Stage the task parameters
        if: steps.guard.outputs.proceed == 'true'
        run: |
          jq -nc --arg task "$TASK" --arg ref "$REF" '{task: $task, ref: $ref}' > /tmp/agent-task.json

      - name: Drive the headless wrapper
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODEL: ${{ steps.model.outputs.model }}
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "2400000"
          AGENT_MAIN_STRICT: ${{ vars.AGENT_MAIN_STRICT }}
        run: |
          set -euo pipefail
          cat > /tmp/agent-prompt.md <<'PROMPT'
          You are running headless in CI on a checkout of the aether repo.
          FIRST ACTION: read /tmp/agent-task.json. Its "task" field names this run's
          pipeline task; its "ref" field is the issue or PR ref to act on.
          Invoke the repo's /<task>-headless skill against that ref, substituting
          the file's task value for <task>. That wrapper executes the original
          /<task> skill verbatim and applies .claude/skills/headless/protocol.md
          for the interaction surface: run its re-entrancy guard first, then follow
          the wrapper's Overrides table exactly — ask-and-park where the original
          would ask a human, end-turn-not-wait where the original would block on a
          human, checkout-as-isolation instead of a worktree, and the owner's
          public git identity (already configured) for any commit or merge. Never
          sleep-poll on a human and never author under the owner's real name or
          personal email. When you reach the wrapper's terminal state (parked, or
          the flow's end-turn point), end your turn.
          PROMPT
          claude -p "$(cat /tmp/agent-prompt.md)" \
            --dangerously-skip-permissions \
            --model "$MODEL" \
            --max-turns ${{ (inputs.task == 'implement' || inputs.task == 'approve-sweep' || inputs.task == 'resolve') && 400 || 200 }} \
            --output-format stream-json --verbose \
            | tee /tmp/agent-work-session.jsonl \
            | python3 scripts/render-agent-stream.py \
            || true

      # The full session transcript (stream-json JSONL) — uploaded even on failure,
      # since a dead run's transcript is exactly what diagnoses it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-work-session-transcript
          path: /tmp/agent-work-session.jsonl
          if-no-files-found: ignore
