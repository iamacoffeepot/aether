name: Reconciler

# Single writer of the post-green phase stretch: recompute a PR's linked issue
# phase (phase:building / phase:qa / phase:findings / phase:held) from observable
# facts on every relevant event. No Claude, no cargo — pure GitHub-API fact
# arithmetic, so it is free, instant, and deterministic. It never writes the
# earlier ladder (define/design/plan/ready) nor the parked states (bounced/
# stalled); those stay owned by the pipeline skills. Every firing recomputes the
# whole target from scratch, so a missed event self-heals on the next one, and a
# forgotten agent step is a liveness hiccup rather than a wrong flag.
#
# DECLARED-SURFACE GATE: reaching `held` additionally requires the PR's actual
# changed-file set to stay a subset of its closing issue's `## Declared surface`
# globs (what /approve resolved the approval tier over). A diff that escapes the
# declaration is no longer the change that was approved, so it is pinned at
# `building` behind a required, failing `Approval gate` commit status — an
# owner-gated, label-mirroring shape. It self-heals when the owner trims the
# diff, widens the declaration (an issue-timeline edit), or applies an
# `approval:surface-ok` waiver.
#
# `Approval gate` is a REQUIRED check, so this workflow posts it on EVERY path,
# never conditionally. A required context that never reports does not pass —
# GitHub holds it as "Expected" and blocks the merge indefinitely — so silence is
# not a neutral outcome, it is a wedge. Where there is genuinely nothing to
# enforce (the PR closes no issue, its issue is outside the reconciler domain, or
# its issue declares no surface) the gate posts a PASSING status: it never blocks
# a change it has no opinion about. Only a diff that actually escapes its
# declaration goes red.
#
# TRIGGER MODEL (five paths, one pure recompute each):
#   - pull_request [opened, reopened, synchronize, ready_for_review, labeled,
#     unlabeled] — the payload carries the PR directly. synchronize is the
#     push-demotes path (a fresh head with CI not yet green falls back to
#     building); labeled/unlabeled wakes the reconciler when a QA post job flips
#     the dogfood:unresolved PR label, or when the owner applies the
#     approval:surface-ok waiver. A label event on any other label
#     exits cleanly. The reconciler's own approval:surface-exceeded write does
#     not re-enter it: GITHUB_TOKEN-authored events do not trigger workflows.
#   - pull_request_review [submitted, dismissed] — a native review verdict
#     changes GitHub's reviewDecision, which the reconciler keys merge-readiness
#     on (ADR-0148), so a submitted or dismissed review must recompute. Barista
#     (iamabarista[bot]) is a separate GitHub App, not GITHUB_TOKEN, so its
#     createPullRequestReview call genuinely raises this event regardless of
#     which review.yml job submitted it.
#   - workflow_run on CI only — CI is pull_request-triggered, so a CI run object
#     carries the real PR branch and resolves exactly as review.yml's resolve
#     step does. Review and Dogfood are deliberately NOT in this list: those
#     workflows are themselves workflow_run-triggered, so their run objects
#     anchor to main (head_branch is always "main") and cannot be resolved to a
#     PR here.
#   - workflow_dispatch { pr } — the manual re-reconcile, and the authoritative
#     QA-completion hand-off: the Review and Dogfood post jobs each poke this
#     workflow with the exact PR number they already know (gh workflow run
#     reconciler.yml -f pr=…). A GITHUB_TOKEN-created event does not trigger
#     workflows EXCEPT workflow_dispatch, which is the documented exception the
#     poke relies on.
#   - schedule (every 15 minutes) — the global recompute backstop: enumerate
#     open PRs and recompute each whose linked issue sits in the reconciler
#     domain. This is the supported answer to thread resolve / unresolve events
#     having no Actions trigger (a human clicking Resolve emits nothing a hosted
#     workflow can subscribe to), and the self-heal for any missed poke. Worst-
#     case staleness for a human thread-resolve is one cron period.
#
# SECURITY POSTURE: this workflow CHECKS NOTHING OUT and reads the PR head only
# as data. Every fact is a GitHub-API call. The one piece of code it executes,
# scripts/surface-match.py, is fetched through the contents API with no ref —
# which always resolves to the default branch — exactly as the policy file is.
#
# The checkout is omitted deliberately, not incidentally. `actions/checkout` with
# `ref:` pinned to the default branch LOOKS equivalent, but it falls back to the
# TRIGGERING ref whenever that expression is empty, and on a pull_request event
# the triggering ref is the PR head. A single unset expression would have this
# job executing branch-authored Python while holding statuses: write and
# issues: write. The fleet's App can push branches, so that is a live path, not a
# hypothetical. The API read has no fallback: default branch, or it fails.
#
# So a PR can no more edit the matcher that judges its diff than it can edit the
# policy that matcher annotates with. The job-level guard additionally drops fork
# heads (a fork PR gets a read-only token and carries no QA flags to compute over
# anyway), matching the same-repo posture the Review and Dogfood runners hold.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to reconcile
        required: true
  schedule:
    - cron: "*/15 * * * *"

# Serialize recomputes that target the same PR so two firings never race the
# label PUT. Keyed by the payload PR / dispatched PR / CI head branch where
# known, else the run id (the schedule path processes every PR inside one run,
# so a single group is correct there). cancel-in-progress is false: a recompute
# is cheap and a superseded one still needs to finish its atomic write.
concurrency:
  group: reconciler-${{ github.event.pull_request.number || github.event.inputs.pr || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile PR phases
    runs-on: ubuntu-latest
    # Least privilege. issues: write backs the phase label PUT on the closing
    # issue. pull-requests: write backs the PR object + the GraphQL reviewThreads
    # / closingIssuesReferences reads AND the approval:surface-* label and the
    # diagnostic comment: those ride the issues API but land on a PULL REQUEST, so
    # GitHub scopes them to the pull-requests permission — issues: write alone
    # returns 403. checks: read backs the head check-runs; statuses: write backs
    # posting the Approval gate status. actions: write backs the self-requeue
    # workflow_dispatch when a default-branch fetch is infra-unavailable after
    # retries (#3259), matching agent-judge.yml's same-rationale grant.
    permissions:
      issues: write
      pull-requests: write
      contents: read
      checks: read
      statuses: write
      actions: write
    # Same-repo only. Dispatch and schedule are always trusted; a pull_request
    # or CI-completion path with a fork head is skipped (its token is read-only
    # and it carries no QA state to reconcile).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      # Resolve the PR set for this event, then recompute each one. The fact
      # reads and the compute live in this single step so a run's whole
      # reasoning is legible from its log: one line per fact, one for the
      # verdict, grouped per PR.
      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # A synchronize (new head push) forces a demotion to building — it
          # applies to the single payload PR, the only PR this event names.
          is_synchronize=0
          if [ "$EVENT" = "pull_request" ] && [ "$EVENT_ACTION" = "synchronize" ]; then
            is_synchronize=1
          fi

          # Resolve the PR set to recompute.
          case "$EVENT" in
            pull_request)
              # Early gate: a label event on anything but a QA flag is not our
              # business. This also keeps the reconciler off the label churn its
              # own peers make on unrelated labels.
              if [ "$EVENT_ACTION" = "labeled" ] || [ "$EVENT_ACTION" = "unlabeled" ]; then
                case "$LABEL_NAME" in
                  dogfood:unresolved|approval:surface-ok) ;;
                  *) echo "label '${LABEL_NAME}' is not a QA flag — nothing to reconcile."; exit 0 ;;
                esac
              fi
              prs="$PR_NUMBER"
              ;;
            pull_request_review)
              prs="$PR_NUMBER"
              ;;
            workflow_dispatch)
              prs="$DISPATCH_PR"
              ;;
            workflow_run)
              # CI's run object carries the real PR branch (CI is
              # pull_request-triggered). head is owner:branch; state=open bounds
              # it to a live PR. A CI run on a branch with no open PR (e.g. a
              # push to main) resolves to nothing and is a clean no-op.
              prs="$(gh api "repos/${REPO}/pulls?head=${OWNER}:${HEAD_BRANCH}&state=open" \
                --jq '.[0].number // empty')"
              ;;
            schedule)
              # Global backstop: every open PR, recomputed. The per-PR domain
              # gate below short-circuits the ones whose issue is out of scope.
              prs="$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --paginate \
                --jq '.[].number')"
              ;;
            *)
              echo "unexpected event '${EVENT}' — nothing to reconcile."
              exit 0
              ;;
          esac

          if [ -z "${prs:-}" ]; then
            echo "No PR to reconcile for this event."
            exit 0
          fi

          # Wraps a default-branch contents-API fetch (no `?ref=` — the same
          # pin to main the security posture below requires) in a bounded
          # retry with backoff: a transient blip — rate limit, network, a
          # truncated body — must not read as a verdict about the diff
          # (#3259). Retries on both a failed API call and an empty result, so
          # a truncated-but-200 response gets the same second chance a hard
          # failure does. Returns non-zero only once every attempt has failed.
          fetch_default_branch_file() {
            path="$1" dest="$2"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if gh api "repos/${REPO}/contents/${path}" --jq '.content' 2>/dev/null \
                   | base64 -d >"$dest" 2>/dev/null \
                 && [ -s "$dest" ]; then
                return 0
              fi
              echo "fetch_default_branch_file: attempt ${attempt} failed for ${path}"
              if [ "$attempt" -lt 3 ]; then
                sleep "$((2 ** attempt))"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          # Recompute one PR: resolve its closing issue, gate on the issue phase,
          # read the facts, compute the target phase by the first-match table,
          # and write it (only when it changes) with the atomic non-phase-
          # preserving label PUT.
          reconcile_pr() {
            pr="$1"
            echo "::group::reconcile PR #${pr}"

            # Read the head FIRST. `Approval gate` is a REQUIRED check, and a
            # required context that never reports does not pass — GitHub holds it
            # as "Expected" and blocks the merge forever. So every path out of
            # this function, including the early no-op returns below, has to be
            # able to address a commit status. Resolving the head up front is what
            # makes that possible.
            head_sha="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')"
            echo "fact head_sha: ${head_sha}"

            # Post the gate verdict. Called on EVERY path: `success` wherever there
            # is genuinely nothing to enforce (the un-gated cases below), `failure`
            # only where the diff actually escaped its declaration. The gate never
            # blocks a change it has no opinion about, and never stays silent.
            post_gate() {
              gh api -X POST "repos/${REPO}/statuses/${head_sha}" \
                -f state="$1" \
                -f context="Approval gate" \
                -f description="$2" \
                -f target_url="$RUN_URL" >/dev/null
              echo "write: Approval gate=${1} (${2})"
            }

            # Issue association is the PR's closing reference (GraphQL), per the
            # pipeline's closing-keyword convention — a body regex would lose it
            # on a re-worded body. A PR closing no issue has no declaration to be
            # judged against, so the gate passes it.
            issue="$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    closingIssuesReferences(first:1) { nodes { number } }
                  }
                }
              }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty')"
            if [ -z "${issue:-}" ]; then
              echo "fact issue: PR #${pr} closes no issue — no phase to reconcile."
              post_gate success "no closing issue — nothing to enforce"
              echo "::endgroup::"
              return 0
            fi
            echo "fact issue: #${issue}"

            # Domain gate: recompute only issues resting in the reconciler's
            # stretch. Straggler executing/refine labels ARE in the domain — the
            # reconciler migrates them forward on this recompute. An issue outside
            # the domain never went through the Plan->Ready edge this gate guards,
            # so there is no approved surface to hold it to.
            issue_labels="$(gh api "repos/${REPO}/issues/${issue}/labels" --jq '.[].name')"
            current_phase="$(grep -m1 -oE '^phase:[a-z]+' <<<"$issue_labels" || true)"
            echo "fact issue_phase: ${current_phase:-none}"

            # Fact — the advisory QA flags on the PR (PRs are issues for labels).
            # Read up here (ahead of the domain gate) so the reviewer-bounce edge
            # below can key on it: a bounce fires regardless of the issue's current
            # phase, and must stay reachable even on a re-poke where the issue is
            # already phase:bounced (which the domain gate would otherwise drop).
            pr_labels="$(gh api "repos/${REPO}/issues/${pr}/labels" --jq '.[].name')"
            dogfood_unresolved=0
            grep -qx 'dogfood:unresolved' <<<"$pr_labels" && dogfood_unresolved=1
            echo "fact pr_labels: dogfood:unresolved=${dogfood_unresolved}"

            # Reviewer-bounce edge (issue #3391). A deep pass that found a fundamental
            # problem, or a confirm pass judging the delta needs restart-level rework,
            # stamps `review:bounce` (+ `review:bounce-to:<phase>`) on the PR via
            # post-review-rollup.mjs. That is a review→issue-phase-regression with no
            # native reviewDecision to carry it, so it is handled HERE — ahead of the
            # native-verdict target ladder and the domain gate — as a first-match edge:
            # regress the linked issue to phase:bounced + bounce-to:<phase> (the
            # mechanism /bounce and this reconcile already use), record the reason on
            # the issue, and CLOSE the bounced PR so it leaves the open-PR pool — the
            # work restarts from the regressed issue and a fresh /implement supersedes
            # it. Idempotent: the label write is skipped once the issue already rests at
            # phase:bounced with the same bounce-to, and the PR close is skipped once it
            # is already closed, so a re-poke is a clean no-op.
            if grep -qx 'review:bounce' <<<"$pr_labels"; then
              bounce_to="$(grep -m1 -oE '^review:bounce-to:[a-z]+' <<<"$pr_labels" | sed 's/^review:bounce-to://' || true)"
              [ -n "$bounce_to" ] || bounce_to=design
              echo "verdict: PR #${pr} carries review:bounce — regress issue #${issue} to phase:bounced + bounce-to:${bounce_to}, close the PR."

              cur_bounce_to="$(grep -m1 -oE '^bounce-to:[a-z]+' <<<"$issue_labels" | sed 's/^bounce-to://' || true)"
              if [ "$current_phase" = "phase:bounced" ] && [ "$cur_bounce_to" = "$bounce_to" ]; then
                echo "write: issue #${issue} already phase:bounced + bounce-to:${bounce_to} — no label change."
              else
                # Atomic PUT — every non-phase / non-bounce-to label plus the two new
                # ones, so the issue never carries two phase or two bounce-to labels.
                new_labels="$(gh api "repos/${REPO}/issues/${issue}/labels" \
                  --jq "[.[].name | select((startswith(\"phase:\") or startswith(\"bounce-to:\")) | not)] + [\"phase:bounced\", \"bounce-to:${bounce_to}\"]")"
                gh api -X PUT "repos/${REPO}/issues/${issue}/labels" \
                  --input <(jq -nc --argjson l "$new_labels" '{labels: $l}') >/dev/null \
                  && echo "write: issue #${issue} ${current_phase:-none} → phase:bounced + bounce-to:${bounce_to}" \
                  || echo "warn: could not regress issue #${issue} labels"
                gh api -X POST "repos/${REPO}/issues/${issue}/comments" \
                  -f body="Bounced by the review of PR #${pr} to \`phase:bounced\` + \`bounce-to:${bounce_to}\` — the review found a fundamental problem a fix round cannot address (the reason is on the PR). The work returns to scoping; re-run \`/scope\` from \`bounce-to:${bounce_to}\`, and a fresh \`/implement\` supersedes PR #${pr}." >/dev/null \
                  || echo "warn: could not post the bounce reason on issue #${issue}"
              fi

              if [ "$(gh api "repos/${REPO}/pulls/${pr}" --jq '.state')" = "open" ]; then
                gh api -X POST "repos/${REPO}/issues/${pr}/comments" \
                  -f body="Closing — the review bounced issue #${issue} to \`phase:bounced\` + \`bounce-to:${bounce_to}\`. The work returns to scoping; a fresh PR supersedes this one." >/dev/null || true
                gh api -X PATCH "repos/${REPO}/pulls/${pr}" -f state=closed >/dev/null \
                  && echo "write: closed bounced PR #${pr}" \
                  || echo "warn: could not close bounced PR #${pr}"
              fi

              post_gate success "issue #${issue} bounced by review — PR closed, work returns to scoping"
              echo "::endgroup::"
              return 0
            fi

            case "$current_phase" in
              phase:ready|phase:executing|phase:building|phase:refine|phase:qa|phase:findings|phase:held) ;;
              *)
                echo "verdict: issue #${issue} phase '${current_phase:-none}' is outside the reconciler domain — no phase to reconcile."
                post_gate success "issue #${issue} phase ${current_phase:-none} is outside the reconciler domain"
                echo "::endgroup::"
                return 0
                ;;
            esac

            # Fact — CI green: the `CI pass` aggregator check run on the current
            # head, the same required-merge aggregator wave-status.sh gates on.
            # Reading the aggregator rather than the whole check-run set matters
            # twice over: this workflow's own pull_request-triggered run is a
            # check run on the same head (the whole-set read would see itself
            # pending and never compute green), and the aggregator alone defines
            # merge-green — unrelated advisory checks don't get a vote. A fresh
            # synchronize has no completed aggregator yet, which reads as
            # not-green.
            ci_state="$(gh api "repos/${REPO}/commits/${head_sha}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI pass")] | .[0]
                    | if . == null then "missing"
                      elif .status != "completed" then "pending"
                      else .conclusion end')"
            ci_green=0
            if [ "$ci_state" = "success" ]; then
              ci_green=1
            fi
            echo "fact ci_green: ${ci_green} (CI pass=${ci_state})"

            # Fact — review verdict in (PR-level, ADR-0148): GitHub's native
            # reviewDecision, aggregated from barista's required native review and
            # already dismiss-stale-aware, so no per-head read is needed to stay
            # honest across pushes — a fresh push's is_synchronize demotion already
            # pins the head at building until CI is green. REVIEW_REQUIRED or null
            # = verdict owed (null is the pre-flip/not-required state; fail closed
            # rather than sliding a PR to held with no verdict ever submitted).
            # CHANGES_REQUESTED = findings. APPROVED = verdict in and clean.
            review_decision="$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) { reviewDecision }
                }
              }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" \
              --jq '.data.repository.pullRequest.reviewDecision // empty')"
            case "$review_decision" in
              APPROVED) review_owed=0; review_findings=0 ;;
              CHANGES_REQUESTED) review_owed=0; review_findings=1 ;;
              *) review_owed=1; review_findings=0 ;;
            esac
            echo "fact review_decision: ${review_decision:-null} (owed=${review_owed} findings=${review_findings})"

            # Fact — dogfood owed: the closing issue carries a filled Dogfood
            # brief that is not N/A (the same section read dogfood.yml gates on).
            issue_body="$(gh api "repos/${REPO}/issues/${issue}" --jq '.body')"
            brief="$(awk '/^## Dogfood brief/{f=1; next} /^## /{f=0} f' <<<"$issue_body")"
            dogfood_owed=0
            if [ -n "$brief" ] && ! grep -qE '^[[:space:]]*N/A' <<<"$brief"; then
              dogfood_owed=1
            fi

            # Fact — dogfood verdict in: the issue marker reads verdict=green
            # (terminal per dogfood's own retry contract — per-feature, not
            # per-head), OR a failed attempt's findings are in via
            # dogfood:unresolved on the PR. The grep -m1 || true guards the
            # SIGPIPE that grep's early exit would raise on the paginated gh.
            marker="$(gh api "repos/${REPO}/issues/${issue}/comments" --paginate \
              --jq '.[].body' | grep -m1 -oE '<!-- aether-dogfood[^>]*-->' || true)"
            dogfood_verdict="$(grep -oE 'verdict=[a-z]+' <<<"$marker" | sed 's/verdict=//' || true)"
            dogfood_verdict_in=0
            if [ "$dogfood_verdict" = "green" ] || [ "$dogfood_unresolved" -eq 1 ]; then
              dogfood_verdict_in=1
            fi
            echo "fact dogfood: owed=${dogfood_owed} verdict=${dogfood_verdict:-none} verdict_in=${dogfood_verdict_in}"

            # Fact — declared surface: the closing issue's `## Declared surface`
            # fenced glob block bounds what the implementation may touch, and the
            # PR's changed-file set must stay inside it. A diff that escapes the
            # declaration is no longer the change /approve resolved an approval
            # tier over, so it pins the issue at building behind a failing
            # `Approval gate` status until the owner trims the diff, widens the
            # declaration (an issue-body edit), or waives with approval:surface-ok.
            # An issue that declares no surface is un-gated and gets no status at
            # all, so making the gate required in branch protection is the owner's
            # separate call and never wedges a PR from before the mechanism.
            surface="$(awk '/^## Declared surface/{f=1; next} /^## /{f=0} f' <<<"$issue_body" \
              | sed -n '/^[[:space:]]*```/,/^[[:space:]]*```/p' | sed '1d;$d' \
              | grep -v '^[[:space:]]*$' || true)"

            surface_exceeded=0
            if [ -z "$surface" ]; then
              # Un-gated: the issue was scoped before the mechanism, or /scope left
              # the section empty. There is no declaration to hold the diff to, so
              # the gate passes rather than staying silent — silence would wedge a
              # required check.
              echo "fact declared_surface: none — un-gated."
              post_gate success "issue #${issue} declares no surface — un-gated"
            else
              printf '%s\n' "$surface" >"${RUNNER_TEMP}/globs.txt"
              gh api "repos/${REPO}/pulls/${pr}/files" --paginate --jq '.[].filename' \
                >"${RUNNER_TEMP}/changed.txt"
              # The policy is read from the DEFAULT branch, never the PR head — a
              # PR must not be able to relax the policy it is being judged by. It
              # only annotates each escaping path with the tier it would demand;
              # the verdict below is containment, which never consults it. Before
              # this file exists on the default branch the fetch simply misses, and
              # the tier column honestly reads "?" rather than asserting a tier.
              fetch_default_branch_file ".github/approval-policy.yml" "${RUNNER_TEMP}/policy.yml" \
                || : >"${RUNNER_TEMP}/policy.yml"
              # The matcher is fetched the same way the policy is: the contents API
              # with NO ref, which always resolves to the default branch. This
              # workflow checks nothing out on purpose. A checkout pinned to the
              # default branch would look equivalent, but `actions/checkout` falls
              # back to the TRIGGERING ref when its `ref:` input is empty — and on a
              # pull_request event that is the PR head. One unset expression and this
              # job would execute branch-authored Python holding statuses: write and
              # issues: write. The fleet's App can push branches, so that is not a
              # hypothetical. The API read has no such fallback: it is default-branch
              # or it fails. A PR can no more edit the matcher that judges its diff
              # than the policy that matcher annotates with.
              # A missing matcher must FAIL CLOSED, not fail silent. Dying here
              # under `set -e` would skip the gate write entirely and leave the
              # required Approval gate unreported — which GitHub holds as "Expected"
              # forever, wedging the PR (#3158). So an unreadable matcher posts a
              # FAILING gate and moves on: the check is red and legible instead of
              # absent and mysterious. It cannot mean "contained", because with no
              # matcher containment was never computed.
              if ! fetch_default_branch_file "scripts/surface-match.py" "${RUNNER_TEMP}/surface_match.py" \
                 || ! [ -s "${RUNNER_TEMP}/surface_match.py" ]; then
                echo "fact declared_surface: matcher unavailable on the default branch after retries."
                post_gate failure "surface matcher unavailable on the default branch — containment not computed"
                # Infra-unavailable, not containment-violated: the verdict above
                # reflects the fetch, not the diff, so guarantee a later recompute
                # rather than leaning on the cron backstop (#3256 shows that is not
                # reliable). A GITHUB_TOKEN-created workflow_dispatch is the
                # documented exception that re-triggers a workflow.
                gh api -X POST "repos/${REPO}/actions/workflows/reconciler.yml/dispatches" \
                  -f ref=main -F 'inputs[pr]='"${pr}" >/dev/null
                echo "requeue: dispatched reconciler for PR #${pr} — matcher fetch was infra-unavailable, not a containment verdict"
                echo "::endgroup::"
                return 0
              fi

              # The one place gitwildmatch semantics are decided, shared with the
              # tick's approval-tier lookup (#3176). Prints the changed paths that
              # escape the declaration, tier-annotated; silent when contained.
              escaping="$(python3 -I "${RUNNER_TEMP}/surface_match.py" \
                "${RUNNER_TEMP}/globs.txt" "${RUNNER_TEMP}/changed.txt" "${RUNNER_TEMP}/policy.yml")"

              # Owner waiver: approval:surface-ok accepts the overreach, but only
              # when the owner applied it — verified via the timeline actor. An
              # agent can set the label; it just doesn't count.
              surface_ok=0
              if grep -qx 'approval:surface-ok' <<<"$pr_labels"; then
                waiver_actor="$(gh api "repos/${REPO}/issues/${pr}/timeline" --paginate \
                  --jq '[.[] | select(.event=="labeled" and .label.name=="approval:surface-ok")] | last | .actor.login // empty')"
                if [ "$waiver_actor" = "$OWNER" ]; then
                  surface_ok=1
                fi
              fi

              escaping_count=0
              if [ -n "$escaping" ]; then
                escaping_count="$(wc -l <<<"$escaping" | tr -d ' ')"
              fi

              if [ "$escaping_count" -eq 0 ]; then
                gate_state="success"
                gate_description="diff within the issue's declared surface"
              elif [ "$surface_ok" -eq 1 ]; then
                gate_state="success"
                gate_description="declared-surface overreach waived by owner (approval:surface-ok)"
              elif grep -qx 'approval:surface-ok' <<<"$pr_labels"; then
                # Label present but not the owner's — the waiver is the owner's
                # signoff alone, so it does not count.
                surface_exceeded=1
                gate_state="failure"
                gate_description="approval:surface-ok ignored: applied by '${waiver_actor:-unknown}', not the owner. Owner must re-apply."
              else
                surface_exceeded=1
                gate_state="failure"
                gate_description="${escaping_count} file(s) escape issue #${issue}'s declared surface — widen it, trim the diff, or waive with approval:surface-ok"
              fi
              echo "fact declared_surface: globs=$(wc -l <<<"$surface" | tr -d ' ') escaping=${escaping_count} exceeded=${surface_exceeded}"
              if [ "$escaping_count" -gt 0 ]; then
                sed 's/^/  escapes: /' <<<"$escaping"
              fi

              # The commit status IS the gate, so it is written FIRST and alone.
              # The label and comment below are advisory mirrors of a verdict this
              # status already carries, and an advisory write that dies under
              # `set -e` before the status lands would leave the PREVIOUS status
              # standing — an escaping diff keeping a stale green Approval gate,
              # the exact hazard this check exists to close. Gate first, then
              # diagnostics, each guarded: the gate fails closed no matter what
              # the diagnostics do.
              post_gate "$gate_state" "$gate_description"

              # Mirror the verdict into the PR label. The write uses GITHUB_TOKEN,
              # whose events do not trigger workflows, so setting it cannot
              # re-enter this reconciler. A failed label call warns and carries on:
              # this workflow is the sole writer of every PR's phase and loops over
              # every open PR on the cron path, so letting one label error abort
              # the run would strand the whole fleet's reconciliation.
              if [ "$surface_exceeded" -eq 1 ]; then
                grep -qx 'approval:surface-exceeded' <<<"$pr_labels" \
                  || gh api -X POST "repos/${REPO}/issues/${pr}/labels" -f "labels[]=approval:surface-exceeded" >/dev/null \
                  || echo "warn: could not set approval:surface-exceeded (is the label bootstrapped?)"
              else
                ! grep -qx 'approval:surface-exceeded' <<<"$pr_labels" \
                  || gh api -X DELETE "repos/${REPO}/issues/${pr}/labels/approval:surface-exceeded" >/dev/null \
                  || echo "warn: could not clear approval:surface-exceeded"
              fi

              # Diagnostic comment, upserted against a marker so the cron backstop
              # updates one comment instead of spamming a new one every 15 minutes.
              # It clears when the violation does, leaving no stale accusation.
              # Advisory like the label, and guarded for the same reason.
              comment_id="$(gh api "repos/${REPO}/issues/${pr}/comments" --paginate \
                --jq '[.[] | select(.body | contains("<!-- aether-approval-gate -->"))] | last | .id // empty' || true)"
              if [ "$surface_exceeded" -eq 1 ]; then
                {
                  echo "<!-- aether-approval-gate -->"
                  echo "**Approval gate: this diff escapes issue #${issue}'s declared surface.**"
                  echo
                  echo "These changed files are outside the \`## Declared surface\` globs \`/approve\` resolved this issue's approval tier over, so what is about to merge is no longer the change that was approved. The tier column is what each path would demand under \`.github/approval-policy.yml\` (\`?\` = the policy is not on the default branch yet)."
                  echo
                  echo "| escaping path | tier it would demand |"
                  echo "|---|---|"
                  awk -F'\t' '{printf "| `%s` | %s |\n", $1, $2}' <<<"$escaping"
                  echo
                  echo "Clear it by trimming the diff back inside the declaration, widening \`## Declared surface\` on #${issue} (an owner edit — the issue timeline records it), or applying \`approval:surface-ok\` (owner only). The next reconcile recomputes from scratch."
                } >"${RUNNER_TEMP}/comment.md"
                if [ -n "$comment_id" ]; then
                  gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" \
                    -F body=@"${RUNNER_TEMP}/comment.md" >/dev/null \
                    && echo "write: updated approval-gate comment ${comment_id}" \
                    || echo "warn: could not update the approval-gate comment"
                else
                  gh api -X POST "repos/${REPO}/issues/${pr}/comments" \
                    -F body=@"${RUNNER_TEMP}/comment.md" >/dev/null \
                    && echo "write: posted approval-gate comment" \
                    || echo "warn: could not post the approval-gate comment"
                fi
              elif [ -n "$comment_id" ]; then
                gh api -X DELETE "repos/${REPO}/issues/comments/${comment_id}" >/dev/null \
                  && echo "write: cleared stale approval-gate comment ${comment_id}" \
                  || echo "warn: could not clear the stale approval-gate comment"
              fi
            fi

            # Fact — findings open: either advisory QA flag on the PR, or any
            # unresolved review thread (GraphQL; the only per-thread signal, and
            # the reason the schedule backstop exists — thread resolves have no
            # Actions event).
            unresolved_threads="$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) { nodes { isResolved } }
                  }
                }
              }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
            findings_open=0
            if [ "$review_findings" -eq 1 ] || [ "$dogfood_unresolved" -eq 1 ] || [ "${unresolved_threads:-0}" -gt 0 ]; then
              findings_open=1
            fi
            echo "fact unresolved_threads: ${unresolved_threads:-0} (findings_open=${findings_open})"

            # Compute the target phase, first match wins. A diff that escaped the
            # declared surface pins at building alongside the not-green cases: it
            # owes a re-approval, so it is not a change QA or the owner should be
            # spending attention on yet.
            if [ "$surface_exceeded" -eq 1 ] || [ "$is_synchronize" = "1" ] || [ "$ci_green" -eq 0 ]; then
              target="phase:building"
            elif [ "$review_owed" -eq 1 ] || { [ "$dogfood_owed" -eq 1 ] && [ "$dogfood_verdict_in" -eq 0 ]; }; then
              target="phase:qa"
            elif [ "$findings_open" -eq 1 ]; then
              target="phase:findings"
            else
              target="phase:held"
            fi
            echo "verdict: PR #${pr} issue #${issue} → ${target} (was ${current_phase:-none})"

            # Write only on a change. The PUT replaces the whole label set, so
            # build it as every non-phase label plus the target — the atomic,
            # non-phase-preserving reconcile the pipeline uses everywhere.
            if [ "$current_phase" = "$target" ]; then
              echo "write: already ${target} — no change."
            else
              new_labels="$(gh api "repos/${REPO}/issues/${issue}/labels" \
                --jq "[.[].name | select(startswith(\"phase:\") | not)] + [\"${target}\"]")"
              gh api -X PUT "repos/${REPO}/issues/${issue}/labels" \
                --input <(jq -nc --argjson l "$new_labels" '{labels: $l}')
              echo "write: ${current_phase:-none} → ${target}"
            fi
            echo "::endgroup::"
          }

          for pr in $prs; do
            reconcile_pr "$pr"
          done
