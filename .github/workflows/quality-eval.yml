name: Quality eval

# Weekly offline quality-eval harness (#3380) — the ground-truth correctness
# regression alarm for routing / effort / model changes. It re-implements a
# sample of recently-landed issues BLIND (a single-revision scratch clone at the
# pre-merge trunk tip, a headless agent under current fleet routing and an
# edit-only tool allowlist), judges each candidate diff against the landed
# "ground truth" diff with a defect-checklist judge, and posts verdict rates onto
# a single rolling tracking issue. It runs off the merge critical path — never a
# `ci-pass` gate — because the value is a weekly trend, not a per-PR check.
# `workflow_dispatch` runs it on demand and surfaces the sample size.
# Scheduled workflows fire only from the file on `main` and run in UTC.
#
# The blindness is STRUCTURAL, enforced by scripts/quality-eval-run.sh: a
# single-revision clone in which the landed fix is reachable from no ref, a
# removed remote, and a pre-run contamination assert that fails a leaked sample.

on:
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:
    inputs:
      sample_size:
        description: "How many recently-landed issues to re-implement and judge."
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  eval:
    name: Offline quality eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # issues: write is only for upserting the single rolling tracking issue.
      issues: write
    # The blind runs build + test the scratch repo per sample, so the wall-clock
    # is dominated by 5 headless agent sessions; cap generously, off the critical
    # path. A stalled runner still can't eat the 6h default quota silently.
    timeout-minutes: 360
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # Full history so the landed "ground truth" squash commit is reachable for
      # the driver's `git show` diff harvest.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The blind coding agent builds and tests the scratch repo, so it needs the
      # same toolchain the workspace test job uses.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install ALSA dev headers (cpal Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Note when the OAuth token secret is absent
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "AGENT_CLAUDE_CODE_OAUTH_TOKEN is not set — the quality eval is skipped."
          echo "Mint one from the agent subscription with 'claude setup-token' and add it:"
          echo "  gh secret set AGENT_CLAUDE_CODE_OAUTH_TOKEN"

      # Shared headless-Claude scaffold (#3359): strip hooks, pinned install,
      # basecamp mkdir + pre-trust, auth probe.
      - name: Headless Claude setup
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: ./.github/actions/headless-claude
        with:
          claude-code-version: ${{ vars.AGENT_CLAUDE_CODE_VERSION }}
          oauth-token: ${{ secrets.AGENT_CLAUDE_CODE_OAUTH_TOKEN }}

      # select -> run -> judge. Each stage streams NDJSON to the next; the judge
      # prints the verdict-rate rollup markdown consumed by the post step.
      - name: Select the sample
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_EVAL_SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '5' }}
        run: node scripts/quality-eval-select.mjs > /tmp/quality-eval-samples.jsonl

      - name: Run the blind re-implementations
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          # Sealed out with the remote inside the driver; never reaches the agent.
          QUALITY_EVAL_CLONE_TOKEN: ${{ github.token }}
        run: bash scripts/quality-eval-run.sh /tmp/quality-eval-samples.jsonl > /tmp/quality-eval-judged.jsonl

      - name: Judge candidate vs landed diffs
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          QUALITY_EVAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          QUALITY_EVAL_RUN_DATE="$(date -u +%Y-%m-%d)" \
            node scripts/quality-eval-judge.mjs /tmp/quality-eval-judged.jsonl > /tmp/quality-eval-rollup.md
          cat /tmp/quality-eval-rollup.md >> "$GITHUB_STEP_SUMMARY"

      # Post the verdict-rate rollup onto ONE rolling tracking issue — comment on
      # the existing one, or file it the first time. Mirrors desktop-nightly.yml's
      # file-or-update idiom. --label alert keeps the fleet's dispatcher from
      # scoping a machine-filed tracking issue as pipeline work (#3180).
      - name: Post the verdict rates onto the rolling tracking issue
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="quality-eval: weekly offline verdict rates"
          existing=$(gh issue list --state open --search "${title} in:title" \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            echo "Commenting rollup on existing tracking issue #${existing}."
            gh issue comment "$existing" --body-file /tmp/quality-eval-rollup.md
          else
            echo "Filing the rolling tracking issue."
            gh issue create --title "$title" --body-file /tmp/quality-eval-rollup.md --label alert
          fi
