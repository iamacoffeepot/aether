# Raw OS-thread spawns bypass the trace + settlement umbrella (ADR-0080 §12):
# the spawned work emits no HoldOpen/Release and any mail it pushes is rootless,
# so it is invisible to settlement and the trace tree. Handler/capability code
# must instead route through a sanctioned primitive:
#   - NativeCtx::spawn_inherit / spawn_detached  (ADR-0080 §12) for chain-continuing async work
#   - the ADR-0093 task system (dispatch_blocking / TaskQueue / #[handler(task)]) for per-handler blocking work
# Every remaining raw spawn is infra below the actor/mail layer (transport sockets,
# worker pools, device-callback threads, periodic timers, the primitive's own impl)
# and must carry an explicit #[allow(clippy::disallowed_methods)] + a one-line reason.
disallowed-methods = [
    { path = "std::thread::spawn", reason = "raw thread spawn bypasses the settlement/trace umbrella; use NativeCtx::spawn_inherit/spawn_detached, the ADR-0093 task system, or SelfWake::spawn_sidecar for a cap's dedicated sidecar thread, or #[allow] with a reason for infra threads" },
    { path = "std::thread::Builder::spawn", reason = "raw thread spawn bypasses the settlement/trace umbrella; use NativeCtx::spawn_inherit/spawn_detached, the ADR-0093 task system, or SelfWake::spawn_sidecar for a cap's dedicated sidecar thread, or #[allow] with a reason for infra threads" },
    { path = "aether_data::MailboxId::from_name", reason = "hashes a namespace into a MailboxId and freezes the depth-1 shape into the caller. Address a root cap with `aether_actor::root_mailbox::<C>()` and a sibling via #[actor(depends(Cap))] with ctx.send::<Cap>(..) or ctx.actor_ref::<Cap>(). Only the registry's own canonical name→id derivation may #[allow] with a reason." },
    { path = "std::env::var", reason = "capabilities configure through the ADR-0090 derive-Config path (argv > env > default, resolved into init), not a naked env read; route config through #[derive(aether_substrate::Config)]. Only the sanctioned config machinery, process-level tuning knobs, genuinely external vars (HOME/XDG), and tests may #[allow] with a reason." },
    { path = "std::env::var_os", reason = "OS-string variant of the above; capabilities configure through the ADR-0090 derive-Config path, not a naked env read. #[allow] with a reason for the sanctioned config machinery, process-level tuning, external vars, or tests." },
    { path = "aether_substrate::chassis::builder::Builder::new", reason = "mints an un-based chassis builder; the boot path routes through aether_substrate::chassis::composed, the single minting point that installs the aborter + base stratum. Only composed itself, the hermetic in-process harness embedder, and test/embedder code that deliberately builds a bare chassis may #[allow] with a reason." },
    { path = "aether_substrate::chassis::builder::Builder::from_boot", reason = "mints an un-based chassis builder; the boot path routes through aether_substrate::chassis::composed, the single minting point that installs the aborter + base stratum. Only composed itself, the hermetic in-process harness embedder, and test/embedder code that deliberately builds a bare chassis may #[allow] with a reason." },
]
