[profile.default]
final-status-level = "slow"

[profile.ci]
# Don't fail fast in CI to run the full test suite.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 1 }

# The kit scenario integration binaries cold-load and compile
# `aether_kit.wasm` in each test. CI measurements in #2805 put the
# camera scenario around 56.5s and mesh around 52-53s against the default
# 60s cap. The terrain workbench scenario likewise cold-loads the kit wasm
# and crossed 60s under the CI software renderer, so give only these known
# wasm-heavy binaries extra headroom.
[[profile.ci.overrides]]
filter = "package(=aether-kit) & (binary(camera_scenario) | binary(mesh_scenario) | binary(terrain_workbench_scenario))"
slow-timeout = { period = "120s", terminate-after = 1 }

# The `aether-substrate-bundle` integration tests (FleetBench + the engines /
# routing fleet suites) fork real debug `aether-substrate` processes and wait
# for them to bind. Run concurrently they make timely progress but stretch
# well past the 60s steady-state cap under fork contention, so they carry a
# generous wall-clock backstop — a deadlock guard a healthy run never reaches,
# not a steady-state deadline (same stance as the hub proxy-connect budget,
# iamacoffeepot/aether#2072). `kind(test)` scopes this to the integration
# binaries; the package's unit tests keep the 60s cap.
[[profile.ci.overrides]]
filter = "package(=aether-substrate-bundle) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The fleetbench replace binary also cold-loads `aether_kit.wasm` and was
# measured in #2805 around 156.8s against the 180s bundle cap. Keep the
# package-wide cap intact and widen only this known slow binary.
[[profile.ci.overrides]]
filter = "package(=aether-substrate-bundle) & binary(fleetbench_replace)"
slow-timeout = { period = "300s", terminate-after = 1 }

# Trybuild fixtures spawn a nested `cargo` build per `.rs` fixture.
# iamacoffeepot/aether#1275 feature-gated wasmtime out of the
# `aether-derive` fixture dep graph (local wall-clock 240s → 18s on
# our dev boxes); CI's 2-core runners still push it past 60s under
# parallel contention with `aether-data-derive`'s ui binary, so all
# four derive crates (`aether-data-derive`, `aether-derive`,
# `aether-actor-derive`, `aether-behavior-derive`) keep the wider cap.
# The bigger speedup for all four is its own follow-up.
[[profile.ci.overrides]]
filter = "package(=aether-data-derive) | package(=aether-derive) | package(=aether-actor-derive) | package(=aether-behavior-derive)"
slow-timeout = { period = "300s", terminate-after = 1 }
