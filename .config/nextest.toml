[profile.default]
final-status-level = "slow"

[profile.ci]
# Don't fail fast in CI to run the full test suite.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 1 }

# `terrain_workbench_scenario` is the crate's heaviest integration binary —
# four cold wasm component loads (mark/world/terra/workbench) plus a font
# load and six GPU captures in one test, versus siblings that load one or
# two components — and iamacoffeepot/aether#3627 saw it cross the 120s
# class cap on main's full-suite job (~123.8s on two back-to-back pushes).
# Locally the scenario completes in ~3s: our dev box has hardware GPU
# acceleration and 8 idle cores, while CI's shared 2-core runner falls back
# to a software rasterizer under full-suite contention (the same dev-box
# vs. CI gap #1275 measured for the derive-crate fixtures below), so a
# local timing isn't a usable headroom baseline here. Every wait in the
# test is bounded (`wait_for_idle` panics after 16 frames), so this is
# slow-but-completing rather than a hang; widen generously, matching the
# `fleetbench_replace` precedent below, and keep the package-wide cap
# intact for the crate's other ten integration binaries.
#
# Ordering constraint: this override must precede the package-wide
# `kind(test)` class cap below — nextest applies the first matching
# override per setting, so listed after the class cap the 300s widening
# never applies and the test dies at 120s (the #3627 timeout recurring
# on main even after the widening first landed).
[[profile.ci.overrides]]
filter = "package(=aether-kit) & binary(terrain_workbench_scenario)"
slow-timeout = { period = "300s", terminate-after = 1 }

# The two heaviest binaries iamacoffeepot/aether#3768 rehomed from
# `aether-substrate-bundle` (whose package cap is 180s) into aether-kit:
# `widget_render_interaction`'s scenarios each cold-load the kit wasm plus a
# font and run multi-capture verdicts, and `world_case_atlas` renders and
# scores a whole contact sheet per test. Both were sized against the bundle's
# 180s cap, so the kit-wide 120s class cap below would be a silent tightening
# under CI's software-rasterizer contention; widen them to the same 300s
# backstop as `terrain_workbench_scenario` above. Same ordering constraint:
# these must precede the package-wide `kind(test)` class cap — nextest applies
# the first matching override per setting.
[[profile.ci.overrides]]
filter = "package(=aether-kit) & (binary(widget_render_interaction) | binary(world_case_atlas))"
slow-timeout = { period = "300s", terminate-after = 1 }

# Every binary under `crates/aether-kit/tests/` cold-loads and compiles
# `aether_kit.wasm` and boots a wgpu `SubstrateHarness`, so they are one slow
# class rather than a fixed allowlist: #2805 measured the camera scenario
# around 56.5s and mesh around 52-53s against the default 60s cap, and
# iamacoffeepot/aether#3527 saw two more binaries (`mark_scenario`,
# `proposal_scenario`) cross 60s the same way, exactly the allowlist gap a
# per-binary filter leaves open for the next one. `kind(test)` scopes the
# cap to the integration binaries; the crate's `kind(lib)` unit tests keep
# the 60s default.
[[profile.ci.overrides]]
filter = "package(=aether-kit) & kind(test)"
slow-timeout = { period = "120s", terminate-after = 1 }

# The `aether-component` integration binaries mix two rehomed slow classes:
# the scenario tests (iamacoffeepot/aether#3769) cold-load and compile
# fixture wasm into a `SubstrateHarness`, and the fleet tests
# (iamacoffeepot/aether#3776) fork real debug `aether-substrate-headless`
# processes through `FleetBench` and wait for them to bind. The fork class
# stretches well past 60s under contention with the sibling fleet suites,
# so the whole package rides the same 180s deadlock-guard backstop as the
# bundle / rpc / engine overrides below — a wall-clock guard a healthy run
# never reaches. `kind(test)` scopes the cap to the integration binaries;
# the crate's `kind(lib)` unit tests keep the 60s default.
[[profile.ci.overrides]]
filter = "package(=aether-component) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-substrate` integration binaries mix two rehomed slow
# classes: the harness tests (cap_registry / cost_table /
# substrate_harness_logs, iamacoffeepot/aether#3770) cold-load fixture wasm
# — cap_registry's replace test additionally cold-compiles
# `aether_kit.wasm`, the exact load that pushed the aether-kit binaries
# past 60s (#2805) — and the fleet log-tail test (`fleetbench_logs`,
# iamacoffeepot/aether#3781) forks a real debug
# `aether-substrate-headless` process and waits for it to bind. The fork
# class stretches well past 60s under contention with the sibling fleet
# suites, so the whole package rides the same 180s deadlock-guard
# backstop as the bundle / rpc / engine overrides below — a wall-clock
# guard a healthy run never reaches. `kind(test)` scopes the cap to the
# integration binaries; the crate's `kind(lib)` unit tests keep the 60s
# default.
[[profile.ci.overrides]]
filter = "package(=aether-substrate) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-substrate-bundle` integration tests (FleetBench + the engines /
# routing fleet suites) fork real debug `aether-substrate` processes and wait
# for them to bind. Run concurrently they make timely progress but stretch
# well past the 60s steady-state cap under fork contention, so they carry a
# generous wall-clock backstop — a deadlock guard a healthy run never reaches,
# not a steady-state deadline (same stance as the hub proxy-connect budget,
# iamacoffeepot/aether#2072). `kind(test)` scopes this to the integration
# binaries; the package's unit tests keep the 60s cap.
[[profile.ci.overrides]]
filter = "package(=aether-substrate-bundle) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The rehomed tcp fleet-load test (`fleetbench_tcp_load`, #3780) forks a
# real debug `aether-substrate-headless` process through `FleetBench` and
# then churns real loopback listeners/sessions on top — the same
# fork-contention class as the bundle's fleet suites above, so it carries
# the same 180s wall-clock backstop. `kind(test)` scopes the cap to the
# integration binary; the crate's `kind(lib)` unit tests keep the 60s
# default.
[[profile.ci.overrides]]
filter = "package(=aether-tcp) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-actor` addressing fleet tests (`fleetbench_inline_child`,
# `fleetbench_matrix_sweep`, rehomed from the bundle by
# iamacoffeepot/aether#3777) are the same slow class: they fork real debug
# `aether-substrate-headless` processes and wait for them to bind, which
# stretches well past the 60s steady-state cap under fork contention with
# the sibling fleet suites. Same generous deadlock-guard stance as the
# bundle override above; `kind(test)` keeps the crate's unit tests on the
# 60s default (the crate's other integration binaries are light and never
# approach the backstop). No binary-specific override exists for this
# package, so first-match-wins ordering is unconstrained here.
[[profile.ci.overrides]]
filter = "package(=aether-actor) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-http` serving test binary (`http_serving`, rehomed from the
# bundle by iamacoffeepot/aether#3782) boots a full in-process
# `HeadlessChassis` with a real wasm guest per test and speaks to it over
# a real TcpStream. It ran under the bundle's 180s `kind(test)` cap above
# before the move; carry the same wall-clock backstop — a deadlock guard
# a healthy run never reaches. `kind(test)` scopes it to the integration
# binary; the crate's unit tests keep the 60s default. No binary-specific
# override exists for this package, so first-match-wins ordering is
# unconstrained here.
[[profile.ci.overrides]]
filter = "package(=aether-http) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-rpc` integration tests (`fleetbench_mail`, `rpc_engine_routing`,
# rehomed from the bundle by iamacoffeepot/aether#3778) are the same slow
# class: they fork real debug `aether-substrate-headless` processes and wait
# for them to bind, which stretches well past the 60s steady-state cap under
# fork contention with the sibling fleet suites. Same generous deadlock-guard
# stance as the bundle override above; `kind(test)` keeps the crate's unit
# tests on the 60s default. No binary-specific override exists for this
# package, so first-match-wins ordering is unconstrained here.
[[profile.ci.overrides]]
filter = "package(=aether-rpc) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-render` render scenario binary (rehomed from the bundle's
# `substrate_harness_scenario` dispatcher, issue #3771) boots a wgpu
# `SubstrateHarness` per test and runs ~18 GPU captures; on CI's shared
# 2-core runner the frames rasterize in software under full-suite
# contention, so the binary stretches well past the 60s steady-state cap
# while still making timely progress. It ran under the bundle's 180s
# `kind(test)` cap above before the move; carry the same wall-clock
# backstop — a deadlock guard a healthy run never reaches. `kind(test)`
# scopes it to the integration binary; the crate's unit tests keep the
# 60s default. Ordering: nextest applies the first matching override per
# setting, so any narrower `aether-render` binary override must be
# listed before this one.
[[profile.ci.overrides]]
filter = "package(=aether-render) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The `aether-engine` integration tests (`fleetbench_spawn`,
# `fleetbench_terminate`, `engines_cap`, rehomed from the bundle by
# iamacoffeepot/aether#3779) are the same slow class: they fork real debug
# `aether-substrate-headless` processes and wait for them to bind, which
# stretches well past the 60s steady-state cap under fork contention with the
# sibling fleet suites. Same generous deadlock-guard stance as the bundle
# override above; `kind(test)` keeps the crate's unit tests on the 60s
# default. No binary-specific override exists for this package, so
# first-match-wins ordering is unconstrained here.
[[profile.ci.overrides]]
filter = "package(=aether-engine) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# The fleetbench replace binary also cold-loads `aether_kit.wasm` and was
# measured in #2805 around 156.8s against the 180s bundle cap. Keep the
# package-wide cap intact and widen only this known slow binary.
[[profile.ci.overrides]]
filter = "package(=aether-substrate-bundle) & binary(fleetbench_replace)"
slow-timeout = { period = "300s", terminate-after = 1 }

# The `aether-text` text scenario binary (rehomed from the bundle's
# `substrate_harness_scenario` dispatcher, issue #3772) boots a wgpu
# `SubstrateHarness` per test and runs a dozen GPU captures; on CI's
# shared 2-core runner the frames rasterize in software under
# full-suite contention, so the binary stretches well past the 60s
# steady-state cap while still making timely progress. It ran under
# the bundle's 180s `kind(test)` cap above before the move; carry the
# same wall-clock backstop — a deadlock guard a healthy run never
# reaches. `kind(test)` scopes it to the integration binary; the
# crate's unit tests keep the 60s default. Ordering: nextest applies
# the first matching override per setting, so any narrower
# `aether-text` binary override must be listed before this one.
[[profile.ci.overrides]]
filter = "package(=aether-text) & kind(test)"
slow-timeout = { period = "180s", terminate-after = 1 }

# Trybuild fixtures spawn a nested `cargo` build per `.rs` fixture.
# iamacoffeepot/aether#1275 feature-gated wasmtime out of the
# `aether-derive` fixture dep graph (local wall-clock 240s → 18s on
# our dev boxes); CI's 2-core runners still push it past 60s under
# parallel contention with `aether-data-derive`'s ui binary, so all
# four derive crates (`aether-data-derive`, `aether-derive`,
# `aether-actor-derive`, `aether-behavior-derive`) keep the wider cap.
# The bigger speedup for all four is its own follow-up.
[[profile.ci.overrides]]
filter = "package(=aether-data-derive) | package(=aether-derive) | package(=aether-actor-derive) | package(=aether-behavior-derive)"
slow-timeout = { period = "300s", terminate-after = 1 }
